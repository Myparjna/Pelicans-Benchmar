<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .weather-label {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; font-size: clamp(14px, 3vw, 24px); font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5); pointer-events: none;
            transition: opacity 0.5s; z-index: 10;
        }
        .progress-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: min(300px, 60vw); height: 6px; background: rgba(255,255,255,0.3);
            border-radius: 3px; overflow: hidden; z-index: 10;
        }
        .progress-fill {
            height: 100%; width: 0%; border-radius: 3px;
            transition: background 1s;
        }
    </style>
</head>
<body>
    <div class="weather-label" id="weatherLabel">☀️ 晴天</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, groundY;
let time = 0;
let weatherTime = 0;
const WEATHER_DURATION = 5000;
let currentWeather = 'sunny';
let prevWeather = 'sunny';
let weatherTransition = 1;
const weathers = ['sunny', 'cloudy', 'rainy'];
const weatherNames = { sunny: '☀️ 晴天', cloudy: '☁️ 阴天', rainy: '🌧️ 雨天' };
const colors = {
    sunny:  { sky1: '#87CEEB', sky2: '#E0F7FA', sun: '#FFD700', cloud: '#FFF', road: '#666', grass: '#4CAF50' },
    cloudy: { sky1: '#78909C', sky2: '#B0BEC5', sun: null,     cloud: '#90A4AE', road: '#555', grass: '#558B2F' },
    rainy:  { sky1: '#37474F', sky2: '#546E7A', sun: null,     cloud: '#455A64', road: '#333', grass: '#33691E' }
};

function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
    W = window.innerWidth;
    H = window.innerHeight;
    groundY = H * 0.72;
}
window.addEventListener('resize', resize);
resize();

setInterval(() => {
    let idx = weathers.indexOf(currentWeather);
    prevWeather = currentWeather;
    currentWeather = weathers[(idx + 1) % 3];
    weatherTransition = 0;
    document.getElementById('weatherLabel').textContent = weatherNames[currentWeather];
}, WEATHER_DURATION);

class Raindrop {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * W * 1.5 - W * 0.25;
        this.y = Math.random() * -H;
        this.speed = 8 + Math.random() * 6;
        this.length = 15 + Math.random() * 20;
        this.opacity = 0.3 + Math.random() * 0.4;
    }
    update(dt) {
        this.y += this.speed * dt * 60;
        this.x -= 1.5 * dt * 60;
        if (this.y > H + 20) this.reset();
    }
    draw(ctx) {
        ctx.strokeStyle = `rgba(150,200,255,${this.opacity})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - 3, this.y + this.length);
        ctx.stroke();
    }
}
const raindrops = Array.from({ length: 150 }, () => new Raindrop());

class Tree {
    constructor(x) { this.baseX = x; this.scale = 0.5 + Math.random() * 0.8; }
    get x() { return ((this.baseX - time * 30) % (W + 200)); }
    draw(ctx, parallaxSpeed) {
        const x = ((this.baseX - time * 30 * parallaxSpeed) % (W + 300)) + 150;
        const s = this.scale;
        const gy = groundY;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(x - 3*s, gy - 40*s, 6*s, 40*s);
        ctx.fillStyle = '#2E7D32';
        ctx.beginPath();
        ctx.arc(x, gy - 50*s, 20*s, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#388E3C';
        ctx.beginPath();
        ctx.arc(x - 8*s, gy - 40*s, 15*s, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 10*s, gy - 38*s, 14*s, 0, Math.PI*2);
        ctx.fill();
    }
}
const trees = Array.from({length: 20}, (_, i) => new Tree(i * 120 + Math.random() * 60));
const smallTrees = Array.from({length: 30}, (_, i) => new Tree(i * 80 + Math.random() * 40));

function drawSun(ctx, x, y, r, opacity) {
    ctx.save();
    ctx.globalAlpha = opacity;
    const glow = ctx.createRadialGradient(x, y, r*0.5, x, y, r*3);
    glow.addColorStop(0, 'rgba(255,235,59,0.4)');
    glow.addColorStop(1, 'rgba(255,235,59,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, r*3, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,235,59,0.6)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 + time * 0.2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a)*r*1.3, y + Math.sin(a)*r*1.3);
        ctx.lineTo(x + Math.cos(a)*r*2.2, y + Math.sin(a)*r*2.2);
        ctx.stroke();
    }
    const grad = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 0, x, y, r);
    grad.addColorStop(0, '#FFF176');
    grad.addColorStop(1, '#FFD700');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
}

function drawCloud(ctx, x, y, scale, opacity, dark) {
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.fillStyle = dark ? '#546E7A' : '#FFFFFF';
    const blobs = [[0, 0, 30], [-25, 5, 25], [28, 3, 28], [-12, -12, 22], [15, -10, 24]];
    blobs.forEach(([bx, by, r]) => {
        ctx.beginPath();
        ctx.arc(x + bx*scale, y + by*scale, r*scale, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.restore();
}

function drawPelicanBike(ctx, cx, cy, bounce) {
    const s = Math.min(W, H) * 0.0018;
    ctx.save();
    ctx.translate(cx, cy + bounce);
    
    const pedalAngle = time * 3;
    
    function drawWheel(wx, wy, wr, rotation) {
        ctx.save();
        ctx.translate(wx, wy);
        ctx.rotate(rotation);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4*s;
        ctx.beginPath();
        ctx.arc(0, 0, wr, 0, Math.PI*2);
        ctx.stroke();
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 1.5*s;
        ctx.beginPath();
        ctx.arc(0, 0, wr - 2*s, 0, Math.PI*2);
        ctx.stroke();
        ctx.strokeStyle = '#BBB';
        ctx.lineWidth = 1*s;
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a)*(wr-2*s), Math.sin(a)*(wr-2*s));
            ctx.stroke();
        }
        ctx.restore();
    }
    
    const wheelR = 18*s;
    const crankRadius = 8*s;
    const pedalRot = pedalAngle;
    const pedalLx = Math.cos(pedalRot) * crankRadius;
    const pedalLy = Math.sin(pedalRot) * crankRadius;
    const pedalRx = Math.cos(pedalRot + Math.PI) * crankRadius;
    const pedalRy = Math.sin(pedalRot + Math.PI) * crankRadius;
    
    ctx.strokeStyle = '#E53935';
    ctx.lineWidth = 4*s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-wheelR - 5*s, 0);
    ctx.lineTo(0, -15*s);
    ctx.lineTo(-5*s, -55*s);
    ctx.lineTo(5*s, -55*s);
    ctx.lineTo(wheelR * 0.6, -45*s);
    ctx.lineTo(0, 0);
    ctx.moveTo(wheelR * 0.6, -45*s);
    ctx.lineTo(wheelR + 5*s, 0);
    ctx.stroke();
    
    ctx.lineWidth = 2.5*s;
    ctx.strokeStyle = '#C62828';
    ctx.beginPath();
    ctx.moveTo(-wheelR - 5*s, 0);
    ctx.lineTo(0, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-wheelR - 5*s, 0);
    ctx.lineTo(-5*s, -55*s);
    ctx.stroke();
    
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.arc(0, 0, 4*s, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#777';
    ctx.lineWidth = 3*s;
    ctx.beginPath();
    ctx.moveTo(pedalLx, pedalLy);
    ctx.lineTo(0, 0);
    ctx.lineTo(pedalRx, pedalRy);
    ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.fillRect(pedalLx - 5*s, pedalLy - 2*s, 10*s, 4*s);
    ctx.fillRect(pedalRx - 5*s, pedalRy - 2*s, 10*s, 4*s);
    
    drawWheel(-wheelR - 5*s, wheelR, wheelR, -time * 4);
    drawWheel(wheelR + 5*s, wheelR, wheelR, -time * 4);
    
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 3*s;
    ctx.beginPath();
    ctx.moveTo(wheelR + 5*s, -5*s);
    ctx.lineTo(wheelR + 10*s, -50*s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(wheelR + 2*s, -52*s);
    ctx.lineTo(wheelR + 18*s, -48*s);
    ctx.stroke();
    
    ctx.strokeStyle = '#FFB300';
    ctx.lineWidth = 2*s;
    ctx.beginPath();
    ctx.moveTo(wheelR + 5*s, -48*s);
    ctx.lineTo(wheelR - 2*s, -35*s);
    ctx.lineTo(wheelR + 20*s, -35*s);
    ctx.lineTo(wheelR + 12*s, -48*s);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = '#FF4081';
    ctx.beginPath();
    ctx.arc(wheelR + 9*s, -42*s, 4*s, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#FFF176';
    ctx.beginPath();
    ctx.arc(wheelR + 9*s, -42*s, 2*s, 0, Math.PI*2);
    ctx.fill();
    
    const pelicanBounce = Math.sin(time * 8) * 2*s;
    const pelicanY = -55*s + pelicanBounce;
    
    ctx.strokeStyle = '#FF8A65';
    ctx.lineWidth = 4*s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-5*s, pelicanY + 10*s);
    ctx.quadraticCurveTo(-2*s + pedalLx*0.5, pelicanY + 30*s + pedalLy*0.3, pedalLx, pedalLy + 2*s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-5*s, pelicanY + 10*s);
    ctx.quadraticCurveTo(-2*s + pedalRx*0.5, pelicanY + 30*s + pedalRy*0.3, pedalRx, pedalRy + 2*s);
    ctx.stroke();
    ctx.fillStyle = '#FF8A65';
    ctx.beginPath();
    ctx.ellipse(pedalLx, pedalLy + 3*s, 6*s, 3*s, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(pedalRx, pedalRy + 3*s, 6*s, 3*s, 0, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#F5F5F5';
    ctx.beginPath();
    ctx.ellipse(0, pelicanY - 5*s, 22*s, 28*s, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#EEEEEE';
    const wingFlap = Math.sin(time * 5) * 5*s;
    ctx.beginPath();
    ctx.ellipse(-18*s, pelicanY - 10*s + wingFlap, 10*s, 18*s, -0.3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#FAFAFA';
    ctx.beginPath();
    ctx.arc(12*s, pelicanY - 32*s, 14*s, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#FFB74D';
    ctx.beginPath();
    ctx.moveTo(22*s, pelicanY - 35*s);
    ctx.lineTo(55*s, pelicanY - 30*s);
    ctx.quadraticCurve(52*s, pelicanY - 15*s, 25*s, pelicanY - 25*s);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#F57C00';
    ctx.lineWidth = 1.5*s;
    ctx.beginPath();
    ctx.moveTo(22*s, pelicanY - 35*s);
    ctx.lineTo(52*s, pelicanY - 30*s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(25*s, pelicanY - 25*s);
    ctx.quadraticCurve(45*s, pelicanY - 5*s, 50*s, pelicanY - 20*s);
    ctx.stroke();
    
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(16*s, pelicanY - 36*s, 5*s, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(17*s, pelicanY - 36*s, 2.5*s, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(18*s, pelicanY - 37*s, 1*s, 0, Math.PI*2);
    ctx.fill();
    
    ctx.strokeStyle = '#E65100';
    ctx.lineWidth = 1.5*s;
    ctx.beginPath();
    ctx.arc(22*s, pelicanY - 30*s, 4*s, 0.1, Math.PI * 0.7);
    ctx.stroke();
    
    ctx.strokeStyle = '#F5F5F5';
    ctx.lineWidth = 5*s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(10*s, pelicanY - 10*s);
    ctx.quadraticCurve(25*s, pelicanY - 25*s, wheelR + 10*s, -50*s);
    ctx.stroke();
    ctx.fillStyle = '#E0E0E0';
    ctx.beginPath();
    ctx.arc(wheelR + 10*s, -50*s, 4*s, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

function drawSplash(ctx, x, y, size) {
    ctx.fillStyle = 'rgba(150,200,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(x, y, size, size * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
}

function render(timestamp) {
    const dt = 1/60;
    time += dt;
    weatherTime += dt;
    if (weatherTransition < 1) weatherTransition = Math.min(1, weatherTime / 0.5);
    
    const progress = (weatherTime % WEATHER_DURATION) / WEATHER_DURATION;
    const fill = document.getElementById('progressFill');
    fill.style.width = (progress * 100) + '%';
    fill.style.background = currentWeather === 'sunny' ? '#FFD700' : currentWeather === 'cloudy' ? '#90A4AE' : '#5C6BC0';
    
    const c = colors[currentWeather];
    const pc = colors[prevWeather];
    
    ctx.fillStyle = c.sky1;
    ctx.fillRect(0, 0, W, H);
    
    if (currentWeather === 'sunny' || prevWeather === 'sunny') {
        const sunOpacity = currentWeather === 'sunny' ? 1 : (1 - weatherTransition);
        drawSun(ctx, W * 0.8, H * 0.15, Math.min(W,H)*0.04, sunOpacity);
    }
    
    const cloudCount = currentWeather === 'rainy' ? 8 : currentWeather === 'cloudy' ? 6 : 3;
    const cloudDark = currentWeather === 'rainy';
    for (let i = 0; i < cloudCount; i++) {
        const cx = ((i * 200 + time * (15 + i * 3)) % (W + 300)) - 100;
        const cy = H * 0.1 + i * H * 0.06 + Math.sin(time + i) * 10;
        const opacity = currentWeather === 'rainy' ? 0.9 : currentWeather === 'cloudy' ? 0.85 : 0.7;
        drawCloud(ctx, cx, cy, 0.8 + i * 0.15, opacity, cloudDark);
    }
    
    ctx.fillStyle = c.grass;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (let x = 0; x <= W; x += 50) {
        const y = groundY - 30 - Math.sin(x * 0.005 + time * 0.1) * 20 - Math.sin(x * 0.01) * 15;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, groundY);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    
    ctx.fillStyle = c.grass;
    ctx.fillRect(0, groundY, W, H - groundY);
    
    const roadTop = groundY + 20;
    const roadBot = groundY + 60;
    ctx.fillStyle = c.road;
    ctx.fillRect(0, roadTop, W, roadBot - roadTop);
    
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    ctx.lineDashOffset = -time * 200;
    ctx.beginPath();
    ctx.moveTo(0, roadTop + (roadBot - roadTop) / 2);
    ctx.lineTo(W, roadTop + (roadBot - roadTop) / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.fillStyle = '#9E9E9E';
    ctx.fillRect(0, groundY + 5, W, 18);
    ctx.fillStyle = '#BDBDBD';
    ctx.fillRect(0, roadBot, W, 15);
    
    trees.forEach(t => t.draw(ctx, 0.6));
    smallTrees.forEach(t => t.draw(ctx, 0.8));
    
    const bikeX = W * 0.45;
    const bikeY = groundY + 18 - 18 * Math.min(W,H)*0.0018;
    const bounce = Math.sin(time * 12) * 2 * Math.min(W,H)*0.001;
    
    drawPelicanBike(ctx, bikeX, bikeY, bounce);
    
    if (currentWeather === 'rainy') {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, 0, W, H);
        raindrops.forEach(r => { r.update(dt); r.draw(ctx); });
        if (Math.random() < 0.3) {
            const sx = Math.random() * W;
            drawSplash(ctx, sx, groundY + 30, 3 + Math.random() * 4);
        }
    }
    
    const vignette = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.8);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.15)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    
    requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
