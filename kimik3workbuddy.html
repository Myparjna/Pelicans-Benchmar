<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鹈鹕兜风 · 天气轮播</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    position: relative;
    transition: background 1.6s ease;
  }

  /* ========== 天空配色（随天气切换） ========== */
  body.w-sunny  { background: linear-gradient(180deg, #6ec3f5 0%, #a5dcf9 55%, #d8f1fd 100%); }
  body.w-cloudy { background: linear-gradient(180deg, #8fa6bb 0%, #b3c2cf 55%, #d4dde4 100%); }
  body.w-rainy  { background: linear-gradient(180deg, #5d7085 0%, #7f92a6 55%, #a3b3c2 100%); }

  /* ========== 天气标签 ========== */
  .weather-tag {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; z-index: 50;
    padding: 7px 16px; border-radius: 999px;
    background: rgba(255,255,255,.75); backdrop-filter: blur(6px);
    color: #33475b; font-size: 14px; letter-spacing: 2px;
    box-shadow: 0 2px 10px rgba(60,90,120,.18);
    display: flex; align-items: center; gap: 8px;
    transition: background .8s ease;
  }
  .weather-tag .dot { width: 9px; height: 9px; border-radius: 50%; transition: background .8s ease; }
  body.w-sunny  .weather-tag .dot { background: #f7b731; }
  body.w-cloudy .weather-tag .dot { background: #8d9aa8; }
  body.w-rainy  .weather-tag .dot { background: #4a90d9; }

  /* ========== 太阳 ========== */
  .sun {
    position: absolute; top: 9%; right: 12%; z-index: 1;
    width: clamp(64px, 12vmin, 120px); height: clamp(64px, 12vmin, 120px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe9a3, #ffce3d 65%, #ffb62e);
    box-shadow: 0 0 60px 22px rgba(255, 205, 70, .55);
    transition: opacity 1.4s ease, transform 1.4s ease;
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100% { box-shadow: 0 0 60px 22px rgba(255,205,70,.55); }
    50%     { box-shadow: 0 0 80px 34px rgba(255,205,70,.7); }
  }
  body.w-cloudy .sun { opacity: .18; transform: scale(.85); }
  body.w-rainy  .sun { opacity: 0; transform: scale(.7); }

  /* ========== 云 ========== */
  .cloud {
    position: absolute; z-index: 2;
    width: var(--w); height: calc(var(--w) * .36);
    background: var(--c1, #ffffff);
    border-radius: calc(var(--w) * .18);
    opacity: .92;
    transition: background 1.4s ease, opacity 1.4s ease;
    animation: drift var(--t, 60s) linear infinite;
    left: -30%;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 46%; height: 160%; left: 14%; top: -78%; }
  .cloud::after  { width: 32%; height: 120%; right: 14%; top: -52%; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(160vw); }
  }
  .c1 { --w: clamp(140px, 22vw, 260px); --t: 75s; top: 12%; animation-delay: -10s; }
  .c2 { --w: clamp(110px, 17vw, 200px); --t: 95s; top: 24%; animation-delay: -55s; }
  .c3 { --w: clamp(170px, 26vw, 320px); --t: 62s; top: 6%;  animation-delay: -38s; }
  .c4 { --w: clamp(120px, 19vw, 220px); --t: 85s; top: 30%; animation-delay: -70s; opacity: 0; }
  .c5 { --w: clamp(150px, 23vw, 280px); --t: 70s; top: 17%; animation-delay: -25s; opacity: 0; }

  body.w-cloudy .cloud { --c1: #eef1f4; }
  body.w-cloudy .c4, body.w-cloudy .c5 { opacity: .95; }
  body.w-rainy .cloud { --c1: #77879a; opacity: .98; }
  body.w-rainy .c4, body.w-rainy .c5 { opacity: .98; }
  body.w-rainy .c1, body.w-rainy .c2, body.w-rainy .c3 { --c1: #6a7a8e; }

  /* ========== 雨 ========== */
  .rain { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
  body.w-rainy .rain { opacity: 1; }
  .drop {
    position: absolute; top: -8%;
    width: 2px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, rgba(210,228,246,0), rgba(210,228,246,.85));
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(-5vh); }
    to   { transform: translateY(115vh); }
  }

  /* ========== 远景（向后移动，制造骑行感） ========== */
  .scenery {
    position: absolute; left: 0; right: 0; bottom: 18vh; z-index: 4;
    height: 60px; overflow: hidden;
  }
  .scenery-track {
    position: absolute; bottom: 0; left: 0; height: 100%;
    display: flex; align-items: flex-end; gap: 26vmin;
    animation: scrollX 9s linear infinite;
    padding-left: 100vw;
  }
  @keyframes scrollX {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-100vw - 100%)); }
  }
  .tree {
    width: 0; height: 0; flex: none;
    border-left: calc(3.2vmin) solid transparent;
    border-right: calc(3.2vmin) solid transparent;
    border-bottom: calc(8vmin) solid #4e8f5f;
    position: relative; transition: border-bottom-color 1.4s ease;
  }
  .tree::after {
    content: ""; position: absolute; left: calc(-.9vmin); top: calc(8vmin);
    width: calc(1.8vmin); height: calc(3vmin); background: #7a5c3e;
  }
  .bush {
    flex: none; width: calc(7vmin); height: calc(3.4vmin);
    background: #5da86f; border-radius: 50% 50% 12% 12%;
    transition: background 1.4s ease;
  }
  body.w-cloudy .tree { border-bottom-color: #47785a; }
  body.w-cloudy .bush { background: #548c66; }
  body.w-rainy .tree { border-bottom-color: #3d6449; }
  body.w-rainy .bush { background: #47755a; }

  /* ========== 地面与道路 ========== */
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    height: 18vh;
    transition: background 1.4s ease;
    background: linear-gradient(180deg, #79b567 0%, #5f9c52 100%);
  }
  body.w-cloudy .ground { background: linear-gradient(180deg, #6ea362 0%, #588a4d 100%); }
  body.w-rainy  .ground { background: linear-gradient(180deg, #5d8a56 0%, #4a7345 100%); }
  .road {
    position: absolute; left: 0; right: 0; bottom: 0; height: 9vh;
    background: #8d9299; transition: background 1.4s ease;
    overflow: hidden;
  }
  body.w-rainy .road { background: #767c85; }
  .road::before {
    content: ""; position: absolute; left: 0; right: 0; top: 46%; height: 5px;
    background: repeating-linear-gradient(90deg, #f2e9c9 0 46px, transparent 46px 92px);
    animation: dash 0.9s linear infinite;
    opacity: .85;
  }
  @keyframes dash {
    from { background-position-x: 0; }
    to   { background-position-x: -92px; }
  }

  /* ========== 鹈鹕 + 自行车 ========== */
  .rider {
    position: absolute; z-index: 10;
    left: 50%; bottom: 6.5vh;
    width: min(88vw, 62vh);
    transform: translateX(-50%);
    animation: bob 1.1s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-4px); }
  }
  .rider svg { width: 100%; height: auto; display: block; overflow: visible; }

  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .crank { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
  .leg-front { transform-box: fill-box; transform-origin: 50% 12%; animation: pedalA 1s linear infinite; }
  .leg-back  { transform-box: fill-box; transform-origin: 50% 12%; animation: pedalB 1s linear infinite; }
  @keyframes pedalA { 0% { transform: rotate(9deg); } 50% { transform: rotate(-9deg); } 100% { transform: rotate(9deg); } }
  @keyframes pedalB { 0% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } 100% { transform: rotate(-9deg); } }

  .wing { transform-box: fill-box; transform-origin: 20% 15%; animation: flap 1.4s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }

  .head-group { transform-box: fill-box; transform-origin: 15% 80%; animation: nod 2.2s ease-in-out infinite; }
  @keyframes nod { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3.5deg); } }

  /* ========== 雨滴溅落的小水洼 ========== */
  .puddles { position: absolute; left: 0; right: 0; bottom: 8.6vh; z-index: 6; height: 3vh;
    opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  body.w-rainy .puddles { opacity: 1; }
  .puddle {
    position: absolute; bottom: 0; height: 100%;
    background: rgba(190, 214, 235, .5); border-radius: 50%;
    transform: scaleY(.28);
    animation: shimmer 2.4s ease-in-out infinite;
  }
  @keyframes shimmer { 0%,100% { opacity: .45; } 50% { opacity: .8; } }
</style>
</head>
<body class="w-sunny">

  <div class="weather-tag"><span class="dot"></span><span id="weatherText">晴天 · 适合兜风</span></div>

  <div class="sun"></div>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="cloud c5"></div>

  <div class="rain" id="rain"></div>

  <div class="scenery">
    <div class="scenery-track" id="sceneryTrack"></div>
  </div>

  <div class="ground"></div>
  <div class="road"></div>
  <div class="puddles" id="puddles"></div>

  <!-- 鹈鹕骑自行车 -->
  <div class="rider">
    <svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" aria-label="鹈鹕骑自行车">
      <!-- 后轮 -->
      <g class="wheel">
        <circle cx="140" cy="245" r="46" fill="none" stroke="#3a3f44" stroke-width="7"/>
        <circle cx="140" cy="245" r="40" fill="none" stroke="#c9ced4" stroke-width="2"/>
        <g stroke="#9aa1a8" stroke-width="2.5">
          <line x1="140" y1="205" x2="140" y2="285"/>
          <line x1="100" y1="245" x2="180" y2="245"/>
          <line x1="112" y1="217" x2="168" y2="273"/>
          <line x1="168" y1="217" x2="112" y2="273"/>
        </g>
        <circle cx="140" cy="245" r="6" fill="#3a3f44"/>
      </g>
      <!-- 前轮 -->
      <g class="wheel">
        <circle cx="290" cy="245" r="46" fill="none" stroke="#3a3f44" stroke-width="7"/>
        <circle cx="290" cy="245" r="40" fill="none" stroke="#c9ced4" stroke-width="2"/>
        <g stroke="#9aa1a8" stroke-width="2.5">
          <line x1="290" y1="205" x2="290" y2="285"/>
          <line x1="250" y1="245" x2="330" y2="245"/>
          <line x1="262" y1="217" x2="318" y2="273"/>
          <line x1="318" y1="217" x2="262" y2="273"/>
        </g>
        <circle cx="290" cy="245" r="6" fill="#3a3f44"/>
      </g>

      <!-- 车架 -->
      <g stroke="#2f8f83" stroke-width="8" stroke-linecap="round" fill="none">
        <line x1="140" y1="245" x2="212" y2="238"/>
        <line x1="212" y1="238" x2="180" y2="168"/>
        <line x1="140" y1="245" x2="180" y2="168"/>
        <line x1="212" y1="238" x2="262" y2="172"/>
        <line x1="180" y1="168" x2="262" y2="172"/>
        <line x1="262" y1="172" x2="290" y2="245"/>
      </g>
      <!-- 车座与车把 -->
      <line x1="168" y1="162" x2="196" y2="162" stroke="#3a3f44" stroke-width="9" stroke-linecap="round"/>
      <path d="M262 172 L272 138 Q274 130 284 132 L296 136" fill="none" stroke="#3a3f44" stroke-width="7" stroke-linecap="round"/>

      <!-- 曲柄脚踏 -->
      <g class="crank">
        <line x1="212" y1="224" x2="212" y2="252" stroke="#3a3f44" stroke-width="5" stroke-linecap="round"/>
        <line x1="198" y1="224" x2="226" y2="224" stroke="#3a3f44" stroke-width="5" stroke-linecap="round"/>
        <circle cx="212" cy="238" r="5" fill="#3a3f44"/>
      </g>

      <!-- 后腿（被身体部分遮挡） -->
      <g class="leg-back">
        <line x1="196" y1="176" x2="205" y2="222" stroke="#d68a2e" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="205" cy="224" rx="10" ry="6" fill="#d68a2e"/>
      </g>

      <!-- 鹈鹕身体 -->
      <path d="M150 168 Q138 118 178 100 Q232 80 252 116 Q266 142 244 162 Q214 186 176 182 Q158 180 150 168 Z"
            fill="#faf6ee" stroke="#e4dccb" stroke-width="3"/>
      <!-- 尾巴 -->
      <path d="M152 158 Q128 150 118 132 Q140 136 154 142 Z" fill="#e9e1d0"/>
      <!-- 翅膀 -->
      <g class="wing">
        <path d="M172 108 Q216 92 240 116 Q224 148 184 150 Q168 132 172 108 Z" fill="#ded5c2"/>
        <path d="M186 120 Q210 112 226 122" fill="none" stroke="#c9bfa9" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- 头 + 长嘴 -->
      <g class="head-group">
        <path d="M238 108 Q232 84 252 72 Q272 62 284 76 Q292 88 284 100 Q272 114 252 112 Z" fill="#faf6ee" stroke="#e4dccb" stroke-width="3"/>
        <!-- 上喙 -->
        <path d="M282 82 Q330 84 352 92 Q330 98 284 94 Z" fill="#f5a623"/>
        <!-- 喉囊 -->
        <path d="M284 94 Q326 98 348 94 Q336 118 306 116 Q288 112 284 100 Z" fill="#f0932b"/>
        <!-- 眼睛 -->
        <circle cx="268" cy="84" r="4.5" fill="#2f3438"/>
        <circle cx="269.5" cy="82.5" r="1.4" fill="#ffffff"/>
        <!-- 小冠羽 -->
        <path d="M250 70 Q244 58 252 54 Q254 62 256 68 Z" fill="#e9e1d0"/>
      </g>

      <!-- 翅膀尖搭在车把上的“手” -->
      <circle cx="290" cy="136" r="7" fill="#ded5c2"/>

      <!-- 前腿 -->
      <g class="leg-front">
        <line x1="206" y1="178" x2="216" y2="224" stroke="#e89a35" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="218" cy="226" rx="10" ry="6" fill="#e89a35"/>
      </g>
    </svg>
  </div>

<script>
  // ===== 天气自动切换：晴天 -> 阴天 -> 雨天 -> 晴天，每 5 秒 =====
  const weathers = [
    { cls: 'w-sunny',  text: '晴天 · 适合兜风' },
    { cls: 'w-cloudy', text: '阴天 · 云多了起来' },
    { cls: 'w-rainy',  text: '雨天 · 鹈鹕在淋雨' }
  ];
  let idx = 0;
  const textEl = document.getElementById('weatherText');
  setInterval(() => {
    idx = (idx + 1) % weathers.length;
    document.body.className = weathers[idx].cls;
    textEl.textContent = weathers[idx].text;
  }, 5000);

  // ===== 生成雨滴 =====
  const rain = document.getElementById('rain');
  const DROP_COUNT = window.innerWidth < 600 ? 60 : 110;
  for (let i = 0; i < DROP_COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = Math.random() * 100 + '%';
    d.style.animationDuration = (0.55 + Math.random() * 0.5) + 's';
    d.style.animationDelay = (-Math.random() * 2) + 's';
    d.style.opacity = 0.35 + Math.random() * 0.5;
    rain.appendChild(d);
  }

  // ===== 生成远景树丛（两组无缝滚动） =====
  const track = document.getElementById('sceneryTrack');
  for (let g = 0; g < 2; g++) {
    for (let i = 0; i < 6; i++) {
      const el = document.createElement('div');
      el.className = Math.random() > 0.35 ? 'tree' : 'bush';
      track.appendChild(el);
    }
  }

  // ===== 生成水洼 =====
  const puddles = document.getElementById('puddles');
  [12, 38, 66, 88].forEach(left => {
    const p = document.createElement('div');
    p.className = 'puddle';
    p.style.left = left + '%';
    p.style.width = (8 + Math.random() * 7) + 'vmin';
    p.style.animationDelay = (-Math.random() * 2) + 's';
    puddles.appendChild(p);
  });
</script>
</body>
</html>
