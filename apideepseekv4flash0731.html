<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鹈鹕骑自行车 · 天气动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  #scene {
    position: fixed; inset: 0;
    width: 100%;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    background: #87ceeb;
  }

  /* ---------- 天空 ---------- */
  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #4facfe 0%, #aee3ff 100%);
    transition: background 1.4s ease;
  }
  #scene[data-weather="cloudy"] .sky { background: linear-gradient(180deg, #96a4b5 0%, #cbd6de 100%); }
  #scene[data-weather="rainy"]  .sky { background: linear-gradient(180deg, #5c6b7c 0%, #8da0b0 100%); }

  /* ---------- 太阳 ---------- */
  .sun {
    position: absolute; top: 7%; right: 8%;
    width: 17vmin; height: 17vmin;
    border-radius: 50%;
    background: radial-gradient(circle, #fff9c4 15%, #ffd54f 55%, rgba(255,213,79,0) 72%);
    opacity: 0; transform: scale(.3);
    transition: opacity 1s ease, transform 1s ease;
    z-index: 3;
    filter: drop-shadow(0 0 28px rgba(255,190,60,.75));
  }
  .sun::before {
    content: '';
    position: absolute; inset: -35%;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,220,90,.55) 0deg 9deg, transparent 9deg 18deg);
    animation: spin 24s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #scene[data-weather="sunny"] .sun { opacity: 1; transform: scale(1); }

  /* ---------- 云朵 ---------- */
  .cloud {
    position: absolute; left: 0;
    width: 160px; height: 52px;
    background: #fff;
    border-radius: 60px;
    opacity: 0;
    transition: opacity 1.2s ease;
    z-index: 2;
  }
  .cloud::before, .cloud::after {
    content: ''; position: absolute;
    background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 62px; height: 62px; top: -30px; left: 26px; }
  .cloud::after  { width: 46px; height: 46px; top: -20px; right: 22px; }

  .c1 { top: 5%; width: 190px; height: 60px; animation: drift 28s linear infinite; animation-delay: -6s; }
  .c2 { top: 13%; width: 135px; height: 46px; animation: drift 38s linear infinite; animation-delay: -20s; }
  .c3 { top: 21%; width: 105px; height: 36px; animation: drift 46s linear infinite; animation-delay: -32s; }
  .c2::before { width: 50px; height: 50px; top: -24px; left: 20px; }
  .c2::after  { width: 38px; height: 38px; top: -16px; right: 16px; }
  .c3::before { width: 42px; height: 42px; top: -20px; left: 16px; }
  .c3::after  { width: 32px; height: 32px; top: -13px; right: 12px; }

  @keyframes drift {
    from { transform: translateX(-32vw); }
    to   { transform: translateX(132vw); }
  }
  #scene[data-weather="cloudy"] .cloud { opacity: .95; }
  #scene[data-weather="rainy"]  .cloud { opacity: 1; background: #8b98a5; filter: brightness(.8); }

  /* ---------- 雨 ---------- */
  .rain {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity .6s ease;
    z-index: 15;
    pointer-events: none;
  }
  #scene[data-weather="rainy"] .rain { opacity: 1; }
  .drop {
    position: absolute; top: -12vh;
    width: 2px; height: 14px;
    border-radius: 2px;
    background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.85));
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(135vh); } }

  /* ---------- 地面 / 道路 ---------- */
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 30vh;
    background: linear-gradient(180deg, #8bc34a 0%, #7cb342 60%, #66a332 100%);
    transition: filter 1s ease;
    z-index: 1;
  }
  #scene[data-weather="rainy"] .ground { filter: brightness(.72) saturate(.85); }

  .road {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 13vh;
    background: #5c6b7a;
    transition: background 1s ease;
  }
  #scene[data-weather="rainy"] .road { background: #46545f; }
  .road::after {
    content: '';
    position: absolute; left: 0; right: 0; top: 50%; height: 5px;
    background: repeating-linear-gradient(90deg, #f4d03f 0px 38px, transparent 38px 76px);
    animation: roadMove 1.1s linear infinite;
  }
  @keyframes roadMove { to { background-position: -76px 0; } }

  /* ---------- 骑车鹈鹕 ---------- */
  .rider {
    position: absolute; left: 0; bottom: 12vh;
    width: min(88vw, 58vh);
    z-index: 5;
    animation: ride 14s linear infinite;
    will-change: transform;
  }
  @keyframes ride {
    from { transform: translateX(-45vw); }
    to   { transform: translateX(145vw); }
  }
  .rider svg { display: block; width: 100%; height: auto; }

  /* ---------- SVG 内部动画 ---------- */
  .wheel-rear, .wheel-front {
    transform-box: view-box;
    animation: wheelSpin 1.2s linear infinite;
  }
  .wheel-rear  { transform-origin: 125px 235px; }
  .wheel-front { transform-origin: 295px 235px; }
  .crank {
    transform-box: view-box;
    transform-origin: 205px 225px;
    animation: crankSpin 1.2s linear infinite;
  }
  .leg-front {
    transform-box: view-box;
    transform-origin: 198px 154px;
    animation: legSwing 1.2s ease-in-out infinite;
  }
  .leg-back {
    transform-box: view-box;
    transform-origin: 190px 152px;
    animation: legSwing 1.2s ease-in-out infinite reverse;
  }
  .rider-body {
    transform-box: view-box;
    transform-origin: 205px 160px;
    animation: bob 1.2s ease-in-out infinite;
  }
  .scarf {
    transform-box: view-box;
    transform-origin: 188px 116px;
    animation: scarfWave 1.4s ease-in-out infinite;
  }
  @keyframes wheelSpin { to { transform: rotate(360deg); } }
  @keyframes crankSpin { to { transform: rotate(360deg); } }
  @keyframes legSwing {
    0%, 100% { transform: rotate(-22deg); }
    50%      { transform: rotate(22deg); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes scarfWave {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(7deg); }
  }

  /* ---------- 天气提示 ---------- */
  .hud {
    position: absolute;
    top: calc(4vh + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    padding: 9px 20px;
    border-radius: 40px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
    font-size: 17px; color: #2c3e50;
    z-index: 20;
    white-space: nowrap;
    transition: background 1s ease, color 1s ease;
  }
  #scene[data-weather="cloudy"] .hud { background: rgba(220,228,235,.7); color: #34495e; }
  #scene[data-weather="rainy"]  .hud { background: rgba(50,60,75,.7); color: #ecf0f1; }
  .hud .weather-icon { font-size: 22px; line-height: 1; }
</style>
</head>
<body>

<div id="scene" data-weather="sunny">
  <div class="sky"></div>
  <div class="sun"></div>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="ground"><div class="road"></div></div>

  <div class="rider">
    <svg viewBox="0 0 420 300" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
      <!-- 地面阴影 -->
      <ellipse cx="210" cy="286" rx="118" ry="8" fill="rgba(0,0,0,.18)"/>

      <!-- 后轮 -->
      <g class="wheel-rear">
        <circle cx="125" cy="235" r="48" fill="none" stroke="#263238" stroke-width="6"/>
        <circle cx="125" cy="235" r="44" fill="none" stroke="#90a4ae" stroke-width="2"/>
        <line x1="125" y1="190" x2="125" y2="280" stroke="#78909c" stroke-width="2.5"/>
        <line x1="80"  y1="235" x2="170" y2="235" stroke="#78909c" stroke-width="2.5"/>
        <line x1="93"  y1="203" x2="157" y2="267" stroke="#78909c" stroke-width="2.5"/>
        <line x1="157" y1="203" x2="93"  y2="267" stroke="#78909c" stroke-width="2.5"/>
        <circle cx="125" cy="235" r="7" fill="#263238"/>
      </g>

      <!-- 前轮 -->
      <g class="wheel-front">
        <circle cx="295" cy="235" r="48" fill="none" stroke="#263238" stroke-width="6"/>
        <circle cx="295" cy="235" r="44" fill="none" stroke="#90a4ae" stroke-width="2"/>
        <line x1="295" y1="190" x2="295" y2="280" stroke="#78909c" stroke-width="2.5"/>
        <line x1="250" y1="235" x2="340" y2="235" stroke="#78909c" stroke-width="2.5"/>
        <line x1="263" y1="203" x2="327" y2="267" stroke="#78909c" stroke-width="2.5"/>
        <line x1="327" y1="203" x2="263" y2="267" stroke="#78909c" stroke-width="2.5"/>
        <circle cx="295" cy="235" r="7" fill="#263238"/>
      </g>

      <!-- 车架 -->
      <g stroke="#e74c3c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="125" y1="235" x2="205" y2="225"/>
        <line x1="125" y1="235" x2="190" y2="160"/>
        <line x1="205" y1="225" x2="190" y2="160"/>
        <line x1="190" y1="160" x2="255" y2="150"/>
        <line x1="205" y1="225" x2="262" y2="172"/>
        <line x1="255" y1="150" x2="262" y2="172"/>
        <line x1="262" y1="172" x2="295" y2="235"/>
      </g>

      <!-- 车把 -->
      <g stroke="#263238" stroke-width="5" fill="none" stroke-linecap="round">
        <line x1="255" y1="150" x2="248" y2="133"/>
        <line x1="248" y1="133" x2="234" y2="136"/>
      </g>

      <!-- 车座 -->
      <rect x="175" y="151" width="30" height="8" rx="4" fill="#263238"/>

      <!-- 曲柄与脚踏 -->
      <g class="crank">
        <circle cx="205" cy="225" r="9" fill="#37474f"/>
        <line x1="205" y1="225" x2="205" y2="193" stroke="#37474f" stroke-width="5" stroke-linecap="round"/>
        <rect x="194" y="188" width="22" height="6" rx="3" fill="#263238"/>
        <line x1="205" y1="225" x2="205" y2="257" stroke="#37474f" stroke-width="5" stroke-linecap="round"/>
        <rect x="194" y="254" width="22" height="6" rx="3" fill="#263238"/>
      </g>

      <!-- 鹈鹕整体（含身体起伏） -->
      <g class="rider-body">
        <!-- 后腿 -->
        <g class="leg-back">
          <line x1="190" y1="152" x2="196" y2="206" stroke="#b98f5f" stroke-width="7" stroke-linecap="round"/>
          <ellipse cx="196" cy="208" rx="5" ry="3" fill="#b98f5f"/>
        </g>
        <!-- 前腿 -->
        <g class="leg-front">
          <line x1="198" y1="154" x2="205" y2="195" stroke="#d9ab73" stroke-width="7" stroke-linecap="round"/>
          <ellipse cx="205" cy="197" rx="5" ry="3" fill="#d9ab73"/>
        </g>

        <!-- 尾巴 -->
        <path d="M150 140 L126 147 L150 153 Z" fill="#e8e4da" stroke="#d5d1c6" stroke-width="1"/>

        <!-- 身体 -->
        <ellipse cx="180" cy="132" rx="40" ry="27" fill="#f7f5ef" stroke="#d9d5cb" stroke-width="2"/>

        <!-- 翅膀 -->
        <ellipse cx="168" cy="125" rx="24" ry="14" fill="#ece9df"/>
        <path d="M150 120 Q168 111 190 120 Q180 132 150 128 Z" fill="#e0dcd0"/>

        <!-- 红围巾（迎风飘动） -->
        <path class="scarf" d="M188 116 C170 122 157 134 151 148 C162 136 172 128 184 120 Z" fill="#e74c3c"/>

        <!-- 脖子 -->
        <path d="M192 112 C198 96 200 92 206 88" stroke="#f7f5ef" stroke-width="14" fill="none" stroke-linecap="round"/>

        <!-- 头 -->
        <circle cx="214" cy="84" r="17" fill="#f7f5ef" stroke="#d9d5cb" stroke-width="1.5"/>

        <!-- 大嘴与喉囊 -->
        <path d="M228 82 C250 78 283 80 306 86 C285 92 256 92 228 90 Z" fill="#f39c12"/>
        <path d="M228 90 C240 110 269 116 301 92 C278 104 252 102 230 92 Z" fill="#f5b041"/>
        <path d="M228 82 L228 92" stroke="#d68910" stroke-width="1.5"/>
        <path d="M228 86 C250 84 280 85 300 88" stroke="#d68910" stroke-width="1.2" fill="none"/>

        <!-- 眼睛 -->
        <circle cx="220" cy="79" r="3.2" fill="#1c1c1c"/>
        <circle cx="221" cy="78" r="1" fill="#fff"/>

        <!-- 头顶小羽冠 -->
        <path d="M204 68 Q210 63 216 67" stroke="#e8e4da" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="rain" id="rain"></div>

  <div class="hud">
    <span class="weather-icon" id="weatherIcon">☀️</span>
    <span class="weather-text" id="weatherText">晴天</span>
  </div>
</div>

<script>
(function () {
  // 生成雨滴
  var rain = document.getElementById('rain');
  for (var i = 0; i < 42; i++) {
    var d = document.createElement('div');
    d.className = 'drop';
    d.style.left = (Math.random() * 100).toFixed(2) + '%';
    d.style.animationDuration = (0.55 + Math.random() * 0.65).toFixed(2) + 's';
    d.style.animationDelay = (Math.random() * 1.4).toFixed(2) + 's';
    d.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
    rain.appendChild(d);
  }

  // 天气循环：晴天 → 阴天 → 雨天 → 晴天，每 5 秒切换
  var scene = document.getElementById('scene');
  var states = [
    { key: 'sunny',  label: '晴天', icon: '☀️' },
    { key: 'cloudy', label: '阴天', icon: '⛅' },
    { key: 'rainy',  label: '雨天', icon: '🌧️' }
  ];
  var idx = 0;

  function apply(s) {
    scene.dataset.weather = s.key;
    document.getElementById('weatherIcon').textContent = s.icon;
    document.getElementById('weatherText').textContent = s.label;
  }

  apply(states[0]);
  setInterval(function () {
    idx = (idx + 1) % states.length;
    apply(states[idx]);
  }, 5000);
})();
</script>
</body>
</html>
