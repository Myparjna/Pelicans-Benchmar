<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>体素鹈鹕骑自行车 · 天气循环场景 · qwen3.8max</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#87b7dd;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .pill{position:fixed;z-index:10;display:flex;align-items:center;gap:8px;pointer-events:none;
    background:rgba(255,255,255,.78);color:#2c3a47;border-radius:999px;padding:7px 16px;
    font-size:clamp(13px,2.6vmin,17px);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.14);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);user-select:none;}
  #weatherPill{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));}
  #tipPill{display:block;bottom:max(12px,env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    font-weight:400;font-size:clamp(11px,2.2vmin,14px);color:#5a6b7a;padding:5px 12px;
    max-width:calc(100vw - 24px);text-align:center;white-space:normal;}
  #err{position:fixed;inset:0;display:none;place-items:center;color:#fff;font-size:16px;
    text-align:center;padding:24px;background:#5a707f;}
</style>
</head>
<body>
<div id="weatherPill" class="pill"><span id="wIcon">☀️</span><span id="wText">晴天</span></div>
<div id="tipPill" class="pill"><span>天气每 5 秒自动切换：晴天 → 阴天 → 雨天</span></div>
<div id="err">三维引擎加载失败，请检查网络后刷新页面。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
if (!window.THREE) {
  // 备用 CDN
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/three@0.128.0/build/three.min.js';
  s.onload = () => main();
  s.onerror = () => { document.getElementById('err').style.display = 'grid'; };
  document.head.appendChild(s);
} else {
  main();
}

function main() {
  /* ================= 渲染器 / 相机 ================= */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87c7f2);
  scene.fog = new THREE.Fog(0x9fd0f0, 16, 46);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 120);
  const target = new THREE.Vector3(0, 1.35, 0);
  const camDir = new THREE.Vector3(0.52, 0.22, 0.78).normalize();

  /* ================= 灯光 ================= */
  const hemi = new THREE.HemisphereLight(0xffffff, 0x778866, 0.95);
  scene.add(hemi);
  const sunLight = new THREE.DirectionalLight(0xfff2d0, 1.05);
  sunLight.position.set(-9, 13, 7);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.left = -9; sunLight.shadow.camera.right = 9;
  sunLight.shadow.camera.top = 9;   sunLight.shadow.camera.bottom = -9;
  sunLight.shadow.camera.near = 2;  sunLight.shadow.camera.far = 40;
  scene.add(sunLight);

  /* ================= 体素工具 ================= */
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const matCache = new Map();
  function M(hex) {
    if (!matCache.has(hex)) matCache.set(hex, new THREE.MeshLambertMaterial({ color: hex }));
    return matCache.get(hex);
  }
  // 可单独变色的材质（天气过渡用）
  const grassMat = new THREE.MeshLambertMaterial({ color: 0x74b04a });
  const roadMat  = new THREE.MeshLambertMaterial({ color: 0x50555c });
  const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

  function V(parent, mat, x, y, z, sx, sy, sz, cast, recv) {
    const m = new THREE.Mesh(geo, mat.isMaterial ? mat : M(mat));
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    m.castShadow = cast !== false;
    m.receiveShadow = recv !== false;
    parent.add(m);
    return m;
  }
  // 两点之间的方形“管子”
  function tube(parent, mat, p1, p2, th) {
    const len = p1.distanceTo(p2);
    const m = new THREE.Mesh(geo, mat.isMaterial ? mat : M(mat));
    m.position.copy(p1).lerp(p2, 0.5);
    m.scale.set(th, th, len);
    m.lookAt(p2.clone().add(parent.position));
    m.castShadow = true;
    parent.add(m);
    return m;
  }

  /* ================= 地面与马路 ================= */
  const ground = new THREE.Group();
  scene.add(ground);
  const grass = new THREE.Mesh(geo, grassMat);
  grass.scale.set(70, 0.3, 40); grass.position.y = -0.15;
  grass.receiveShadow = true; ground.add(grass);
  const road = new THREE.Mesh(geo, roadMat);
  road.scale.set(70, 0.3, 3.4); road.position.y = -0.13;
  road.receiveShadow = true; ground.add(road);

  // 道路标线（滚动）
  const dashes = [];
  for (let i = 0; i < 12; i++) {
    dashes.push(V(ground, 0xf2f2ee, -13 + i * 2.3, 0.045, 0, 0.55, 0.05, 0.14, false, true));
  }

  // 远山（静态背景，压低放远）
  V(scene, 0x5c8f4e, -9, 0.5, -21, 18, 1.5, 4, false, false);
  V(scene, 0x679a55, 6, 0.8, -23, 22, 2.1, 4, false, false);
  V(scene, 0x528347, 16, 0.4, -19, 14, 1.2, 4, false, false);

  // 树（滚动）
  const trees = [];
  function makeTree(s, x, z) {
    const g = new THREE.Group();
    V(g, 0x8a5a33, 0, 0.45 * s, 0, 0.24 * s, 0.9 * s, 0.24 * s);
    V(g, 0x3f7d3a, 0, 1.15 * s, 0, 0.95 * s, 0.75 * s, 0.95 * s);
    V(g, 0x4f9448, 0, 1.75 * s, 0, 0.62 * s, 0.6 * s, 0.62 * s);
    V(g, 0x5da554, 0, 2.18 * s, 0, 0.34 * s, 0.42 * s, 0.34 * s);
    g.position.set(x, 0, z);
    scene.add(g);
    trees.push(g);
    return g;
  }
  for (let i = 0; i < 8; i++) {
    makeTree(0.85 + (i * 37 % 10) / 22, -14 + i * 3.9, -3.4 - (i * 13 % 7) / 10);
  }

  // 近侧小花小草（滚动，增强速度感）
  const flowers = [];
  const flowerColors = [0xe2574c, 0xf0c33c, 0xffffff, 0xd98ac2];
  for (let i = 0; i < 10; i++) {
    const g = new THREE.Group();
    V(g, 0x4c8a3f, 0, 0.12, 0, 0.05, 0.26, 0.05, false);
    V(g, flowerColors[i % 4], 0, 0.3, 0, 0.15, 0.13, 0.15, false);
    g.position.set(-13 + i * 2.7, 0, 2.5 + (i * 29 % 8) / 10);
    scene.add(g);
    flowers.push(g);
  }

  /* ================= 云朵 ================= */
  const clouds = [];
  function makeCloud(s, x, y, z) {
    const g = new THREE.Group();
    const offs = [
      [0, 0, 0, 1.7, 0.7, 1.0],
      [0.95, 0.16, 0.1, 1.0, 0.55, 0.8],
      [-0.95, 0.12, -0.05, 1.05, 0.5, 0.75],
      [0.25, 0.42, 0, 0.9, 0.5, 0.7],
      [-0.4, 0.36, 0.12, 0.7, 0.42, 0.6]
    ];
    offs.forEach(o => V(g, cloudMat, o[0] * s, o[1] * s, o[2] * s, o[3] * s, o[4] * s, o[5] * s, false, false));
    g.position.set(x, y, z);
    scene.add(g);
    clouds.push(g);
    return g;
  }
  makeCloud(1.5, -10, 5.0, -10);
  makeCloud(1.1, -3, 6.0, -12);
  makeCloud(1.8, 4, 4.6, -9);
  makeCloud(1.0, 10, 5.8, -11);
  makeCloud(1.3, 15, 5.0, -13);
  makeCloud(0.9, -15, 4.4, -8);

  /* ================= 太阳（晴天显示） ================= */
  const sunGrp = new THREE.Group();
  sunGrp.position.set(-4.5, 5.6, -13);
  scene.add(sunGrp);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd94d });
  V(sunGrp, sunMat, 0, 0, 0, 1.7, 1.7, 1.7, false, false);
  V(sunGrp, sunMat, 1.45, 0, 0, 0.6, 0.26, 0.26, false, false);
  V(sunGrp, sunMat, -1.45, 0, 0, 0.6, 0.26, 0.26, false, false);
  V(sunGrp, sunMat, 0, 1.45, 0, 0.26, 0.6, 0.26, false, false);
  V(sunGrp, sunMat, 0, -1.45, 0, 0.26, 0.6, 0.26, false, false);

  /* ================= 自行车 ================= */
  const bike = new THREE.Group();
  scene.add(bike);

  const frameMat = M(0xd64533); // 红色车架
  const darkMat  = M(0x30343c);
  const metalMat = M(0x9aa2ad);

  function makeWheel() {
    const g = new THREE.Group();
    const n = 18, r = 0.74;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      const c = V(g, 0x2e3138, Math.cos(a) * r, Math.sin(a) * r, 0, 0.2, 0.2, 0.16);
      c.rotation.z = a;
    }
    for (let i = 0; i < 3; i++) {
      const sp = V(g, metalMat, 0, 0, 0, 0.07, 1.42, 0.07);
      sp.rotation.z = i * Math.PI / 3;
    }
    V(g, 0xd64533, 0, 0, 0, 0.24, 0.24, 0.2);
    return g;
  }
  const wheelR = makeWheel(); wheelR.position.set(-1.15, 0.84, 0); bike.add(wheelR);
  const wheelF = makeWheel(); wheelF.position.set(1.15, 0.84, 0);  bike.add(wheelF);

  const crankC = new THREE.Vector3(0.02, 0.55, 0);
  const seatP  = new THREE.Vector3(-0.45, 1.55, 0);
  const headT  = new THREE.Vector3(0.92, 1.45, 0);
  const headB  = new THREE.Vector3(0.80, 1.02, 0);
  const hubR   = new THREE.Vector3(-1.15, 0.84, 0);
  const hubF   = new THREE.Vector3(1.15, 0.84, 0);

  tube(bike, frameMat, hubR, crankC, 0.11);           // 后下叉
  tube(bike, frameMat, hubR, seatP, 0.11);            // 后上叉
  tube(bike, frameMat, crankC, seatP, 0.13);          // 座管
  tube(bike, frameMat, crankC, headB, 0.13);          // 下管
  tube(bike, frameMat, seatP, headT, 0.11);           // 上管
  tube(bike, frameMat, headB, headT, 0.12);           // 头管
  tube(bike, frameMat, headT, hubF, 0.10);            // 前叉
  tube(bike, frameMat, headT, new THREE.Vector3(0.98, 1.66, 0), 0.10); // 立管
  tube(bike, darkMat, new THREE.Vector3(0.98, 1.66, -0.4), new THREE.Vector3(0.98, 1.66, 0.4), 0.09); // 车把
  V(bike, darkMat, 0.98, 1.66, -0.45, 0.11, 0.11, 0.16); // 左把套
  V(bike, darkMat, 0.98, 1.66,  0.45, 0.11, 0.11, 0.16); // 右把套
  V(bike, darkMat, -0.47, 1.62, 0, 0.46, 0.1, 0.24);     // 座垫
  const chainring = V(bike, darkMat, crankC.x, crankC.y, 0, 0.42, 0.42, 0.07);
  chainring.rotation.z = Math.PI / 4;

  // 曲柄 + 脚踏
  const crankG = new THREE.Group();
  crankG.position.copy(crankC);
  bike.add(crankG);
  V(crankG, darkMat, 0,  0.17,  0.12, 0.08, 0.34, 0.08);
  V(crankG, darkMat, 0, -0.17, -0.12, 0.08, 0.34, 0.08);
  const pedalR = V(crankG, 0x22262c, 0,  0.34,  0.2, 0.28, 0.07, 0.17);
  const pedalL = V(crankG, 0x22262c, 0, -0.34, -0.2, 0.28, 0.07, 0.17);

  bike.position.y = 0.03;

  /* ================= 鹈鹕 ================= */
  const pel = new THREE.Group();
  pel.position.set(-0.47, 1.62, 0);
  bike.add(pel);

  const white = 0xf4f1e8, gray = 0xd9d4c8, grayD = 0xa8a193,
        beakC = 0xe8912d, pouchC = 0xd97c1a, black = 0x26262a;

  V(pel, white, 0, 0.42, 0, 1.08, 0.64, 0.62);        // 身体
  V(pel, white, 0.36, 0.6, 0, 0.52, 0.46, 0.54);      // 前胸
  V(pel, white, -0.4, 0.5, 0, 0.44, 0.46, 0.52);      // 后身
  const tail = V(pel, gray, -0.68, 0.6, 0, 0.36, 0.22, 0.32);
  tail.rotation.z = 0.45;                              // 尾巴
  V(pel, white, 0.5, 0.92, 0, 0.28, 0.52, 0.28);      // 脖子
  V(pel, white, 0.58, 1.26, 0, 0.44, 0.36, 0.38);     // 头
  V(pel, beakC, 1.1, 1.28, 0, 0.72, 0.13, 0.24);      // 上喙
  V(pel, pouchC, 1.0, 1.16, 0, 0.56, 0.17, 0.22);     // 下喙
  V(pel, pouchC, 0.9, 1.08, 0, 0.32, 0.15, 0.2);      // 喉囊
  V(pel, black, 0.72, 1.33,  0.2, 0.07, 0.09, 0.05);  // 右眼
  V(pel, black, 0.72, 1.33, -0.2, 0.07, 0.09, 0.05);  // 左眼
  const wingR = V(pel, gray, -0.02, 0.44,  0.35, 0.72, 0.36, 0.1); // 右翅
  const wingL = V(pel, gray, -0.02, 0.44, -0.35, 0.72, 0.36, 0.1); // 左翅
  V(pel, grayD, -0.34, 0.4,  0.36, 0.24, 0.28, 0.09);
  V(pel, grayD, -0.34, 0.4, -0.36, 0.24, 0.28, 0.09);

  /* ================= 鹈鹕的腿（两段 IK，跟住脚踏） ================= */
  const LEG1 = 0.85, LEG2 = 0.85;
  const legCubes = [], feet = [];
  for (let s = 0; s < 2; s++) {
    const arr = [];
    for (let i = 0; i < 8; i++) arr.push(V(bike, 0xe0762b, 0, 0, 0, 0.13, 0.13, 0.13));
    legCubes.push(arr);
    feet.push(V(bike, 0xe0762b, 0, 0, 0, 0.32, 0.09, 0.17));
  }
  const _d = new THREE.Vector3(), _n = new THREE.Vector3();
  function solveKnee(H, F, out) {
    _d.subVectors(F, H);
    let len = Math.min(_d.length(), LEG1 + LEG2 - 1e-4);
    _d.normalize();
    const a = (LEG1 * LEG1 - LEG2 * LEG2 + len * len) / (2 * len);
    const h = Math.sqrt(Math.max(LEG1 * LEG1 - a * a, 0));
    _n.set(_d.y, -_d.x, 0);
    if (_n.x < 0) _n.negate(); // 膝盖朝前
    out.copy(H).addScaledVector(_d, a).addScaledVector(_n, h);
    return out;
  }
  const _p = new THREE.Vector3();
  function placeLeg(cubes, H, K, F) {
    const l1 = K.distanceTo(H), l2 = F.distanceTo(K), total = l1 + l2;
    for (let i = 0; i < cubes.length; i++) {
      const t = (i + 0.5) / cubes.length * total;
      if (t < l1) _p.copy(K).sub(H).multiplyScalar(t / l1).add(H);
      else _p.copy(F).sub(K).multiplyScalar((t - l1) / l2).add(K);
      cubes[i].position.copy(_p);
    }
  }

  /* ================= 雨滴 ================= */
  const RAIN_N = 700;
  const rainPos = new Float32Array(RAIN_N * 3);
  for (let i = 0; i < RAIN_N; i++) {
    rainPos[i * 3]     = Math.random() * 18 - 9;
    rainPos[i * 3 + 1] = Math.random() * 12;
    rainPos[i * 3 + 2] = Math.random() * 12 - 7;
  }
  const rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
  const rainMat = new THREE.PointsMaterial({
    color: 0x9fb6c8, size: 0.045, transparent: true, opacity: 0,
    depthWrite: false, sizeAttenuation: true
  });
  const rain = new THREE.Points(rainGeo, rainMat);
  rain.visible = false;
  scene.add(rain);

  /* ================= 天气系统 ================= */
  const WEATHERS = [
    { name: '晴天', icon: '☀️', sky: 0x87c7f2, fog: 0x9fd0f0, hemi: 0.95, sunI: 1.05, sunC: 0xfff2d0, cloud: 0xffffff, grass: 0x74b04a, road: 0x50555c, sunV: 1, rain: 0 },
    { name: '阴天', icon: '🌥️', sky: 0xb9c3ca, fog: 0xb9c3ca, hemi: 0.75, sunI: 0.50, sunC: 0xdfe8ee, cloud: 0xdde3e6, grass: 0x6a9c4b, road: 0x4a4f56, sunV: 0, rain: 0 },
    { name: '雨天', icon: '🌧️', sky: 0x808d97, fog: 0x8a97a1, hemi: 0.55, sunI: 0.32, sunC: 0xc9d4dc, cloud: 0x939ea7, grass: 0x5a8342, road: 0x40454c, sunV: 0, rain: 1 }
  ];
  let wIdx = 0, wStart = 0;
  const wIcon = document.getElementById('wIcon');
  const wText = document.getElementById('wText');

  // 当前值与切换起点（按时间轴平滑过渡，约 1.2 秒完成）
  const cur = {
    sky: new THREE.Color(0x87c7f2), fog: new THREE.Color(0x9fd0f0),
    sunC: new THREE.Color(0xfff2d0), cloud: new THREE.Color(0xffffff),
    grass: new THREE.Color(0x74b04a), road: new THREE.Color(0x50555c),
    hemi: 0.95, sunI: 1.05, sunV: 1, rain: 0
  };
  const snap = {
    sky: cur.sky.clone(), fog: cur.fog.clone(), sunC: cur.sunC.clone(),
    cloud: cur.cloud.clone(), grass: cur.grass.clone(), road: cur.road.clone(),
    hemi: 0.95, sunI: 1.05, sunV: 1, rain: 0
  };
  function setWeather(i) {
    wIdx = i;
    wStart = performance.now();
    snap.sky.copy(cur.sky); snap.fog.copy(cur.fog); snap.sunC.copy(cur.sunC);
    snap.cloud.copy(cur.cloud); snap.grass.copy(cur.grass); snap.road.copy(cur.road);
    snap.hemi = cur.hemi; snap.sunI = cur.sunI; snap.sunV = cur.sunV; snap.rain = cur.rain;
    wIcon.textContent = WEATHERS[i].icon;
    wText.textContent = WEATHERS[i].name;
  }
  setInterval(() => setWeather((wIdx + 1) % 3), 5000); // 每 5 秒切换

  const _tc = new THREE.Color();
  function lerpWeather() {
    const t = WEATHERS[wIdx];
    const u = Math.min(1, (performance.now() - wStart) / 1200);
    const k = u * u * (3 - 2 * u); // smoothstep
    cur.sky.copy(snap.sky).lerp(_tc.setHex(t.sky), k);
    cur.fog.copy(snap.fog).lerp(_tc.setHex(t.fog), k);
    cur.sunC.copy(snap.sunC).lerp(_tc.setHex(t.sunC), k);
    cur.cloud.copy(snap.cloud).lerp(_tc.setHex(t.cloud), k);
    cur.grass.copy(snap.grass).lerp(_tc.setHex(t.grass), k);
    cur.road.copy(snap.road).lerp(_tc.setHex(t.road), k);
    cur.hemi = snap.hemi + (t.hemi - snap.hemi) * k;
    cur.sunI = snap.sunI + (t.sunI - snap.sunI) * k;
    cur.sunV = snap.sunV + (t.sunV - snap.sunV) * k;
    cur.rain = snap.rain + (t.rain - snap.rain) * k;

    scene.background.copy(cur.sky);
    scene.fog.color.copy(cur.fog);
    hemi.intensity = cur.hemi;
    sunLight.intensity = cur.sunI;
    sunLight.color.copy(cur.sunC);
    cloudMat.color.copy(cur.cloud);
    grassMat.color.copy(cur.grass);
    roadMat.color.copy(cur.road);
    sunGrp.visible = cur.sunV > 0.02;
    sunGrp.scale.setScalar(Math.max(cur.sunV, 0.001));
    rainMat.opacity = cur.rain * 0.8;
    rain.visible = cur.rain > 0.02;
  }

  /* ================= 响应式布局（横屏 / 竖屏） ================= */
  function layout() {
    const w = window.innerWidth, h = window.innerHeight, a = w / h;
    renderer.setSize(w, h);
    camera.aspect = a;
    const dist = a >= 1 ? 8.4 : Math.min(8.4 * 1.05 / a, 15.5);
    camera.position.copy(target).addScaledVector(camDir, dist);
    camera.lookAt(target);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  layout();

  /* ================= 动画主循环 ================= */
  const clock = new THREE.Clock();
  const SPEED = 4;        // 前进速度（路面滚动）
  const WHEEL_R = 0.835;  // 车轮半径
  const CADENCE = 3.4;    // 蹬踏角速度
  let theta = 0, t = 0;

  const hipL = new THREE.Vector3(), footL = new THREE.Vector3(), kneeL = new THREE.Vector3();
  const hipR = new THREE.Vector3(), footR = new THREE.Vector3(), kneeR = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    t += dt;
    theta -= CADENCE * dt;

    // 车轮与曲柄
    wheelR.rotation.z -= SPEED / WHEEL_R * dt;
    wheelF.rotation.z -= SPEED / WHEEL_R * dt;
    crankG.rotation.z = theta;
    pedalR.rotation.z = -theta; // 脚踏保持水平
    pedalL.rotation.z = -theta;

    // 鹈鹕轻微起伏
    pel.position.y = 1.62 + Math.sin(theta * 2) * 0.02;
    pel.rotation.z = Math.sin(theta) * 0.015;
    wingR.rotation.x = Math.sin(t * 3) * 0.08;
    wingL.rotation.x = -Math.sin(t * 3) * 0.08;

    // 脚踏位置（自行车局部坐标）
    const s = Math.sin(theta), c = Math.cos(theta);
    footR.set(crankC.x - 0.34 * s, crankC.y + 0.34 * c, 0.2);
    footL.set(crankC.x + 0.34 * s, crankC.y - 0.34 * c, -0.2);
    hipR.set(pel.position.x + 0.12, pel.position.y + 0.1, 0.18);
    hipL.set(pel.position.x + 0.12, pel.position.y + 0.1, -0.18);

    solveKnee(hipR, footR, kneeR);
    solveKnee(hipL, footL, kneeL);
    placeLeg(legCubes[0], hipR, kneeR, footR);
    placeLeg(legCubes[1], hipL, kneeL, footL);
    feet[0].position.set(footR.x + 0.05, footR.y + 0.09, footR.z);
    feet[1].position.set(footL.x + 0.05, footL.y + 0.09, footL.z);

    // 路面滚动
    for (const d of dashes) {
      d.position.x -= SPEED * dt;
      if (d.position.x < -14) d.position.x += 27.6;
    }
    for (const g of trees) {
      g.position.x -= SPEED * dt;
      if (g.position.x < -16) g.position.x += 31;
    }
    for (const g of flowers) {
      g.position.x -= SPEED * dt;
      if (g.position.x < -14) g.position.x += 27;
    }
    // 云朵漂移
    clouds.forEach((g, i) => {
      g.position.x -= (0.25 + i * 0.04) * dt;
      if (g.position.x < -19) g.position.x = 19;
    });

    // 雨
    if (rain.visible) {
      const arr = rainGeo.attributes.position.array;
      for (let i = 0; i < RAIN_N; i++) {
        arr[i * 3 + 1] -= (8.5 + (i % 5) * 0.6) * dt;
        arr[i * 3] -= 1.2 * dt;
        if (arr[i * 3 + 1] < 0) {
          arr[i * 3 + 1] = 10.5 + Math.random() * 2;
          arr[i * 3] = Math.random() * 18 - 9;
          arr[i * 3 + 2] = Math.random() * 12 - 7;
        }
      }
      rainGeo.attributes.position.needsUpdate = true;
    }

    lerpWeather();
    renderer.render(scene, camera);
  }
  animate();
}
</script>
</body>
</html>
