<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鹈鹕骑行 · 天气循环动画</title>
<style>
  :root {
    --sun-color: #ffce54;
    --cloud-color: #ffffff;
    --cloud-shadow: #e7eef5;
    --grass-top: #a9d68b;
    --grass-bottom: #8ec96f;
    --road: #9aa1ab;
    --road-line: #eef2f6;
    --rain-color: #7fb2e6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #7ec8f2, #eaf6ff);
  }

  /* ---------- 天空渐变（三层交叉淡入实现平滑天气切换） ---------- */
  .sky-layer {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.4s ease;
    pointer-events: none;
  }
  .sky-layer.sunny  { background: linear-gradient(180deg, #6dc0f5 0%, #a5dcfb 45%, #eaf6ff 100%); }
  .sky-layer.cloudy { background: linear-gradient(180deg, #aebfd0 0%, #ccd6e0 50%, #e7edf2 100%); }
  .sky-layer.rainy  { background: linear-gradient(180deg, #6e8095 0%, #93a4b6 50%, #c2cdd8 100%); }

  .weather-sunny  .sky-layer.sunny  { opacity: 1; }
  .weather-cloudy .sky-layer.cloudy { opacity: 1; }
  .weather-rainy  .sky-layer.rainy  { opacity: 1; }

  /* ---------- 太阳 ---------- */
  .sun {
    position: absolute;
    top: 9vh;
    right: 10vw;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--sun-color);
    box-shadow: 0 0 0 14px rgba(255, 206, 84, 0.18),
                0 0 0 30px rgba(255, 206, 84, 0.10),
                0 0 80px 22px rgba(255, 214, 102, 0.45);
    transition: opacity 1.4s ease, transform 1.4s ease;
    z-index: 1;
  }
  .weather-cloudy .sun { opacity: 0.18; }
  .weather-rainy  .sun { opacity: 0; transform: translateY(20px) scale(0.85); }

  /* ---------- 云 ---------- */
  .cloud {
    position: absolute;
    background: var(--cloud-color);
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(120, 140, 160, 0.14);
    transition: opacity 1.4s ease, background 1.4s ease, box-shadow 1.4s ease, filter 1.4s ease;
    z-index: 2;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud::before { width: 58%; height: 130%; left: 16%; top: -62%; }
  .cloud::after  { width: 42%; height: 90%;  right: 10%; top: -40%; }

  .cloud.c1 { top: 13vh; left: 6vw;  width: 17vw; height: 5.2vw; animation: drift 34s linear infinite; }
  .cloud.c2 { top: 24vh; left: 32vw; width: 13vw; height: 4.2vw; animation: drift 26s linear infinite; }
  .cloud.c3 { top: 8vh;  left: 56vw; width: 15vw; height: 4.6vw; animation: drift 40s linear infinite; }
  .cloud.c4 { top: 30vh; left: 72vw; width: 20vw; height: 6vw;   animation: drift 30s linear infinite; }

  @keyframes drift {
    0%   { transform: translateX(0); }
    100% { transform: translateX(6vw); }
  }

  /* 晴天云更少 */
  .weather-sunny  .cloud.hide-on-sunny { opacity: 0; }
  .weather-cloudy .cloud.hide-on-sunny { opacity: 1; }
  .weather-rainy  .cloud.hide-on-sunny { opacity: 1; }

  /* 雨天乌云 */
  .weather-cloudy { --cloud-color: #e9eef3; }
  .weather-rainy  { --cloud-color: #94a3b4; --cloud-shadow: #7c8a9a; }
  .weather-rainy .cloud { filter: saturate(0.6); }

  /* ---------- 地面 ---------- */
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 24vh;
    z-index: 3;
    transition: filter 1.4s ease;
  }
  .ground .grass {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--grass-top), var(--grass-bottom));
  }
  .ground .road {
    position: absolute;
    left: 0; right: 0;
    bottom: 13%;
    height: 34%;
    background: var(--road);
    overflow: hidden;
  }
  .ground .road::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 5px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, var(--road-line) 0 46px, transparent 46px 92px);
    animation: roadmove 1.4s linear infinite;
  }
  @keyframes roadmove {
    0%   { background-position-x: 0; }
    100% { background-position-x: -92px; }
  }
  .weather-cloudy { --grass-top: #a3c987; --grass-bottom: #86bb6a; --road: #97a0ab; }
  .weather-rainy  { --grass-top: #8fb77a; --grass-bottom: #6fa259; --road: #7d8794; --road-line: #dfe6ee; }

  /* ---------- 鹈鹕骑行 SVG ---------- */
  .cyclist {
    position: absolute;
    left: 50%;
    bottom: 12vh;
    transform: translateX(-50%);
    z-index: 4;
  }
  .cyclist svg {
    display: block;
    width: min(90vw, 740px);
    height: auto;
  }

  /* ---------- 雨 ---------- */
  .rain {
    position: absolute;
    inset: -10vh 0 0 0;
    z-index: 6;
    opacity: 0;
    transition: opacity 1.4s ease;
    pointer-events: none;
  }
  .weather-rainy .rain { opacity: 1; }
  .drop {
    position: absolute;
    top: 0;
    width: 3px;
    height: 26px;
    background: linear-gradient(180deg, rgba(120, 168, 220, 0) 0%, #6ea3da 55%, #4a82c5 100%);
    border-radius: 3px;
    box-shadow: 0 0 3px rgba(180, 210, 240, 0.6);
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-6vh) translateX(0);    opacity: 0; }
    8%   { opacity: 1; }
    100% { transform: translateY(108vh) translateX(-32px); opacity: 0.9; }
  }

  /* ---------- 天气标签 ---------- */
  .weather-tag {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 7px 20px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    color: #3c4858;
    font-size: 15px;
    letter-spacing: 2px;
    box-shadow: 0 6px 18px rgba(90, 110, 130, 0.14);
    backdrop-filter: blur(6px);
    z-index: 7;
    transition: background 1.4s ease, color 1.4s ease;
  }
  .weather-rainy .weather-tag { background: rgba(255, 255, 255, 0.6); color: #33404f; }

  /* ---------- 响应式微调 ---------- */
  @media (orientation: portrait) {
    .cyclist svg { width: min(96vw, 640px); }
    .cyclist { bottom: 13vh; }
    .sun { width: 68px; height: 68px; top: 8vh; right: 8vw; }
  }
</style>
</head>
<body>
  <div class="scene weather-sunny" id="scene">

    <!-- 天空 -->
    <div class="sky-layer sunny"></div>
    <div class="sky-layer cloudy"></div>
    <div class="sky-layer rainy"></div>

    <!-- 太阳 -->
    <div class="sun"></div>

    <!-- 云 -->
    <div class="cloud c1"></div>
    <div class="cloud c2 hide-on-sunny"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4 hide-on-sunny"></div>

    <!-- 地面 -->
    <div class="ground">
      <div class="grass"></div>
      <div class="road"></div>
    </div>

    <!-- 鹈鹕骑自行车 -->
    <div class="cyclist">
      <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车">
        <!-- 阴影 -->
        <ellipse cx="412" cy="486" rx="250" ry="10" fill="#4a5560" opacity="0.16" />

        <!-- ===== 自行车 ===== -->
        <!-- 后轮 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 250 420" to="360 250 420" dur="1.4s" repeatCount="indefinite" />
          <circle cx="250" cy="420" r="68" fill="none" stroke="#4a4f59" stroke-width="8" />
          <circle cx="250" cy="420" r="60" fill="none" stroke="#b4bac2" stroke-width="1.6" opacity="0.7" />
          <line x1="250" y1="354" x2="250" y2="486" stroke="#c3c9d1" stroke-width="1.6" />
          <line x1="250" y1="354" x2="250" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(30 250 420)" />
          <line x1="250" y1="354" x2="250" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(60 250 420)" />
          <line x1="250" y1="354" x2="250" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(90 250 420)" />
          <line x1="250" y1="354" x2="250" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(120 250 420)" />
          <line x1="250" y1="354" x2="250" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(150 250 420)" />
          <circle cx="250" cy="420" r="7" fill="#4a4f59" />
        </g>

        <!-- 车架 -->
        <g stroke="#5a5f6a" stroke-width="7" stroke-linecap="round" fill="none">
          <line x1="250" y1="420" x2="412" y2="420" />            <!-- 后下叉 -->
          <line x1="412" y1="420" x2="395" y2="300" />            <!-- 立管 -->
          <line x1="395" y1="300" x2="250" y2="420" />            <!-- 后上叉 -->
          <line x1="412" y1="420" x2="560" y2="295" />            <!-- 下管 -->
          <line x1="560" y1="295" x2="575" y2="420" />            <!-- 前叉 -->
        </g>

        <!-- 远侧腿 -->
        <g transform="translate(378,340)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="20;-18;20" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite" />
            <line x1="0" y1="0" x2="8" y2="42" stroke="#e89a3e" stroke-width="9" stroke-linecap="round" />
            <g transform="translate(8,42)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="-25;15;-25" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite" />
                <line x1="0" y1="0" x2="3" y2="40" stroke="#e89a3e" stroke-width="8" stroke-linecap="round" />
                <path d="M3 40 l8 3 l-8 7 z" fill="#f2a54a" />
              </g>
            </g>
          </g>
        </g>

        <!-- ===== 鹈鹕 ===== -->
        <!-- 尾巴 -->
        <path d="M300 235 C270 220 258 248 268 262 C282 258 296 250 300 235 Z" fill="#e6ebf1" stroke="#cdd3db" stroke-width="2" />

        <!-- 身体 -->
        <ellipse cx="385" cy="240" rx="92" ry="68" fill="#ffffff" stroke="#d9dee5" stroke-width="2.5" />
        <!-- 脖子 -->
        <path d="M438 205 Q452 180 448 158" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" />

        <!-- 头 -->
        <circle cx="448" cy="150" r="38" fill="#ffffff" stroke="#d9dee5" stroke-width="2.5" />
        <!-- 头顶羽毛 -->
        <path d="M436 116 q-4 -12 6 -16 q2 12 -6 16" fill="#e6ebf1" stroke="#cdd3db" stroke-width="1.5" />
        <path d="M446 113 q1 -14 11 -15 q-1 13 -11 15" fill="#e6ebf1" stroke="#cdd3db" stroke-width="1.5" />

        <!-- 眼睛 -->
        <circle cx="460" cy="138" r="6.5" fill="#2f3540" />
        <circle cx="462" cy="136" r="2.2" fill="#ffffff" />

        <!-- 上喙 -->
        <path d="M480 142 Q530 148 576 156 Q530 158 480 156 Z" fill="#ff9a3c" stroke="#f07f1d" stroke-width="2" stroke-linejoin="round" />

        <!-- 喉囊 -->
        <path d="M470 158 Q500 196 556 204 Q522 214 470 184 Q460 172 470 158 Z" fill="#ff7f2a" stroke="#f06f16" stroke-width="2" stroke-linejoin="round" />

        <!-- 翅膀 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 372 226; -16 372 226; 0 372 226" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite" />
          <ellipse cx="338" cy="200" rx="56" ry="26" fill="#eef1f5" stroke="#cdd3db" stroke-width="2" transform="rotate(-24 372 226)" />
        </g>

        <!-- 近侧腿 -->
        <g transform="translate(378,340)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-18;20;-18" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite" />
            <line x1="0" y1="0" x2="10" y2="42" stroke="#f7a04b" stroke-width="9" stroke-linecap="round" />
            <g transform="translate(10,42)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="15;-25;15" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite" />
                <line x1="0" y1="0" x2="4" y2="40" stroke="#f7a04b" stroke-width="8" stroke-linecap="round" />
                <path d="M4 40 l8 3 l-8 7 z" fill="#f7a04b" />
              </g>
            </g>
          </g>
        </g>

        <!-- 曲柄 + 踏板 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 412 420" to="360 412 420" dur="1.4s" repeatCount="indefinite" />
          <line x1="412" y1="420" x2="412" y2="450" stroke="#5a5f6a" stroke-width="7" stroke-linecap="round" />
          <line x1="412" y1="420" x2="412" y2="390" stroke="#5a5f6a" stroke-width="7" stroke-linecap="round" />
          <rect x="398" y="445" width="28" height="10" rx="4" fill="#5a5f6a" />
          <rect x="398" y="385" width="28" height="10" rx="4" fill="#5a5f6a" />
          <circle cx="412" cy="420" r="8" fill="#4a4f59" />
        </g>

        <!-- 前轮 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 575 420" to="360 575 420" dur="1.4s" repeatCount="indefinite" />
          <circle cx="575" cy="420" r="68" fill="none" stroke="#4a4f59" stroke-width="8" />
          <circle cx="575" cy="420" r="60" fill="none" stroke="#b4bac2" stroke-width="1.6" opacity="0.7" />
          <line x1="575" y1="354" x2="575" y2="486" stroke="#c3c9d1" stroke-width="1.6" />
          <line x1="575" y1="354" x2="575" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(30 575 420)" />
          <line x1="575" y1="354" x2="575" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(60 575 420)" />
          <line x1="575" y1="354" x2="575" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(90 575 420)" />
          <line x1="575" y1="354" x2="575" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(120 575 420)" />
          <line x1="575" y1="354" x2="575" y2="486" stroke="#c3c9d1" stroke-width="1.6" transform="rotate(150 575 420)" />
          <circle cx="575" cy="420" r="7" fill="#4a4f59" />
        </g>

        <!-- 车座 -->
        <path d="M372 298 Q395 286 420 298 Q395 300 372 298 Z" fill="#6b7280" />
        <line x1="395" y1="300" x2="395" y2="308" stroke="#5a5f6a" stroke-width="6" stroke-linecap="round" />

        <!-- 车把 -->
        <g stroke="#5a5f6a" stroke-width="6" stroke-linecap="round" fill="none">
          <line x1="560" y1="295" x2="556" y2="270" />
          <line x1="548" y1="272" x2="574" y2="272" />
        </g>
        <circle cx="548" cy="272" r="5" fill="#4a4f59" />
        <circle cx="574" cy="272" r="5" fill="#4a4f59" />
      </svg>
    </div>

    <!-- 雨 -->
    <div class="rain" id="rain"></div>

    <!-- 天气标签 -->
    <div class="weather-tag" id="tag">晴 天</div>
  </div>

  <script>
    (function () {
      var scene = document.getElementById('scene');
      var tag = document.getElementById('tag');
      var weathers = [
        { cls: 'weather-sunny',  label: '晴 天' },
        { cls: 'weather-cloudy', label: '阴 天' },
        { cls: 'weather-rainy',  label: '雨 天' }
      ];
      // 解析 URL 参数 ?w=sunny|cloudy|rainy 控制初始天气，方便调试
      var initialIdx = 0;
      var m = location.search.match(/[?&]w=(sunny|cloudy|rainy)/);
      if (m) {
        var found = weathers.findIndex(function (w) { return w.cls.indexOf(m[1]) !== -1; });
        if (found !== -1) initialIdx = found;
      }
      scene.className = 'scene ' + weathers[initialIdx].cls;
      tag.textContent = weathers[initialIdx].label;

      // 每 5 秒：晴天 -> 阴天 -> 雨天 -> 晴天
      var next = (initialIdx + 1) % weathers.length;
      setInterval(function () {
        apply(next);
        next = (next + 1) % weathers.length;
      }, 5000);

      // 生成雨滴
      var rain = document.getElementById('rain');
      var count = 80;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < count; i++) {
        var d = document.createElement('span');
        d.className = 'drop';
        d.style.left = (Math.random() * 100) + 'vw';
        d.style.animationDuration = (0.65 + Math.random() * 0.55) + 's';
        // 用负 delay 让雨滴分布在循环的不同时刻（确保截图/加载初期就能看到下落中的雨滴）
        d.style.animationDelay = (-Math.random() * 1.2) + 's';
        d.style.opacity = (0.55 + Math.random() * 0.4);
        frag.appendChild(d);
      }
      rain.appendChild(frag);
    })();
  </script>
</body>
</html>
