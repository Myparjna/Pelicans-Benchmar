<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - 天气循环动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  /* 场景容器 */
  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    transition: background 1.5s ease;
  }

  /* 晴天 */
  .scene.sunny {
    background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 60%, #98D8C8 100%);
  }
  /* 阴天 */
  .scene.cloudy {
    background: linear-gradient(to bottom, #7D8A99 0%, #A0ACB8 60%, #B8C4CE 100%);
  }
  /* 雨天 */
  .scene.rainy {
    background: linear-gradient(to bottom, #4A5568 0%, #6B7A8C 60%, #8B9AAB 100%);
  }

  /* 太阳 */
  .sun {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 80px;
    height: 80px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 40px #FFD700, 0 0 80px rgba(255, 215, 0, 0.5);
    opacity: 1;
    transition: opacity 1.5s ease, transform 1.5s ease;
  }
  .scene.cloudy .sun,
  .scene.rainy .sun {
    opacity: 0;
    transform: scale(0.5);
  }

  /* 云朵 */
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50px;
    opacity: 0.9;
    transition: opacity 1.5s ease, background 1.5s ease;
  }
  .scene.cloudy .cloud,
  .scene.rainy .cloud {
    background: #8A95A5;
    opacity: 1;
  }

  .cloud::before,
  .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }

  .cloud1 {
    top: 10%;
    left: 10%;
    width: 100px;
    height: 40px;
    animation: floatCloud 25s linear infinite;
  }
  .cloud1::before {
    width: 50px; height: 50px;
    top: -25px; left: 15px;
  }
  .cloud1::after {
    width: 35px; height: 35px;
    top: -18px; left: 50px;
  }

  .cloud2 {
    top: 18%;
    left: 40%;
    width: 120px;
    height: 45px;
    animation: floatCloud 30s linear infinite reverse;
  }
  .cloud2::before {
    width: 60px; height: 60px;
    top: -30px; left: 20px;
  }
  .cloud2::after {
    width: 40px; height: 40px;
    top: -20px; left: 65px;
  }

  .cloud3 {
    top: 12%;
    right: 20%;
    width: 90px;
    height: 35px;
    animation: floatCloud 28s linear infinite;
  }
  .cloud3::before {
    width: 45px; height: 45px;
    top: -22px; left: 12px;
  }
  .cloud3::after {
    width: 30px; height: 30px;
    top: -15px; left: 45px;
  }

  @keyframes floatCloud {
    0% { transform: translateX(0); }
    100% { transform: translateX(30px); }
  }

  /* 雨滴 */
  .rain-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .scene.rainy .rain-container {
    opacity: 1;
  }

  .raindrop {
    position: absolute;
    width: 2px;
    height: 15px;
    background: linear-gradient(to bottom, transparent, rgba(174, 194, 224, 0.8));
    animation: rainFall linear infinite;
  }

  @keyframes rainFall {
    0% {
      transform: translateY(-20px);
      opacity: 0;
    }
    10% { opacity: 1; }
    100% {
      transform: translateY(100vh);
      opacity: 0.3;
    }
  }

  /* 远处山丘 */
  .hills {
    position: absolute;
    bottom: 25%;
    width: 100%;
    height: 30%;
    transition: filter 1.5s ease;
  }
  .scene.cloudy .hills,
  .scene.rainy .hills {
    filter: brightness(0.7) saturate(0.6);
  }

  .hill {
    position: absolute;
    bottom: 0;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }
  .hill1 {
    left: -5%;
    width: 40%;
    height: 100%;
    background: #6B8E6B;
  }
  .hill2 {
    left: 25%;
    width: 50%;
    height: 80%;
    background: #5A7D5A;
  }
  .hill3 {
    right: -5%;
    width: 45%;
    height: 90%;
    background: #7AA07A;
  }

  /* 地面 */
  .ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 25%;
    background: #7CB342;
    transition: background 1.5s ease;
  }
  .scene.cloudy .ground { background: #689F38; }
  .scene.rainy .ground { background: #558B2F; }

  /* 道路 */
  .road {
    position: absolute;
    bottom: 10%;
    width: 100%;
    height: 12%;
    background: #555;
    transition: background 1.5s ease;
  }
  .scene.rainy .road { background: #3A3A3A; }

  .road-line {
    position: absolute;
    top: 50%;
    width: 100%;
    height: 4px;
    background: repeating-linear-gradient(
      to right,
      #FFD700 0px,
      #FFD700 40px,
      transparent 40px,
      transparent 80px
    );
    transform: translateY(-50%);
    animation: roadMove 2s linear infinite;
  }

  @keyframes roadMove {
    0% { background-position: 0 0; }
    100% { background-position: -80px 0; }
  }

  /* 鹈鹕与自行车容器 */
  .pelican-rider {
    position: absolute;
    bottom: 18%;
    left: -200px;
    width: 180px;
    height: 160px;
    animation: rideMove 8s linear infinite;
    z-index: 10;
  }

  @keyframes rideMove {
    0% { left: -200px; }
    100% { left: 110%; }
  }

  /* 自行车 */
  .bike {
    position: absolute;
    bottom: 0;
    width: 180px;
    height: 80px;
  }

  /* 车轮 */
  .wheel {
    position: absolute;
    bottom: 0;
    width: 50px;
    height: 50px;
    border: 4px solid #333;
    border-radius: 50%;
    background: #222;
    animation: wheelSpin 0.6s linear infinite;
  }
  .wheel-front { right: 10px; }
  .wheel-back { left: 10px; }

  .wheel::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background: #888;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .wheel-spoke {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 2px;
    background: #666;
    transform-origin: center;
  }
  .wheel-spoke:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); }
  .wheel-spoke:nth-child(2) { transform: translate(-50%, -50%) rotate(45deg); }
  .wheel-spoke:nth-child(3) { transform: translate(-50%, -50%) rotate(90deg); }
  .wheel-spoke:nth-child(4) { transform: translate(-50%, -50%) rotate(135deg); }

  @keyframes wheelSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* 车架 */
  .frame {
    position: absolute;
    bottom: 25px;
    left: 30px;
    width: 120px;
    height: 3px;
    background: #E53935;
  }
  .frame-seat {
    position: absolute;
    bottom: 25px;
    left: 35px;
    width: 3px;
    height: 30px;
    background: #E53935;
  }
  .frame-handle {
    position: absolute;
    bottom: 25px;
    right: 25px;
    width: 3px;
    height: 35px;
    background: #E53935;
  }
  .seat {
    position: absolute;
    bottom: 53px;
    left: 28px;
    width: 18px;
    height: 5px;
    background: #333;
    border-radius: 3px;
  }
  .handlebar {
    position: absolute;
    bottom: 58px;
    right: 18px;
    width: 20px;
    height: 4px;
    background: #333;
    border-radius: 2px;
  }

  /* 踏板 */
  .pedal-arm {
    position: absolute;
    bottom: 25px;
    left: 85px;
    width: 3px;
    height: 20px;
    background: #555;
    transform-origin: top center;
    animation: pedalSpin 0.6s linear infinite;
  }
  .pedal {
    position: absolute;
    bottom: -4px;
    left: -5px;
    width: 13px;
    height: 4px;
    background: #333;
    border-radius: 2px;
  }

  @keyframes pedalSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* 鹈鹕身体 */
  .pelican {
    position: absolute;
    bottom: 55px;
    left: 40px;
    width: 100px;
    height: 100px;
    animation: pelicanBounce 0.3s ease-in-out infinite alternate;
  }

  @keyframes pelicanBounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-3px); }
  }

  /* 身体 */
  .pelican-body {
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 60px;
    height: 45px;
    background: #F5F5F5;
    border-radius: 50% 50% 45% 45%;
    border: 2px solid #DDD;
  }

  /* 翅膀 */
  .pelican-wing {
    position: absolute;
    bottom: 20px;
    left: 15px;
    width: 45px;
    height: 25px;
    background: #E8E8E8;
    border-radius: 50%;
    border: 1px solid #CCC;
    animation: wingFlap 0.4s ease-in-out infinite alternate;
    transform-origin: left center;
  }

  @keyframes wingFlap {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-10deg); }
  }

  /* 脖子和头 */
  .pelican-neck {
    position: absolute;
    bottom: 40px;
    left: 55px;
    width: 20px;
    height: 35px;
    background: #F5F5F5;
    border-radius: 10px;
    border: 2px solid #DDD;
    transform: rotate(-20deg);
    transform-origin: bottom center;
  }

  .pelican-head {
    position: absolute;
    bottom: 68px;
    left: 62px;
    width: 28px;
    height: 26px;
    background: #F5F5F5;
    border-radius: 50%;
    border: 2px solid #DDD;
  }

  /* 眼睛 */
  .pelican-eye {
    position: absolute;
    top: 8px;
    right: 6px;
    width: 5px;
    height: 5px;
    background: #222;
    border-radius: 50%;
  }

  /* 大嘴巴 */
  .pelican-beak {
    position: absolute;
    top: 10px;
    right: -22px;
    width: 28px;
    height: 12px;
    background: #FFA726;
    border-radius: 0 15px 5px 0;
    border: 1px solid #FB8C00;
  }
  .pelican-beak::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 2px;
    width: 22px;
    height: 10px;
    background: #FFB74D;
    border-radius: 0 0 15px 15px;
    border: 1px solid #FB8C00;
    border-top: none;
  }

  /* 腿和脚 */
  .pelican-leg {
    position: absolute;
    bottom: -5px;
    width: 3px;
    height: 18px;
    background: #FFA726;
  }
  .leg-left {
    left: 25px;
    animation: legLeft 0.6s ease-in-out infinite;
    transform-origin: top center;
  }
  .leg-right {
    left: 45px;
    animation: legRight 0.6s ease-in-out infinite;
    transform-origin: top center;
  }

  @keyframes legLeft {
    0%, 100% { transform: rotate(30deg); }
    50% { transform: rotate(-30deg); }
  }
  @keyframes legRight {
    0%, 100% { transform: rotate(-30deg); }
    50% { transform: rotate(30deg); }
  }

  .pelican-foot {
    position: absolute;
    bottom: -2px;
    left: -4px;
    width: 11px;
    height: 5px;
    background: #FF8F00;
    border-radius: 50%;
  }

  /* 天气提示文字 */
  .weather-label {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 20px;
    font-size: 14px;
    color: #333;
    z-index: 100;
    backdrop-filter: blur(4px);
    transition: all 1s ease;
  }
  .scene.rainy .weather-label {
    background: rgba(50, 50, 50, 0.7);
    color: #fff;
  }

  /* 响应式适配 */
  @media (max-width: 600px) {
    .pelican-rider {
      width: 140px;
      height: 130px;
      bottom: 18%;
    }
    .bike {
      width: 140px;
      height: 65px;
    }
    .wheel {
      width: 40px;
      height: 40px;
    }
    .pelican {
      width: 80px;
      height: 80px;
      bottom: 45px;
      left: 30px;
    }
    .sun {
      width: 50px;
      height: 50px;
    }
    .weather-label {
      font-size: 12px;
      padding: 6px 14px;
    }
    @keyframes rideMove {
      0% { left: -160px; }
      100% { left: 110%; }
    }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .hills { height: 25%; bottom: 28%; }
    .ground { height: 28%; }
    .road { height: 14%; bottom: 10%; }
    .pelican-rider { bottom: 20%; }
  }
</style>
</head>
<body>

<div class="scene sunny" id="scene">
  <div class="weather-label" id="weatherLabel">☀️ 晴天</div>

  <!-- 太阳 -->
  <div class="sun"></div>

  <!-- 云朵 -->
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <!-- 雨滴 -->
  <div class="rain-container" id="rainContainer"></div>

  <!-- 山丘 -->
  <div class="hills">
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
  </div>

  <!-- 地面 -->
  <div class="ground"></div>

  <!-- 道路 -->
  <div class="road">
    <div class="road-line"></div>
  </div>

  <!-- 鹈鹕骑车 -->
  <div class="pelican-rider">
    <div class="bike">
      <div class="wheel wheel-back">
        <div class="wheel-spoke"></div>
        <div class="wheel-spoke"></div>
        <div class="wheel-spoke"></div>
        <div class="wheel-spoke"></div>
      </div>
      <div class="wheel wheel-front">
        <div class="wheel-spoke"></div>
        <div class="wheel-spoke"></div>
        <div class="wheel-spoke"></div>
        <div class="wheel-spoke"></div>
      </div>
      <div class="frame"></div>
      <div class="frame-seat"></div>
      <div class="frame-handle"></div>
      <div class="seat"></div>
      <div class="handlebar"></div>
      <div class="pedal-arm">
        <div class="pedal"></div>
      </div>
    </div>

    <div class="pelican">
      <div class="pelican-body"></div>
      <div class="pelican-wing"></div>
      <div class="pelican-neck"></div>
      <div class="pelican-head">
        <div class="pelican-eye"></div>
        <div class="pelican-beak"></div>
      </div>
      <div class="pelican-leg leg-left">
        <div class="pelican-foot"></div>
      </div>
      <div class="pelican-leg leg-right">
        <div class="pelican-foot"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // 生成雨滴
  function createRaindrops() {
    const container = document.getElementById('rainContainer');
    const count = window.innerWidth < 600 ? 60 : 120;
    
    for (let i = 0; i < count; i++) {
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.left = Math.random() * 100 + '%';
      drop.style.animationDuration = (0.5 + Math.random() * 0.8) + 's';
      drop.style.animationDelay = Math.random() * 2 + 's';
      drop.style.opacity = 0.3 + Math.random() * 0.7;
      container.appendChild(drop);
    }
  }

  // 天气循环
  const weatherStates = [
    { class: 'sunny', text: '☀️ 晴天' },
    { class: 'cloudy', text: '☁️ 阴天' },
    { class: 'rainy', text: '🌧️ 雨天' }
  ];

  let currentWeather = 0;
  const scene = document.getElementById('scene');
  const label = document.getElementById('weatherLabel');

  function switchWeather() {
    scene.classList.remove(weatherStates[currentWeather].class);
    currentWeather = (currentWeather + 1) % weatherStates.length;
    scene.classList.add(weatherStates[currentWeather].class);
    label.textContent = weatherStates[currentWeather].text;
  }

  // 初始化
  createRaindrops();
  setInterval(switchWeather, 5000);

  // 窗口大小变化时重建雨滴
  window.addEventListener('resize', () => {
    const container = document.getElementById('rainContainer');
    container.innerHTML = '';
    createRaindrops();
  });
</script>

</body>
</html>
