<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑行</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff}
  svg{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="一只鹈鹕在晴朗的白天骑自行车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb0ee"/><stop offset=".65" stop-color="#bfe6ff"/><stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff7c2"/><stop offset=".45" stop-color="#ffe680" stop-opacity=".8"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa1a9"/><stop offset="1" stop-color="#7d838b"/></linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e9ef"/></linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>
  <g transform="translate(980,115)">
    <circle r="120" fill="url(#glow)"/>
    <g id="rays"></g>
    <circle r="46" fill="#ffdd3c"/><circle r="38" fill="#ffe864"/>
  </g>
  <g id="birds"></g>
  <g id="clouds"></g>
  <g id="hillFar"></g>
  <g id="hillNear"></g>
  <g id="trees"></g>

  <rect y="530" width="1200" height="170" fill="#79c255"/>
  <rect y="582" width="1200" height="86" fill="url(#roadG)"/>
  <rect y="582" width="1200" height="4" fill="#e9e3d0"/>
  <rect y="664" width="1200" height="4" fill="#e9e3d0"/>
  <g id="dashes"></g>

  <!-- 自行车与鹈鹕：局部坐标原点位于中轴正下方的地面 -->
  <g id="rider" transform="translate(560,640)">
    <ellipse cx="0" cy="2" rx="160" ry="8" fill="rgba(0,0,0,.18)"/>
    <polyline id="legF" fill="none" stroke="#d9741c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footF" fill="#d9741c"/>
    <line id="crankF" stroke="#444" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(-110,-60)"><g id="wheelR"></g></g>
    <g transform="translate(110,-60)"><g id="wheelF"></g></g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-110,-60 L0,-55 L-35,-140 Z" stroke="#e63946" stroke-width="7"/>
      <path d="M-35,-140 L71,-140 M0,-55 L75,-128" stroke="#e63946" stroke-width="7"/>
      <path d="M70,-146 L76,-124" stroke="#b72a35" stroke-width="10"/>
      <path d="M76,-125 L110,-60" stroke="#c9ced4" stroke-width="6"/>
      <path d="M70,-146 L73,-166 M73,-166 Q88,-172 102,-162" stroke="#555" stroke-width="6"/>
      <path d="M-35,-140 L-37,-150" stroke="#555" stroke-width="5"/>
      <path d="M-110,-60 L-2,-71 M-110,-60 L-2,-39" stroke="#666" stroke-width="2.5"/>
    </g>
    <path d="M-62,-152 Q-40,-160 -14,-152 L-20,-146 L-56,-146 Z" fill="#2b2d33"/>
    <circle cx="0" cy="-55" r="16" fill="none" stroke="#666" stroke-width="4"/>
    <circle cx="0" cy="-55" r="5" fill="#666"/>

    <g id="basket">
      <path d="M118,-158 L134,-176 L128,-152 Z" fill="#4a90c2"/>
      <path d="M104,-160 Q112,-176 124,-162" fill="#5aa6d8"/>
      <path d="M88,-154 L132,-154 L126,-126 L94,-126 Z" fill="#c8924f" stroke="#8d5f2a" stroke-width="2"/>
      <path d="M90,-145 L130,-145 M92,-136 L128,-136 M101,-154 L103,-126 M110,-154 L110,-126 M119,-154 L117,-126" stroke="#8d5f2a" stroke-width="1.5"/>
      <path d="M80,-140 L94,-140" stroke="#888" stroke-width="3"/>
    </g>

    <polyline id="legN" fill="none" stroke="#f08a24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footN" fill="#f08a24"/>
    <line id="crankN" stroke="#333" stroke-width="6" stroke-linecap="round"/>

    <g id="pelican">
      <path id="scarfTail" fill="#ff6b6b"/>
      <path d="M-68,-190 L-112,-196 L-104,-182 L-72,-170 Z" fill="#f2f5f8" stroke="#c9d3dc" stroke-width="2"/>
      <ellipse cx="-15" cy="-195" rx="64" ry="42" transform="rotate(-16 -15 -195)" fill="url(#bodyG)" stroke="#c9d3dc" stroke-width="2"/>
      <path d="M18,-215 C46,-245 16,-275 42,-302" fill="none" stroke="#c9d3dc" stroke-width="26" stroke-linecap="round"/>
      <path d="M18,-215 C46,-245 16,-275 42,-302" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
      <ellipse cx="26" cy="-234" rx="16" ry="8" transform="rotate(-20 26 -234)" fill="#ff6b6b"/>
      <circle cx="45" cy="-306" r="21" fill="#fff" stroke="#c9d3dc" stroke-width="2"/>
      <path d="M30,-322 Q38,-336 46,-326 Q50,-338 58,-326" fill="#fff3b8" stroke="#e8d68a" stroke-width="1.5"/>
      <path id="pouch" d="M60,-298 L170,-288 C140,-262 92,-254 60,-284 Z" fill="#f7b955" stroke="#e0973a" stroke-width="1.5"/>
      <path d="M58,-310 L176,-294 Q182,-290 175,-286 L60,-298 Z" fill="#f4a340" stroke="#d98a2c" stroke-width="1.5"/>
      <path d="M62,-302 L168,-290" stroke="#d98a2c" stroke-width="1"/>
      <ellipse cx="52" cy="-311" rx="5" ry="5" fill="#fff6d6"/>
      <ellipse id="eye" cx="53" cy="-311" rx="3.3" ry="3.3" fill="#1b1b1b"/>
      <circle cx="54.2" cy="-312.4" r="1" fill="#fff"/>
      <path d="M-50,-222 C0,-240 55,-210 92,-168 C60,-178 20,-176 -20,-182 C-45,-185 -70,-190 -96,-206 C-80,-214 -66,-218 -50,-222 Z" fill="#f4f7fa" stroke="#c9d3dc" stroke-width="2"/>
      <path d="M-96,-206 C-80,-196 -60,-190 -30,-186 L-40,-180 C-62,-183 -84,-192 -96,-206 Z" fill="#3b3f47"/>
      <path d="M-58,-210 C-30,-206 0,-200 30,-196" fill="none" stroke="#d6dde4" stroke-width="2"/>
      <circle cx="90" cy="-167" r="6" fill="#f4f7fa" stroke="#c9d3dc" stroke-width="1.5"/>
    </g>
  </g>

  <g id="front"></g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const W = 1200;

// 太阳光芒
const rays = $('rays');
for (let i = 0; i < 12; i++) {
  el('path', { d: 'M-6,-60 L0,-88 L6,-60 Z', fill: '#ffe680', transform: `rotate(${i * 30})` }, rays);
}

// 周期性山丘，宽度为两屏以便无缝平移
function hillPath(base, amps, color, parent) {
  let d = `M0,700 L0,${base}`;
  for (let x = 0; x <= W * 2; x += 10) {
    let y = base;
    amps.forEach(([a, k, p]) => { y -= a * Math.sin((x / W) * Math.PI * 2 * k + p); });
    d += ` L${x},${y.toFixed(1)}`;
  }
  d += ` L${W * 2},700 Z`;
  return el('path', { d, fill: color }, parent);
}
hillPath(430, [[40, 2, 0.4], [22, 5, 1.3], [10, 9, 2]], '#a9dc8e', $('hillFar'));
hillPath(490, [[28, 3, 1.1], [16, 7, 0.2], [6, 13, 0.8]], '#8bcf68', $('hillNear'));

// 云朵
const clouds = [];
for (let i = 0; i < 6; i++) {
  const g = el('g', {}, $('clouds'));
  const s = 0.6 + Math.random() * 0.8;
  [[0, 0, 34], [36, -14, 30], [70, 0, 32], [34, 10, 30], [-30, 6, 22], [100, 8, 22]]
    .forEach(([x, y, r]) => el('circle', { cx: x * s, cy: y * s, r: r * s, fill: '#fff', opacity: .95 }, g));
  clouds.push({ g, x: Math.random() * (W + 300) - 150, y: 60 + Math.random() * 200, v: 8 + s * 14 });
}

// 飞鸟
const birds = [];
for (let i = 0; i < 4; i++) {
  const p = el('path', { fill: 'none', stroke: '#3a4a5a', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, $('birds'));
  birds.push({ p, x: Math.random() * W, y: 90 + Math.random() * 120, ph: Math.random() * 6, s: 0.7 + Math.random() * 0.5 });
}

// 树木
const trees = [];
function makeTree(parent) {
  const g = el('g', {}, parent);
  const h = 50 + Math.random() * 40;
  el('rect', { x: -5, y: -h, width: 10, height: h, fill: '#8a5a32', rx: 3 }, g);
  if (Math.random() < 0.5) {
    el('circle', { cx: 0, cy: -h - 10, r: 30, fill: '#3f9a3a' }, g);
    el('circle', { cx: -18, cy: -h + 6, r: 22, fill: '#47a842' }, g);
    el('circle', { cx: 18, cy: -h + 4, r: 22, fill: '#3a9136' }, g);
    el('circle', { cx: -8, cy: -h - 18, r: 12, fill: '#5fbe55', opacity: .7 }, g);
  } else {
    el('path', { d: `M-28,${-h + 16} L0,${-h - 60} L28,${-h + 16} Z`, fill: '#2f8a45' }, g);
    el('path', { d: `M-22,${-h - 10} L0,${-h - 76} L22,${-h - 10} Z`, fill: '#3aa052' }, g);
  }
  return g;
}
for (let i = 0; i < 7; i++) {
  trees.push({ g: makeTree($('trees')), x: i * 200 + Math.random() * 80, y: 534 + Math.random() * 10 });
}

// 道路虚线
const dashes = [];
for (let i = 0; i < 9; i++) {
  dashes.push(el('rect', { x: 0, y: 622, width: 70, height: 7, rx: 3, fill: '#f6f1dc' }, $('dashes')));
}

// 前景花草
const flora = [];
const flowerColors = ['#ff6b8a', '#ffd23f', '#ffffff', '#c77dff'];
for (let i = 0; i < 16; i++) {
  const g = el('g', {}, $('front'));
  const tall = 10 + Math.random() * 14;
  for (let j = -2; j <= 2; j++) {
    el('path', { d: `M${j * 3},0 Q${j * 5},${-tall / 2} ${j * 7},${-tall}`, stroke: '#4f9e35', 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }, g);
  }
  if (Math.random() < 0.6) {
    const c = flowerColors[(Math.random() * flowerColors.length) | 0];
    for (let k = 0; k < 5; k++) {
      const a = k * Math.PI * 2 / 5;
      el('circle', { cx: Math.cos(a) * 4, cy: -tall - 4 + Math.sin(a) * 4, r: 3.4, fill: c }, g);
    }
    el('circle', { cx: 0, cy: -tall - 4, r: 2.6, fill: '#ffb000' }, g);
  }
  flora.push({ g, x: Math.random() * (W + 100), y: 694 + Math.random() * 6 });
}

// 车轮
function buildWheel(g) {
  el('circle', { r: 55, fill: 'none', stroke: '#26282c', 'stroke-width': 10 }, g);
  el('circle', { r: 49, fill: 'none', stroke: '#c3c9cf', 'stroke-width': 3 }, g);
  const sp = el('g', {}, g);
  for (let i = 0; i < 18; i++) {
    const a = i * Math.PI / 9;
    el('line', { x1: 0, y1: 0, x2: (Math.cos(a) * 48).toFixed(2), y2: (Math.sin(a) * 48).toFixed(2), stroke: '#9aa2aa', 'stroke-width': 1.4 }, sp);
  }
  el('circle', { r: 2.5, cx: 30, cy: 0, fill: '#ffb000' }, sp);
  el('circle', { r: 7, fill: '#7a8088' }, g);
  return sp;
}
const spokesR = buildWheel($('wheelR'));
const spokesF = buildWheel($('wheelF'));

// 腿部两段式反向运动学
const CRANK = { x: 0, y: -55, r: 26 };
const L1 = 76, L2 = 76;
function solveLeg(hip, foot) {
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  let d = Math.hypot(dx, dy);
  d = Math.min(d, L1 + L2 - 0.5);
  const a = Math.atan2(dy, dx);
  const off = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
  return { x: hip.x + L1 * Math.cos(a - off), y: hip.y + L1 * Math.sin(a - off) };
}
function drawLeg(legEl, footEl, crankEl, hip, ang) {
  const p = { x: CRANK.x + Math.cos(ang) * CRANK.r, y: CRANK.y + Math.sin(ang) * CRANK.r };
  const k = solveLeg(hip, p);
  legEl.setAttribute('points', `${hip.x},${hip.y} ${k.x.toFixed(1)},${k.y.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)}`);
  crankEl.setAttribute('x1', CRANK.x); crankEl.setAttribute('y1', CRANK.y);
  crankEl.setAttribute('x2', p.x.toFixed(1)); crankEl.setAttribute('y2', p.y.toFixed(1));
  const x = p.x, y = p.y;
  footEl.setAttribute('d', `M${x - 4},${y - 3} L${x + 22},${y - 5} Q${x + 17},${y + 1} ${x + 22},${y + 6} L${x - 4},${y + 4} Z`);
}
const hipN = { x: -14, y: -172 }, hipF = { x: -28, y: -176 };

// 围巾飘动
function drawScarf(t, speed) {
  const n = 7, top = [], bot = [];
  const amp = 1 + speed / 220;
  for (let i = 0; i <= n; i++) {
    const x = 16 - i * 13 * (0.8 + speed / 1100);
    const y = -238 + i * 1.6 + Math.sin(t * (8 + speed / 40) - i * 0.9) * i * amp;
    const w = 8 - i * 0.7;
    top.push(`${x.toFixed(1)},${(y - w / 2).toFixed(1)}`);
    bot.unshift(`${x.toFixed(1)},${(y + w / 2).toFixed(1)}`);
  }
  $('scarfTail').setAttribute('d', 'M' + top.join(' L') + ' L' + bot.join(' L') + ' Z');
}

// 交互：点击或空格切换加速
let target = 200, speed = 200;
function toggle() { target = target > 300 ? 200 : 420; }
$('scene').addEventListener('click', toggle);
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) target = speed = 90;

let dist = 0, last = performance.now(), t = 0, nextBlink = 2;
const rider = $('rider'), pelican = $('pelican'), eye = $('eye');

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; t += dt;
  speed += (target - speed) * Math.min(1, dt * 2);
  dist += speed * dt;

  rays.setAttribute('transform', `rotate(${(t * 6) % 360})`);

  clouds.forEach(c => {
    c.x -= c.v * dt * (speed / 200);
    if (c.x < -200) { c.x = W + 150; c.y = 60 + Math.random() * 200; }
    c.g.setAttribute('transform', `translate(${c.x.toFixed(1)},${c.y.toFixed(1)})`);
  });

  birds.forEach(b => {
    b.x -= 30 * dt;
    if (b.x < -40) { b.x = W + 40; b.y = 90 + Math.random() * 120; }
    const f = Math.sin(t * 9 + b.ph) * 7 * b.s, s = 12 * b.s;
    const y = b.y + Math.sin(t + b.ph) * 6;
    b.p.setAttribute('d', `M${b.x - s},${y - f} Q${b.x - s / 2},${y - f / 2 - 3} ${b.x},${y} Q${b.x + s / 2},${y - f / 2 - 3} ${b.x + s},${y - f}`);
  });

  $('hillFar').setAttribute('transform', `translate(${-((dist * 0.08) % W)},0)`);
  $('hillNear').setAttribute('transform', `translate(${-((dist * 0.2) % W)},0)`);

  trees.forEach(tr => {
    tr.x -= speed * 0.45 * dt;
    if (tr.x < -80) { tr.x += 1400; }
    tr.g.setAttribute('transform', `translate(${tr.x.toFixed(1)},${tr.y})`);
  });

  const off = dist % 150;
  dashes.forEach((d, i) => d.setAttribute('x', (i * 150 - off).toFixed(1)));

  flora.forEach(f => {
    f.x -= speed * 1.4 * dt;
    if (f.x < -30) { f.x = W + 30 + Math.random() * 60; }
    f.g.setAttribute('transform', `translate(${f.x.toFixed(1)},${f.y.toFixed(1)})`);
  });

  const wheelAng = (dist / 55) * 180 / Math.PI;
  spokesR.setAttribute('transform', `rotate(${wheelAng % 360})`);
  spokesF.setAttribute('transform', `rotate(${wheelAng % 360})`);

  const crank = dist / 55 / 2.2;
  drawLeg($('legF'), $('footF'), $('crankF'), hipF, crank + Math.PI);
  drawLeg($('legN'), $('footN'), $('crankN'), hipN, crank);

  const bob = Math.sin(crank * 2) * 2.2;
  const lean = -(speed - 200) / 220 * 4;
  const bump = Math.sin(dist * 0.031) * 0.8 + Math.sin(dist * 0.077) * 0.5;
  rider.setAttribute('transform', `translate(560,${(640 + bump).toFixed(2)})`);
  pelican.setAttribute('transform', `translate(0,${bob.toFixed(2)}) rotate(${(lean + Math.sin(crank * 2) * 0.8).toFixed(2)} -20 -175)`);

  drawScarf(t, speed);

  nextBlink -= dt;
  if (nextBlink < 0) {
    eye.setAttribute('ry', 0.4);
    if (nextBlink < -0.12) { eye.setAttribute('ry', 3.3); nextBlink = 2 + Math.random() * 3; }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
