<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鹈鹕骑行记</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#244e4d;background:#b9e7e5}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden}.world{--sky:#b5e5e8;--horizon:#f8e8c6;--far:#9bcac0;--near:#77b9a6;--cloud:#fffdf2;position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;min-height:300px;overflow:hidden;background:linear-gradient(180deg,var(--sky),var(--horizon));transition:background 1.5s ease}.world.cloudy{--sky:#aebfc7;--horizon:#e8dfce;--far:#9cb9ac;--near:#7fa999;--cloud:#e9ebe3}.world.rainy{--sky:#839fae;--horizon:#c4d0c6;--far:#82a69d;--near:#6e998c;--cloud:#b6c8c9}
.header{position:absolute;z-index:8;top:clamp(24px,5.5vh,56px);left:clamp(24px,6vw,88px);right:clamp(24px,6vw,88px);display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:.22em;color:#285d58}.brand-mark{display:grid;place-items:center;width:28px;height:28px;border:1.5px solid currentColor;border-radius:50%;font-size:16px;letter-spacing:0}.weather{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.12em;color:#285d58}.weather-icon{width:30px;height:30px;display:grid;place-items:center;background:#ffffff8a;border:1px solid #ffffffa0;border-radius:50%;font-size:16px}.weather-name{min-width:2.5em}.intro{position:absolute;z-index:6;left:clamp(24px,6vw,88px);top:clamp(110px,18vh,180px);pointer-events:none}.intro .overline{font-size:10px;font-weight:800;letter-spacing:.24em;color:#327a70}.intro h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(32px,4.1vw,62px);font-weight:500;line-height:1.15;letter-spacing:.07em;margin:12px 0;color:#244e4d}.intro p{font-size:13px;letter-spacing:.16em;color:#345f57;margin:0;line-height:1.8}
.sun{position:absolute;top:13%;right:16%;width:clamp(85px,11vw,155px);aspect-ratio:1;border-radius:50%;background:#ffe19a;box-shadow:0 0 0 17px #ffe9b441,0 0 70px #ffe8aa8a;transition:opacity 1.6s,transform 1.6s}.cloudy .sun{opacity:.3;transform:translateY(15px)}.rainy .sun{opacity:.08;transform:translateY(25px)}.clouds{position:absolute;inset:0;overflow:hidden}.cloud{position:absolute;width:clamp(120px,16vw,230px);height:auto;color:var(--cloud);transition:color 1.5s,opacity 1.5s;animation:float 35s linear infinite}.cloud.a{top:17%;left:5%;opacity:.8}.cloud.b{top:10%;left:56%;width:clamp(160px,21vw,290px);opacity:.7;animation-duration:48s;animation-delay:-15s}.cloud.c{top:29%;left:74%;opacity:.75;animation-duration:42s;animation-delay:-23s}.rainy .cloud{opacity:.95}@keyframes float{0%{translate:-30vw 0}100%{translate:110vw 0}}
.hills{position:absolute;bottom:14%;width:100%;height:38%;overflow:visible}.hills .far{fill:var(--far);transition:fill 1.5s}.hills .near{fill:var(--near);transition:fill 1.5s}.road{position:absolute;bottom:0;left:0;width:100%;height:18%;background:#d5ae82;border-top:8px solid #f1d6a2}.road:after{content:"";position:absolute;top:53%;left:0;width:200%;height:3px;background:repeating-linear-gradient(90deg,#f9e9c7 0 58px,transparent 58px 145px);animation:road 1.3s linear infinite;opacity:.8}@keyframes road{to{transform:translateX(-145px)}}.foreground{position:absolute;bottom:14.5%;width:200%;height:70px;pointer-events:none;animation:grass 12s linear infinite}.foreground svg{width:50%;height:100%;float:left}@keyframes grass{to{transform:translateX(-50%)}}
.rider{position:absolute;z-index:4;left:50%;bottom:13%;width:min(660px,65vw);transform:translateX(-50%);filter:drop-shadow(0 12px 0 #416f5930)}.rider svg{display:block;width:100%;overflow:visible}.riding{animation:bob .58s ease-in-out infinite alternate;transform-origin:50% 70%}@keyframes bob{to{transform:translateY(-3px) rotate(.25deg)}}.spokes{transform-box:fill-box;transform-origin:center;animation:spin 1.05s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.pedal{transform-origin:340px 352px;animation:spin 1.05s linear infinite}.leg-one{transform-origin:278px 242px;animation:leg1 1.05s ease-in-out infinite}.leg-two{transform-origin:303px 242px;animation:leg2 1.05s ease-in-out infinite}@keyframes leg1{50%{transform:rotate(15deg)}}@keyframes leg2{50%{transform:rotate(-13deg)}}.scarf-tail{transform-origin:330px 155px;animation:flap 1s ease-in-out infinite alternate}@keyframes flap{to{transform:rotate(5deg)}}
.rain{position:absolute;z-index:5;inset:-15% 0 0;opacity:0;pointer-events:none;transition:opacity 1s;background-image:repeating-linear-gradient(105deg,transparent 0 24px,#e8f8efaa 25px 27px,transparent 28px 55px);background-size:110px 90px;animation:rain .45s linear infinite;mask-image:linear-gradient(transparent,#000 12%,#000 83%,transparent)}.rainy .rain{opacity:.6}@keyframes rain{to{background-position:-55px 90px}}.bottom-note{position:absolute;z-index:7;bottom:clamp(23px,4vh,38px);left:clamp(24px,6vw,88px);font-size:10px;font-weight:800;letter-spacing:.19em;color:#705f49}.dots{position:absolute;right:clamp(24px,6vw,88px);bottom:clamp(23px,4vh,38px);display:flex;gap:7px;align-items:center;z-index:7}.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#927d66;opacity:.5;transition:width .4s,opacity .4s}.dots i.active{width:25px;border-radius:5px;background:#356b61;opacity:1}
@media(max-width:650px){.header{top:28px}.intro{top:112px}.intro h1{font-size:clamp(30px,8vw,42px)}.intro p{font-size:12px}.sun{top:28%;right:12%;width:90px}.cloud.a{top:30%}.cloud.b{top:25%}.cloud.c{top:38%}.hills{height:32%;bottom:19%}.road{height:23%}.rider{width:min(110vw,570px);bottom:19%}.foreground{bottom:21%}.bottom-note,.dots{bottom:27px}}
@media(max-height:500px) and (min-width:651px){.intro{top:80px}.intro h1{font-size:32px}.rider{width:min(490px,50vw);bottom:9%}.sun{top:15%;width:80px}}
@media(prefers-reduced-motion:reduce){.riding,.spokes,.pedal,.leg-one,.leg-two,.scarf-tail,.road:after,.foreground,.cloud,.rain{animation-duration:8s}}
</style>
</head>
<body>
<main class="world sunny" id="world">
<header class="header"><div class="brand"><span class="brand-mark">✦</span><span>PELICAN RIDE</span></div><div class="weather" aria-live="polite"><span class="weather-icon" id="weatherIcon" aria-hidden="true">☀</span><span class="weather-name" id="weatherName">晴天</span></div></header>
<div class="intro"><div class="overline">A LITTLE JOURNEY</div><h1>鹈鹕骑行记</h1><p>慢慢骑，去看看路上的风景。</p></div>
<div class="sun"></div>

<svg class="hills" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true"><path class="far" d="M0 210Q130 80 270 174T560 147T860 162T1160 130T1440 164V300H0Z"/><path class="near" d="M0 255Q155 145 310 245T615 214T930 230T1240 207T1440 220V300H0Z"/><g fill="#4f957f" opacity=".6"><path d="M110 253l18-55 18 55zm18-25v34h5v-34zm1020 5 16-55 17 55zm14-20v35h5v-35z"/><circle cx="195" cy="237" r="20"/><circle cx="1270" cy="239" r="24"/></g></svg>
<div class="road"></div><div class="foreground" aria-hidden="true"><svg viewBox="0 0 1200 70" preserveAspectRatio="none"><g fill="none" stroke="#599e83" stroke-width="3" stroke-linecap="round"><path d="M40 70q0-25-13-32m13 32q2-20 14-29M330 70q0-20-10-26m10 26q4-18 13-23M820 70q-2-25-16-31m16 31q5-20 17-24M1100 70q0-22-12-29m12 29q4-19 14-23"/></g><g fill="#fff3c5"><circle cx="60" cy="55" r="4"/><circle cx="351" cy="60" r="4"/><circle cx="852" cy="51" r="4"/><circle cx="1125" cy="59" r="4"/></g></svg><svg viewBox="0 0 1200 70" preserveAspectRatio="none"><g fill="none" stroke="#599e83" stroke-width="3" stroke-linecap="round"><path d="M40 70q0-25-13-32m13 32q2-20 14-29M330 70q0-20-10-26m10 26q4-18 13-23M820 70q-2-25-16-31m16 31q5-20 17-24M1100 70q0-22-12-29m12 29q4-19 14-23"/></g><g fill="#fff3c5"><circle cx="60" cy="55" r="4"/><circle cx="351" cy="60" r="4"/><circle cx="852" cy="51" r="4"/><circle cx="1125" cy="59" r="4"/></g></svg></div>

<g fill="#fbf3d9" stroke="#315953" stroke-width="11"><circle cx="150" cy="344" r="83"/><circle cx="554" cy="344" r="83"/></g><g class="spokes" fill="none" stroke="#98b4a3" stroke-width="2.5"><circle cx="150" cy="344" r="73"/><path d="M150 271v146M77 344h146M98 292l104 104M98 396l104-104"/></g><g class="spokes" fill="none" stroke="#98b4a3" stroke-width="2.5"><circle cx="554" cy="344" r="73"/><path d="M554 271v146M481 344h146M502 292l104 104M502 396l104-104"/></g>

</g></svg></div>
<div class="rain" aria-hidden="true"></div><div class="bottom-note">ENJOY THE LITTLE THINGS</div><div class="dots" aria-hidden="true"><i class="active"></i><i></i><i></i></div>
</main>
<script>
(()=>{const world=document.getElementById('world');const name=document.getElementById('weatherName');const icon=document.getElementById('weatherIcon');const dots=[...document.querySelectorAll('.dots i')];const weather=[{className:'sunny',name:'晴天',icon:'☀'},{className:'cloudy',name:'阴天',icon:'☁'},{className:'rainy',name:'雨天',icon:'☂'}];let current=0;setInterval(()=>{current=(current+1)%weather.length;const state=weather[current];world.className='world '+state.className;name.textContent=state.name;icon.textContent=state.icon;dots.forEach((dot,index)=>dot.classList.toggle('active',index===current));},5000)})();
</script>
</body>
