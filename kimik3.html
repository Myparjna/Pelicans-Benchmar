<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>kimik3 · 鹈鹕骑行</title>
<style>
:root{ --grass-h: clamp(110px, 22vh, 200px); }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow:hidden; }
body{ font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:#87ceeb; }
.stage{ position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; }

/* ---------- 天空：晴天 / 阴天 / 雨天三层叠加，透明度交叉切换 ---------- */
.sky{ position:absolute; inset:0; transition:opacity 1.4s ease; }
.sky-sunny{ background:linear-gradient(180deg,#4aa3df 0%,#8fd0f2 55%,#d9f1fd 100%); }
.sky-cloudy{ background:linear-gradient(180deg,#7d93a5 0%,#a9bcc9 55%,#d5dde2 100%); opacity:0; }
.sky-rainy{ background:linear-gradient(180deg,#415663 0%,#6a7f8e 55%,#97a6b0 100%); opacity:0; }
body.w-cloudy .sky-cloudy, body.w-rainy .sky-rainy{ opacity:1; }

/* ---------- 太阳 ---------- */
.sun{ position:absolute; top:9%; right:9%; width:clamp(64px,13vmin,130px); aspect-ratio:1/1; transition:opacity 1.2s ease, transform 1.2s ease; }
.sun .core{ position:absolute; inset:16%; border-radius:50%; background:radial-gradient(circle at 38% 35%,#fffde7 0%,#ffeb3b 55%,#fbc02d 100%); box-shadow:0 0 42px 14px rgba(255,235,59,.55); }
.sun .rays{ position:absolute; inset:0; animation:spin 26s linear infinite; }
.sun .rays i{ position:absolute; left:50%; top:50%; width:5%; height:138%; margin:-69% 0 0 -2.5%; border-radius:999px; background:linear-gradient(180deg,rgba(253,216,53,.95) 0%,rgba(253,216,53,0) 16%,rgba(253,216,53,0) 84%,rgba(253,216,53,.95) 100%); }
.sun .rays i:nth-child(2){ transform:rotate(30deg); }
.sun .rays i:nth-child(3){ transform:rotate(60deg); }
.sun .rays i:nth-child(4){ transform:rotate(90deg); }
.sun .rays i:nth-child(5){ transform:rotate(120deg); }
.sun .rays i:nth-child(6){ transform:rotate(150deg); }
body.w-cloudy .sun{ opacity:.25; transform:scale(.92); }
body.w-rainy .sun{ opacity:0; transform:scale(.85); }

/* ---------- 云 ---------- */
.cloud{ position:absolute; left:0; width:clamp(96px,17vmin,180px); aspect-ratio:2.6/1; background:#ffffff; border-radius:999px; opacity:0; transition:background-color 1.2s ease, opacity 1.2s ease; animation:drift linear infinite; }
.cloud:nth-of-type(2n){ width:clamp(70px,12vmin,130px); }
.cloud::before,.cloud::after{ content:""; position:absolute; background:inherit; border-radius:50%; }
.cloud::before{ width:52%; aspect-ratio:1/1; left:14%; top:-46%; }
.cloud::after{ width:38%; aspect-ratio:1/1; right:15%; top:-28%; }
body.w-sunny .cloud:nth-of-type(-n+2){ opacity:.92; }
body.w-cloudy .cloud{ opacity:.96; background:#dfe7ec; }
body.w-rainy .cloud{ opacity:1; background:#5c6f7b; }
@keyframes drift{ from{ transform:translateX(-45vw); } to{ transform:translateX(135vw); } }

/* ---------- 远景灌木（滚动视差） ---------- */
.bushes{ position:absolute; left:0; right:0; bottom:var(--grass-h); height:30px; background:radial-gradient(circle at 30px 30px,#558b2f 18px,rgba(0,0,0,0) 19px) repeat-x; background-size:150px 30px; animation:bushmove 5.5s linear infinite; transition:filter 1.2s ease; }
@keyframes bushmove{ to{ background-position-x:-150px; } }
body.w-cloudy .bushes{ filter:brightness(.88); }
body.w-rainy .bushes{ filter:brightness(.72); }

/* ---------- 草地与道路 ---------- */
.grass{ position:absolute; left:0; right:0; bottom:0; height:var(--grass-h); background:#7cb342; transition:background-color 1.2s ease; }
body.w-cloudy .grass{ background:#75965b; }
body.w-rainy .grass{ background:#527c40; }
.road{ position:absolute; top:0; left:0; right:0; height:40%; background:#8696a0; transition:background-color 1.2s ease; }
body.w-cloudy .road{ background:#7c8a93; }
body.w-rainy .road{ background:#5d6d78; }
.road::after{ content:""; position:absolute; top:50%; left:0; right:0; height:6px; margin-top:-3px; background:repeating-linear-gradient(90deg,#f5f5f5 0 42px,rgba(0,0,0,0) 42px 92px); animation:dash .7s linear infinite; opacity:.9; }
@keyframes dash{ to{ background-position-x:-92px; } }

/* ---------- 雨天压暗层 ---------- */
.dim{ position:absolute; inset:0; pointer-events:none; background-color:rgba(15,23,42,0); transition:background-color 1.2s ease; }
body.w-rainy .dim{ background-color:rgba(15,23,42,.16); }

/* ---------- 自行车与鹈鹕 ---------- */
.bike{ position:absolute; left:50%; bottom:calc(var(--grass-h)*.55); width:clamp(300px,80vmin,620px); transform:translateX(-52%); }
.bike svg{ display:block; width:100%; height:auto; }
.bike-inner{ animation:bob .55s ease-in-out infinite alternate; }
@keyframes bob{ from{ transform:translateY(0); } to{ transform:translateY(-4px); } }
.wheel{ transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite; }
.crank{ transform-box:fill-box; transform-origin:center; animation:crankspin 1.1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes crankspin{ from{ transform:rotate(-90deg); } to{ transform:rotate(270deg); } }
.wing{ transform-box:fill-box; transform-origin:78% 18%; animation:flap 1.15s ease-in-out infinite; }
@keyframes flap{ 0%,100%{ transform:rotate(-5deg); } 50%{ transform:rotate(9deg); } }
.pouch{ transform-box:fill-box; transform-origin:6% 20%; animation:pouchsway 1.1s ease-in-out infinite; }
@keyframes pouchsway{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(2.5deg); } }

/* ---------- 雨 ---------- */
.rain{ position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 1s ease; }
body.w-rainy .rain{ opacity:1; }
.drop{ position:absolute; top:-24px; width:2px; background:linear-gradient(180deg,rgba(224,242,254,0),rgba(224,242,254,.85)); border-radius:2px; animation:fall linear infinite; }
@keyframes fall{ to{ transform:translateY(115vh); } }

/* ---------- 天气指示 ---------- */
.badge{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:8px 18px; border-radius:999px; background:rgba(255,255,255,.85); box-shadow:0 2px 12px rgba(0,0,0,.12); font-size:clamp(14px,2.4vmin,18px); color:#37474f; letter-spacing:2px; z-index:5; }
.badge .dot{ width:10px; height:10px; border-radius:50%; background:#fbc02d; transition:background-color .8s ease; }
body.w-cloudy .badge .dot{ background:#90a4ae; }
body.w-rainy .badge .dot{ background:#546e7a; }
</style>
</head>
<body class="w-sunny">
<div class="stage">
  <div class="sky sky-sunny"></div>
  <div class="sky sky-cloudy"></div>
  <div class="sky sky-rainy"></div>

  <div class="sun">
    <div class="rays"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="core"></div>
  </div>

  <div class="clouds">
    <div class="cloud" style="top:8%;  animation-duration:58s; animation-delay:-12s"></div>
    <div class="cloud" style="top:20%; animation-duration:74s; animation-delay:-45s"></div>
    <div class="cloud" style="top:14%; animation-duration:66s; animation-delay:-30s"></div>
    <div class="cloud" style="top:28%; animation-duration:80s; animation-delay:-60s"></div>
    <div class="cloud" style="top:5%;  animation-duration:70s; animation-delay:-52s"></div>
    <div class="cloud" style="top:33%; animation-duration:62s; animation-delay:-8s"></div>
  </div>

  <div class="bushes"></div>

  <div class="grass"><div class="road"></div></div>

  <div class="dim"></div>

  <div class="bike"><div class="bike-inner">
    <svg viewBox="0 0 420 315" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车">
      <ellipse cx="215" cy="302" rx="125" ry="9" fill="rgba(0,0,0,.16)"/>

      <!-- 后轮 -->
      <g class="wheel">
        <circle cx="130" cy="245" r="48" fill="none" stroke="#37474f" stroke-width="11"/>
        <circle cx="130" cy="245" r="41" fill="none" stroke="#b0bec5" stroke-width="3"/>
        <g stroke="#b0bec5" stroke-width="2.5">
          <line x1="87" y1="245" x2="173" y2="245"/>
          <line x1="130" y1="202" x2="130" y2="288"/>
          <line x1="99.6" y1="214.6" x2="160.4" y2="275.4"/>
          <line x1="99.6" y1="275.4" x2="160.4" y2="214.6"/>
        </g>
        <circle cx="130" cy="245" r="6" fill="#37474f"/>
      </g>
      <!-- 前轮 -->
      <g class="wheel">
        <circle cx="300" cy="245" r="48" fill="none" stroke="#37474f" stroke-width="11"/>
        <circle cx="300" cy="245" r="41" fill="none" stroke="#b0bec5" stroke-width="3"/>
        <g stroke="#b0bec5" stroke-width="2.5">
          <line x1="257" y1="245" x2="343" y2="245"/>
          <line x1="300" y1="202" x2="300" y2="288"/>
          <line x1="269.6" y1="214.6" x2="330.4" y2="275.4"/>
          <line x1="269.6" y1="275.4" x2="330.4" y2="214.6"/>
        </g>
        <circle cx="300" cy="245" r="6" fill="#37474f"/>
      </g>

      <!-- 远侧腿（深色，位于车身后方） -->
      <line x1="198" y1="144" x2="192" y2="242" stroke="#f57c00" stroke-width="8" stroke-linecap="round">
        <animate attributeName="x2" dur="1.1s" repeatCount="indefinite" values="192;193.5;197.9;204.3;212;219.7;226.1;230.5;232;230.5;226.1;219.7;212;204.3;197.9;193.5;192"/>
        <animate attributeName="y2" dur="1.1s" repeatCount="indefinite" values="242;234.3;227.9;223.5;222;223.5;227.9;234.3;242;249.7;256.1;260.5;262;260.5;256.1;249.7;242"/>
      </line>
      <ellipse rx="10" ry="6" fill="#f57c00" cx="192" cy="242">
        <animate attributeName="cx" dur="1.1s" repeatCount="indefinite" values="192;193.5;197.9;204.3;212;219.7;226.1;230.5;232;230.5;226.1;219.7;212;204.3;197.9;193.5;192"/>
        <animate attributeName="cy" dur="1.1s" repeatCount="indefinite" values="242;234.3;227.9;223.5;222;223.5;227.9;234.3;242;249.7;256.1;260.5;262;260.5;256.1;249.7;242"/>
      </ellipse>

      <!-- 车架 -->
      <g stroke="#e53935" stroke-width="6" stroke-linecap="round" fill="none">
        <line x1="130" y1="245" x2="212" y2="242"/>
        <line x1="130" y1="245" x2="178" y2="152"/>
        <line x1="212" y1="242" x2="178" y2="152"/>
        <line x1="212" y1="242" x2="290" y2="158"/>
        <line x1="182" y1="152" x2="288" y2="156"/>
        <line x1="290" y1="158" x2="300" y2="245"/>
      </g>
      <line x1="284" y1="148" x2="296" y2="166" stroke="#c62828" stroke-width="9" stroke-linecap="round"/>
      <line x1="290" y1="154" x2="303" y2="133" stroke="#e53935" stroke-width="6" stroke-linecap="round"/>
      <line x1="303" y1="133" x2="284" y2="128" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
      <rect x="156" y="141" width="44" height="11" rx="5.5" fill="#5d4037"/>

      <!-- 曲柄与脚踏 -->
      <g class="crank">
        <line x1="212" y1="222" x2="212" y2="262" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
        <rect x="203" y="218" width="18" height="7" rx="3.5" fill="#455a64"/>
        <rect x="203" y="259" width="18" height="7" rx="3.5" fill="#455a64"/>
        <circle cx="212" cy="242" r="7" fill="#37474f"/>
      </g>

      <!-- 尾巴与身体 -->
      <path d="M170 100 L138 84 L148 114 Z" fill="#eceff1" stroke="#cfd8dc" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="205" cy="112" rx="44" ry="35" fill="#ffffff" stroke="#dbe4e8" stroke-width="2" transform="rotate(-6 205 112)"/>

      <!-- 脖子、头、羽冠 -->
      <path d="M234 94 Q253 84 252 62" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
      <circle cx="252" cy="58" r="17" fill="#ffffff" stroke="#dbe4e8" stroke-width="2"/>
      <path d="M247 43 Q242 34 233 34" fill="none" stroke="#dbe4e8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M253 42 Q250 32 242 30" fill="none" stroke="#dbe4e8" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 喙与喉囊 -->
      <path d="M261 50 L343 61 L263 65 Z" fill="#ffa726" stroke="#f57c00" stroke-width="2" stroke-linejoin="round"/>
      <path class="pouch" d="M265 64 Q300 98 341 63 Q303 78 265 64 Z" fill="#ffcc80" stroke="#f57c00" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="341" cy="62" r="2.6" fill="#e65100"/>
      <circle cx="257" cy="52" r="3.4" fill="#263238"/>

      <!-- 近侧腿 -->
      <line x1="206" y1="140" x2="232" y2="242" stroke="#fb8c00" stroke-width="8" stroke-linecap="round">
        <animate attributeName="x2" dur="1.1s" repeatCount="indefinite" values="232;230.5;226.1;219.7;212;204.3;197.9;193.5;192;193.5;197.9;204.3;212;219.7;226.1;230.5;232"/>
        <animate attributeName="y2" dur="1.1s" repeatCount="indefinite" values="242;249.7;256.1;260.5;262;260.5;256.1;249.7;242;234.3;227.9;223.5;222;223.5;227.9;234.3;242"/>
      </line>
      <ellipse rx="10" ry="6" fill="#fb8c00" cx="232" cy="242">
        <animate attributeName="cx" dur="1.1s" repeatCount="indefinite" values="232;230.5;226.1;219.7;212;204.3;197.9;193.5;192;193.5;197.9;204.3;212;219.7;226.1;230.5;232"/>
        <animate attributeName="cy" dur="1.1s" repeatCount="indefinite" values="242;249.7;256.1;260.5;262;260.5;256.1;249.7;242;234.3;227.9;223.5;222;223.5;227.9;234.3;242"/>
      </ellipse>

      <!-- 翅膀 -->
      <g class="wing">
        <ellipse cx="200" cy="102" rx="31" ry="19" fill="#eceff1" stroke="#cfd8dc" stroke-width="2" transform="rotate(-16 200 102)"/>
        <path d="M180 104 Q194 112 212 106" fill="none" stroke="#cfd8dc" stroke-width="2" stroke-linecap="round"/>
        <path d="M176 112 Q190 120 210 114" fill="none" stroke="#cfd8dc" stroke-width="2" stroke-linecap="round"/>
      </g>
    </svg>
  </div></div>

  <div class="rain"></div>

  <div class="badge"><span class="dot"></span><span id="wname">晴天</span></div>
</div>

<script>
// 天气按 晴天 → 阴天 → 雨天 → 晴天 循环，每 5 秒切换一次
var order = ['sunny','cloudy','rainy'];
var names = { sunny:'晴天', cloudy:'阴天', rainy:'雨天' };
var params = new URLSearchParams(location.search);
var idx = Math.max(0, order.indexOf(params.get('w')));
function apply(){
  document.body.className = 'w-' + order[idx];
  document.getElementById('wname').textContent = names[order[idx]];
}
apply();
if(!params.has('w')){
  setInterval(function(){ idx = (idx + 1) % order.length; apply(); }, 5000);
}

// 生成雨滴
var rain = document.querySelector('.rain');
for(var i = 0; i < 110; i++){
  var d = document.createElement('i');
  d.className = 'drop';
  d.style.left = (Math.random() * 100) + '%';
  d.style.height = (12 + Math.random() * 10) + 'px';
  d.style.animationDuration = (0.7 + Math.random() * 0.6) + 's';
  d.style.animationDelay = (Math.random() * 1.5) + 's';
  rain.appendChild(d);
}
</script>
</body>
</html>
