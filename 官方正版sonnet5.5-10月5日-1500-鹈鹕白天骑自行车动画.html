<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(#49aef0 0, #49aef0 62%, #78c34f 62%, #78c34f 100%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bar {
    position: fixed; left: 18px; top: 18px;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 18px; border-radius: 999px;
    background: rgba(255,255,255,.85); box-shadow: 0 4px 16px rgba(30,70,40,.25);
    color: #2c4a37; font-size: 14px; user-select: none;
  }
  #bar button {
    border: 0; border-radius: 999px; padding: 6px 16px; cursor: pointer;
    background: #f08a24; color: #fff; font-size: 14px; font-family: inherit;
  }
  #bar button:hover { background: #dc7a18; }
  #bar input[type=range] { width: 140px; accent-color: #f08a24; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="440">
      <stop offset="0" stop-color="#49aef0"/>
      <stop offset="1" stop-color="#cdeefb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6b0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7279"/>
      <stop offset="1" stop-color="#585d64"/>
    </linearGradient>
  </defs>

  <rect x="-1200" y="-600" width="3600" height="1200" fill="url(#sky)"/>

  <!-- sun -->
  <g transform="translate(1010 105)">
    <circle r="120" fill="url(#glow)"/>
    <g id="sunRays" stroke="#ffd23f" stroke-width="5" stroke-linecap="round"></g>
    <circle r="40" fill="#ffd84a"/>
    <circle r="40" fill="none" stroke="#ffe98a" stroke-width="3"/>
  </g>

  <g id="clouds"></g>
  <g id="hillsFar"></g>
  <g id="hillsNear"></g>
  <g id="trees"></g>

  <rect x="-1200" y="440" width="3600" height="70" fill="#86cf57"/>
  <g id="fence"></g>
  <g id="roadside"></g>

  <rect x="-1200" y="495" width="3600" height="120" fill="url(#road)"/>
  <rect x="-1200" y="495" width="3600" height="5" fill="#d9dde2"/>
  <g id="dashes"></g>

  <g id="streaks" stroke="#ffffff" stroke-opacity=".7" stroke-linecap="round" stroke-width="3"></g>

  <!-- bike + pelican, origin at rear hub -->
  <g id="bike" transform="translate(440 485)">
    <ellipse cx="100" cy="62" rx="150" ry="9" fill="#1b2a1f" opacity=".22"/>

    <!-- far leg -->
    <polyline id="legFar" fill="none" stroke="#d9871c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footFar"><path d="M-6,-3 L22,3 L18,9 L10,7 L12,13 L-4,7 Z" fill="#d9871c"/></g>
    <line id="crankFar" stroke="#6b7078" stroke-width="6" stroke-linecap="round"/>
    <rect id="pedalFar" width="22" height="5" rx="2" fill="#3a3f46"/>

    <!-- wheels -->
    <g id="wheelR" transform="translate(0 0)"></g>
    <g id="wheelF" transform="translate(200 0)"></g>

    <!-- frame -->
    <g fill="none" stroke="#e5483b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,0 L88,8 L66,-96 Z"/>
      <path d="M66,-96 L168,-100 L88,8"/>
      <path d="M168,-100 L174,-72 L200,0"/>
    </g>
    <path d="M66,-96 L62,-112" stroke="#2f3338" stroke-width="5" stroke-linecap="round"/>
    <path d="M44,-114 Q64,-122 90,-112 Q70,-104 44,-114 Z" fill="#2f3338"/>
    <path d="M168,-100 L172,-120 L188,-118" fill="none" stroke="#2f3338" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="chainring" transform="translate(88 8)">
      <circle r="17" fill="none" stroke="#7a8089" stroke-width="3"/>
      <line x1="-17" y1="0" x2="17" y2="0" stroke="#7a8089" stroke-width="2"/>
      <line x1="0" y1="-17" x2="0" y2="17" stroke="#7a8089" stroke-width="2"/>
    </g>
    <circle cx="88" cy="8" r="6" fill="#4a4f57"/>

    <!-- near leg -->
    <polyline id="legNear" fill="none" stroke="#f2a42d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- body -->
    <g id="bodyG">
      <path d="M38,-135 L-8,-108 L-16,-126 L32,-160 Z" fill="#dfe5ea"/>
      <ellipse cx="75" cy="-165" rx="50" ry="64" transform="rotate(25 75 -165)" fill="#fdfdfb" stroke="#d3dae0" stroke-width="2"/>
      <path d="M52,-130 Q80,-110 116,-142" fill="none" stroke="#e8edf1" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g id="crankNearG">
      <line id="crankNear" stroke="#8b9099" stroke-width="7" stroke-linecap="round"/>
      <rect id="pedalNear" width="24" height="5" rx="2" fill="#2f3338"/>
      <g id="footNear"><path d="M-6,-3 L24,3 L19,10 L10,8 L13,14 L-4,8 Z" fill="#f2a42d"/></g>
    </g>

    <!-- basket and fish -->
    <g id="basket">
      <g id="fish" transform="translate(214 -112) rotate(-28)">
        <path d="M-26,0 L-40,-10 L-38,0 L-40,10 Z" fill="#3d86c6"/>
        <ellipse cx="0" cy="0" rx="24" ry="10" fill="#5aa7e0"/>
        <path d="M-12,-8 Q0,-14 10,-7" fill="none" stroke="#3d86c6" stroke-width="3"/>
        <circle cx="14" cy="-2" r="2.4" fill="#10243a"/>
      </g>
      <path d="M190,-108 L238,-108 L230,-76 L198,-76 Z" fill="#c98a4a" stroke="#9a6430" stroke-width="3" stroke-linejoin="round"/>
      <path d="M194,-96 L234,-96 M196,-86 L232,-86 M208,-108 L206,-76 M220,-108 L222,-76" stroke="#9a6430" stroke-width="2"/>
    </g>

    <!-- neck, wing, head -->
    <g id="topG">
      <path d="M98,-205 C128,-215 118,-250 146,-258" fill="none" stroke="#d3dae0" stroke-width="31" stroke-linecap="round"/>
      <path d="M98,-205 C128,-215 118,-250 146,-258" fill="none" stroke="#fdfdfb" stroke-width="27" stroke-linecap="round"/>
      <g id="wing">
        <path d="M92,-188 Q146,-184 180,-118" fill="none" stroke="#c2cbd2" stroke-width="25" stroke-linecap="round"/>
        <path d="M92,-188 Q146,-184 180,-118" fill="none" stroke="#fdfdfb" stroke-width="21" stroke-linecap="round"/>
        <path d="M150,-166 Q170,-146 181,-120" fill="none" stroke="#39454e" stroke-width="12" stroke-linecap="round"/>
        <path d="M110,-182 L126,-176 M124,-186 L140,-178" stroke="#dde3e8" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g id="headG">
        <circle cx="150" cy="-262" r="20" fill="#fdfdfb" stroke="#d3dae0" stroke-width="2"/>
        <path d="M134,-272 Q126,-292 140,-286 Q144,-276 138,-270 Z" fill="#fdfdfb" stroke="#d3dae0" stroke-width="1.5"/>
        <g id="pouch">
          <path d="M160,-250 L262,-246 Q238,-214 196,-218 Q166,-222 158,-250 Z" fill="#f7d37a" stroke="#d9a63c" stroke-width="2" stroke-linejoin="round"/>
          <path d="M178,-244 Q200,-226 236,-243" fill="none" stroke="#e8b955" stroke-width="2"/>
        </g>
        <path d="M156,-278 L258,-263 Q272,-259 270,-250 L263,-244 L160,-249 Z" fill="#f3a82f" stroke="#d9871c" stroke-width="2" stroke-linejoin="round"/>
        <path d="M258,-263 Q272,-259 270,-250 L263,-244 Q266,-254 258,-263 Z" fill="#d9731c"/>
        <circle cx="158" cy="-268" r="6.5" fill="#fff"/>
        <circle cx="159.5" cy="-268" r="4" fill="#15202a"/>
        <circle cx="161" cy="-269.5" r="1.3" fill="#fff"/>
        <path d="M150,-250 Q156,-245 164,-247" fill="none" stroke="#f3a82f" stroke-width="2" opacity=".0"/>
      </g>
    </g>
  </g>
</svg>

<div id="bar">
  <button id="toggle" type="button">暂停</button>
  <label>速度 <input id="speed" type="range" min="0" max="2" step="0.05" value="1"></label>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const PERIOD = 1200;

  // ---------- 静态场景生成 ----------
  const sunRays = $("sunRays");
  for (let i = 0; i < 14; i++) {
    const a = i * Math.PI * 2 / 14;
    el("line", { x1: Math.cos(a) * 54, y1: Math.sin(a) * 54, x2: Math.cos(a) * 72, y2: Math.sin(a) * 72 }, sunRays);
  }

  function hillPath(base, comps) {
    let d = "M0," + 520;
    for (let x = 0; x <= 2400; x += 20) {
      let y = base;
      for (const c of comps) y -= c[0] * Math.sin(2 * Math.PI * c[1] * x / PERIOD + c[2]);
      d += " L" + x + "," + y.toFixed(1);
    }
    return d + " L2400,520 Z";
  }
  el("path", { d: hillPath(405, [[34, 2, 0.4], [18, 3, 1.9], [8, 7, 0.2]]), fill: "#a8dba7" }, $("hillsFar"));
  el("path", { d: hillPath(440, [[26, 3, 2.2], [14, 5, 0.9], [6, 9, 1.4]]), fill: "#86c986" }, $("hillsNear"));

  // 云
  const cloudDefs = [
    { x: 120, y: 90, s: 1.0 }, { x: 430, y: 150, s: 0.7 }, { x: 700, y: 70, s: 1.2 },
    { x: 950, y: 185, s: 0.8 }, { x: 260, y: 215, s: 0.6 }
  ];
  const cloudG = $("clouds");
  const cloudEls = [];
  for (const c of cloudDefs) {
    const g = el("g", {}, cloudG);
    el("ellipse", { cx: 0, cy: 0, rx: 62, ry: 20, fill: "#fff" }, g);
    el("circle", { cx: -22, cy: -16, r: 24, fill: "#fff" }, g);
    el("circle", { cx: 12, cy: -24, r: 30, fill: "#fff" }, g);
    el("circle", { cx: 40, cy: -10, r: 20, fill: "#fff" }, g);
    cloudEls.push({ g, c });
  }

  // 树（两份副本以便循环）
  const treeSpots = [60, 190, 330, 470, 600, 760, 880, 1040, 1130];
  const treeScale = [1.0, 0.8, 1.15, 0.9, 1.05, 0.85, 1.1, 0.95, 0.8];
  const treeCol = ["#3f9a4b", "#4aa653", "#37904a"];
  const treesG = $("trees");
  for (let rep = 0; rep < 2; rep++) {
    treeSpots.forEach((x, i) => {
      const s = treeScale[i];
      const g = el("g", { transform: "translate(" + (x + rep * PERIOD) + " 470) scale(" + s + ")" }, treesG);
      el("rect", { x: -6, y: -50, width: 12, height: 52, fill: "#8a5a34" }, g);
      el("circle", { cx: 0, cy: -80, r: 38, fill: treeCol[i % 3] }, g);
      el("circle", { cx: -24, cy: -58, r: 26, fill: treeCol[(i + 1) % 3] }, g);
      el("circle", { cx: 24, cy: -58, r: 26, fill: treeCol[(i + 2) % 3] }, g);
    });
  }

  // 栅栏
  const fenceG = $("fence");
  el("rect", { x: 0, y: 463, width: 2400, height: 6, fill: "#c99a62" }, fenceG);
  el("rect", { x: 0, y: 477, width: 2400, height: 6, fill: "#c99a62" }, fenceG);
  for (let x = 0; x < 2400; x += 150) {
    el("rect", { x: x, y: 450, width: 12, height: 44, rx: 2, fill: "#b5834c" }, fenceG);
    el("rect", { x: x, y: 450, width: 12, height: 6, rx: 2, fill: "#d3a56d" }, fenceG);
  }

  // 路边花草
  const rsG = $("roadside");
  const flowerCols = ["#ff6f91", "#ffd23f", "#ffffff", "#c77dff"];
  for (let rep = 0; rep < 2; rep++) {
    for (let i = 0; i < 16; i++) {
      const x = rep * PERIOD + 20 + i * 75 + (i % 3) * 14;
      const g = el("g", { transform: "translate(" + x + " 496)" }, rsG);
      el("path", { d: "M-8,0 L-6,-16 L-2,0 M0,0 L2,-20 L6,0 M4,0 L10,-14 L12,0", fill: "none", stroke: "#4d9b3a", "stroke-width": 3, "stroke-linecap": "round" }, g);
      if (i % 2 === 0) {
        el("line", { x1: 0, y1: 0, x2: 0, y2: -24, stroke: "#4d9b3a", "stroke-width": 2 }, g);
        el("circle", { cx: 0, cy: -27, r: 5, fill: flowerCols[(i >> 1) % 4] }, g);
        el("circle", { cx: 0, cy: -27, r: 2, fill: "#f6a500" }, g);
      }
    }
  }

  // 路面虚线
  const dashG = $("dashes");
  for (let x = 0; x < 2400; x += 120) {
    el("rect", { x: x, y: 574, width: 64, height: 8, rx: 3, fill: "#f4f1e0" }, dashG);
  }

  // 风线
  const streakG = $("streaks");
  const streaks = [];
  [[300, 300, 90], [520, 180, 60], [160, 400, 70], [880, 340, 100], [700, 240, 55], [1050, 420, 80]].forEach((s) => {
    const l = el("line", { x1: 0, y1: 0, x2: s[2], y2: 0 }, streakG);
    streaks.push({ l, x: s[0], y: s[1], len: s[2] });
  });

  // 车轮
  function buildWheel(g) {
    el("circle", { r: 60, fill: "none", stroke: "#2b2f36", "stroke-width": 7 }, g);
    el("circle", { r: 55, fill: "none", stroke: "#b9bfc7", "stroke-width": 2 }, g);
    const spin = el("g", {}, g);
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      el("line", { x1: 0, y1: 0, x2: Math.cos(a) * 55, y2: Math.sin(a) * 55, stroke: "#aab1ba", "stroke-width": 1.4 }, spin);
    }
    el("circle", { cx: 52, cy: 0, r: 3.2, fill: "#ff9f1c" }, spin);
    el("circle", { r: 7, fill: "#6b7078" }, g);
    return spin;
  }
  const spinR = buildWheel($("wheelR"));
  const spinF = buildWheel($("wheelF"));

  // ---------- 动画 ----------
  const BB = { x: 88, y: 8 }, HIP = { x: 70, y: -116 };
  const THIGH = 80, SHIN = 86, CRANK = 30, R = 60, GEAR = 1.8;
  const BASE_SPEED = 380;

  const legFar = $("legFar"), legNear = $("legNear");
  const footFar = $("footFar"), footNear = $("footNear");
  const crankFar = $("crankFar"), crankNear = $("crankNear");
  const pedalFar = $("pedalFar"), pedalNear = $("pedalNear");
  const chainring = $("chainring");
  const bodyG = $("bodyG"), topG = $("topG"), headG = $("headG"), pouch = $("pouch"), fish = $("fish");

  function leg(px, py) {
    let dx = px - HIP.x, dy = py - HIP.y;
    const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.5);
    const base = Math.atan2(dy, dx);
    const c = Math.max(-1, Math.min(1, (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d)));
    const A = Math.acos(c);
    const k1 = { x: HIP.x + THIGH * Math.cos(base + A), y: HIP.y + THIGH * Math.sin(base + A) };
    const k2 = { x: HIP.x + THIGH * Math.cos(base - A), y: HIP.y + THIGH * Math.sin(base - A) };
    return k1.x > k2.x ? k1 : k2;
  }

  function pose(crank) {
    const bob = Math.sin(crank * 2) * 1.6;
    bodyG.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    topG.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    headG.setAttribute("transform", "translate(0 " + (Math.sin(crank * 2 + 1) * 1.8).toFixed(2) + ") rotate(" + (Math.sin(crank * 2 + 0.6) * 1.6).toFixed(2) + " 150 -262)");
    pouch.setAttribute("transform", "translate(0 -250) scale(1 " + (1 + Math.sin(crank * 4) * 0.05).toFixed(3) + ") translate(0 250)");
    fish.setAttribute("transform", "translate(214 " + (-112 + Math.sin(crank * 4 + 1) * 1.5).toFixed(2) + ") rotate(" + (-28 + Math.sin(crank * 2) * 6).toFixed(2) + ")");
    chainring.setAttribute("transform", "translate(" + BB.x + " " + BB.y + ") rotate(" + (crank * 180 / Math.PI).toFixed(2) + ")");

    [[crank, legNear, footNear, crankNear, pedalNear], [crank + Math.PI, legFar, footFar, crankFar, pedalFar]].forEach((p) => {
      const a = p[0];
      const px = BB.x + CRANK * Math.cos(a), py = BB.y + CRANK * Math.sin(a);
      const knee = leg(px, py);
      p[1].setAttribute("points", HIP.x + "," + (HIP.y + (p[1] === legNear ? bob : bob)) + " " + knee.x.toFixed(1) + "," + knee.y.toFixed(1) + " " + px.toFixed(1) + "," + (py - 4).toFixed(1));
      p[2].setAttribute("transform", "translate(" + px.toFixed(1) + " " + (py - 4).toFixed(1) + ")");
      p[3].setAttribute("x1", BB.x); p[3].setAttribute("y1", BB.y);
      p[3].setAttribute("x2", px.toFixed(1)); p[3].setAttribute("y2", py.toFixed(1));
      p[4].setAttribute("x", (px - 8).toFixed(1)); p[4].setAttribute("y", (py + 5).toFixed(1));
    });
  }

  let dist = 0, last = performance.now(), paused = false, speedMul = 1, clock = 0;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    clock += dt;
    const v = paused ? 0 : BASE_SPEED * speedMul;
    dist += v * dt;

    const wheelDeg = (dist / R) * 180 / Math.PI;
    spinR.setAttribute("transform", "rotate(" + (wheelDeg % 360).toFixed(2) + ")");
    spinF.setAttribute("transform", "rotate(" + (wheelDeg % 360).toFixed(2) + ")");
    pose(dist / R / GEAR);

    const sc = (id, factor) => $(id).setAttribute("transform", "translate(" + (-((dist * factor) % PERIOD)).toFixed(2) + " 0)");
    sc("hillsFar", 0.06); sc("hillsNear", 0.14); sc("trees", 0.4);
    sc("fence", 1.0); sc("roadside", 1.0); sc("dashes", 1.0);

    sunRays.parentNode.setAttribute("transform", "translate(1010 105) rotate(" + ((clock * 6) % 360).toFixed(2) + ")");
    cloudEls.forEach((o, i) => {
      const x = ((o.c.x - (dist * 0.025 + clock * (4 + i * 1.5)) * 1) % 1500 + 1500) % 1500 - 150;
      o.g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + o.c.y + ") scale(" + o.c.s + ")");
    });
    streaks.forEach((s, i) => {
      const x = ((s.x - dist * 1.4 - i * 97) % 1500 + 1500) % 1500 - 150;
      s.l.setAttribute("transform", "translate(" + x.toFixed(1) + " " + s.y + ")");
      s.l.setAttribute("opacity", Math.min(1, speedMul * (paused ? 0 : 1)));
    });
    requestAnimationFrame(frame);
  }

  $("toggle").addEventListener("click", function () {
    paused = !paused;
    this.textContent = paused ? "继续" : "暂停";
  });
  $("speed").addEventListener("input", function () { speedMul = parseFloat(this.value); });

  pose(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
