<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鹈鹕骑行 - 天气循环动画</title>
    <style>
        :root {
            /* 颜色变量 */
            --sky-sunny: #87CEEB;
            --sky-cloudy: #B0C4DE;
            --sky-rainy: #708090;
            --ground-color: #8FBC8F;
            --pelican-body: #FFFFFF;
            --pelican-beak: #FFA500;
            --pelican-pouch: #FF8C00;
            --bike-frame: #FF4500;
            --wheel-color: #333;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333; /* 默认背景，会被天气覆盖 */
        }

        /* UI 控制层 */
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            backdrop-filter: blur(5px);
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 14px;
            width: 90%;
            max-width: 400px;
            justify-content: space-between;
        }

        .status-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            color: white;
            transition: background-color 0.5s;
        }

        .controls button {
            background: #333;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* 主舞台 */
        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transition: background-color 2s ease;
            background-color: var(--sky-sunny);
        }

        /* 天气状态类 */
        .stage.sunny { background-color: var(--sky-sunny); }
        .stage.cloudy { background-color: var(--sky-cloudy); }
        .stage.rainy { background-color: var(--sky-rainy); }

        /* 场景元素 */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25vh;
            background-color: var(--ground-color);
            border-top: 5px solid #6da46d;
            z-index: 10;
        }

        /* 太阳 */
        .sun {
            position: absolute;
            top: 10vh;
            right: 15vw;
            width: 80px;
            height: 80px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 40px #FFD700;
            opacity: 1;
            transition: opacity 1s, transform 1s;
            z-index: 1;
        }
        
        /* 隐藏太阳 */
        .stage:not(.sunny) .sun {
            opacity: 0;
            transform: translateY(50px);
        }

        /* 云朵容器 */
        .clouds-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            pointer-events: none;
            z-index: 2;
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            opacity: 0.8;
            animation: moveClouds linear infinite;
        }
        
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        /* 云的具体形状 */
        .cloud.c1 { width: 120px; height: 40px; top: 15%; left: -150px; animation-duration: 20s; }
        .cloud.c1::after { width: 50px; height: 50px; top: -25px; left: 20px; }
        .cloud.c1::before { width: 40px; height: 40px; top: -15px; left: 60px; }

        .cloud.c2 { width: 100px; height: 35px; top: 25%; left: -150px; animation-duration: 25s; animation-delay: 5s; transform: scale(0.8); }
        .cloud.c2::after { width: 40px; height: 40px; top: -20px; left: 15px; }

        /* 阴雨天的云 */
        .storm-cloud {
            background: #778899;
        }

        /* 雨水容器 */
        .rain-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            display: none;
        }
        
        .stage.rainy .rain-container {
            display: block;
        }

        .drop {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            width: 2px;
            height: 15px;
            top: -20px;
            animation: fall linear infinite;
        }

        /* 鹈鹕与自行车组合 */
        .pelican-wrapper {
            position: absolute;
            bottom: 20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 250px;
            z-index: 20;
            animation: bounce 1s infinite ease-in-out alternate;
        }

        /* 自行车 */
        .bike {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 120px;
        }

        .wheel {
            position: absolute;
            bottom: 0;
            width: 80px;
            height: 80px;
            border: 4px solid var(--wheel-color);
            border-radius: 50%;
            background: transparent;
            animation: spin 1s linear infinite;
        }
        
        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--wheel-color);
            border-radius: 50%;
        }

        /* 轮辐 (简单线条) */
        .spoke {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0,0,0,0.2);
            transform-origin: center;
        }
        .spoke:nth-child(1) { transform: rotate(0deg); }
        .spoke:nth-child(2) { transform: rotate(45deg); }
        .spoke:nth-child(3) { transform: rotate(90deg); }
        .spoke:nth-child(4) { transform: rotate(135deg); }

        .wheel.back { left: 10px; }
        .wheel.front { right: 10px; }

        .frame {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 50px;
            border: 5px solid var(--bike-frame);
            border-top: none;
            border-right: none;
            border-radius: 0 0 0 20px;
            transform: skewX(-10deg);
        }

        .handle-post {
            position: absolute;
            bottom: 70px;
            right: 40px;
            width: 5px;
            height: 40px;
            background: var(--bike-frame);
            transform: rotate(-15deg);
        }

        .handle-bar {
            position: absolute;
            bottom: 105px;
            right: 25px;
            width: 50px;
            height: 5px;
            background: var(--bike-frame);
            border-radius: 5px;
        }

        .seat-post {
            position: absolute;
            bottom: 60px;
            left: 60px;
            width: 5px;
            height: 40px;
            background: var(--bike-frame);
        }

        .seat {
            position: absolute;
            bottom: 100px;
            left: 50px;
            width: 40px;
            height: 10px;
            background: #333;
            border-radius: 10px 10px 0 0;
        }

        .pedal-group {
            position: absolute;
            bottom: 45px;
            left: 95px;
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            animation: spin 1s linear infinite reverse; /* 脚踏板反向旋转相对于轮子视觉上更自然 */
        }

        .pedal-arm {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 4px;
            background: #333;
            /* 动画在pedal-group上 */
        }

        /* 鹈鹕构造 */
        .pelican {
            position: absolute;
            bottom: 110px; /* 坐在车座上 */
            left: 35px;
            width: 120px;
            height: 100px;
        }

        .p-body {
            position: absolute;
            width: 100px;
            height: 70px;
            background: var(--pelican-body);
            border-radius: 40px 50px 50px 50px;
            z-index: 2;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.05);
        }

        .p-neck {
            position: absolute;
            bottom: 60px;
            left: 60px;
            width: 30px;
            height: 50px;
            background: var(--pelican-body);
            transform: rotate(-20deg);
            z-index: 1;
            border-radius: 10px;
        }

        .p-head {
            position: absolute;
            bottom: 100px;
            left: 70px;
            width: 45px;
            height: 35px;
            background: var(--pelican-body);
            border-radius: 40% 40% 50% 50%;
            z-index: 3;
        }

        .p-eye {
            position: absolute;
            top: 10px;
            left: 25px;
            width: 6px;
            height: 6px;
            background: #000;
            border-radius: 50%;
        }

        .p-beak-top {
            position: absolute;
            top: 15px;
            right: -30px;
            width: 45px;
            height: 10px;
            background: var(--pelican-beak);
            border-radius: 5px;
            z-index: 2;
        }

        .p-beak-pouch {
            position: absolute;
            top: 20px;
            right: -35px;
            width: 40px;
            height: 25px;
            background: var(--pelican-pouch);
            border-radius: 0 0 20px 20px;
            z-index: 1;
            border-top: 2px solid var(--pelican-beak);
        }

        .p-wing {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 50px;
            height: 30px;
            background: #f0f0f0;
            border-radius: 50% 50% 0 0;
            border: 1px solid #ddd;
            transform-origin: bottom left;
            animation: flap 0.8s infinite alternate ease-in-out;
            z-index: 4; /* 盖住车把手 */
        }
        
        .p-legs {
            position: absolute;
            bottom: -20px;
            left: 50px;
            width: 20px;
            height: 30px;
            z-index: 1;
        }
        
        .leg {
            width: 4px;
            height: 30px;
            background: #FFA500;
            position: absolute;
            top: 0;
            transform-origin: top center;
            animation: pedal-legs 1s infinite linear;
        }
        .leg.left { left: 0; animation-delay: 0s; }
        .leg.right { left: 10px; animation-delay: 0.5s; }

        /* 动画定义 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        @keyframes bounce {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(5px); }
        }

        @keyframes flap {
            0% { transform: rotate(0deg) translateY(0); }
            100% { transform: rotate(10deg) translateY(-2px); }
        }

        @keyframes pedal-legs {
            0% { transform: rotate(-20deg); }
            50% { transform: rotate(20deg); }
            100% { transform: rotate(-20deg); }
        }

        /* 响应式调整 */
        @media (min-width: 768px) {
            .pelican-wrapper {
                transform: translateX(-50%) scale(1.5);
                bottom: 18vh;
            }
            .ground { height: 20vh; }
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div id="weather-status" class="status-badge">晴天</div>
        <div id="timer-display">切换倒计时: 5s</div>
        <div class="controls">
            <button id="toggle-anim">暂停动画</button>
        </div>
    </div>

    <main class="stage sunny" id="stage">
        <div class="sun"></div>
        
        <div class="clouds-container" id="clouds-container">
            <!-- 云朵通过JS动态补充或使用静态 -->
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
        </div>

        <div class="rain-container" id="rain-container">
            <!-- 雨滴由JS生成 -->
        </div>

        <div class="ground"></div>

        <div class="pelican-wrapper" id="pelican">
            <div class="pelican">
                <div class="p-body"></div>
                <div class="p-neck"></div>
                <div class="p-head">
                    <div class="p-eye"></div>
                    <div class="p-beak-top"></div>
                    <div class="p-beak-pouch"></div>
                </div>
                <div class="p-wing"></div>
                <div class="p-legs">
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                </div>
            </div>
            
            <div class="bike">
                <div class="frame"></div>
                <div class="handle-post"></div>
                <div class="handle-bar"></div>
                <div class="seat-post"></div>
                <div class="seat"></div>
                <div class="pedal-group">
                    <div class="pedal-arm"></div>
                </div>
                <div class="wheel back">
                    <div class="spoke"></div><div class="spoke"></div><div class="spoke"></div><div class="spoke"></div>
                </div>
                <div class="wheel front">
                    <div class="spoke"></div><div class="spoke"></div><div class="spoke"></div><div class="spoke"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.getElementById('stage');
            const weatherStatus = document.getElementById('weather-status');
            const timerDisplay = document.getElementById('timer-display');
            const rainContainer = document.getElementById('rain-container');
            const cloudsContainer = document.getElementById('clouds-container');
            const toggleBtn = document.getElementById('toggle-anim');
            
            // 动画元素集合
            const animatingElements = document.querySelectorAll('.pelican-wrapper, .wheel, .cloud, .drop, .leg, .p-wing');

            // 天气配置
            const weathers = [
                { name: '晴天', class: 'sunny', color: '#FFA500', textColor: '#fff' },
                { name: '阴天', class: 'cloudy', color: '#778899', textColor: '#fff' },
                { name: '雨天', class: 'rainy', color: '#2F4F4F', textColor: '#fff' }
            ];
            
            let currentIndex = 0;
            let timeLeft = 5;
            let isPaused = false;
            let timerInterval = null;

            // 初始化雨滴
            function createRain() {
                const dropCount = 50;
                for (let i = 0; i < dropCount; i++) {
                    const drop = document.createElement('div');
                    drop.classList.add('drop');
                    drop.style.left = Math.random() * 100 + 'vw';
                    drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
                    drop.style.animationDelay = Math.random() * 2 + 's';
                    rainContainer.appendChild(drop);
                }
            }

            // 初始化更多云朵
            function createClouds() {
                for(let i=0; i<3; i++) {
                    const cloud = document.createElement('div');
                    cloud.classList.add('cloud');
                    // 随机化样式
                    const width = Math.random() * 60 + 60;
                    cloud.style.width = width + 'px';
                    cloud.style.height = (width * 0.35) + 'px';
                    cloud.style.top = (Math.random() * 40 + 5) + '%';
                    cloud.style.animationDuration = (Math.random() * 20 + 20) + 's';
                    cloud.style.animationDelay = (Math.random() * -20) + 's';
                    cloudsContainer.appendChild(cloud);
                    
                    // 伪元素处理略复杂，这里只做简单圆形聚合
                    const after = document.createElement('div');
                    after.style.cssText = `content:''; position:absolute; background:inherit; border-radius:50%; width:50%; height:150%; top:-60%; left:20%;`;
                    cloud.appendChild(after);
                }
            }

            // 切换天气逻辑
            function switchWeather() {
                // 移除当前天气类
                stage.classList.remove(weathers[currentIndex].class);
                
                // 更新索引
                currentIndex = (currentIndex + 1) % weathers.length;
                
                // 添加新天气类
                const newWeather = weathers[currentIndex];
                stage.classList.add(newWeather.class);
                
                // 更新UI
                weatherStatus.textContent = newWeather.name;
                weatherStatus.style.backgroundColor = newWeather.color;
                
                // 阴天/雨天让云朵变暗
                const clouds = document.querySelectorAll('.cloud');
                clouds.forEach(c => {
                    if (newWeather.class === 'sunny') {
                        c.style.background = '#fff';
                        c.style.opacity = '0.8';
                    } else {
                        c.style.background = '#778899'; // 风暴云颜色
                        c.style.opacity = '0.9';
                    }
                });
            }

            // 倒计时逻辑
            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (!isPaused) {
                        timeLeft--;
                        timerDisplay.textContent = `切换倒计时: ${timeLeft}s`;
                        
                        if (timeLeft <= 0) {
                            switchWeather();
                            timeLeft = 5;
                            timerDisplay.textContent = `切换倒计时: ${timeLeft}s`;
                        }
                    }
                }, 1000);
            }

            // 暂停/播放控制
            toggleBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                toggleBtn.textContent = isPaused ? '继续动画' : '暂停动画';
                
                const state = isPaused ? 'paused' : 'running';
                animatingElements.forEach(el => {
                    el.style.animationPlayState = state;
                });
                
                // 雨滴也要控制
                const drops = document.querySelectorAll('.drop');
                drops.forEach(d => d.style.animationPlayState = state);
            });

            // 初始化
            createRain();
            createClouds();
            startTimer();
            // 初始状态UI
            weatherStatus.textContent = weathers[0].name;
            weatherStatus.style.backgroundColor = weathers[0].color;
        });
    </script>
</body>
</html>
