<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鹈鹕骑行记</title>
    <style>
        :root {
            --sky-sunny: #87CEEB;
            --cloud-sunny: #ffffff;
            
            --sky-cloudy: #b0c4de;
            --cloud-cloudy: #e0e0e0;
            
            --sky-rainy: #4a5d6e;
            --cloud-rainy: #7f8fa6;
            
            --ground-color: #90EE90;
            --road-color: #555;
            
            /* 动画状态变量 */
            --bg-color: var(--sky-sunny);
            --cloud-color: var(--cloud-sunny);
            --sun-opacity: 1;
            --rain-opacity: 0;
            --lighting: brightness(1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            transition: background-color 1s ease-in-out;
            font-family: sans-serif;
        }

        /* 场景容器 */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            filter: var(--lighting);
            transition: filter 1s ease;
        }

        /* 太阳 */
        .sun {
            position: absolute;
            top: 10%;
            right: 15%;
            width: 10vmin;
            height: 10vmin;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 40px #FFD700;
            opacity: var(--sun-opacity);
            transition: opacity 1s ease, transform 1s ease;
            z-index: 1;
        }

        /* 云朵 */
        .cloud-container {
            position: absolute;
            top: 5%;
            width: 100%;
            height: 30%;
            z-index: 2;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: var(--cloud-color);
            border-radius: 50px;
            opacity: 0.9;
            transition: background 1s ease;
        }
        
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        /* 云朵位置与大小定义 */
        .c1 { width: 12vmin; height: 6vmin; left: 10%; top: 20%; animation: floatCloud 20s linear infinite; }
        .c1::after { width: 6vmin; height: 6vmin; top: -3vmin; left: 2vmin; }
        .c1::before { width: 5vmin; height: 5vmin; top: -2vmin; left: 6vmin; }

        .c2 { width: 15vmin; height: 7vmin; left: 60%; top: 10%; animation: floatCloud 25s linear infinite reverse; }
        .c2::after { width: 8vmin; height: 8vmin; top: -4vmin; left: 3vmin; }
        .c2::before { width: 6vmin; height: 6vmin; top: -3vmin; left: 8vmin; }

        .c3 { width: 10vmin; height: 5vmin; left: 35%; top: 40%; animation: floatCloud 15s linear infinite; }
        .c3::after { width: 5vmin; height: 5vmin; top: -2.5vmin; left: 1.5vmin; }

        @keyframes floatCloud {
            0% { transform: translateX(-20vw); }
            100% { transform: translateX(120vw); }
        }

        /* 地面与道路 */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            background: var(--ground-color);
            z-index: 3;
        }

        .road {
            position: absolute;
            bottom: 10%;
            width: 100%;
            height: 12vmin;
            background: var(--road-color);
            border-top: 2px solid #fff;
            border-bottom: 2px solid #fff;
        }

        /* 道路标线 (通过背景渐变模拟) */
        .road-lines {
            position: absolute;
            top: 50%;
            left: 0;
            width: 200%; /* 两倍宽度用于滚动 */
            height: 4px;
            background: repeating-linear-gradient(90deg, #fff 0, #fff 4vmin, transparent 4vmin, transparent 8vmin);
            transform: translateY(-50%);
            animation: roadMove 1s linear infinite;
        }

        @keyframes roadMove {
            from { transform: translateX(0) translateY(-50%); }
            to { transform: translateX(-8vmin) translateY(-50%); }
        }

        /* 自行车与鹈鹕组合体 */
        .rider-group {
            position: absolute;
            bottom: 22%; /* 骑在路面上 */
            left: 50%;
            transform: translateX(-50%);
            width: 40vmin;
            height: 40vmin;
            z-index: 10;
            animation: bikeBounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes bikeBounce {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-1vmin); }
        }

        /* 轮子 */
        .wheel {
            position: absolute;
            bottom: 0;
            width: 12vmin;
            height: 12vmin;
            border: 0.8vmin solid #333;
            border-radius: 50%;
            background: transparent;
            box-sizing: border-box;
        }

        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 0.8vmin;
            background: #333;
            transform: translateY(-50%);
        }
        
        .wheel::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            height: 100%;
            width: 0.8vmin;
            background: #333;
            transform: translateX(-50%);
        }

        .wheel-back { left: 0; animation: spinWheel 0.5s linear infinite; }
        .wheel-front { right: 0; animation: spinWheel 0.5s linear infinite; }

        @keyframes spinWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 车架 */
        .frame {
            position: absolute;
            bottom: 6vmin;
            left: 10vmin;
            width: 20vmin;
            height: 2vmin;
            background: #e74c3c;
            transform: skewX(-30deg);
            z-index: 1;
        }
        .frame::before {
            content: '';
            position: absolute;
            top: -10vmin;
            left: 5vmin;
            width: 2vmin;
            height: 14vmin;
            background: #e74c3c;
            transform: skewX(30deg);
        }
        .handlebar {
            position: absolute;
            bottom: 14vmin;
            right: 2vmin;
            width: 4vmin;
            height: 1vmin;
            background: #333;
            transform: rotate(-20deg);
        }
        .seat {
            position: absolute;
            bottom: 16vmin;
            left: 4vmin;
            width: 5vmin;
            height: 1vmin;
            background: #333;
            border-radius: 10px;
        }

        /* 鹈鹕 SVG */
        .pelican-svg {
            position: absolute;
            bottom: 14vmin;
            left: 5vmin;
            width: 16vmin;
            height: 16vmin;
            z-index: 5;
        }

        /* 雨 */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: var(--rain-opacity);
            transition: opacity 1s ease;
        }

        .drop {
            position: absolute;
            width: 2px;
            height: 10px;
            background: rgba(255, 255, 255, 0.6);
            animation: fall 0.7s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        /* 状态控制类 */
        .weather-cloudy {
            --bg-color: var(--sky-cloudy);
            --cloud-color: var(--cloud-cloudy);
            --sun-opacity: 0.2;
        }

        .weather-rainy {
            --bg-color: var(--sky-rainy);
            --cloud-color: var(--cloud-rainy);
            --sun-opacity: 0;
            --rain-opacity: 1;
            --lighting: brightness(0.7);
        }

    </style>
</head>
<body>

    <div class="scene" id="scene">
        <!-- 太阳 -->
        <div class="sun"></div>

        <!-- 云 -->
        <div class="cloud-container">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- 雨 -->
        <div class="rain-container" id="rainContainer">
            <!-- JS will populate drops here -->
        </div>

        <!-- 地面 -->
        <div class="ground">
            <div class="road">
                <div class="road-lines"></div>
            </div>
        </div>

        <!-- 骑行者 -->
        <div class="rider-group">
            <!-- 后轮 -->
            <div class="wheel wheel-back"></div>
            
            <!-- 车架结构 -->
            <div class="frame"></div>
            <div class="seat"></div>
            <div class="handlebar"></div>

            <!-- 前轮 -->
            <div class="wheel wheel-front"></div>

            <!-- 鹈鹕 SVG -->
            <svg class="pelican-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- 身体 -->
                <path d="M30,60 Q20,40 40,30 T70,40 Q80,50 70,70 Z" fill="#FFF" stroke="#ddd" stroke-width="1"/>
                <!-- 翅膀 (简单的线条表示) -->
                <path d="M40,45 Q60,45 65,55" fill="none" stroke="#eee" stroke-width="2"/>
                
                <!-- 脖子 -->
                <path d="M65,40 Q70,20 60,15" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
                
                <!-- 头 -->
                <circle cx="60" cy="15" r="10" fill="#FFF"/>
                
                <!-- 眼睛 -->
                <circle cx="63" cy="12" r="2" fill="#000"/>
                
                <!-- 大嘴 (上颚) -->
                <path d="M65,15 L95,20 L65,22 Z" fill="#F4A460"/>
                <!-- 大嘴 (下囊) -->
                <path d="M65,22 Q80,40 90,20 L65,22 Z" fill="#F4A460" opacity="0.9"/>
                
                <!-- 手臂/翅膀握住车把的简单示意 -->
                <path d="M60,45 L75,48" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <script>
        // 生成雨滴
        const rainContainer = document.getElementById('rainContainer');
        for(let i=0; i<100; i++) {
            const drop = document.createElement('div');
            drop.classList.add('drop');
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
            drop.style.animationDelay = Math.random() * 2 + 's';
            rainContainer.appendChild(drop);
        }

        // 天气循环逻辑
        const scene = document.getElementById('scene');
        const states = ['weather-sunny', 'weather-cloudy', 'weather-rainy'];
        let currentStateIndex = 0;

        function changeWeather() {
            // 移除当前状态
            if(currentStateIndex > 0) {
                scene.classList.remove(states[currentStateIndex - 1]);
            }
            
            // 移动到下一个状态
            currentStateIndex = (currentStateIndex + 1) % states.length;
            
            // 添加新状态
            if(currentStateIndex > 0) {
                scene.classList.add(states[currentStateIndex]);
            }
        }

        // 初始设为晴天 (不需要加类名，CSS默认就是晴天)
        // 设置定时器，每5秒切换一次
        setInterval(changeWeather, 5000);

    </script>
</body>
</html>
