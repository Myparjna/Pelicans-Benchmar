<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="一只鹈鹕在海边公路上骑自行车的响应式网页动画，天气每五秒在晴天、阴天与雨天之间自动切换。" />
  <meta name="theme-color" content="#bde9ff" />
  <title>鹈鹕的天气骑行</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #bde9ff;
    }

    body {
      min-height: 100svh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .weather-card {
      position: fixed;
      z-index: 2;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 166px;
      padding: 10px 14px 10px 11px;
      color: #173344;
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 999px;
      box-shadow: 0 10px 28px rgba(41, 79, 99, .14);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      transform: translateX(-50%);
    }

    .weather-symbol {
      position: relative;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #ffe479;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
      transition: background .5s ease;
    }

    .weather-symbol::before,
    .weather-symbol::after {
      content: "";
      position: absolute;
      transition: all .5s ease;
    }

    .weather-symbol::before {
      width: 22px;
      height: 10px;
      right: -1px;
      bottom: 5px;
      border-radius: 999px;
      background: transparent;
      box-shadow: none;
    }

    .weather-card.cloudy .weather-symbol,
    .weather-card.rainy .weather-symbol { background: #a9bdc9; }

    .weather-card.cloudy .weather-symbol::before,
    .weather-card.rainy .weather-symbol::before {
      background: #f5f8fa;
      box-shadow: -7px 1px 0 -1px #f5f8fa, 3px -5px 0 -2px #f5f8fa;
    }

    .weather-card.rainy .weather-symbol::after {
      left: 10px;
      bottom: -3px;
      width: 2px;
      height: 7px;
      border-radius: 2px;
      background: #428bb1;
      box-shadow: 7px 2px #428bb1, 14px 0 #428bb1;
      transform: rotate(18deg);
    }

    .weather-copy { min-width: 0; }

    .weather-name {
      display: block;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .weather-next {
      display: block;
      margin-top: 2px;
      color: rgba(23, 51, 68, .64);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .timer {
      width: 34px;
      height: 34px;
      margin-left: auto;
      transform: rotate(-90deg);
    }

    .timer circle { fill: none; stroke-width: 3; }
    .timer .track { stroke: rgba(23, 51, 68, .11); }
    .timer .progress {
      stroke: #2f7f9f;
      stroke-linecap: round;
      stroke-dasharray: 88;
      stroke-dashoffset: 0;
    }

    .hint {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      padding: 7px 11px;
      color: rgba(29, 56, 65, .64);
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .05em;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
    }

    @media (max-width: 480px) {
      .weather-card {
        top: max(12px, env(safe-area-inset-top));
        min-width: 154px;
        padding: 8px 11px 8px 9px;
      }
      .weather-symbol { width: 34px; height: 34px; }
      .weather-name { font-size: 13px; }
      .timer { width: 30px; height: 30px; }
      .hint { bottom: max(10px, env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main aria-label="鹈鹕骑行场景">
    <canvas id="scene" aria-label="一只鹈鹕在海边公路上骑自行车，天气会自动变化"></canvas>
  </main>

  <div class="weather-card sunny" id="weatherCard" aria-live="polite">
    <span class="weather-symbol" aria-hidden="true"></span>
    <span class="weather-copy">
      <span class="weather-name" id="weatherName">晴天骑行</span>
      <span class="weather-next" id="weatherNext">5 秒后转为阴天</span>
    </span>
    <svg class="timer" viewBox="0 0 32 32" aria-hidden="true">
      <circle class="track" cx="16" cy="16" r="14"></circle>
      <circle class="progress" id="timerProgress" cx="16" cy="16" r="14"></circle>
    </svg>
  </div>

  <div class="hint">海风作伴 · 一直向前</div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d', { alpha: false });
      const weatherCard = document.getElementById('weatherCard');
      const weatherName = document.getElementById('weatherName');
      const weatherNext = document.getElementById('weatherNext');
      const timerProgress = document.getElementById('timerProgress');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const weather = [
        { key: 'sunny', name: '晴天骑行', next: '阴天', sky: ['#8dd8ff', '#eefaff'], sea: '#63bed2', hill: '#82c990', light: 1 },
        { key: 'cloudy', name: '阴天骑行', next: '雨天', sky: ['#92aebd', '#dce6e9'], sea: '#789da8', hill: '#75a581', light: .82 },
        { key: 'rainy', name: '雨天骑行', next: '晴天', sky: ['#647f91', '#b4c4cb'], sea: '#668792', hill: '#5f8a70', light: .68 }
      ];

      let width = 0;
      let height = 0;
      let dpr = 1;
      let weatherIndex = 0;
      let previousIndex = 0;
      let cycleStart = performance.now();
      let transitionStart = cycleStart;
      let lastTime = cycleStart;
      let travel = 0;
      let rainSeed = 1123;
      let raindrops = [];

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const ease = t => t * t * (3 - 2 * t);

      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function mixColor(a, b, t) {
        const x = hexToRgb(a), y = hexToRgb(b);
        return `rgb(${Math.round(lerp(x[0], y[0], t))},${Math.round(lerp(x[1], y[1], t))},${Math.round(lerp(x[2], y[2], t))})`;
      }

      function roundedRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, rr);
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        createRain();
      }

      function random() {
        rainSeed = (rainSeed * 1664525 + 1013904223) >>> 0;
        return rainSeed / 4294967296;
      }

      function createRain() {
        rainSeed = 1123;
        const count = Math.ceil((width * height) / 8500);
        raindrops = Array.from({ length: clamp(count, 50, 190) }, () => ({
          x: random() * width,
          y: random() * height,
          len: 10 + random() * 18,
          speed: 460 + random() * 280,
          alpha: .18 + random() * .34
        }));
      }

      function updateWeather(now) {
        const elapsed = now - cycleStart;
        if (elapsed >= 5000) {
          previousIndex = weatherIndex;
          weatherIndex = (weatherIndex + 1) % weather.length;
          cycleStart += Math.floor(elapsed / 5000) * 5000;
          transitionStart = now;
          const current = weather[weatherIndex];
          weatherCard.className = `weather-card ${current.key}`;
          weatherName.textContent = current.name;
          weatherNext.textContent = `5 秒后转为${current.next}`;
        }
        const remaining = Math.max(0, 5 - (now - cycleStart) / 1000);
        weatherNext.textContent = `${Math.max(1, Math.ceil(remaining))} 秒后转为${weather[weatherIndex].next}`;
        timerProgress.style.strokeDashoffset = String(88 * (1 - remaining / 5));
      }

      function drawCloud(x, y, scale, alpha, dark = false) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = dark ? '#8ba0aa' : '#ffffff';
        ctx.shadowColor = 'rgba(36, 68, 81, .08)';
        ctx.shadowBlur = 14 * scale;
        ctx.beginPath();
        ctx.arc(x, y, 19 * scale, Math.PI, 0);
        ctx.arc(x + 22 * scale, y - 8 * scale, 27 * scale, Math.PI, 0);
        ctx.arc(x + 54 * scale, y - 1 * scale, 20 * scale, Math.PI, 0);
        ctx.lineTo(x + 70 * scale, y + 13 * scale);
        ctx.lineTo(x - 18 * scale, y + 13 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawSky(current, old, blend, now) {
        const top = mixColor(old.sky[0], current.sky[0], blend);
        const bottom = mixColor(old.sky[1], current.sky[1], blend);
        const gradient = ctx.createLinearGradient(0, 0, 0, height * .68);
        gradient.addColorStop(0, top);
        gradient.addColorStop(1, bottom);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        const sunny = weatherIndex === 0 ? blend : previousIndex === 0 ? 1 - blend : 0;
        if (sunny > .01) {
          const sx = width < 600 ? width * .78 : width * .82;
          const sy = height * .18;
          const r = clamp(Math.min(width, height) * .055, 24, 50);
          ctx.save();
          ctx.globalAlpha = sunny;
          const glow = ctx.createRadialGradient(sx, sy, r * .4, sx, sy, r * 2.5);
          glow.addColorStop(0, 'rgba(255,238,135,.72)');
          glow.addColorStop(1, 'rgba(255,238,135,0)');
          ctx.fillStyle = glow;
          ctx.beginPath(); ctx.arc(sx, sy, r * 2.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffe36e';
          ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        const cloudiness = weatherIndex === 0 ? .18 * blend : lerp(previousIndex === 0 ? .18 : .74, weatherIndex === 2 ? .95 : .74, blend);
        const cloudTravel = reduceMotion ? 0 : now * .006;
        drawCloud((width * .06 + cloudTravel) % (width + 180) - 100, height * .19, .78, cloudiness, weatherIndex === 2);
        drawCloud((width * .42 + cloudTravel * .65) % (width + 240) - 120, height * .12, 1.05, cloudiness * .84, weatherIndex === 2);
        drawCloud((width * .75 + cloudTravel * .8) % (width + 210) - 105, height * .28, .62, cloudiness * .7, weatherIndex === 2);
      }

      function drawDistantLandscape(current, old, blend) {
        const horizon = height * .58;

        ctx.fillStyle = mixColor(old.sea, current.sea, blend);
        ctx.fillRect(0, horizon, width, height * .18);
        ctx.save();
        ctx.globalAlpha = .28;
        ctx.strokeStyle = '#eefcff';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
          const y = horizon + 14 + i * 12;
          ctx.beginPath();
          for (let x = -30; x <= width + 30; x += 30) {
            const yy = y + Math.sin((x + travel * .18 + i * 20) * .035) * 2;
            if (x === -30) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
          }
          ctx.stroke();
        }
        ctx.restore();

        const hill = mixColor(old.hill, current.hill, blend);
        ctx.fillStyle = hill;
        ctx.beginPath();
        ctx.moveTo(0, horizon + 28);
        for (let x = 0; x <= width + 60; x += 60) {
          const phase = (x + travel * .06) / Math.max(width, 600);
          ctx.lineTo(x, horizon - 18 - Math.sin(phase * Math.PI * 5) * 25 - Math.sin(phase * 11) * 7);
        }
        ctx.lineTo(width, horizon + 52);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,.82)';
        const sailX = ((width * .8 - travel * .11) % (width + 100) + width + 100) % (width + 100) - 40;
        const sailY = horizon + 20;
        ctx.beginPath();
        ctx.moveTo(sailX, sailY - 34); ctx.lineTo(sailX, sailY); ctx.lineTo(sailX - 22, sailY); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#c96d52';
        ctx.fillRect(sailX - 26, sailY + 2, 36, 4);
      }

      function drawRoad() {
        const roadTop = height * .69;
        const road = ctx.createLinearGradient(0, roadTop, 0, height);
        road.addColorStop(0, '#72818a');
        road.addColorStop(1, '#4f5d65');
        ctx.fillStyle = road;
        ctx.fillRect(0, roadTop, width, height - roadTop);

        ctx.fillStyle = '#d6c99f';
        ctx.fillRect(0, roadTop - 14, width, 16);
        ctx.fillStyle = '#f8efce';
        ctx.fillRect(0, roadTop - 14, width, 4);

        ctx.fillStyle = 'rgba(255,255,255,.62)';
        const stripeY = lerp(roadTop, height, .7);
        const stripeW = clamp(width * .1, 42, 110);
        const gap = stripeW * 1.3;
        const offset = -(travel * 1.5 % (stripeW + gap));
        for (let x = offset - stripeW; x < width + stripeW; x += stripeW + gap) {
          roundedRect(x, stripeY, stripeW, clamp(height * .012, 5, 10), 5);
          ctx.fill();
        }

        const pebbleOffset = -(travel * .85 % 140);
        ctx.fillStyle = 'rgba(255,255,255,.15)';
        for (let x = pebbleOffset; x < width + 140; x += 140) {
          ctx.beginPath(); ctx.ellipse(x + 30, height * .91, 5, 2, 0, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(x + 93, height * .82, 3, 1.5, 0, 0, Math.PI * 2); ctx.fill();
        }
      }

      function drawForegroundPlants() {
        const baseY = height * .69 - 12;
        const unit = clamp(width * .09, 54, 100);
        const offset = -(travel * .7 % unit);
        for (let x = offset - unit; x < width + unit; x += unit) {
          ctx.strokeStyle = '#4d9466';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x + 15, baseY); ctx.quadraticCurveTo(x + 9, baseY - 26, x + 19, baseY - 40); ctx.stroke();
          ctx.fillStyle = '#fff0a8';
          ctx.beginPath(); ctx.arc(x + 19, baseY - 41, 4, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#5ca074';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x + 44, baseY); ctx.lineTo(x + 40, baseY - 21); ctx.moveTo(x + 40, baseY - 13); ctx.lineTo(x + 32, baseY - 20); ctx.stroke();
        }
      }

      function drawWheel(x, y, r, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#263840';
        ctx.lineWidth = Math.max(3, r * .09);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(235,246,246,.72)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 12; i++) {
          const a = angle + i * Math.PI / 6;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * .88, Math.sin(a) * r * .88); ctx.stroke();
        }
        ctx.fillStyle = '#d9edf0';
        ctx.beginPath(); ctx.arc(0, 0, r * .1, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawBikeAndPelican(now, rainyAmount) {
        const portrait = height > width * 1.15;
        const scale = clamp(Math.min(width / (portrait ? 390 : 720), height / (portrait ? 720 : 520)), .72, 1.35);
        const groundY = height * .82;
        const cx = width * (portrait ? .5 : .49);
        const bob = reduceMotion ? 0 : Math.sin(now * .008) * 2.5 * scale;
        const wheelR = 43 * scale;
        const rearX = cx - 67 * scale;
        const frontX = cx + 72 * scale;
        const wheelY = groundY;
        const spin = travel / wheelR;

        ctx.save();
        ctx.shadowColor = 'rgba(20,38,43,.2)';
        ctx.shadowBlur = 10 * scale;
        ctx.fillStyle = 'rgba(28,43,48,.24)';
        ctx.beginPath(); ctx.ellipse(cx + 3 * scale, wheelY + wheelR + 8 * scale, 125 * scale, 9 * scale, 0, 0, Math.PI * 2); ctx.fill();
        ctx.shadowColor = 'transparent';

        drawWheel(rearX, wheelY, wheelR, spin);
        drawWheel(frontX, wheelY, wheelR, spin);

        const crankX = cx + 2 * scale;
        const crankY = wheelY - 2 * scale;
        const seatX = cx - 31 * scale;
        const seatY = wheelY - 67 * scale;
        const handleX = cx + 54 * scale;
        const handleY = wheelY - 71 * scale;

        ctx.strokeStyle = '#e25e49';
        ctx.lineWidth = 7 * scale;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(rearX, wheelY); ctx.lineTo(crankX, crankY); ctx.lineTo(seatX, seatY); ctx.lineTo(rearX, wheelY);
        ctx.moveTo(crankX, crankY); ctx.lineTo(frontX - 11 * scale, wheelY - 66 * scale); ctx.lineTo(frontX, wheelY);
        ctx.moveTo(seatX, seatY); ctx.lineTo(handleX, handleY);
        ctx.stroke();

        ctx.strokeStyle = '#273b43';
        ctx.lineWidth = 5 * scale;
        ctx.beginPath(); ctx.moveTo(seatX - 12 * scale, seatY - 3 * scale); ctx.lineTo(seatX + 14 * scale, seatY - 3 * scale); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(handleX - 5 * scale, handleY); ctx.quadraticCurveTo(handleX + 7 * scale, handleY - 13 * scale, handleX + 20 * scale, handleY - 7 * scale); ctx.stroke();

        ctx.fillStyle = '#fff4c7';
        ctx.strokeStyle = '#ecd798';
        ctx.lineWidth = 2 * scale;
        roundedRect(frontX + 1 * scale, wheelY - 58 * scale, 39 * scale, 32 * scale, 5 * scale); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#b28c58';
        ctx.lineWidth = 1.4 * scale;
        for (let i = 1; i < 4; i++) {
          ctx.beginPath(); ctx.moveTo(frontX + 1 * scale, wheelY - (58 - i * 8) * scale); ctx.lineTo(frontX + 40 * scale, wheelY - (58 - i * 8) * scale); ctx.stroke();
        }

        ctx.save();
        ctx.translate(0, bob);

        const pedalA = spin * .7;
        const foot1 = { x: crankX + Math.cos(pedalA) * 17 * scale, y: crankY + Math.sin(pedalA) * 12 * scale };
        const foot2 = { x: crankX - Math.cos(pedalA) * 17 * scale, y: crankY - Math.sin(pedalA) * 12 * scale };
        ctx.strokeStyle = '#e7a34a';
        ctx.lineWidth = 8 * scale;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx - 14 * scale, wheelY - 70 * scale); ctx.quadraticCurveTo(cx - 9 * scale, wheelY - 38 * scale, foot1.x, foot1.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - 33 * scale, wheelY - 72 * scale); ctx.quadraticCurveTo(cx - 26 * scale, wheelY - 35 * scale, foot2.x, foot2.y); ctx.stroke();
        ctx.fillStyle = '#cf6547';
        ctx.beginPath(); ctx.ellipse(foot1.x + 5 * scale, foot1.y, 13 * scale, 5 * scale, -.1, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(foot2.x + 5 * scale, foot2.y, 13 * scale, 5 * scale, -.1, 0, Math.PI * 2); ctx.fill();

        const bodyX = cx - 25 * scale;
        const bodyY = wheelY - 126 * scale;
        ctx.fillStyle = '#f8f4df';
        ctx.strokeStyle = '#ded7bd';
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        ctx.ellipse(bodyX, bodyY, 42 * scale, 56 * scale, -.2, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#e8e2ca';
        ctx.beginPath();
        ctx.ellipse(bodyX - 13 * scale, bodyY + 6 * scale, 25 * scale, 39 * scale, -.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(143,132,104,.26)';
        ctx.lineWidth = 1.4 * scale;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath(); ctx.arc(bodyX - (18 - i * 7) * scale, bodyY + (2 + i * 9) * scale, (18 - i * 2) * scale, .6, 2.25); ctx.stroke();
        }

        ctx.strokeStyle = '#f5efe0';
        ctx.lineWidth = 15 * scale;
        ctx.beginPath(); ctx.moveTo(bodyX + 16 * scale, bodyY - 31 * scale); ctx.quadraticCurveTo(cx + 19 * scale, bodyY - 46 * scale, handleX + 2 * scale, handleY - 2 * scale); ctx.stroke();
        ctx.fillStyle = '#dcb04e';
        ctx.beginPath(); ctx.arc(handleX + 2 * scale, handleY - 2 * scale, 6 * scale, 0, Math.PI * 2); ctx.fill();

        const headX = cx - 7 * scale;
        const headY = wheelY - 205 * scale;
        ctx.fillStyle = '#fbf8e8';
        ctx.strokeStyle = '#ded7bd';
        ctx.lineWidth = 2 * scale;
        ctx.beginPath(); ctx.ellipse(headX, headY, 34 * scale, 40 * scale, -.12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#f6b856';
        ctx.beginPath();
        ctx.moveTo(headX + 22 * scale, headY - 5 * scale);
        ctx.quadraticCurveTo(headX + 81 * scale, headY + 1 * scale, headX + 91 * scale, headY + 13 * scale);
        ctx.quadraticCurveTo(headX + 54 * scale, headY + 27 * scale, headX + 18 * scale, headY + 17 * scale);
        ctx.quadraticCurveTo(headX + 13 * scale, headY + 6 * scale, headX + 22 * scale, headY - 5 * scale);
        ctx.fill();
        ctx.strokeStyle = '#d9953c'; ctx.lineWidth = 1.5 * scale; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(headX + 25 * scale, headY + 7 * scale); ctx.quadraticCurveTo(headX + 63 * scale, headY + 10 * scale, headX + 88 * scale, headY + 13 * scale); ctx.stroke();

        ctx.fillStyle = '#20333b';
        ctx.beginPath(); ctx.arc(headX + 11 * scale, headY - 10 * scale, 3.5 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(headX + 12 * scale, headY - 11 * scale, 1.2 * scale, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#d95144';
        ctx.beginPath();
        ctx.arc(headX - 5 * scale, headY - 29 * scale, 28 * scale, Math.PI, 0);
        ctx.lineTo(headX + 25 * scale, headY - 21 * scale);
        ctx.lineTo(headX - 33 * scale, headY - 21 * scale);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#b93d35';
        ctx.fillRect(headX - 34 * scale, headY - 24 * scale, 62 * scale, 6 * scale);
        ctx.fillStyle = '#f1c04f';
        ctx.beginPath(); ctx.arc(headX - 5 * scale, headY - 31 * scale, 4 * scale, 0, Math.PI * 2); ctx.fill();

        if (rainyAmount > .15) {
          ctx.save();
          ctx.globalAlpha = clamp(rainyAmount, 0, 1);
          ctx.fillStyle = '#f1c84e';
          ctx.beginPath();
          ctx.moveTo(bodyX - 47 * scale, bodyY - 12 * scale);
          ctx.quadraticCurveTo(bodyX, bodyY - 43 * scale, bodyX + 45 * scale, bodyY - 7 * scale);
          ctx.lineTo(bodyX + 37 * scale, bodyY + 28 * scale);
          ctx.quadraticCurveTo(bodyX, bodyY + 11 * scale, bodyX - 42 * scale, bodyY + 26 * scale);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#dcac35'; ctx.lineWidth = 2 * scale; ctx.stroke();
          ctx.restore();
        }

        ctx.restore();
        ctx.restore();
      }

      function drawRain(dt, amount) {
        if (amount <= .01) return;
        ctx.save();
        ctx.globalAlpha = amount;
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#d6eff9';
        ctx.lineCap = 'round';
        for (const drop of raindrops) {
          drop.y += drop.speed * dt;
          drop.x -= drop.speed * dt * .19;
          if (drop.y > height + 30 || drop.x < -30) {
            drop.y = -30;
            drop.x = random() * width + width * .12;
          }
          ctx.globalAlpha = amount * drop.alpha;
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - drop.len * .22, drop.y + drop.len);
          ctx.stroke();
        }
        ctx.restore();
      }

      function draw(now) {
        const dt = clamp((now - lastTime) / 1000, 0, .04);
        lastTime = now;
        updateWeather(now);
        if (!reduceMotion) travel += dt * 82;

        const blend = ease(clamp((now - transitionStart) / 900, 0, 1));
        const current = weather[weatherIndex];
        const old = weather[previousIndex];
        const rainCurrent = weatherIndex === 2 ? blend : previousIndex === 2 ? 1 - blend : 0;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        drawSky(current, old, blend, now);
        drawDistantLandscape(current, old, blend);
        drawRoad();
        drawForegroundPlants();
        drawBikeAndPelican(now, rainCurrent);
        drawRain(dt, rainCurrent);

        requestAnimationFrame(draw);
      }

      addEventListener('resize', resize, { passive: true });
      addEventListener('orientationchange', () => setTimeout(resize, 120), { passive: true });
      resize();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
