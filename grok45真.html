<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕自行车骑行</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    overflow: hidden;
    background: #87CEEB;
    transition: background 1s ease;
}
canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

let weather = 'sunny'; // sunny, cloudy, rainy
let weatherIndex = 0;
const weathers = ['sunny', 'cloudy', 'rainy'];
let lastWeatherChange = Date.now();

// 鹈鹕参数
let pelican = {
    x: width * 0.25,
    y: height * 0.55,
    speed: 2.8,
    wingAngle: 0,
    legAngle: 0,
    pedalAngle: 0
};

// 雨滴
let raindrops = [];

// 云朵
let clouds = [
    {x: 150, y: 120, size: 70},
    {x: 400, y: 90, size: 55},
    {x: 700, y: 140, size: 65}
];

// 自行车相关
let bikeOffset = 0;

function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    
    // 重新定位鹈鹕
    pelican.x = width * 0.25;
    pelican.y = height * 0.55;
}

window.addEventListener('resize', resizeCanvas);

function drawSky() {
    let grad;
    if (weather === 'sunny') {
        grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#87CEEB');
        grad.addColorStop(1, '#E0F7FA');
    } else if (weather === 'cloudy') {
        grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#7E9CBD');
        grad.addColorStop(1, '#B0C4DE');
    } else {
        grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#5A7BA5');
        grad.addColorStop(1, '#6B8E9B');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
}

function drawSun() {
    if (weather !== 'sunny') return;
    
    ctx.save();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(width * 0.75, height * 0.18, 45, 0, Math.PI * 2);
    ctx.fill();
    
    // 光芒
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) {
        const angle = (i * 30) * Math.PI / 180;
        const x1 = width * 0.75 + Math.cos(angle) * 55;
        const y1 = height * 0.18 + Math.sin(angle) * 55;
        const x2 = width * 0.75 + Math.cos(angle) * 70;
        const y2 = height * 0.18 + Math.sin(angle) * 70;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }
    ctx.restore();
}

function drawCloud(x, y, size) {
    ctx.save();
    ctx.fillStyle = weather === 'sunny' ? '#FFFFFF' : '#D8D8D8';
    
    ctx.beginPath();
    ctx.arc(x, y, size * 0.6, 0, Math.PI * 2);
    ctx.arc(x + size * 0.5, y - size * 0.2, size * 0.7, 0, Math.PI * 2);
    ctx.arc(x + size * 1.1, y, size * 0.6, 0, Math.PI * 2);
    ctx.arc(x + size * 0.55, y + size * 0.35, size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawClouds() {
    clouds.forEach(cloud => {
        let offsetX = Math.sin(Date.now() / 4000) * 12;
        drawCloud(cloud.x + offsetX, cloud.y, cloud.size);
    });
}

function createRaindrop() {
    return {
        x: Math.random() * width,
        y: Math.random() * height * 0.7,
        length: 12 + Math.random() * 10,
        speed: 6 + Math.random() * 4
    };
}

function updateRain() {
    if (weather !== 'rainy') {
        raindrops = [];
        return;
    }
    
    if (raindrops.length < 180) {
        raindrops.push(createRaindrop());
    }
    
    for (let i = 0; i < raindrops.length; i++) {
        raindrops[i].y += raindrops[i].speed;
        if (raindrops[i].y > height) {
            raindrops[i].y = Math.random() * height * 0.3;
            raindrops[i].x = Math.random() * width;
        }
    }
}

function drawRain() {
    if (weather !== 'rainy') return;
    
    ctx.strokeStyle = 'rgba(180, 200, 220, 0.65)';
    ctx.lineWidth = 1.5;
    
    raindrops.forEach(drop => {
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x, drop.y + drop.length);
        ctx.stroke();
    });
}

function drawPelican(x, y, wingAngle, legAngle, pedalAngle) {
    ctx.save();
    ctx.translate(x, y);
    
    // 身体（白色）
    ctx.fillStyle = '#F8F8FF';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    
    // 身体
    ctx.beginPath();
    ctx.ellipse(0, 10, 42, 28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    
    // 脖子
    ctx.fillStyle = '#F8F8FF';
    ctx.beginPath();
    ctx.ellipse(25, -18, 14, 22, Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    
    // 头
    ctx.beginPath();
    ctx.arc(42, -32, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    
    // 嘴（大嘴袋）
    ctx.fillStyle = '#FFCC80';
    ctx.strokeStyle = '#D2691E';
    ctx.beginPath();
    ctx.moveTo(52, -32);
    ctx.quadraticCurveTo(85, -25, 72, -10);
    ctx.quadraticCurveTo(52, -20, 52, -32);
    ctx.fill();
    ctx.stroke();
    
    // 眼睛
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(48, -35, 4, 0, Math.PI * 2);
    ctx.fill();
    
    // 翅膀
    ctx.fillStyle = '#F0F0F0';
    ctx.strokeStyle = '#333';
    ctx.save();
    ctx.translate(-5, 8);
    ctx.rotate(wingAngle);
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 14, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    
    // 尾巴
    ctx.fillStyle = '#E8E8E8';
    ctx.beginPath();
    ctx.moveTo(-42, 10);
    ctx.lineTo(-58, -2);
    ctx.lineTo(-55, 20);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // 腿（左）
    ctx.strokeStyle = '#FFCC80';
    ctx.lineWidth = 5;
    ctx.save();
    ctx.translate(-10, 32);
    ctx.rotate(legAngle - 0.2);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 32);
    ctx.stroke();
    ctx.restore();
    
    // 腿（右）
    ctx.save();
    ctx.translate(15, 32);
    ctx.rotate(legAngle + 0.2);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 32);
    ctx.stroke();
    ctx.restore();
    
    ctx.restore();
}

function drawBicycle(x, y, pedalAngle) {
    ctx.save();
    ctx.translate(x, y);
    
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    
    // 前轮
    ctx.beginPath();
    ctx.arc(50, 35, 22, 0, Math.PI * 2);
    ctx.stroke();
    
    // 后轮
    ctx.beginPath();
    ctx.arc(-40, 35, 22, 0, Math.PI * 2);
    ctx.stroke();
    
    // 轮毂
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(50, 35, 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-40, 35, 8, 0, Math.PI * 2);
    ctx.stroke();
    
    // 车架
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-40, 35);
    ctx.lineTo(-5, 10);
    ctx.lineTo(30, 35);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(-5, 10);
    ctx.lineTo(50, 35);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(-5, 10);
    ctx.lineTo(-5, 35);
    ctx.stroke();
    
    // 踏板
    ctx.save();
    ctx.translate(-5, 35);
    ctx.rotate(pedalAngle);
    ctx.fillStyle = '#222';
    ctx.fillRect(-6, -3, 12, 6);
    ctx.restore();
    
    // 车把
    ctx.beginPath();
    ctx.moveTo(50, 35);
    ctx.lineTo(65, 5);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(65, 5);
    ctx.lineTo(75, 2);
    ctx.stroke();
    
    ctx.restore();
}

function drawGround() {
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, height * 0.65, width, height * 0.35);
    
    // 草地
    ctx.fillStyle = '#6B8E23';
    ctx.fillRect(0, height * 0.62, width, height * 0.08);
    
    // 路
    ctx.fillStyle = '#555';
    ctx.fillRect(0, height * 0.72, width, height * 0.05);
    
    // 路边线
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 3;
    ctx.setLineDash([40, 30]);
    ctx.beginPath();
    ctx.moveTo(0, height * 0.745);
    ctx.lineTo(width, height * 0.745);
    ctx.stroke();
    ctx.setLineDash([]);
}

function updatePelican() {
    // 移动
    pelican.x += pelican.speed;
    if (pelican.x > width + 80) {
        pelican.x = -100;
    }
    
    // 翅膀扇动
    pelican.wingAngle = Math.sin(Date.now() / 180) * 0.6;
    
    // 腿部晃动
    pelican.legAngle = Math.sin(Date.now() / 240) * 0.35;
    
    // 踏板
    pelican.pedalAngle = Date.now() / 180;
}

function updateWeather() {
    const now = Date.now();
    if (now - lastWeatherChange > 5000) {
        weatherIndex = (weatherIndex + 1) % weathers.length;
        weather = weathers[weatherIndex];
        lastWeatherChange = now;
        
        // 切换天气时重置雨滴
        if (weather === 'rainy') {
            raindrops = [];
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    
    // 更新
    updateWeather();
    updatePelican();
    updateRain();
    
    // 绘制顺序
    drawSky();
    drawSun();
    drawClouds();
    drawGround();
    
    // 自行车 + 鹈鹕
    const bikeX = pelican.x + 30;
    const bikeY = pelican.y + 45;
    
    drawBicycle(bikeX, bikeY, pelican.pedalAngle);
    drawPelican(pelican.x, pelican.y, pelican.wingAngle, pelican.legAngle, pelican.pedalAngle);
    
    drawRain();
    
    // 地面草
    ctx.fillStyle = '#556B2F';
    for (let i = 0; i < width; i += 35) {
        ctx.beginPath();
        ctx.moveTo(i, height * 0.62);
        ctx.lineTo(i + 6, height * 0.58);
        ctx.lineTo(i + 12, height * 0.62);
        ctx.fill();
    }
    
    requestAnimationFrame(draw);
}

// 初始化雨滴
for (let i = 0; i < 80; i++) {
    raindrops.push(createRaindrop());
}

// 初始云朵位置
clouds = [
    {x: width * 0.15, y: 90, size: 65},
    {x: width * 0.45, y: 70, size: 50},
    {x: width * 0.72, y: 110, size: 60}
];

draw();
</script>

</body>
</html>
