<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6fbcf0">
<title>鹈鹕骑行 · 天气循环</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#6fbcf0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---------- 天气过渡 ---------- */
.sky,.sun-g,.set-fair,.set-gray,.set-storm,#rain,#splashes{transition:opacity 1.8s ease}
.sky-c,.sky-r{opacity:0}
body.cloudy .sky-c,body.rainy .sky-c{opacity:1}
body.rainy .sky-r{opacity:1}
body.cloudy .sun-g,body.rainy .sun-g{opacity:0}
.set-gray,.set-storm{opacity:0}
body.cloudy .set-fair{opacity:.15}
body.cloudy .set-gray{opacity:1}
body.cloudy .set-storm{opacity:.25}
body.rainy .set-fair{opacity:0}
body.rainy .set-gray{opacity:.3}
body.rainy .set-storm{opacity:1}
#rain,#splashes{opacity:0;transition-duration:1.2s}
body.rainy #rain,body.rainy #splashes{opacity:1}
#land{transition:filter 1.8s ease}
body.cloudy #land{filter:saturate(.75) brightness(.93)}
body.rainy #land{filter:saturate(.55) brightness(.75)}
#flash{opacity:0;pointer-events:none}
#flash.on{animation:flash 1.6s ease-out}
@keyframes flash{0%,100%{opacity:0}5%{opacity:.45}11%{opacity:.05}18%{opacity:.3}30%{opacity:0}}

/* ---------- 滚动与落体 ---------- */
.lane{animation:laneMove .45s linear infinite}
@keyframes laneMove{to{stroke-dashoffset:72}}
.drop{stroke:#cfe4f2;stroke-width:2.4;stroke-linecap:round;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(1400px)}}
.splash{fill:none;stroke:#e6f0f6;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:splash 1s linear infinite}
@keyframes splash{0%{transform:scale(.2);opacity:.9}70%{opacity:.35}100%{transform:scale(1);opacity:0}}

/* ---------- HUD ---------- */
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;align-items:center;gap:9px;
  padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 4px 18px rgba(20,40,60,.14);color:#17324a;font-size:14px;font-weight:600;letter-spacing:.5px;
  cursor:pointer;user-select:none;touch-action:manipulation;transition:transform .15s}
#hud:active{transform:scale(.93)}
#bar{width:56px;height:4px;border-radius:4px;background:rgba(23,50,74,.16);overflow:hidden}
#barFill{display:block;height:100%;width:0;border-radius:4px;background:#17324a;opacity:.7}
#barFill.run{animation:fillbar 5s linear forwards}
@keyframes fillbar{from{width:0}to{width:100%}}
#caption{position:fixed;left:14px;bottom:max(12px,env(safe-area-inset-bottom));font-size:12px;
  color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(0,40,20,.35);letter-spacing:1px;pointer-events:none}
</style>
</head>
<body class="sunny">

<svg id="scene" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gSunny" gradientUnits="userSpaceOnUse" x1="0" y1="-380" x2="0" y2="470">
    <stop offset="0" stop-color="#6fbcf0"/><stop offset=".65" stop-color="#aadcf7"/><stop offset="1" stop-color="#eaf7ff"/>
  </linearGradient>
  <linearGradient id="gCloudy" gradientUnits="userSpaceOnUse" x1="0" y1="-380" x2="0" y2="470">
    <stop offset="0" stop-color="#8ea3b2"/><stop offset=".65" stop-color="#bcc8d0"/><stop offset="1" stop-color="#dde3e7"/>

<!-- 天空：三层渐变交叉淡化 -->
<rect class="sky" x="-800" y="-420" width="1600" height="900" fill="url(#gSunny)"/>

<g class="set-fair">

</g>
<g class="set-gray">
  <g><animateTransform attributeName="transform" type="translate" from="1060 54" to="-1060 54" dur="78s" begin="-20s" repeatCount="indefinite"/><use href="#cloud" fill="#c2ccd4" transform="scale(1.5)"/></g>
  <g><animateTransform attributeName="transform" type="translate" from="1060 150" to="-1060 150" dur="60s" begin="-35s" repeatCount="indefinite"/><use href="#cloud" fill="#cdd6dc"/></g>
  <g><animateTransform attributeName="transform" type="translate" from="1060 -36" to="-1060 -36" dur="95s" begin="-60s" repeatCount="indefinite"/><use href="#cloud" fill="#b7c2cb" transform="scale(1.8)"/></g>
  <g><animateTransform attributeName="transform" type="translate" from="1060 210" to="-1060 210" dur="52s" begin="-10s" repeatCount="indefinite"/><use href="#cloud" fill="#d2dbe1" transform="scale(.7)"/></g>
</g>
<g class="set-storm">
  <g><animateTransform attributeName="transform" type="translate" from="1060 -70" to="-1060 -70" dur="100s" begin="-30s" repeatCount="indefinite"/><use href="#cloud" fill="#4d5d6a" transform="scale(2.7)"/></g>
  <g><animateTransform attributeName="transform" type="translate" from="1060 30" to="-1060 30" dur="80s" begin="-55s" repeatCount="indefinite"/><use href="#cloud" fill="#576774" transform="scale(2)"/></g>
  <g><animateTransform attributeName="transform" type="translate" from="1060 110" to="-1060 110" dur="88s" begin="-12s" repeatCount="indefinite"/><use href="#cloud" fill="#465663" transform="scale(2.3)"/></g>
  <g><animateTransform attributeName="transform" type="translate" from="1060 -160" to="-1060 -160" dur="115s" begin="-80s" repeatCount="indefinite"/><use href="#cloud" fill="#52626f" transform="scale(3)"/></g>
  <g><animateTransform attributeName="transform" type="translate" from="1060 180" to="-1060 180" dur="66s" begin="-25s" repeatCount="indefinite"/><use href="#cloud" fill="#5d6d7a" transform="scale(1.35)"/></g>
</g>

<!-- 地面场景 -->
<g id="land">
  <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="14s" repeatCount="indefinite"/>
    <use href="#hillFar" x="-1600" fill="#b7dfae"/><use href="#hillFar" x="-800" fill="#b7dfae"/><use href="#hillFar" fill="#b7dfae"/>
  </g>
  <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="6s" repeatCount="indefinite"/>
    <use href="#hillNear" x="-1800" fill="#8fcb7e"/><use href="#hillNear" x="-1200" fill="#8fcb7e"/><use href="#hillNear" x="-600" fill="#8fcb7e"/><use href="#hillNear" fill="#8fcb7e"/><use href="#hillNear" x="600" fill="#8fcb7e"/>
    <use href="#treeRow" x="-1800"/><use href="#treeRow" x="-1200"/><use href="#treeRow" x="-600"/><use href="#treeRow"/><use href="#treeRow" x="600"/>
  </g>
  <rect x="-800" y="470" width="1600" height="96" fill="#5b616d"/>
  <rect x="-800" y="470" width="1600" height="4" fill="#4a505c"/>
  <line class="lane" x1="-800" y1="518" x2="800" y2="518" stroke="#eef1f4" stroke-width="5" stroke-dasharray="42 30"/>
  <rect x="-800" y="566" width="1600" height="280" fill="#67ae5b"/>
  <rect x="-800" y="566" width="1600" height="4" fill="#559a4a"/>
  <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="2.5s" repeatCount="indefinite"/>
    <use href="#tufts" x="-1600" y="592"/><use href="#tufts" x="-1200" y="592"/><use href="#tufts" x="-800" y="592"/><use href="#tufts" x="-400" y="592"/><use href="#tufts" y="592"/><use href="#tufts" x="400" y="592"/><use href="#tufts" x="800" y="592"/>
    <g transform="translate(-200 642) scale(1.3)"><use href="#tufts" x="-1200"/><use href="#tufts" x="-800"/><use href="#tufts" x="-400"/><use href="#tufts"/><use href="#tufts" x="400"/><use href="#tufts" x="800"/></g>
  </g>
  <ellipse cx="5" cy="561" rx="150" ry="7" fill="#000" opacity=".16"/>
  <g id="splashes"></g>

  <!-- 鹈鹕 + 自行车 -->
  <path id="legFar" fill="none" stroke="#cf7f42" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="footFar"><path d="M-4,-1 Q5,-4 12,-2 L22,1 L15,4 L18,7 L10,6 L11,9 L3,7 Q-5,5 -4,-1 Z" fill="#c97a3e"/></g>

  <g><!-- 后轮 -->
    <circle cx="-95" cy="505" r="50" fill="none" stroke="#2c313a" stroke-width="8"/>
    <circle cx="-95" cy="505" r="40" fill="none" stroke="#aab3bd" stroke-width="2"/>
    <g stroke="#b9c2cb" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0 -95 505" to="360 -95 505" dur="1.96s" repeatCount="indefinite"/>
      <line x1="-95" y1="467" x2="-95" y2="543"/>
      <line x1="-95" y1="467" x2="-95" y2="543" transform="rotate(60 -95 505)"/>
      <line x1="-95" y1="467" x2="-95" y2="543" transform="rotate(120 -95 505)"/>
    </g>
    <circle cx="-95" cy="505" r="6" fill="#39404b"/>
  </g>
  <g><!-- 前轮 -->
    <circle cx="105" cy="505" r="50" fill="none" stroke="#2c313a" stroke-width="8"/>
    <circle cx="105" cy="505" r="40" fill="none" stroke="#aab3bd" stroke-width="2"/>
    <g stroke="#b9c2cb" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0 105 505" to="360 105 505" dur="1.96s" repeatCount="indefinite"/>
      <line x1="105" y1="467" x2="105" y2="543"/>
      <line x1="105" y1="467" x2="105" y2="543" transform="rotate(60 105 505)"/>
      <line x1="105" y1="467" x2="105" y2="543" transform="rotate(120 105 505)"/>
    </g>
    <circle cx="105" cy="505" r="6" fill="#39404b"/>
  </g>

  <circle cx="-95" cy="505" r="6" fill="#39404b"/>
  <line x1="3" y1="481" x2="-92" y2="499" stroke="#39404b" stroke-width="2.5"/>
  <line x1="3" y1="503" x2="-92" y2="511" stroke="#39404b" stroke-width="2.5"/>
  <circle cx="0" cy="492" r="13" fill="none" stroke="#39404b" stroke-width="3"/>

  <g stroke="#3a8f86" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M-95,505 L0,492 L-42,406 Z"/>
    <path d="M0,492 L72,424"/>
    <path d="M-42,406 L78,408"/>
    <path d="M78,408 L72,424"/>
    <path d="M72,424 L105,505" stroke-width="6"/>
  </g>
  <path d="M78,408 L84,396 M84,396 C92,391 98,393 100,401" fill="none" stroke="#2c313a" stroke-width="5" stroke-linecap="round"/>
  <line x1="-42" y1="406" x2="-44" y2="398" stroke="#2c313a" stroke-width="5"/>
  <line x1="-58" y1="397" x2="-30" y2="395" stroke="#2c313a" stroke-width="8" stroke-linecap="round"/>

  <g id="crank">
    <line x1="0" y1="492" x2="26" y2="492" stroke="#2c313a" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="492" x2="-26" y2="492" stroke="#2c313a" stroke-width="6" stroke-linecap="round"/>
    <g id="pedN"><rect x="18" y="489.5" width="16" height="5" rx="2" fill="#22262c"/></g>
    <g id="pedF"><rect x="-34" y="489.5" width="16" height="5" rx="2" fill="#22262c"/></g>
    <circle cx="0" cy="492" r="4" fill="#22262c"/>
  </g>

  <path id="legNear" fill="none" stroke="#ef9448" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="footNear"><path d="M-4,-1 Q5,-4 12,-2 L22,1 L15,4 L18,7 L10,6 L11,9 L3,7 Q-5,5 -4,-1 Z" fill="#ef9448"/></g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2.4;0 0" dur="0.55s" repeatCount="indefinite" calcMode="spline" keySplines=".5 0 .5 1;.5 0 .5 1"/>
    <path d="M-64,346 L-112,320 L-98,344 L-122,342 L-96,356 Z" fill="#e3eaee"/>
    <circle cx="-36" cy="398" r="13" fill="#f8fafb"/>
    <ellipse cx="-28" cy="342" rx="60" ry="40" fill="#f8fafb" transform="rotate(-16 -28 342)"/>
    <path d="M-70,336 C-44,314 2,316 22,342 C4,360 -42,362 -70,350 Z" fill="#dde6ea"/>
    <path d="M16,320 C42,312 50,294 62,272 C72,254 76,248 86,246" fill="none" stroke="#f8fafb" stroke-width="17" stroke-linecap="round"/>
    <circle cx="88" cy="244" r="18" fill="#f8fafb"/>
    <path d="M74,232 C66,226 64,218 70,210 C72,220 78,224 82,228 Z" fill="#f8fafb"/>
    <path d="M102,249 L170,259 C165,286 132,296 110,283 C103,277 100,263 102,249 Z" fill="#ee8b3a"/>
    <path d="M102,237 L172,254 Q176,257 171,260 L102,249 Z" fill="#f4a83e"/>
    <circle cx="91" cy="239" r="3" fill="#262b31"/><circle cx="92" cy="238" r="1" fill="#fff"/>
    <path d="M-4,326 C30,330 64,352 96,398" fill="none" stroke="#d3dee3" stroke-width="15" stroke-linecap="round"/>
    <circle cx="97" cy="399" r="7.5" fill="#d3dee3"/>
  </g>
</g>

<g id="rain"></g>
<rect id="flash" x="-800" y="-420" width="1600" height="1440" fill="#ffffff"/>
</svg>

<div id="hud"><span id="hudIcon">☀️</span><span id="hudName">晴天</span><div id="bar"><i id="barFill"></i></div></div>
<div id="caption">鹈鹕骑行 · 天气每 5 秒自动循环 · 点上方可手动切换</div>

<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('scene');

/* ---- 自适应：横屏扩宽，竖屏保最小场景宽、向上下扩展天空草地 ---- */
function fit(){
  const ar=innerWidth/innerHeight;let W,H;
  if(ar>=0.533){W=Math.min(600*ar,1560);H=600;}else{W=320;H=Math.min(320/ar,1600);}
  svg.setAttribute('viewBox',(10-W/2)+' '+((600-H)/2)+' '+W+' '+H);
}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();

/* ---- 雨滴与水花 ---- */
const rain=document.getElementById('rain');
for(let i=0;i<80;i++){
  const l=document.createElementNS(NS,'line'),x=-780+Math.random()*1560,y=-420+Math.random()*1400;
  l.setAttribute('x1',x);l.setAttribute('y1',y);l.setAttribute('x2',x-5);l.setAttribute('y2',y+24);
  l.setAttribute('class','drop');
  l.style.animationDuration=(0.75+Math.random()*0.5).toFixed(2)+'s';
  l.style.animationDelay=(-Math.random()*2).toFixed(2)+'s';
  rain.appendChild(l);
}
const spl=document.getElementById('splashes');
for(let i=0;i<16;i++){
  const e=document.createElementNS(NS,'ellipse');
  e.setAttribute('cx',(-740+Math.random()*1480).toFixed(0));
  e.setAttribute('cy',(Math.random()<0.75?480+Math.random()*80:572+Math.random()*26).toFixed(0));
  e.setAttribute('rx',9);e.setAttribute('ry',2.6);e.setAttribute('class','splash');
  e.style.animationDelay=(-Math.random()).toFixed(2)+'s';
  spl.appendChild(e);
}

/* ---- 蹬车：曲柄旋转 + 双腿双骨骼 IK ---- */
const crank=document.getElementById('crank'),pedN=document.getElementById('pedN'),pedF=document.getElementById('pedF');
const legNear=document.getElementById('legNear'),legFar=document.getElementById('legFar');
const footNear=document.getElementById('footNear'),footFar=document.getElementById('footFar');
const HIP=[-38,402],L1=62,L2=70;
function solveLeg(th,pathEl,footEl){
  const px=26*Math.cos(th),py=492+26*Math.sin(th),ax=px-1,ay=py-10;
  const dx=ax-HIP[0],dy=ay-HIP[1];let d=Math.hypot(dx,dy);
  const dc=Math.min(d,L1+L2-0.5),a=Math.atan2(dy,dx);
  const c=Math.max(-1,Math.min(1,(L1*L1+dc*dc-L2*L2)/(2*L1*dc))),k=Math.acos(c);
  const kx=HIP[0]+L1*Math.cos(a-k),ky=HIP[1]+L1*Math.sin(a-k);
  pathEl.setAttribute('d','M'+HIP[0]+','+HIP[1]+' L'+kx.toFixed(1)+','+ky.toFixed(1)+' L'+ax.toFixed(1)+','+ay.toFixed(1));
  footEl.setAttribute('transform','translate('+ax.toFixed(1)+' '+ay.toFixed(1)+')');
}
function frame(now){
  const th=now/1100*Math.PI*2,deg=(th*180/Math.PI)%360;
  crank.setAttribute('transform','rotate('+deg.toFixed(2)+' 0 492)');
  pedN.setAttribute('transform','rotate('+(-deg).toFixed(2)+' 26 492)');
  pedF.setAttribute('transform','rotate('+(-deg).toFixed(2)+' -26 492)');
  solveLeg(th,legNear,footNear);
  solveLeg(th+Math.PI,legFar,footFar);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- 天气循环：晴 -> 阴 -> 雨，每 5 秒 ---- */
const seq=[['sunny','☀️','晴天'],['cloudy','☁️','阴天'],['rainy','🌧️','雨天']];
const hud=document.getElementById('hud'),hudIcon=document.getElementById('hudIcon'),
      hudName=document.getElementById('hudName'),barFill=document.getElementById('barFill'),
      flash=document.getElementById('flash');
let idx=0,timer=null;
function apply(){
  const s=seq[idx];
  document.body.className=s[0];
  hudIcon.textContent=s[1];hudName.textContent=s[2];
  barFill.classList.remove('run');void barFill.offsetWidth;barFill.classList.add('run');
  if(s[0]==='rainy'){flash.classList.remove('on');void flash.getBoundingClientRect();flash.classList.add('on');}
}
function next(){idx=(idx+1)%3;apply();}
function restart(){clearInterval(timer);timer=setInterval(next,5000);}
hud.addEventListener('click',()=>{next();restart();});
apply();restart();
</script>
</body>
</html>
