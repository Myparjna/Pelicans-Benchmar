<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>鹈鹕骑自行车 · 体素天气场景</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#8fd0f0;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;width:100%;height:100%;}
  #hud{
    position:fixed;left:14px;top:14px;
    padding:8px 16px;border-radius:999px;
    font:600 14px/1.2 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#fff;background:rgba(20,30,45,.32);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    letter-spacing:.5px;user-select:none;pointer-events:none;
    box-shadow:0 2px 12px rgba(0,0,0,.14);
    transition:background .6s ease;
    white-space:nowrap;
  }
  @media (max-width:560px){
    #hud{font-size:12px;padding:6px 13px;left:10px;top:10px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">☀️ 晴天</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const container = document.getElementById('app');
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd0f0);
scene.fog = new THREE.Fog(0xc8e6ff, 100, 330);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 3000);

const CAM_TARGET = new THREE.Vector3(0, 14, 0);
const CAM_DIR = new THREE.Vector3(0.40, 0.22, 0.89).normalize();
const CAM_DIST = 70;

camera.position.copy(CAM_TARGET).addScaledVector(CAM_DIR, CAM_DIST);
camera.lookAt(CAM_TARGET);

/* =========================================================
   2. 灯光
   ========================================================= */
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x5e8a42, 0.85);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfff2cf, 0.95);
sunLight.position.set(60, 95, 45);
scene.add(sunLight);

/* =========================================================
   3. 体素工具
   ========================================================= */
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const _matCache = Object.create(null);

function matOf(color) {
  let m = _matCache[color];
  if (!m) {
    m = new THREE.MeshLambertMaterial({ color: color });
    _matCache[color] = m;
  }
  return m;
}

/** 放置一个体素方块 */
function V(parent, x, y, z, color, sx, sy, sz) {
  sx = sx === undefined ? 1 : sx;
  sy = sy === undefined ? 1 : sy;
  sz = sz === undefined ? 1 : sz;
  const m = new THREE.Mesh(unitBox, matOf(color));
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  parent.add(m);
  return m;
}

/** 实心椭球体（体素化） */
function ellipsoid(parent, cx, cy, cz, rx, ry, rz, color) {
  const nx = Math.ceil(rx), ny = Math.ceil(ry), nz = Math.ceil(rz);
  for (let x = -nx; x <= nx; x++) {
    for (let y = -ny; y <= ny; y++) {
      for (let z = -nz; z <= nz; z++) {
        const v = (x * x) / (rx * rx) + (y * y) / (ry * ry) + (z * z) / (rz * rz);
        if (v <= 1.0) V(parent, cx + x, cy + y, cz + z, color, 1, 1, 1);
      }
    }
  }
}

/** 两点之间铺体素 */
function tube(parent, a, b, color, t) {
  const A = new THREE.Vector3(a[0], a[1], a[2]);
  const B = new THREE.Vector3(b[0], b[1], b[2]);
  const steps = Math.max(1, Math.round(A.distanceTo(B)));
  for (let i = 0; i <= steps; i++) {
    const p = A.clone().lerp(B, i / steps);
    V(parent, p.x, p.y, p.z, color, t, t, t);
  }
}

/* =========================================================
   4. 配色
   ========================================================= */
const COL = {
  ground: 0x7ec95f,
  grassA: 0x6bbc4d,
  grassB: 0x8ed36b,
  tire:   0x2c2d33,
  rim:    0xc7ccd6,
  frame:  0xd94f3d,
  seat:   0x4a3226,
  dark:   0x353a42,
  metal:  0x9aa2ad,
  bodyW:  0xf7f4ea,
  wingW:  0xe4dfd2,
  beakO:  0xf0a33a,
  pouchO: 0xf8c96b,
  eye:    0x1c1e24,
  trunk:  0x8a5a34,
  leaf:   0x4fa845,
  leaf2:  0x5cb850,
  shadow: 0x2b4a1e
};

/* =========================================================
   5. 构建世界
   ========================================================= */
const world = new THREE.Group();
scene.add(world);

// ---------- 地面 ----------
const ground = new THREE.Mesh(new THREE.BoxGeometry(700, 6, 700), matOf(COL.ground));
ground.position.y = -3;
world.add(ground);

// 散落草丛（体素感）
(function scatterGrass() {
  const rnd = (function () { let s = 20240517; return function () { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; })();
  for (let i = 0; i < 70; i++) {
    const x = (rnd() - 0.5) * 190;
    const z = (rnd() - 0.5) * 190;
    if (Math.abs(x) < 18 && Math.abs(z) < 10) continue;
    V(world, Math.round(x), 0.45, Math.round(z),
      rnd() > 0.5 ? COL.grassA : COL.grassB, 1, 1, 1);
  }
})();

// 假阴影（骑车下方）
(function fakeShadow() {
  const sm = new THREE.MeshBasicMaterial({ color: COL.shadow, transparent: true, opacity: 0.16, depthWrite: false });
  const sh = new THREE.Mesh(new THREE.BoxGeometry(34, 0.12, 11), sm);
  sh.position.set(0, 0.08, 0);
  world.add(sh);
})();

// ---------- 树 ----------
function makeTree(x, z, h) {
  for (let i = 1; i <= h; i++) V(world, x, i, z, COL.trunk, 2, 1.05, 2);
  V(world, x, h + 2, z, COL.leaf, 8, 4, 8);
  V(world, x, h + 4.8, z, COL.leaf2, 6, 3, 6);
  V(world, x + 3.4, h + 2.8, z + 2, COL.leaf, 3.2, 3.2, 3.2);
  V(world, x - 3.4, h + 3.4, z - 2.2, COL.leaf2, 3.2, 3.2, 3.2);
  V(world, x + 0.5, h + 6.6, z - 1, COL.leaf, 3.6, 2.6, 3.6);
}
makeTree(-30, -16, 7);
makeTree(30, -26, 9);
makeTree(-52, 14, 6);

// ---------- 云 ----------
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
const cloudGroups = [];

function makeCloud(x, y, z, s) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.userData.phase = Math.random() * Math.PI * 2;
  const parts = [
    [0, 0, 0, 9, 3, 6.5],
    [5.5, 0.9, 0.5, 6.5, 2.6, 5],
    [-5.5, 0.7, -0.6, 6.5, 2.4, 5],
    [1, 2, 0.5, 5.5, 2.6, 4.5]
  ];
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    const m = new THREE.Mesh(unitBox, cloudMat);
    m.position.set(p[0] * s, p[1] * s, p[2] * s);
    m.scale.set(p[3] * s, p[4] * s, p[5] * s);
    g.add(m);
  }
  world.add(g);
  cloudGroups.push(g);
  return g;
}

makeCloud(-53, 30, -44, 1.0);
makeCloud(1, 30, -70, 1.25);
makeCloud(-60, 32, -30, 0.9);
makeCloud(20, 30, -90, 1.1);

// ---------- 太阳 ----------
const sunCoreMat = new THREE.MeshBasicMaterial({ color: 0xffe066, fog: false, transparent: true, opacity: 1 });
const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xfff3b8, fog: false, transparent: true, opacity: 0.32 });

const sunGroup = new THREE.Group();
sunGroup.position.set(-46, 21, -102);
(function buildSun() {
  const core = new THREE.Mesh(unitBox, sunCoreMat);
  core.scale.set(13, 13, 13);
  sunGroup.add(core);
  const g1 = new THREE.Mesh(unitBox, sunGlowMat);
  g1.scale.set(20, 20, 20);
  sunGroup.add(g1);
  const g2 = new THREE.Mesh(unitBox, sunGlowMat);
  g2.scale.set(28, 28, 28);
  g2.material = sunGlowMat;
  sunGroup.add(g2);
})();
world.add(sunGroup);

/* =========================================================
   6. 自行车
   ========================================================= */
const bike = new THREE.Group();
world.add(bike);

const WHEEL_R = 6;

function makeWheel(cx, cy) {
  const g = new THREE.Group();
  g.position.set(cx, cy, 0);
  bike.add(g);

  // 外胎（体素圆环）
  for (let x = -WHEEL_R; x <= WHEEL_R; x++) {
    for (let y = -WHEEL_R; y <= WHEEL_R; y++) {
      const d = Math.sqrt(x * x + y * y);
      if (d <= WHEEL_R && d >= WHEEL_R - 1.35) {
        V(g, x, y, 0, COL.tire, 1.06, 1.06, 1.5);
      }
    }
  }
  // 轮毂
  V(g, 0, 0, 0, COL.rim, 2.4, 2.4, 1.9);

  // 辐条
  for (let a = 0; a < 4; a++) {
    const ang = a * Math.PI / 2 + Math.PI / 4;
    for (let r = 1.9; r < WHEEL_R - 1.6; r += 1.35) {
      V(g, Math.cos(ang) * r, Math.sin(ang) * r, 0, COL.rim, 0.85, 0.85, 1.1);
    }
  }
  return g;
}

const rearWheel = makeWheel(-8, WHEEL_R);
const frontWheel = makeWheel(8, WHEEL_R);

// 车架节点
const REAR_HUB  = [-8, 6, 0];
const FRONT_HUB = [8, 6, 0];
const BB        = [-2, 7, 0];
const SEAT_TOP  = [-6, 13, 0];
const HEAD_BOT  = [5, 11, 0];
const HEAD_TOP  = [6, 14, 0];

tube(bike, REAR_HUB, BB,        COL.frame, 1.35); // 后下叉
tube(bike, REAR_HUB, SEAT_TOP,  COL.frame, 1.15); // 后上叉
tube(bike, BB,       SEAT_TOP,  COL.frame, 1.25); // 立管
tube(bike, BB,       HEAD_BOT,  COL.frame, 1.25); // 下管
tube(bike, SEAT_TOP, HEAD_TOP,  COL.frame, 1.15); // 上管
tube(bike, HEAD_BOT, HEAD_TOP,  COL.frame, 1.35); // 头管
tube(bike, HEAD_BOT, FRONT_HUB, COL.frame, 1.15); // 前叉

// 车把
tube(bike, HEAD_TOP, [6, 16, 0], COL.dark, 1.15);
tube(bike, [6, 16, -4.6], [6, 16, 4.6], COL.dark, 1.05);
V(bike, 6, 16, 5.1, 0x22252b, 1.6, 1.6, 1.6);
V(bike, 6, 16, -5.1, 0x22252b, 1.6, 1.6, 1.6);

// 坐垫
V(bike, -6, 14.5, 0, COL.seat, 4.2, 1.1, 3.3);
V(bike, -8.1, 14.5, 0, COL.seat, 1.6, 0.9, 2.4);

// 曲柄组（会旋转）
const crank = new THREE.Group();
crank.position.set(-2, 7, 0);
bike.add(crank);

V(crank, 0, 0, 0, COL.metal, 3.6, 3.6, 0.85);        // 牙盘
V(crank, 0, 1.5, 1.7, COL.dark, 0.95, 3.2, 0.95);    // 右曲柄
V(crank, 0, -1.5, -1.7, COL.dark, 0.95, 3.2, 0.95);  // 左曲柄
V(crank, 0, 3.05, 1.9, 0x1c1c20, 2.7, 0.7, 1.7);     // 右踏板
V(crank, 0, -3.05, -1.9, 0x1c1c20, 2.7, 0.7, 1.7);   // 左踏板

/* =========================================================
   7. 鹈鹕
   ========================================================= */
const pelican = new THREE.Group();
world.add(pelican);

// —— 身体
ellipsoid(pelican, -6, 18, 0, 3.6, 2.8, 2.4, COL.bodyW);

// —— 尾巴
V(pelican, -9.6, 19.4, 0, COL.wingW, 2.6, 1.9, 2.1);
V(pelican, -11.6, 20.4, 0, COL.wingW, 2.3, 1.7, 1.7);

// —— 脖子
tube(pelican, [-4.4, 20.0, 0], [0.6, 25.0, 0], COL.bodyW, 2.1);

// —— 头
ellipsoid(pelican, 1.5, 26.5, 0, 2.05, 2.0, 1.8, COL.bodyW);

// —— 上喙
(function buildBeak() {
  for (let i = 0; i < 8; i++) {
    const x = 3.4 + i * 0.95;
    const y = 26.3 - i * 0.14;
    const h = 1.5 - i * 0.07;
    const w = 2.0 - i * 0.13;
    V(pelican, x, y, 0, COL.beakO, 1.0, h, w);
  }
  // 喙尖一点深色
  V(pelican, 11.0, 25.1, 0, 0xd98c2a, 1.0, 0.9, 1.0);
})();

// —— 喉囊
(function buildPouch() {
  const depths = [1, 2, 3, 3, 2, 2, 1];
  for (let i = 0; i < depths.length; i++) {
    const x = 3.6 + i * 0.95;
    const top = 25.4 - i * 0.1;
    const w = 1.9 - i * 0.13;
    for (let j = 0; j < depths[i]; j++) {
      V(pelican, x, top - j, 0, COL.pouchO, 1.0, 1.0, w);
    }
  }
})();

// —— 眼睛
V(pelican, 2.5, 27.3, 1.30, COL.eye, 1.0, 1.0, 1.0);
V(pelican, 2.5, 27.3, -1.30, COL.eye, 1.0, 1.0, 1.0);
// 眼白高光
V(pelican, 2.75, 27.55, 1.75, 0xffffff, 0.42, 0.42, 0.42);
V(pelican, 2.75, 27.55, -1.75, 0xffffff, 0.42, 0.42, 0.42);

// —— 翅膀（向后展开）
(function buildWings() {
  const pts = [[0, 0], [-1, -0.6], [-2, -1.2], [-3, -1.85], [-4, -2.5]];
  for (let i = 0; i < pts.length; i++) {
    const x = -5 + pts[i][0];
    const y = 20.4 + pts[i][1];
    const zoff = 2.3 + i * 0.6;
    V(pelican, x, y, zoff, COL.wingW, 2.5, 2.5, 1.5);
    V(pelican, x, y, -zoff, COL.wingW, 2.5, 2.5, 1.5);
  }
  // 翅尖
  V(pelican, -9.2, 17.6, 5.6, 0xd8d2c2, 2.0, 2.0, 1.4);
  V(pelican, -9.2, 17.6, -5.6, 0xd8d2c2, 2.0, 2.0, 1.4);
})();

// —— 腿（橙色）
tube(pelican, [-6, 15.6, 1.3], [-3.1, 8.6, 1.7], COL.beakO, 1.35);
tube(pelican, [-6, 15.6, -1.3], [-3.1, 8.6, -1.7], COL.beakO, 1.35);

/* =========================================================
   8. 雨
   ========================================================= */
const RAIN_COUNT = 1300;
const RAIN_TOP = 72;

const rainPositions = new Float32Array(RAIN_COUNT * 3);
const rainSpeeds = new Float32Array(RAIN_COUNT);

for (let i = 0; i < RAIN_COUNT; i++) {
  rainPositions[i * 3]     = (Math.random() - 0.5) * 170;
  rainPositions[i * 3 + 1] = Math.random() * RAIN_TOP;
  rainPositions[i * 3 + 2] = (Math.random() - 0.5) * 170;
  rainSpeeds[i] = 34 + Math.random() * 26;
}

const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));

const rainMat = new THREE.PointsMaterial({
  color: 0xc4dcf7,
  size: 1.0,
  transparent: true,
  opacity: 0,
  depthWrite: false,
  sizeAttenuation: true
});

const rainPoints = new THREE.Points(rainGeo, rainMat);
rainPoints.frustumCulled = false;
rainPoints.visible = false;
world.add(rainPoints);

/* =========================================================
   9. 天气系统
   ========================================================= */
const WEATHERS = [
  {
    label: '☀️ 晴天',
    sky: 0x8fd0f0, fog: 0xc8e6ff,
    hemiCol: 0xffffff, hemiI: 0.85,
    sunCol: 0xfff2cf, sunI: 0.95, sunVis: 1,
    cloudCol: 0xffffff, rain: 0
  },
  {
    label: '☁️ 阴天',
    sky: 0xa9b8c6, fog: 0xbcc8d4,
    hemiCol: 0xdde6ee, hemiI: 1.0,
    sunCol: 0xe6edf4, sunI: 0.25, sunVis: 0.15,
    cloudCol: 0xd0d8e0, rain: 0
  },
  {
    label: '🌧️ 雨天',
    sky: 0x6f7d8d, fog: 0x7f8c9b,
    hemiCol: 0xb6c5d6, hemiI: 0.78,
    sunCol: 0xc8d4e2, sunI: 0.10, sunVis: 0,
    cloudCol: 0x9aa6b4, rain: 1
  }
];

const WEATHER_INTERVAL = 5; // 秒

let weatherIdx = 0;
let weatherTimer = 0;

const cur = {
  sky: new THREE.Color(WEATHERS[0].sky),
  fog: new THREE.Color(WEATHERS[0].fog),
  hemiCol: new THREE.Color(WEATHERS[0].hemiCol),
  sunCol: new THREE.Color(WEATHERS[0].sunCol),
  cloudCol: new THREE.Color(WEATHERS[0].cloudCol),
  hemiI: WEATHERS[0].hemiI,
  sunI: WEATHERS[0].sunI,
  sunVis: WEATHERS[0].sunVis,
  rain: WEATHERS[0].rain
};

const _tmpColor = new THREE.Color();

function setWeather(idx) {
  weatherIdx = ((idx % WEATHERS.length) + WEATHERS.length) % WEATHERS.length;
  hud.textContent = WEATHERS[weatherIdx].label;
}
setWeather(0);

function updateWeather(dt) {
  weatherTimer += dt;
  if (weatherTimer >= WEATHER_INTERVAL) {
    weatherTimer -= WEATHER_INTERVAL;
    setWeather(weatherIdx + 1);
  }

  const w = WEATHERS[weatherIdx];
  const k = Math.min(1, dt * 2.2);

  cur.sky.lerp(_tmpColor.set(w.sky), k);
  cur.fog.lerp(_tmpColor.set(w.fog), k);
  cur.hemiCol.lerp(_tmpColor.set(w.hemiCol), k);
  cur.sunCol.lerp(_tmpColor.set(w.sunCol), k);
  cur.cloudCol.lerp(_tmpColor.set(w.cloudCol), k);

  cur.hemiI += (w.hemiI - cur.hemiI) * k;
  cur.sunI += (w.sunI - cur.sunI) * k;
  cur.sunVis += (w.sunVis - cur.sunVis) * k;
  cur.rain += (w.rain - cur.rain) * k;

  // 应用到场景
  scene.background.copy(cur.sky);
  scene.fog.color.copy(cur.fog);

  hemiLight.intensity = cur.hemiI;
  hemiLight.color.copy(cur.hemiCol);

  sunLight.intensity = cur.sunI;
  sunLight.color.copy(cur.sunCol);

  cloudMat.color.copy(cur.cloudCol);

  // 太阳可见度
  const sv = Math.max(0, Math.min(1, cur.sunVis));
  sunCoreMat.opacity = sv;
  sunGlowMat.opacity = sv * 0.32;
  sunGroup.visible = sv > 0.01;

  // 雨
  rainMat.opacity = cur.rain * 0.72;
  rainPoints.visible = cur.rain > 0.02;
}

/* =========================================================
   10. 相机自适应（横屏 / 竖屏）
   ========================================================= */
function fitCamera() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / h;

  const NEED_H = 36;  // 需要覆盖的竖直范围
  const NEED_W = 34;  // 需要覆盖的水平范围
  const d = CAM_DIST;

  const tH = NEED_H / (2 * d);
  const tW = NEED_W / (2 * d * aspect);
  const t = Math.max(tH, tW);

  camera.fov = 2 * Math.atan(t) * 180 / Math.PI;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(w, h);
  fitCamera();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function () {
  setTimeout(onResize, 120);
});

fitCamera();

/* =========================================================
   11. 动画循环
   ========================================================= */
let lastTime = performance.now();
let clock = 0;

function animate(now) {
  requestAnimationFrame(animate);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!isFinite(dt)) dt = 0.016;
  dt = Math.min(dt, 0.05);
  clock += dt;

  // 天气
  updateWeather(dt);

  // 车轮旋转
  const wheelSpeed = 3.4;
  rearWheel.rotation.z -= wheelSpeed * dt;
  frontWheel.rotation.z -= wheelSpeed * dt;

  // 曲柄旋转
  crank.rotation.z -= 2.2 * dt;

  // 鹈鹕轻微起伏（蹬车感）
  pelican.position.y = Math.sin(clock * 3.2) * 0.32;
  pelican.rotation.z = Math.sin(clock * 3.2) * 0.012;

  // 整车轻微摇摆
  bike.rotation.z = Math.sin(clock * 1.6) * 0.006;

  // 云漂移
  for (let i = 0; i < cloudGroups.length; i++) {
    const g = cloudGroups[i];
    g.position.x += dt * 0.9;
    if (g.position.x > 130) g.position.x = -130;
    g.position.y += Math.sin(clock * 0.5 + g.userData.phase) * dt * 0.25;
  }

  // 雨滴
  if (cur.rain > 0.02) {
    const arr = rainGeo.attributes.position.array;
    const strength = cur.rain;
    for (let i = 0; i < RAIN_COUNT; i++) {
      const idx = i * 3 + 1;
      arr[idx] -= rainSpeeds[i] * dt * (0.35 + strength * 0.65);
      if (arr[idx] < 0) {
        arr[idx] = RAIN_TOP;
        arr[i * 3]     = (Math.random() - 0.5) * 170;
        arr[i * 3 + 2] = (Math.random() - 0.5) * 170;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

})();
</script>
