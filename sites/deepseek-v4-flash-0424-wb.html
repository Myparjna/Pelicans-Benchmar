<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6db3f2">
<title>鹈鹕骑行 · 天气动画</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { overflow:hidden; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#6db3f2; }

  #scene { position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; }

  /* ---------- 天空 ---------- */
  .sky-layer { position:absolute; inset:0; opacity:0; transition: opacity 1.2s ease; }
  .sky-sunny  { background:linear-gradient(180deg,#5aa7f0 0%, #a9d9ff 52%, #e8f7ff 100%); }
  .sky-cloudy { background:linear-gradient(180deg,#9fb2c2 0%, #c7d3dd 55%, #e9eef3 100%); }
  .sky-rainy  { background:linear-gradient(180deg,#7c92a7 0%, #a9bdcc 58%, #d2dde5 100%); }
  #scene.weather-sunny  .sky-sunny  { opacity:1; }
  #scene.weather-cloudy .sky-cloudy { opacity:1; }
  #scene.weather-rainy  .sky-rainy  { opacity:1; }

  /* ---------- 太阳 ---------- */
  .sun { position:absolute; top:7%; right:9%; width:min(16vw,120px); height:min(16vw,120px); border-radius:50%;
         background:radial-gradient(circle at 38% 35%, #fff7c9, #ffd94d 60%, #ffb92e);
         box-shadow:0 0 50px 14px rgba(255,209,77,.5);
         opacity:0; transform:scale(.6); transition: opacity 1s, transform 1s; }
  #scene.weather-sunny .sun { opacity:1; transform:scale(1); }
  .sun::after { content:""; position:absolute; inset:-32%;
                background:repeating-conic-gradient(rgba(255,220,110,.85) 0deg 10deg, transparent 10deg 22deg);
                -webkit-mask:radial-gradient(circle, transparent 58%, #000 64%);
                        mask:radial-gradient(circle, transparent 58%, #000 64%);
                animation: spin 22s linear infinite; }

  /* ---------- 云 ---------- */
  .cloud { position:absolute; left:-38vw; width:150px; height:52px; border-radius:52px;
           background:var(--cloud-c); opacity:var(--cloud-o);
           filter:drop-shadow(0 8px 12px rgba(20,35,55,.10));
           transition: background-color 1s ease, opacity 1s ease;
           animation: cloud-drift linear infinite; }
  .cloud::before, .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
  .cloud::before { width:66px; height:66px; top:-36px; left:20px; }
  .cloud::after  { width:46px; height:46px; top:-24px; right:18px; }
  #scene { --cloud-c: rgba(255,255,255,.92); --cloud-o:.8; }
  #scene.weather-cloudy { --cloud-c:#9aa8b6; --cloud-o:.96; }
  #scene.weather-rainy  { --cloud-c:#6e7d8f; --cloud-o:.98; }
  .c1 { top:10%; animation-duration:34s; animation-delay:-8s; }
  .c2 { top:20%; transform:scale(.62); animation-duration:48s; animation-delay:-26s; }
  .c3 { top:30%; transform:scale(.46); animation-duration:60s; animation-delay:-14s; }
  .c4 { top:5%;  transform:scale(1.12); animation-duration:40s; animation-delay:-33s; }
  @keyframes cloud-drift { from{ left:-38vw; } to{ left:138vw; } }

  /* ---------- 远山 ---------- */
  .hills { position:absolute; left:0; right:0; bottom:15vh; height:20vh; }
  .hills::before, .hills::after { content:""; position:absolute; bottom:0;
                                  border-radius:50% 50% 0 0 / 100% 100% 0 0; transition: filter 1s ease; }
  .hills::before { left:-10vw; width:64vw; height:19vh; background:linear-gradient(#8fd07d, #5fa967); }
  .hills::after  { right:-8vw; width:58vw; height:14vh; background:linear-gradient(#7cc56d, #559d5e); }
  #scene.weather-cloudy .hills::before, #scene.weather-cloudy .hills::after { filter:brightness(.9) saturate(.85); }
  #scene.weather-rainy  .hills::before, #scene.weather-rainy  .hills::after { filter:brightness(.72) saturate(.7); }

  /* ---------- 雨 ---------- */
  .rain { position:absolute; inset:0; pointer-events:none; opacity:0; transition: opacity .9s ease;
          background-image:repeating-linear-gradient(103deg,
            rgba(255,255,255,0) 0 5px, rgba(205,228,252,.5) 5px 6px,
            rgba(255,255,255,0) 6px 18px);
          background-size:70px 140px;
          animation: rain-fall .55s linear infinite; }
  #scene.weather-rainy .rain { opacity:1; }
  @keyframes rain-fall { from{ background-position:0 0; } to{ background-position:-28px 140px; } }

  .rain-dim { position:absolute; inset:0; pointer-events:none; background:rgba(38,58,88,.16); opacity:0; transition:opacity 1.2s ease; }
  #scene.weather-rainy .rain-dim { opacity:1; }

  /* ---------- 道路 ---------- */
  .road { position:absolute; left:0; right:0; bottom:0; height:15vh;
          background:linear-gradient(#5c6168, #474c52 55%, #3b3f44);
          border-top:2px solid rgba(255,255,255,.18); }
  .road-line { position:absolute; left:0; right:0; top:46%; height:3px;
               background:repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 44px, transparent 44px 92px);
               animation: road-move 1.1s linear infinite; }
  @keyframes road-move { to{ transform:translateX(-92px); } }
  #scene.weather-rainy .road { filter:brightness(.8); }

  /* ---------- 骑行主体（双 SVG 无缝循环） ---------- */
  .ride-track { position:absolute; left:0; right:0; bottom:7.5vh; z-index:6; overflow:hidden; }
  .ride { display:flex; width:max-content; animation: ride-across 9s linear infinite; }
  .rider { flex:0 0 auto; width:min(84vw, 46vh); }
  .rider svg { display:block; width:100%; height:auto; }
  @keyframes ride-across { from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

  /* 轮子 / 踏板旋转 */
  @keyframes spin { to { transform:rotate(360deg); } }
  .wheel, .pedal-unit { animation: spin 1s linear infinite; transform-box:view-box; }

  /* 骑行主体上下起伏 */
  .pelican { transform-box:view-box; transform-origin:150px 150px; animation:bob .5s ease-in-out infinite alternate; }
  @keyframes bob { from{ transform:translateY(0) rotate(-1.4deg); } to{ transform:translateY(-3.5px) rotate(1.4deg); } }

  .wing { transform-box:view-box; transform-origin:172px 106px; animation:flap 1.1s ease-in-out infinite alternate; }
  @keyframes flap { from{ transform:rotate(-7deg); } to{ transform:rotate(9deg); } }

  /* ---------- 天气指示 ---------- */
  .chip { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:calc(14px + env(safe-area-inset-left)); z-index:20;
          display:flex; align-items:center; gap:9px; padding:9px 16px; border-radius:999px;
          background:rgba(255,255,255,.78); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
          box-shadow:0 3px 12px rgba(15,30,60,.14); color:#33425c; font-size:14px; font-weight:600; letter-spacing:.5px; }
  .chip .dot { width:11px; height:11px; border-radius:50%; background:#f2b91f; box-shadow:0 0 0 4px rgba(242,185,31,.22);
               transition:background .8s, box-shadow .8s; }
  #scene.weather-cloudy .chip .dot { background:#8fa1b2; box-shadow:0 0 0 4px rgba(143,161,178,.22); }
  #scene.weather-rainy  .chip .dot { background:#5b82ac; box-shadow:0 0 0 4px rgba(91,130,172,.22); }
</style>
</head>
<body>
<div id="scene" class="weather-sunny">
  <div class="sky-layer sky-sunny"></div>
  <div class="sky-layer sky-cloudy"></div>
  <div class="sky-layer sky-rainy"></div>
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="hills"></div>
  <div class="rain"></div>
  <div class="rain-dim"></div>
  <div class="road"><div class="road-line"></div></div>

  <div class="ride-track">

            <line x1="75"  y1="180" x2="150" y2="175"/>

          </g>

          <path d="M 205 122 Q 206 109 217 107 L 225 111" stroke="#2f3542" stroke-width="3" stroke-linecap="round" fill="none"/>
          <g class="pedal-unit" style="transform-origin:150px 175px">
            <line x1="0" y1="0" x2="0" y2="-34" stroke="#4a4f57" stroke-width="4" stroke-linecap="round"/>

            <rect x="-11" y="-38" width="22" height="8" rx="4" fill="#2f3542"/>

          </g>

            <path d="M 98 110 Q 80 104 72 94 Q 90 98 104 102 Z" fill="#eef2f5" stroke="#d7dde2" stroke-width="1.5"/>
            <path d="M 96 122 Q 76 118 66 110 Q 88 114 104 116 Z" fill="#f5f8fa" stroke="#d7dde2" stroke-width="1.5"/>

            <ellipse cx="146" cy="130" rx="30" ry="15" fill="rgba(208,219,228,.55)"/>
            <g class="wing">
              <ellipse cx="170" cy="108" rx="32" ry="18" fill="#f0f4f7" stroke="#d0d9e0" stroke-width="2"/>
              <path d="M 146 102 Q 160 100 178 102 M 146 110 Q 162 108 180 109 M 150 118 Q 164 116 176 117"
                    stroke="#c5cfd7" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>
            <path d="M 176 94 Q 200 76 212 62" stroke="#e2e7eb" stroke-width="20" stroke-linecap="round" fill="none"/>
            <path d="M 176 94 Q 200 76 212 62" stroke="#ffffff" stroke-width="15" stroke-linecap="round" fill="none"/>
            <circle cx="214" cy="56" r="15" fill="#ffffff" stroke="#d7dde2" stroke-width="2.5"/>
            <path d="M 224 48 Q 250 42 270 56 Q 274 62 269 66 Q 258 86 236 81 Q 224 76 220 62 Z"
                  fill="#f6a623" stroke="#d68910" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 222 54 Q 250 51 268 61" stroke="#d68910" stroke-width="1.5" fill="none"/>
            <path d="M 246 63 Q 251 71 253 79" stroke="rgba(255,255,255,.4)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="217" cy="48" r="3.2" fill="#2f3542"/>
            <circle cx="218" cy="46.6" r="1.1" fill="#ffffff"/>
          </g>
        </svg>
      </div>
      <!-- 副本 B（无缝循环关键：动画平移 50% 后正好替换 A 的位置） -->
      <div class="rider" aria-hidden="true">
        <svg viewBox="0 0 300 216" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="150" cy="212" rx="90" ry="6.5" fill="rgba(25,35,50,.28)"/>
          <g class="wheel" style="transform-origin:75px 180px">
            <circle cx="75" cy="180" r="34" fill="#f6f8fa" stroke="#2f3542" stroke-width="5"/>
            <circle cx="75" cy="180" r="28" fill="none" stroke="#57606f" stroke-width="2"/>
            <g stroke="#57606f" stroke-width="2">
              <line x1="75" y1="152" x2="75" y2="208"/>
              <line x1="47" y1="180" x2="103" y2="180"/>
              <line x1="55" y1="160" x2="95" y2="200"/>
              <line x1="95" y1="160" x2="55" y2="200"/>
            </g>
            <circle cx="75" cy="180" r="5" fill="#2f3542"/>
          </g>
          <g class="wheel" style="transform-origin:225px 180px">
            <circle cx="225" cy="180" r="34" fill="#f6f8fa" stroke="#2f3542" stroke-width="5"/>
            <circle cx="225" cy="180" r="28" fill="none" stroke="#57606f" stroke-width="2"/>
            <g stroke="#57606f" stroke-width="2">
              <line x1="225" y1="152" x2="225" y2="208"/>
              <line x1="197" y1="180" x2="253" y2="180"/>
              <line x1="205" y1="160" x2="245" y2="200"/>
              <line x1="245" y1="160" x2="205" y2="200"/>
            </g>
            <circle cx="225" cy="180" r="5" fill="#2f3542"/>
          </g>
          <path d="M 93 184 L 150 182" stroke="#6b6f76" stroke-width="2" stroke-linecap="round"/>
          <g stroke="#d9533f" stroke-width="4" stroke-linecap="round" fill="none">
            <line x1="75"  y1="180" x2="150" y2="175"/>
            <line x1="150" y1="175" x2="123" y2="126"/>
            <line x1="150" y1="175" x2="205" y2="122"/>
            <line x1="123" y1="126" x2="205" y2="122"/>
            <line x1="205" y1="122" x2="225" y2="180"/>
          </g>
          <ellipse cx="122" cy="123" rx="14" ry="5" fill="#8e44ad"/>
          <path d="M 205 122 Q 206 109 217 107 L 225 111" stroke="#2f3542" stroke-width="3" stroke-linecap="round" fill="none"/>
          <g class="pedal-unit" style="transform-origin:150px 175px">
            <line x1="0" y1="0" x2="0" y2="-34" stroke="#4a4f57" stroke-width="4" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="0" y2="34"  stroke="#4a4f57" stroke-width="4" stroke-linecap="round"/>
            <circle cx="0" cy="0" r="13" fill="#3a3f46" stroke="#565c64" stroke-width="2"/>
            <circle cx="0" cy="0" r="4" fill="#8a9099"/>
            <path d="M 0 0 L -5 -34" stroke="#f2a963" stroke-width="5" stroke-linecap="round"/>
            <path d="M 0 0 L 5 34"   stroke="#e89a5a" stroke-width="5" stroke-linecap="round"/>
            <rect x="-11" y="-38" width="22" height="8" rx="4" fill="#2f3542"/>
            <rect x="-11" y="30"  width="22" height="8" rx="4" fill="#2f3542"/>
          </g>
          <g class="pelican">
            <path d="M 98 110 Q 80 104 72 94 Q 90 98 104 102 Z" fill="#eef2f5" stroke="#d7dde2" stroke-width="1.5"/>
            <path d="M 96 122 Q 76 118 66 110 Q 88 114 104 116 Z" fill="#f5f8fa" stroke="#d7dde2" stroke-width="1.5"/>
            <ellipse cx="146" cy="114" rx="52" ry="46" fill="url(#body-grad)" stroke="#d7dde2" stroke-width="2.5"/>
            <ellipse cx="146" cy="130" rx="30" ry="15" fill="rgba(208,219,228,.55)"/>
            <g class="wing">
              <ellipse cx="170" cy="108" rx="32" ry="18" fill="#f0f4f7" stroke="#d0d9e0" stroke-width="2"/>
              <path d="M 146 102 Q 160 100 178 102 M 146 110 Q 162 108 180 109 M 150 118 Q 164 116 176 117"

            </g>
            <path d="M 176 94 Q 200 76 212 62" stroke="#e2e7eb" stroke-width="20" stroke-linecap="round" fill="none"/>
            <path d="M 176 94 Q 200 76 212 62" stroke="#ffffff" stroke-width="15" stroke-linecap="round" fill="none"/>
            <circle cx="214" cy="56" r="15" fill="#ffffff" stroke="#d7dde2" stroke-width="2.5"/>
            <path d="M 224 48 Q 250 42 270 56 Q 274 62 269 66 Q 258 86 236 81 Q 224 76 220 62 Z"
                  fill="#f6a623" stroke="#d68910" stroke-width="2" stroke-linejoin="round"/>

            <circle cx="217" cy="48" r="3.2" fill="#2f3542"/>
            <circle cx="218" cy="46.6" r="1.1" fill="#ffffff"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div class="chip"><span class="dot"></span><span id="chipText">晴天</span></div>
</div>

<script>
  (function () {
    var scene = document.getElementById('scene');
    var chipText = document.getElementById('chipText');
    var states = ['weather-sunny', 'weather-cloudy', 'weather-rainy'];
    var labels = { 'weather-sunny': '晴天', 'weather-cloudy': '阴天', 'weather-rainy': '雨天' };
    var i = 0;
    setInterval(function () {
      i = (i + 1) % states.length;
      scene.classList.remove(states[0], states[1], states[2]);
      scene.classList.add(states[i]);
      chipText.textContent = labels[states[i]];
    }, 5000);
  })();
</script>
</body>
</html>
