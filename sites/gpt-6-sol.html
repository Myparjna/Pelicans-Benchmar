<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#89c9e8">
  <title>鹈鹕的晴日骑行</title>
  <style>
    :root{font-family:"Trebuchet MS","Microsoft YaHei",sans-serif;color:#234d5b}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#89c9e8}
    .scene{position:relative;width:100%;height:100%;height:100svh;min-height:440px;isolation:isolate;overflow:hidden;background:#89c9e8;transition:background 1.3s ease}
    .scene[data-weather="cloudy"]{background:#a8bac3}
    .scene[data-weather="rainy"]{background:#758fa6}
    svg{display:block;width:100%;height:100%}
    .scene-art{position:absolute;inset:0}
    .sky-wash{fill:#a8dbeb;transition:fill 1.3s ease}
    .scene[data-weather="cloudy"] .sky-wash{fill:#b9c8cb}
    .scene[data-weather="rainy"] .sky-wash{fill:#8da9b8}
    .sun{transform-origin:980px 124px;transition:opacity 1s ease,transform 1.2s ease}
    .scene[data-weather="cloudy"] .sun{opacity:.18;transform:scale(.9)}
    .scene[data-weather="rainy"] .sun{opacity:0;transform:scale(.8)}
    .sun-rays{animation:turn 38s linear infinite;transform-origin:980px 124px}
    .cloud{animation:cloud-drift 28s ease-in-out infinite alternate}
    .cloud.two{animation-delay:-9s;animation-duration:34s}
    .cloud.three{animation-delay:-17s;animation-duration:30s}
    .weather-clouds{opacity:0;transform:translateY(-18px);transition:opacity 1s ease,transform 1s ease}
    .scene[data-weather="cloudy"] .weather-clouds,.scene[data-weather="rainy"] .weather-clouds{opacity:1;transform:translateY(0)}
    .rain-layer{opacity:0;transition:opacity .7s ease}
    .scene[data-weather="rainy"] .rain-layer{opacity:1}
    .rain-a,.rain-b{animation:rain-fall .65s linear infinite}
    .rain-b{animation-delay:-.32s}
    .far-hill{fill:#9ecba6;transition:fill 1.3s ease}
    .near-hill{fill:#6aa78f;transition:fill 1.3s ease}
    .grass{fill:#70b58a;transition:fill 1.3s ease}
    .scene[data-weather="cloudy"] .far-hill{fill:#a3bba9}
    .scene[data-weather="cloudy"] .near-hill{fill:#789e92}
    .scene[data-weather="cloudy"] .grass{fill:#84a895}
    .scene[data-weather="rainy"] .far-hill{fill:#809ea2}
    .scene[data-weather="rainy"] .near-hill{fill:#527b83}
    .scene[data-weather="rainy"] .grass{fill:#5e927e}
    .road{fill:#e8d9b8;transition:fill 1.3s ease}
    .scene[data-weather="cloudy"] .road{fill:#d7d4c3}
    .scene[data-weather="rainy"] .road{fill:#b8c4c4}
    .road-stripe{animation:road-move 1.25s linear infinite}
    .tree-line{animation:scenery-move 10s linear infinite}
    .tree-line.back{animation-duration:18s;opacity:.65}
    .bike-wheels{animation:bob .32s ease-in-out infinite alternate}
    .wheel-spin{animation:turn .8s linear infinite;transform-box:fill-box;transform-origin:center}
    .bike-frame,.rider{animation:bob .32s ease-in-out infinite alternate}
    .rider{animation-delay:-.16s}
    .wing{animation:wing 1s ease-in-out infinite alternate;transform-origin:598px 470px}
    .scarf-tail{animation:scarf 1.1s ease-in-out infinite alternate;transform-origin:579px 396px}
    .pedal-spin{animation:turn .8s linear infinite;transform-origin:602px 581px}
    .flower{transform-box:fill-box;transform-origin:center bottom}
    .puddle{opacity:0;transition:opacity 1s ease}
    .scene[data-weather="rainy"] .puddle{opacity:1}
    .masthead{position:absolute;z-index:3;top:clamp(22px,4vw,50px);left:clamp(22px,5vw,72px);pointer-events:none}
    .eyebrow{margin:0 0 8px;color:#426875;font-size:clamp(10px,.85vw,12px);font-weight:800;letter-spacing:.32em;text-transform:uppercase}
    h1{margin:0;color:#174553;font-family:Georgia,"Microsoft YaHei",serif;font-size:clamp(27px,3vw,46px);font-weight:700;letter-spacing:.06em;line-height:1.15}
    .subhead{margin:12px 0 0;color:#426875;font-size:clamp(12px,1.1vw,15px);letter-spacing:.12em}
    .weather-panel{position:absolute;z-index:3;top:clamp(24px,4vw,48px);right:clamp(20px,5vw,70px);display:flex;align-items:center;gap:13px;min-width:144px;padding:12px 17px;border:1px solid rgba(255,255,255,.72);border-radius:100px;background:rgba(255,255,255,.78);box-shadow:0 10px 34px rgba(41,88,99,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .weather-symbol{font-size:23px;line-height:1;width:27px;text-align:center}
    .weather-name{font-size:13px;font-weight:800;letter-spacing:.11em}
    .weather-dots{display:flex;gap:5px;margin-top:5px}
    .weather-dots span{width:15px;height:3px;border-radius:4px;background:#b6cac8;transition:background .4s,width .4s}
    .weather-dots span.active{width:24px;background:#e6a650}
    .footer-note{position:absolute;z-index:3;right:clamp(20px,5vw,70px);bottom:clamp(24px,4vw,44px);color:#35616c;font-size:11px;font-weight:800;letter-spacing:.25em;text-transform:uppercase}
    @keyframes turn{to{transform:rotate(360deg)}}
    @keyframes cloud-drift{to{transform:translateX(45px)}}
    @keyframes rain-fall{to{transform:translate(-26px,70px)}}
    @keyframes road-move{to{transform:translateX(-170px)}}
    @keyframes scenery-move{to{transform:translateX(-280px)}}
    @keyframes bob{to{transform:translateY(3px)}}
    @keyframes wing{to{transform:rotate(-6deg)}}
    @keyframes scarf{to{transform:rotate(8deg) translateY(3px)}}
    @keyframes flower-sway{to{transform:rotate(7deg)}}
    @media(max-width:700px){
      .masthead{top:24px;left:22px}.eyebrow{font-size:9px;letter-spacing:.22em;margin-bottom:6px}h1{font-size:25px}.subhead{margin-top:7px;font-size:11px;letter-spacing:.06em}
      .weather-panel{top:112px;left:22px;right:auto;min-width:126px;padding:10px 13px;gap:9px}
      .weather-symbol{font-size:20px}.weather-name{font-size:12px}
      .footer-note{right:20px;bottom:21px;font-size:9px;letter-spacing:.16em}
      .bike-and-bird{transform:scale(.73);transform-origin:600px 550px}
    }
    @media(max-width:360px){.bike-and-bird{transform:scale(.64);transform-origin:600px 550px}}
    @media(prefers-reduced-motion:reduce){.wheel-spin,.pedal-spin,.bike-wheels,.bike-frame,.rider,.wing,.scarf-tail,.road-stripe,.tree-line,.cloud,.sun-rays,.rain-a,.rain-b,.flower{animation-duration:5s}}
  </style>
</head>
<body>

          <path d="M613 564l29 11" stroke="#d59c6a" stroke-width="12" stroke-linecap="round"/>
          <path d="M551 529l-24 31" stroke="#d59c6a" stroke-width="12" stroke-linecap="round"/>

    <div class="masthead"><p class="eyebrow">A little ride through the day</p><h1>鹈鹕的骑行日记</h1><p class="subhead">沿着风的方向，慢慢向前。</p></div>
    <div class="weather-panel" aria-live="polite" aria-atomic="true"><span class="weather-symbol" id="weather-symbol" aria-hidden="true">☀</span><div><div class="weather-name" id="weather-name">晴天</div><div class="weather-dots" aria-hidden="true"><span class="active"></span><span></span><span></span></div></div></div>
    <div class="footer-note">Keep on riding · 01 / 03</div>
  </main>
  <script>
    (() => {
      const scene = document.querySelector('.scene');
      const name = document.querySelector('#weather-name');
      const symbol = document.querySelector('#weather-symbol');
      const dots = [...document.querySelectorAll('.weather-dots span')];
      const footer = document.querySelector('.footer-note');
      const weather = [
        {key:'sunny', label:'晴天', icon:'☀'},
        {key:'cloudy', label:'阴天', icon:'☁'},
        {key:'rainy', label:'雨天', icon:'☂'}
      ];
      let current = 0;
      window.setInterval(() => {
        current = (current + 1) % weather.length;
        const next = weather[current];
        scene.dataset.weather = next.key;
        name.textContent = next.label;
        symbol.textContent = next.icon;
        footer.textContent = `Keep on riding · 0${current + 1} / 03`;
        dots.forEach((dot, index) => dot.classList.toggle('active', index === current));
      }, 5000);
    })();
  </script>
</body>
</html>
