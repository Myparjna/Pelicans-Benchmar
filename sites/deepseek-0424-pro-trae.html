<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
}

.scene {
  width: 100%;
  height: 100%;
  position: relative;
}

.scene svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* ===== 天气层过渡 ===== */
#skyRect {
  transition: fill 1.5s ease;
}
#groundGrass {
  transition: fill 1.5s ease;
}
#groundRoad {
  transition: fill 1.5s ease;
}

/* ===== 太阳 ===== */
.sun-group {
  transition: opacity 1.5s ease;
}
.sun-ray {
  animation: sunPulse 3s ease-in-out infinite;
  transform-origin: 680px 80px;
}
.sun-ray:nth-child(2)  { animation-delay: 0s; }
.sun-ray:nth-child(3)  { animation-delay: 0.2s; }
.sun-ray:nth-child(4)  { animation-delay: 0.4s; }
.sun-ray:nth-child(5)  { animation-delay: 0.6s; }
.sun-ray:nth-child(6)  { animation-delay: 0.8s; }
.sun-ray:nth-child(7)  { animation-delay: 1.0s; }
.sun-ray:nth-child(8)  { animation-delay: 1.2s; }
.sun-ray:nth-child(9)  { animation-delay: 1.4s; }
.sun-ray:nth-child(10) { animation-delay: 1.6s; }
.sun-ray:nth-child(11) { animation-delay: 1.8s; }
.sun-ray:nth-child(12) { animation-delay: 2.0s; }
.sun-ray:nth-child(13) { animation-delay: 2.2s; }

@keyframes sunPulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.15); }
}

/* ===== 云层 ===== */
.clouds-group {
  transition: opacity 1.5s ease;
}
.cloud {
  animation: cloudDrift 20s linear infinite;
}
.cloud:nth-child(1) { animation-duration: 25s; animation-delay: 0s; }
.cloud:nth-child(2) { animation-duration: 20s; animation-delay: -5s; }
.cloud:nth-child(3) { animation-duration: 22s; animation-delay: -10s; }
.cloud:nth-child(4) { animation-duration: 18s; animation-delay: -7s; }
.cloud:nth-child(5) { animation-duration: 24s; animation-delay: -12s; }

@keyframes cloudDrift {
  from { transform: translateX(900px); }
  to { transform: translateX(-300px); }
}

/* ===== 雨天 ===== */
.rain-group {
  transition: opacity 1.5s ease;
}
.raindrop {
  animation: rainFall linear infinite;
}
@keyframes rainFall {
  0% { transform: translateY(-10px) translateX(0); opacity: 0; }
  5% { opacity: 1; }
  90% { opacity: 0.6; }
  100% { transform: translateY(420px) translateX(-15px); opacity: 0; }
}

/* ===== 车轮旋转 ===== */
.wheel-spin {
  transform-origin: var(--cx) var(--cy);
  animation: wheelRotate 0.8s linear infinite;
}
@keyframes wheelRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ===== 踏板旋转 ===== */
.pedal-crank {
  transform-origin: 390px 342px;
  animation: pedalRotate 0.8s linear infinite;
}
@keyframes pedalRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ===== 鹈鹕身体晃动 ===== */
.pelican-body-group {
  animation: bodyBob 0.8s ease-in-out infinite;
}
@keyframes bodyBob {
  0%, 100% { transform: translateY(0); }
  25% { transform: translateY(-3px); }
  75% { transform: translateY(3px); }
}

/* ===== 翅膀微动 ===== */
.pelican-wing {
  transform-origin: 330px 205px;
  animation: wingFlap 2s ease-in-out infinite;
}
@keyframes wingFlap {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-5deg); }
  75% { transform: rotate(3deg); }
}

/* ===== 远处树木微动 ===== */
.tree-group {
  animation: treeSway 4s ease-in-out infinite;
  transform-origin: bottom center;
}
.tree-group:nth-child(odd) { animation-delay: -2s; }
@keyframes treeSway {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(1deg); }
  75% { transform: rotate(-1deg); }
}

/* ===== 天气标签 ===== */
.weather-label {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: clamp(16px, 3vw, 28px);
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: opacity 1s ease;
  pointer-events: none;
  z-index: 10;
  letter-spacing: 0.1em;
}

/* ===== 响应式提示 ===== */
@media (max-width: 600px) {
  .weather-label {
    top: 12px;
  }
}
</style>

<script>
(function() {
  // ============ 天气切换 ============
  const weatherStates = ['sunny', 'cloudy', 'rainy'];
  const weatherLabels = { sunny: '☀️ 晴天', cloudy: '☁️ 阴天', rainy: '🌧️ 雨天' };
  const skyColors = {
    sunny: 'url(#skySunny)',
    cloudy: 'url(#skyCloudy)',
    rainy: 'url(#skyRainy)'
  };
  const grassColors = {
    sunny: 'url(#grassGrad)',
    cloudy: '#7A9A6B',
    rainy: '#5A7A4B'
  };
  const roadColors = {
    sunny: '#5A5A5A',
    cloudy: '#4E4E4E',
    rainy: '#3A3A3A'
  };

  let currentWeather = 0; // 0: sunny, 1: cloudy, 2: rainy
  const skyRect = document.getElementById('skyRect');
  const groundGrass = document.getElementById('groundGrass');
  const groundRoad = document.getElementById('groundRoad');
  const sunGroup = document.getElementById('sunGroup');
  const cloudsGroup = document.getElementById('cloudsGroup');
  const rainGroup = document.getElementById('rainGroup');
  const weatherLabel = document.getElementById('weatherLabel');

  function applyWeather(index) {
    const state = weatherStates[index];
    skyRect.setAttribute('fill', skyColors[state]);
    groundGrass.setAttribute('fill', grassColors[state]);
    groundRoad.setAttribute('fill', roadColors[state]);
    weatherLabel.textContent = weatherLabels[state];

    if (state === 'sunny') {
      sunGroup.style.opacity = '1';
      cloudsGroup.style.opacity = '0.3';
      rainGroup.style.opacity = '0';
    } else if (state === 'cloudy') {
      sunGroup.style.opacity = '0';
      cloudsGroup.style.opacity = '1';
      rainGroup.style.opacity = '0';
    } else if (state === 'rainy') {
      sunGroup.style.opacity = '0';
      cloudsGroup.style.opacity = '1';
      rainGroup.style.opacity = '1';
    }
  }

  function switchWeather() {
    currentWeather = (currentWeather + 1) % 3;
    applyWeather(currentWeather);
  }

  // 初始状态
  applyWeather(0);

  // 每5秒切换
  setInterval(switchWeather, 5000);

  // ============ 腿部动画 ============
  const nearLeg = document.getElementById('nearLeg');
  const nearLegShadow = document.getElementById('nearLegShadow');
  const farLeg = document.getElementById('farLeg');
  const nearFoot = document.getElementById('nearFoot');
  const farFoot = document.getElementById('farFoot');

  const hipNearX = 330, hipNearY = 240;
  const hipFarX = 335, hipFarY = 238;
  const crankX = 390, crankY = 342;
  const crankRadius = 22;

  function animateLegs(timestamp) {
    // 踏板旋转速度：与车轮同步 (0.8s一圈)
    const angle = (timestamp / 800) * Math.PI * 2;

    // 近侧踏板 (下方)
    const nearPedalX = crankX + crankRadius * Math.cos(angle);
    const nearPedalY = crankY + crankRadius * Math.sin(angle);

    // 远侧踏板 (上方，180度相位差)
    const farPedalX = crankX + crankRadius * Math.cos(angle + Math.PI);
    const farPedalY = crankY + crankRadius * Math.sin(angle + Math.PI);

    // 更新近侧腿
    nearLeg.setAttribute('x2', nearPedalX);
    nearLeg.setAttribute('y2', nearPedalY);
    nearLegShadow.setAttribute('x2', nearPedalX);
    nearLegShadow.setAttribute('y2', nearPedalY);

    // 更新近侧脚掌
    const footAngle = angle * 180 / Math.PI;
    nearFoot.setAttribute('transform',
      `translate(${nearPedalX - 390},${nearPedalY - 364}) rotate(${footAngle},390,364)`);

    // 更新远侧腿
    farLeg.setAttribute('x2', farPedalX);
    farLeg.setAttribute('y2', farPedalY);

    // 更新远侧脚掌
    farFoot.setAttribute('transform',
      `translate(${farPedalX - 390},${farPedalY - 320}) rotate(${footAngle + 180},390,320)`);

    requestAnimationFrame(animateLegs);
  }

  requestAnimationFrame(animateLegs);
})();
</script>
