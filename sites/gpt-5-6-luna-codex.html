<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eaf6ff" />
  <title>鹈鹕的天气自行车</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324d;
      --muted: #6c8297;
      --panel: rgba(255, 255, 255, .82);
      --line: rgba(37, 81, 112, .13);
      --accent: #f18a3f;
      --shadow: 0 24px 70px rgba(32, 83, 116, .17);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 280px;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.95), transparent 33rem),
        linear-gradient(135deg, #f1fbff 0%, #f8f4ec 100%);
      overflow-x: hidden;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(18px, 4vw, 48px) 0 clamp(22px, 5vw, 54px);
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: clamp(18px, 3vw, 30px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 3px;
      border-radius: 5px;
      background: currentColor;
    }

    h1 {
      margin: 0;
      max-width: 610px;
      font-size: clamp(30px, 5vw, 60px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .subcopy {
      max-width: 510px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 1.7vw, 17px);
      line-height: 1.65;
    }

    .weather-card {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 188px;
      padding: 13px 15px;
      border: 1px solid rgba(255,255,255,.88);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 10px 35px rgba(44, 94, 123, .09);
      backdrop-filter: blur(14px);
    }

    .weather-icon {
      display: grid;
      flex: 0 0 46px;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: #fff0d3;
      font-size: 25px;
    }

    .weather-card small,
    .weather-card strong { display: block; }

    .weather-card small { color: var(--muted); font-size: 11px; }
    .weather-card strong { margin-top: 3px; font-size: 16px; }

    .stage-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.92);
      border-radius: clamp(24px, 4vw, 42px);
      background: #dff3ff;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .stage-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: inherit;
      z-index: 2;
    }

    canvas {
      display: block;
      width: 100%;
      height: clamp(390px, 59vw, 650px);
      min-height: 390px;
      touch-action: none;
    }

    .stage-note {
      position: absolute;
      left: clamp(17px, 3vw, 34px);
      bottom: clamp(15px, 3vw, 29px);
      z-index: 3;
      max-width: 255px;
      padding: 10px 13px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 14px;
      color: rgba(23,50,77,.72);
      background: rgba(255,255,255,.48);
      font-size: 12px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    .hud {
      position: absolute;
      top: clamp(15px, 3vw, 29px);
      right: clamp(15px, 3vw, 29px);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 13px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 15px;
      color: rgba(23,50,77,.78);
      background: rgba(255,255,255,.52);
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .progress {
      width: 55px;
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(23,50,77,.12);
    }

    .progress > span {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transform-origin: left center;
      transition: transform .15s linear;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 60px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.58);
      transition: background .25s ease, border-color .25s ease, transform .25s ease;
    }

    .legend-item.active {
      border-color: rgba(241,138,63,.38);
      background: rgba(255,244,225,.92);
      transform: translateY(-2px);
    }

    .legend-item i {
      display: grid;
      flex: 0 0 32px;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 11px;
      background: #edf6fb;
      font-style: normal;
      font-size: 17px;
    }

    .legend-item strong { display: block; font-size: 13px; }
    .legend-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .signature { font-weight: 700; color: var(--ink); }

    @media (max-width: 650px) {
      .shell { width: min(100% - 22px, 1180px); padding-top: 20px; }
      .topbar { display: block; }
      .weather-card { margin-top: 17px; width: fit-content; }
      .subcopy { margin-top: 11px; }
      canvas { height: min(73vh, 610px); min-height: 430px; }
      .legend { gap: 7px; }
      .legend-item { display: block; min-height: 89px; padding: 10px; }
      .legend-item i { margin-bottom: 7px; }
      .legend-item span { line-height: 1.25; }
      .stage-note { max-width: 170px; font-size: 11px; }
      footer { align-items: flex-start; flex-direction: column; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">A tiny weather ride</p>
        <h1>鹈鹕今天也要<br />骑车去海边。</h1>
        <p class="subcopy">一场会随天气变化的轻盈小动画。每 5 秒，天空会在晴、阴、雨之间悄悄换景。</p>
      </div>
      <div class="weather-card" aria-live="polite">
        <div class="weather-icon" id="weatherIcon">☀</div>
        <div>
          <small>现在的天气</small>
          <strong id="weatherLabel">晴天</strong>
        </div>
      </div>
    </header>

    <section class="stage-wrap" aria-label="鹈鹕在不同天气中骑自行车的动画">
      <canvas id="scene" role="img" aria-label="一只鹈鹕正在骑自行车"></canvas>
      <div class="hud">
        <span id="countdown">5 秒后换天</span>
        <span class="progress" aria-hidden="true"><span id="progressBar"></span></span>
      </div>
      <div class="stage-note" id="stageNote">阳光正好，海风从身后吹来。</div>
    </section>

    <section class="legend" aria-label="天气循环顺序">
      <div class="legend-item active" data-weather="sunny"><i>☀</i><div><strong>晴天</strong><span>海风与金色阳光</span></div></div>
      <div class="legend-item" data-weather="cloudy"><i>☁</i><div><strong>阴天</strong><span>云层慢慢盖住天空</span></div></div>
      <div class="legend-item" data-weather="rainy"><i>☂</i><div><strong>雨天</strong><span>车轮溅起小小水花</span></div></div>
    </section>

    <footer>
      <span class="signature">Pelican Cycle Club · 08:13</span>
      <span>自动天气循环 · 触摸屏幕也能欣赏</span>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const label = document.getElementById("weatherLabel");
      const icon = document.getElementById("weatherIcon");
      const note = document.getElementById("stageNote");
      const countdown = document.getElementById("countdown");
      const progressBar = document.getElementById("progressBar");
      const legendItems = [...document.querySelectorAll(".legend-item")];
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const states = [
        { key: "sunny", label: "晴天", icon: "☀", note: "阳光正好，海风从身后吹来。" },
        { key: "cloudy", label: "阴天", icon: "☁", note: "云层很轻，鹈鹕依然保持好心情。" },
        { key: "rainy", label: "雨天", icon: "☂", note: "滴答、滴答，车轮溅起小水花。" }
      ];

      let weatherIndex = 0;
      let weatherStartedAt = performance.now();
      let lastFrame = performance.now();
      let width = 0;
      let height = 0;
      let dpr = 1;
      let particles = [];
      let birds = [];
      let bubbles = [];

      const TAU = Math.PI * 2;
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      function resize() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(280, rect.width);
        height = Math.max(390, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        seedParticles();
      }

      function seedParticles() {
        const count = Math.round(clamp(width * height / 12000, 34, 95));
        particles = Array.from({ length: count }, (_, i) => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: 1.2 + Math.random() * 3.5,
          speed: .12 + Math.random() * .35,
          phase: Math.random() * TAU,
          depth: .4 + Math.random() * .8,
          alpha: .12 + Math.random() * .28,
          kind: i % 3
        }));
        birds = Array.from({ length: Math.max(3, Math.round(width / 190)) }, (_, i) => ({
          x: (i / Math.max(3, width / 190)) * width + Math.random() * 80,
          y: 88 + Math.random() * 125,
          scale: .55 + Math.random() * .45,
          phase: Math.random() * TAU,
          speed: .000025 + Math.random() * .000035
        }));
        bubbles = Array.from({ length: 18 }, (_, i) => ({
          x: Math.random() * width,
          y: height * (.68 + Math.random() * .22),
          r: 1 + Math.random() * 4,
          phase: i * 1.7 + Math.random() * 2
        }));
      }

      function drawSky(t, state) {
        const rain = state === "rainy";
        const cloudy = state === "cloudy";
        const top = rain ? "#6d849a" : cloudy ? "#aebdca" : "#72c4eb";
        const bottom = rain ? "#b9c8cf" : cloudy ? "#dae1df" : "#dff4ee";
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, top);
        sky.addColorStop(.68, bottom);
        sky.addColorStop(1, rain ? "#b6c7bf" : cloudy ? "#dfe4dd" : "#c7e9d8");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const vignette = ctx.createRadialGradient(width * .5, height * .35, 20, width * .5, height * .45, Math.max(width, height) * .7);
        vignette.addColorStop(0, "rgba(255,255,255,.12)");
        vignette.addColorStop(1, rain ? "rgba(27,50,71,.15)" : "rgba(255,255,255,0)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);

        if (!rain) {
          const sunX = width * .78;
          const sunY = height * .18;
          const glow = ctx.createRadialGradient(sunX, sunY, 2, sunX, sunY, cloudy ? 88 : 124);
          glow.addColorStop(0, cloudy ? "rgba(255,240,194,.30)" : "rgba(255,238,146,.55)");
          glow.addColorStop(1, "rgba(255,239,167,0)");
          ctx.fillStyle = glow;
          ctx.fillRect(sunX - 140, sunY - 140, 280, 280);
          if (!cloudy) {
            ctx.save();
            ctx.translate(sunX, sunY);
            ctx.strokeStyle = "rgba(255,236,157,.68)";
            ctx.lineWidth = 3;
            for (let i = 0; i < 10; i++) {
              const angle = i * TAU / 10 + t * .00005;
              ctx.beginPath();
              ctx.moveTo(Math.cos(angle) * 37, Math.sin(angle) * 37);
              ctx.lineTo(Math.cos(angle) * 49, Math.sin(angle) * 49);
              ctx.stroke();
            }
            ctx.fillStyle = "#ffe29a";
            ctx.beginPath(); ctx.arc(0, 0, 28, 0, TAU); ctx.fill();
            ctx.restore();
          }
        }
      }

      function drawCloud(x, y, scale, alpha, dark = false) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = dark ? "#677c91" : "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y + 10 * scale, 23 * scale, Math.PI, 0);
        ctx.arc(x + 22 * scale, y - 3 * scale, 30 * scale, Math.PI, 0);
        ctx.arc(x + 53 * scale, y + 6 * scale, 22 * scale, Math.PI, 0);
        ctx.lineTo(x + 75 * scale, y + 27 * scale);
        ctx.lineTo(x - 2 * scale, y + 27 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawClouds(t, state) {
        const dark = state === "rainy";
        const opacity = state === "sunny" ? .42 : state === "cloudy" ? .66 : .72;
        drawCloud(((t * .009) % (width + 210)) - 160, height * .18, 1.05, opacity, dark);
        drawCloud(width * .26 + Math.sin(t * .00008) * 26, height * .30, 1.4, state === "sunny" ? .24 : .56, dark);
        drawCloud(width * .75 - ((t * .006) % (width + 250)), height * .12, .78, state === "sunny" ? .24 : .5, dark);
        if (state !== "sunny") drawCloud(width * .52 + Math.sin(t * .00005) * 30, height * .06, 1.75, state === "rainy" ? .76 : .52, dark);
      }

      function drawDistantLandscape(t, state) {
        const wet = state === "rainy";
        ctx.fillStyle = wet ? "rgba(89,119,130,.38)" : "rgba(106,166,153,.36)";
        ctx.beginPath();
        ctx.moveTo(0, height * .57);
        for (let x = 0; x <= width; x += 36) {
          ctx.lineTo(x, height * (.54 + Math.sin(x * .011 + 1) * .045 + Math.sin(x * .025 + t * .00008) * .018));
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.closePath(); ctx.fill();

        ctx.fillStyle = wet ? "#9daea9" : "#90c9aa";
        ctx.beginPath();
        ctx.moveTo(0, height * .66);
        for (let x = 0; x <= width; x += 28) ctx.lineTo(x, height * (.62 + Math.sin(x * .017) * .04));
        ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.closePath(); ctx.fill();

        ctx.fillStyle = wet ? "rgba(210,224,220,.32)" : "rgba(255,255,255,.40)";
        ctx.beginPath();
        ctx.moveTo(0, height * .71);
        for (let x = 0; x <= width; x += 31) ctx.lineTo(x, height * (.69 + Math.sin(x * .014 + 1.3) * .035));
        ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.closePath(); ctx.fill();
      }

      function drawSeaAndRoad(t, state) {
        const wet = state === "rainy";
        const seaY = height * .63;
        const sea = ctx.createLinearGradient(0, seaY, 0, height);
        sea.addColorStop(0, wet ? "#8ba9b0" : "#74bfc2");
        sea.addColorStop(1, wet ? "#718e9b" : "#4d9eac");
        ctx.fillStyle = sea;
        ctx.fillRect(0, seaY, width, height - seaY);

        ctx.save();
        ctx.globalAlpha = wet ? .2 : .32;
        ctx.strokeStyle = "#e8f6e4";
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
          const y = seaY + 12 + i * 17;
          ctx.beginPath();
          for (let x = -30; x < width + 30; x += 34) {
            ctx.lineTo(x, y + Math.sin(x * .05 + t * .001 + i) * 2);
          }
          ctx.stroke();
        }
        ctx.restore();

        const roadY = height * .77;
        ctx.fillStyle = wet ? "#6b8185" : "#a8a291";
        ctx.beginPath();
        ctx.moveTo(0, roadY + 10);
        ctx.lineTo(width, roadY - 18);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = wet ? "rgba(214,232,224,.46)" : "rgba(249,231,180,.70)";
        ctx.beginPath();
        ctx.moveTo(0, roadY + 2); ctx.lineTo(width, roadY - 26); ctx.lineTo(width, roadY - 18); ctx.lineTo(0, roadY + 10); ctx.closePath(); ctx.fill();

        ctx.save();
        ctx.globalAlpha = wet ? .35 : .45;
        ctx.strokeStyle = wet ? "#c7d9d6" : "#fff3c9";
        ctx.lineWidth = 3;
        ctx.setLineDash([26, 24]);
        ctx.beginPath(); ctx.moveTo(0, height * .90); ctx.lineTo(width, height * .82); ctx.stroke();
        ctx.restore();

        if (wet) {
          ctx.save();
          ctx.globalAlpha = .28;
          for (const bubble of bubbles) {
            const y = bubble.y + Math.sin(t * .001 + bubble.phase) * 5;
            ctx.strokeStyle = "#e5ffff";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(bubble.x, y, bubble.r, 0, TAU); ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawBackgroundMotion(t, state) {
        const rain = state === "rainy";
        ctx.save();
        particles.forEach((p) => {
          const drift = Math.sin(t * .001 * p.speed + p.phase) * (rain ? 4 : 14);
          let x = (p.x + drift + t * p.speed * (rain ? .008 : .003)) % (width + 20);
          let y = p.y + Math.sin(t * .001 * p.speed + p.phase) * 9;
          if (x < -10) x += width + 20;
          if (rain) {
            const rainLength = 11 + p.size * 3;
            y = (p.y + t * (.035 + p.speed * .03) * 10) % (height * .76);
            ctx.strokeStyle = "rgba(222,244,250," + (.16 + p.alpha * .55) + ")";
            ctx.lineWidth = p.size * .55;
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y + rainLength); ctx.stroke();
          } else if (p.kind === 0) {
            ctx.fillStyle = "rgba(255,255,255," + p.alpha + ")";
            ctx.beginPath(); ctx.arc(x, y, p.size * .6, 0, TAU); ctx.fill();
          } else {
            ctx.strokeStyle = "rgba(255,255,255," + (p.alpha * .65) + ")";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 8 * p.depth, y); ctx.stroke();
          }
        });
        ctx.restore();
      }

      function drawTinyBirds(t, state) {
        if (state === "rainy") return;
        ctx.save();
        ctx.strokeStyle = state === "cloudy" ? "rgba(73,97,113,.38)" : "rgba(45,105,119,.40)";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        birds.forEach((bird) => {
          const x = ((bird.x + t * bird.speed) % (width + 80)) - 40;
          const y = bird.y + Math.sin(t * .0012 + bird.phase) * 8;
          ctx.save(); ctx.translate(x, y); ctx.scale(bird.scale, bird.scale);
          ctx.beginPath(); ctx.moveTo(-9, 1); ctx.quadraticCurveTo(-4, -5, 0, 1); ctx.quadraticCurveTo(4, -5, 9, 1); ctx.stroke();
          ctx.restore();
        });
        ctx.restore();
      }

      function drawBicycle(x, y, s, t, state) {
        const wheelR = 57 * s;
        const rear = { x: x - 78 * s, y };
        const front = { x: x + 78 * s, y };
        const crank = { x: x - 10 * s, y: y - 1 * s };
        const frame = "#234f64";
        const orange = "#ee8441";
        const wet = state === "rainy";

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalAlpha = .22;
        ctx.fillStyle = wet ? "#274852" : "#1e6574";
        ctx.beginPath(); ctx.ellipse(x, y + 63 * s, 142 * s, 14 * s, 0, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;

        function wheel(w) {
          ctx.strokeStyle = "rgba(27,63,73,.33)";
          ctx.lineWidth = 9 * s;
          ctx.beginPath(); ctx.arc(w.x, w.y, wheelR, 0, TAU); ctx.stroke();
          ctx.strokeStyle = wet ? "#d3e4dc" : "#f9f1d3";
          ctx.lineWidth = 3 * s;
          ctx.beginPath(); ctx.arc(w.x, w.y, wheelR, 0, TAU); ctx.stroke();
          ctx.strokeStyle = "rgba(244,250,237,.65)";
          ctx.lineWidth = 1.2 * s;
          for (let i = 0; i < 12; i++) {
            const angle = i * TAU / 12 + t * .006;
            ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + Math.cos(angle) * wheelR, w.y + Math.sin(angle) * wheelR); ctx.stroke();
          }
          ctx.fillStyle = "#f2a04e";
          ctx.beginPath(); ctx.arc(w.x, w.y, 5 * s, 0, TAU); ctx.fill();
        }

        wheel(rear); wheel(front);
        ctx.strokeStyle = frame; ctx.lineWidth = 5 * s;
        [[rear, crank], [crank, front], [rear, front], [rear, { x: x - 31 * s, y: y - 49 * s }], [{ x: x - 31 * s, y: y - 49 * s }, crank]].forEach(([a, b]) => {
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        });
        ctx.strokeStyle = orange; ctx.lineWidth = 4 * s;
        ctx.beginPath(); ctx.moveTo(front.x, front.y); ctx.lineTo(x + 53 * s, y - 47 * s); ctx.lineTo(x + 69 * s, y - 49 * s); ctx.stroke();
        ctx.strokeStyle = "#234f64"; ctx.lineWidth = 4 * s;
        ctx.beginPath(); ctx.moveTo(x + 68 * s, y - 50 * s); ctx.quadraticCurveTo(x + 75 * s, y - 58 * s, x + 85 * s, y - 53 * s); ctx.stroke();
        ctx.strokeStyle = orange; ctx.lineWidth = 5 * s;
        ctx.beginPath(); ctx.moveTo(x - 35 * s, y - 54 * s); ctx.lineTo(x - 27 * s, y - 54 * s); ctx.stroke();
        ctx.strokeStyle = frame; ctx.lineWidth = 3 * s;
        ctx.beginPath(); ctx.moveTo(crank.x, crank.y); ctx.lineTo(crank.x + Math.cos(t * .007) * 23 * s, crank.y + Math.sin(t * .007) * 23 * s); ctx.stroke();
        ctx.fillStyle = orange; ctx.beginPath(); ctx.arc(crank.x, crank.y, 6 * s, 0, TAU); ctx.fill();
        ctx.restore();
      }

      function drawPelican(x, y, s, t, state) {
        const flap = Math.sin(t * .0045) * .06;
        const pedal = t * .007;
        const wet = state === "rainy";
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.fillStyle = "#e7edf0";
        ctx.strokeStyle = "#477183";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-72, -69); ctx.quadraticCurveTo(-116, -83, -133, -62); ctx.quadraticCurveTo(-110, -56, -81, -47); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-72, -68); ctx.quadraticCurveTo(-121, -63, -135, -42); ctx.quadraticCurveTo(-101, -39, -72, -43); ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#f4f4ed";
        ctx.strokeStyle = "#365f70";
        ctx.beginPath(); ctx.ellipse(-12, -105, 58, 66, -.08, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#d9e4e6";
        ctx.beginPath(); ctx.ellipse(2, -91, 41, 51, -.2, 0, TAU); ctx.fill();
        ctx.fillStyle = "#f8f8f1";
        ctx.beginPath(); ctx.ellipse(-35, -170, 34, 38, -.16, 0, TAU); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#d9e7e8";
        ctx.beginPath(); ctx.moveTo(-59, -189); ctx.quadraticCurveTo(-82, -206, -59, -221); ctx.quadraticCurveTo(-51, -205, -43, -214); ctx.quadraticCurveTo(-35, -197, -36, -187); ctx.closePath(); ctx.fill();

        ctx.fillStyle = "#f39a52";
        ctx.beginPath(); ctx.moveTo(-56, -169); ctx.quadraticCurveTo(-88, -169, -174, -150); ctx.quadraticCurveTo(-184, -146, -174, -137); ctx.quadraticCurveTo(-98, -133, -49, -152); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#f8b660";
        ctx.beginPath(); ctx.moveTo(-174, -150); ctx.quadraticCurveTo(-117, -149, -51, -157); ctx.lineTo(-52, -151); ctx.quadraticCurveTo(-112, -139, -174, -137); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#173b4c";
        ctx.beginPath(); ctx.arc(-73, -174, 5, 0, TAU); ctx.fill();
        ctx.fillStyle = "#fff6df";
        ctx.beginPath(); ctx.arc(-74, -175, 1.8, 0, TAU); ctx.fill();

        ctx.save();
        ctx.translate(-13, -125);
        ctx.rotate(flap);
        ctx.fillStyle = "#c9dade";
        ctx.beginPath(); ctx.moveTo(-2, -8); ctx.quadraticCurveTo(50, -43, 73, 4); ctx.quadraticCurveTo(52, 33, 5, 25); ctx.quadraticCurveTo(-9, 13, -2, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "rgba(61,101,115,.45)";
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(9 + i * 8, 2); ctx.quadraticCurveTo(35 + i * 8, -5, 59 + i * 6, 5); ctx.stroke(); }
        ctx.restore();

        ctx.strokeStyle = "#dc8146";
        ctx.lineWidth = 5;
        const legA = { x: -24 + Math.cos(pedal) * 22, y: -43 + Math.sin(pedal) * 20 };
        const legB = { x: -2 + Math.cos(pedal + Math.PI) * 20, y: -43 + Math.sin(pedal + Math.PI) * 19 };
        ctx.beginPath(); ctx.moveTo(-23, -62); ctx.lineTo(legA.x, legA.y); ctx.lineTo(-10, -14); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-4, -63); ctx.lineTo(legB.x, legB.y); ctx.lineTo(10, -12); ctx.stroke();
        ctx.strokeStyle = "#ea8842"; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(-11, -14); ctx.lineTo(-25, -10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, -12); ctx.lineTo(24, -7); ctx.stroke();

        ctx.fillStyle = "#eef0e9";
        ctx.strokeStyle = "#365f70";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(19, -135); ctx.quadraticCurveTo(60, -136, 80, -82); ctx.quadraticCurveTo(58, -79, 38, -102); ctx.lineTo(13, -119); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(21, -129); ctx.quadraticCurveTo(69, -118, 86, -70); ctx.quadraticCurveTo(61, -70, 45, -93); ctx.lineTo(18, -112); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "rgba(80,114,121,.46)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(38, -111); ctx.lineTo(74, -78); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(45, -101); ctx.lineTo(79, -71); ctx.stroke();

        if (wet) {
          ctx.fillStyle = "rgba(195,226,230,.86)";
          ctx.beginPath(); ctx.arc(-36, -202, 32, Math.PI * 1.08, Math.PI * 1.9); ctx.lineTo(-11, -197); ctx.quadraticCurveTo(-27, -218, -36, -202); ctx.fill();
          ctx.strokeStyle = "#8ec1c7"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-87, -101); ctx.lineTo(-91, -88); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(68, -151); ctx.lineTo(64, -138); ctx.stroke();
        }
        ctx.restore();
      }

      function drawFrame(t) {
        const elapsed = t - weatherStartedAt;
        const state = states[weatherIndex].key;
        drawSky(t, state);
        drawClouds(t, state);
        drawTinyBirds(t, state);
        drawDistantLandscape(t, state);
        drawSeaAndRoad(t, state);
        drawBackgroundMotion(t, state);

        const scale = clamp(Math.min(width / 930, height / 565), .72, 1.15);
        const riderX = width * .52 + Math.sin(t * .0011) * 10;
        const riderY = height * .79;
        drawBicycle(riderX, riderY, scale, t, state);
        drawPelican(riderX - 10 * scale, riderY - 12 * scale, scale, t, state);

        if (state === "rainy") {
          ctx.save();
          ctx.globalAlpha = .14;
          ctx.fillStyle = "#e4f2f3";
          ctx.fillRect(0, 0, width, height);
          ctx.restore();
        }

        const ratio = clamp(elapsed / 5000, 0, 1);
        progressBar.style.transform = "scaleX(" + (1 - ratio) + ")";
        const remaining = Math.max(0, Math.ceil((5000 - elapsed) / 1000));
        countdown.textContent = (remaining || 1) + " 秒后换天";
      }

      function changeWeather() {
        weatherIndex = (weatherIndex + 1) % states.length;
        weatherStartedAt = performance.now();
        const current = states[weatherIndex];
        label.textContent = current.label;
        icon.textContent = current.icon;
        note.textContent = current.note;
        legendItems.forEach(item => item.classList.toggle("active", item.dataset.weather === current.key));
        document.documentElement.style.setProperty("--accent", weatherIndex === 2 ? "#5d99ae" : weatherIndex === 1 ? "#778d9d" : "#f18a3f");
      }

      function loop(now) {
        lastFrame = now;
        if (now - weatherStartedAt >= 5000) changeWeather();
        drawFrame(now);
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resize, { passive: true });
      canvas.addEventListener("pointerdown", () => {
        weatherStartedAt = performance.now();
        note.textContent = "风从屏幕这边吹来，旅程继续。";
      }, { passive: true });
      resize();
      label.textContent = states[0].label;
      icon.textContent = states[0].icon;
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
