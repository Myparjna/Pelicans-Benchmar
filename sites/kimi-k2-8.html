<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>鹈鹕骑行日记 · 白天天气动画</title>
<style>
  :root{
    --sky-top:#79c7f2;
    --sky-bottom:#d3efff;
    --hill-back:#a8d8a0;
    --hill-front:#8ccb7f;
    --grass:#74c168;
    --grass-dark:#57a54d;
    --sun-opacity:1;
    --cloud-opacity:.35;
    --rain-opacity:0;
    --overlay:rgba(255,255,255,0);
    --badge-bg:rgba(255,255,255,.78);
    --badge-text:#2b3a4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#dfe9f0;
    overflow:hidden;
    min-height:100vh;
    min-height:100dvh;
  }
  .stage{position:fixed;inset:0;overflow:hidden;}
  .scene{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* 天气整体由 body class 控制，颜色平滑过渡 */
  body.sunny{
    --sky-top:#79c7f2; --sky-bottom:#d3efff;
    --hill-back:#a8d8a0; --hill-front:#8ccb7f;
    --grass:#74c168; --grass-dark:#57a54d;
    --sun-opacity:1; --cloud-opacity:.35; --rain-opacity:0; --overlay:rgba(255,255,255,0);
  }
  body.cloudy{
    --sky-top:#93a5b4; --sky-bottom:#cfdae2;
    --hill-back:#93b489; --hill-front:#759a68;
    --grass:#67975b; --grass-dark:#4e7a45;
    --sun-opacity:.12; --cloud-opacity:1; --rain-opacity:0; --overlay:rgba(60,72,84,.20);
  }
  body.rainy{
    --sky-top:#5a6b78; --sky-bottom:#93a2ad;
    --hill-back:#6e8a70; --hill-front:#57705b;
    --grass:#587f4e; --grass-dark:#426339;
    --sun-opacity:0; --cloud-opacity:1; --rain-opacity:1; --overlay:rgba(35,50,64,.34);
  }

  #sky{fill:url(#skyGrad);transition:opacity 1.2s ease;}
  #skyGrad .stopTop{stop-color:var(--sky-top);transition:stop-color 1.2s ease;}
  #skyGrad .stopBottom{stop-color:var(--sky-bottom);transition:stop-color 1.2s ease;}
  #hillBack{fill:var(--hill-back);transition:fill 1.2s ease;}
  #hillFront{fill:var(--hill-front);transition:fill 1.2s ease;}
  #grass{fill:var(--grass);transition:fill 1.2s ease;}
  #grassDark{fill:var(--grass-dark);transition:fill 1.2s ease;}
  #overlay{fill:var(--overlay);transition:fill 1.2s ease;}

  #sun{opacity:var(--sun-opacity);transition:opacity 1.2s ease;}
  #sunRays{transform-origin:820px 105px;animation:spin 28s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .cloud{opacity:var(--cloud-opacity);transition:opacity 1.2s ease;}
  #cloudA{animation:drift 34s linear infinite;}
  #cloudB{animation:drift 48s linear infinite;animation-delay:-16s;}
  #cloudC{animation:drift 40s linear infinite;animation-delay:-28s;}
  @keyframes drift{from{transform:translateX(-240px);}to{transform:translateX(1160px);}}

  #rain{opacity:var(--rain-opacity);transition:opacity 1.2s ease;}
  .drop{stroke:#aecfe9;stroke-width:2.4;stroke-linecap:round;animation:fall linear infinite;}
  @keyframes fall{from{transform:translate(0,-50px);}to{transform:translate(-46px,680px);}}

  #rider{transform-box:view-box;transform-origin:430px 500px;}
  @media (max-aspect-ratio: 3/4){
    #rider{transform:scale(.62);}
  }

  .badge{
    position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:10px;
    background:var(--badge-bg);color:var(--badge-text);
    padding:9px 16px;border-radius:999px;
    font-size:14px;letter-spacing:.05em;
    box-shadow:0 4px 14px rgba(20,40,60,.18);
    backdrop-filter:blur(6px);
    transition:background 1.2s ease,color 1.2s ease;
    user-select:none;
  }
  .badge .dot{width:10px;height:10px;border-radius:50%;background:#f6a821;transition:background .8s ease;}
  body.cloudy .badge .dot{background:#8fa1b0;}
  body.rainy .badge .dot{background:#4f7fb8;}

  .title{
    position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top));
    color:var(--badge-text);
    background:var(--badge-bg);
    padding:7px 14px;border-radius:12px;
    font-size:13px;letter-spacing:.12em;
    box-shadow:0 4px 14px rgba(20,40,60,.14);
    backdrop-filter:blur(6px);
    transition:background 1.2s ease,color 1.2s ease;
    user-select:none;
  }
</style>
</head>
<body class="sunny">
<div class="stage">
  <svg class="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice" aria-label="鹈鹕白天骑自行车动画">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop class="stopTop" offset="0" stop-color="#79c7f2"/>
        <stop class="stopBottom" offset="1" stop-color="#d3efff"/>
      </linearGradient>
    </defs>

    <!-- 天空 -->
    <rect id="sky" x="0" y="0" width="1000" height="600" fill="url(#skyGrad)"/>

    <!-- 太阳 -->
    <g id="sun">
      <g id="sunRays" stroke="#ffd75e" stroke-width="7" stroke-linecap="round">
        <line x1="820" y1="38" x2="820" y2="58"/>
        <line x1="820" y1="152" x2="820" y2="172"/>
        <line x1="753" y1="105" x2="773" y2="105"/>
        <line x1="867" y1="105" x2="887" y2="105"/>
        <line x1="773" y1="58" x2="787" y2="72"/>
        <line x1="853" y1="138" x2="867" y2="152"/>
        <line x1="867" y1="58" x2="853" y2="72"/>
        <line x1="787" y1="138" x2="773" y2="152"/>
      </g>
      <circle cx="820" cy="105" r="42" fill="#ffdf6b" stroke="#ffc93c" stroke-width="6"/>
    </g>

    <!-- 云 -->
    <g id="cloudA" class="cloud" fill="#ffffff">
      <g transform="translate(120,92)">
        <ellipse cx="0" cy="0" rx="52" ry="26"/>
        <ellipse cx="42" cy="8" rx="40" ry="20"/>
        <ellipse cx="-42" cy="10" rx="36" ry="18"/>
      </g>
    </g>
    <g id="cloudB" class="cloud" fill="#f2f6f9">
      <g transform="translate(430,150) scale(1.25)">
        <ellipse cx="0" cy="0" rx="52" ry="26"/>
        <ellipse cx="42" cy="8" rx="40" ry="20"/>
        <ellipse cx="-42" cy="10" rx="36" ry="18"/>
      </g>
    </g>
    <g id="cloudC" class="cloud" fill="#ffffff">
      <g transform="translate(720,68) scale(.85)">
        <ellipse cx="0" cy="0" rx="52" ry="26"/>
        <ellipse cx="42" cy="8" rx="40" ry="20"/>
        <ellipse cx="-42" cy="10" rx="36" ry="18"/>
      </g>
    </g>

    <!-- 远山 -->
    <path id="hillBack" d="M0,470 Q160,380 340,448 T700,432 Q880,398 1000,452 L1000,600 L0,600 Z" fill="#a8d8a0"/>
    <path id="hillFront" d="M0,502 Q220,436 460,492 T1000,486 L1000,600 L0,600 Z" fill="#8ccb7f"/>

    <!-- 雨层 -->
    <g id="rain"></g>

    <!-- 地面 -->
    <rect id="grass" x="0" y="520" width="1000" height="80" fill="#74c168"/>
    <rect id="grassDark" x="0" y="556" width="1000" height="44" fill="#57a54d"/>
    <g id="lane" stroke="#e8f6df" stroke-width="6" stroke-linecap="round" stroke-dasharray="46 74"></g>

    <!-- 行道树 -->
    <g id="trees"></g>

    <!-- 鹈鹕 + 自行车 -->
    <g id="rider">
      <!-- 后轮 -->
      <g id="wheelBack">
        <circle cx="300" cy="472" r="48" fill="none" stroke="#2f3b52" stroke-width="10"/>
        <g class="spokes" stroke="#8a97ab" stroke-width="3" stroke-linecap="round">
          <line x1="300" y1="472" x2="300" y2="428"/>
          <line x1="300" y1="472" x2="300" y2="516"/>
          <line x1="256" y1="472" x2="344" y2="472"/>
          <line x1="269" y1="441" x2="331" y2="503"/>
          <line x1="331" y1="441" x2="269" y2="503"/>
        </g>
        <circle cx="300" cy="472" r="7" fill="#2f3b52"/>
      </g>
      <!-- 前轮 -->
      <g id="wheelFront">
        <circle cx="560" cy="472" r="48" fill="none" stroke="#2f3b52" stroke-width="10"/>
        <g class="spokes" stroke="#8a97ab" stroke-width="3" stroke-linecap="round">
          <line x1="560" y1="472" x2="560" y2="428"/>
          <line x1="560" y1="472" x2="560" y2="516"/>
          <line x1="516" y1="472" x2="604" y2="472"/>
          <line x1="529" y1="441" x2="591" y2="503"/>
          <line x1="591" y1="441" x2="529" y2="503"/>
        </g>
        <circle cx="560" cy="472" r="7" fill="#2f3b52"/>
      </g>

      <!-- 车架 -->
      <g stroke="#e2574c" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="300" y1="472" x2="430" y2="472"/>
        <line x1="430" y1="472" x2="410" y2="398"/>
        <line x1="410" y1="398" x2="536" y2="392"/>
        <line x1="430" y1="472" x2="560" y2="472"/>
        <line x1="300" y1="472" x2="410" y2="398"/>
      </g>
      <!-- 车座与车把 -->
      <line x1="396" y1="394" x2="424" y2="394" stroke="#2f3b52" stroke-width="10" stroke-linecap="round"/>
      <path d="M536,392 L548,362 M548,362 Q560,352 576,360" stroke="#2f3b52" stroke-width="8" stroke-linecap="round" fill="none"/>

      <!-- 鹈鹕身体 -->
      <g id="bird">
        <!-- 尾羽 -->
        <path d="M352,352 L318,338 L326,358 L312,360 L340,376 Z" fill="#f4f7fa" stroke="#d7dee6" stroke-width="2" stroke-linejoin="round"/>
        <!-- 身体 -->
        <ellipse cx="402" cy="352" rx="56" ry="42" fill="#ffffff" stroke="#d7dee6" stroke-width="3" transform="rotate(-8 402 352)"/>
        <!-- 翅膀 -->
        <ellipse cx="394" cy="356" rx="36" ry="22" fill="#e9eef4" stroke="#cfd8e2" stroke-width="2" transform="rotate(-14 394 356)"/>
        <!-- 脖子 -->
        <path d="M436,332 Q458,318 462,296" stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none"/>
        <path d="M436,332 Q458,318 462,296" stroke="#d7dee6" stroke-width="26" stroke-linecap="round" fill="none" opacity=".45"/>
        <!-- 头 -->
        <circle cx="470" cy="288" r="26" fill="#ffffff" stroke="#d7dee6" stroke-width="3"/>
        <!-- 眼睛 -->
        <circle cx="480" cy="280" r="4.5" fill="#22303f"/>
        <circle cx="481.8" cy="278.4" r="1.5" fill="#ffffff"/>
        <!-- 上喙 -->
        <path d="M492,282 Q552,282 592,294 L590,304 Q544,298 490,294 Z" fill="#f6a821"/>
        <!-- 喉囊 -->
        <path d="M492,294 Q540,300 566,312 Q556,352 516,352 Q492,340 488,306 Z" fill="#f9b84e" stroke="#e79a1e" stroke-width="2" stroke-linejoin="round"/>
        <!-- 腿（动态更新） -->
        <line id="legA" x1="428" y1="386" x2="430" y2="446" stroke="#f6a821" stroke-width="9" stroke-linecap="round"/>
        <line id="legB" x1="428" y1="386" x2="430" y2="446" stroke="#e79a1e" stroke-width="9" stroke-linecap="round" opacity=".85"/>
        <ellipse id="footA" cx="430" cy="446" rx="13" ry="7" fill="#f6a821"/>
        <ellipse id="footB" cx="430" cy="446" rx="13" ry="7" fill="#e79a1e" opacity=".85"/>
        <!-- 曲柄（动态更新） -->
        <line id="crankA" x1="430" y1="472" x2="430" y2="446" stroke="#2f3b52" stroke-width="7" stroke-linecap="round"/>
        <line id="crankB" x1="430" y1="472" x2="430" y2="446" stroke="#2f3b52" stroke-width="7" stroke-linecap="round"/>
        <circle cx="430" cy="472" r="9" fill="#2f3b52"/>
      </g>
    </g>

    <!-- 天气压暗层 -->
    <rect id="overlay" x="0" y="0" width="1000" height="600" fill="rgba(255,255,255,0)" pointer-events="none"/>
  </svg>

  <div class="title">鹈鹕骑行日记</div>
  <div class="badge"><span class="dot"></span><span id="weatherText">晴天</span></div>
</div>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var body = document.body;
  var weatherText = document.getElementById('weatherText');
  var states = ['sunny','cloudy','rainy'];
  var labels = {sunny:'晴天', cloudy:'阴天', rainy:'雨天'};
  var idx = 0;

  /* 每 5 秒切换：晴天 → 阴天 → 雨天 → 晴天 */
  setInterval(function(){
    idx = (idx + 1) % states.length;
    var s = states[idx];
    body.className = s;
    weatherText.textContent = labels[s];
  }, 5000);

  /* 雨丝生成 */
  var rain = document.getElementById('rain');
  for(var i=0;i<90;i++){
    var d = document.createElementNS(NS,'line');
    var x = Math.random()*1120-60;
    var len = 16 + Math.random()*14;
    d.setAttribute('x1',x); d.setAttribute('x2',x-len*0.28);
    d.setAttribute('y1',0); d.setAttribute('y2',len);
    d.setAttribute('class','drop');
    d.style.animationDuration = (0.55 + Math.random()*0.5) + 's';
    d.style.animationDelay = (-Math.random()*1.4) + 's';
    d.style.opacity = 0.35 + Math.random()*0.5;
    rain.appendChild(d);
  }

  /* 车道虚线与行道树生成 */
  var lane = document.getElementById('lane');
  for(var j=0;j<12;j++){
    var seg = document.createElementNS(NS,'line');
    seg.setAttribute('x1',j*120); seg.setAttribute('x2',j*120+46);
    seg.setAttribute('y1',586); seg.setAttribute('y2',586);
    lane.appendChild(seg);
  }

  function makeTree(x, s){
    var g = document.createElementNS(NS,'g');
    g.setAttribute('class','tree');
    g.setAttribute('transform','translate('+x+',520) scale('+s+')');
    g.innerHTML =
      '<rect x="-7" y="-58" width="14" height="58" rx="5" fill="#8a5a34"/>' +
      '<circle cx="0" cy="-86" r="36" fill="#4e9e4a"/>' +
      '<circle cx="-26" cy="-66" r="24" fill="#5fae56"/>' +
      '<circle cx="26" cy="-66" r="24" fill="#5fae56"/>' +
      '<circle cx="-8" cy="-96" r="18" fill="#74c168"/>';
    return g;
  }
  var trees = document.getElementById('trees');
  trees.appendChild(makeTree(140,1));
  trees.appendChild(makeTree(620,.72));
  trees.appendChild(makeTree(920,1.12));

  /* 动画主循环：车轮、脚踏、地面与树的移动 */
  var wheelBack = document.getElementById('wheelBack');
  var wheelFront = document.getElementById('wheelFront');
  var crankA = document.getElementById('crankA');
  var crankB = document.getElementById('crankB');
  var legA = document.getElementById('legA');
  var legB = document.getElementById('legB');
  var footA = document.getElementById('footA');
  var footB = document.getElementById('footB');
  var bird = document.getElementById('bird');
  var treeEls = trees.querySelectorAll('.tree');

  var CX = 430, CY = 472, R = 27, HIPX = 428, HIPY = 384;
  var crank = 0, wheel = 0, offset = 0, last = performance.now();
  var SPEED = 165, CRANK_SPEED = 4.4;

  function pedalPos(a){
    return {x: CX + R*Math.cos(a), y: CY + R*Math.sin(a)};
  }
  function setSeg(el, x1, y1, x2, y2){
    el.setAttribute('x1',x1); el.setAttribute('y1',y1);
    el.setAttribute('x2',x2); el.setAttribute('y2',y2);
  }

  function frame(now){
    var dt = Math.min((now - last)/1000, .05);
    last = now;
    crank += CRANK_SPEED * dt;
    wheel += (SPEED/48) * dt;
    offset += SPEED * dt;

    var p1 = pedalPos(crank);
    var p2 = pedalPos(crank + Math.PI);
    setSeg(crankA, CX, CY, p1.x, p1.y);
    setSeg(crankB, CX, CY, p2.x, p2.y);
    setSeg(legA, HIPX, HIPY, p1.x, p1.y);
    setSeg(legB, HIPX, HIPY, p2.x, p2.y);
    footA.setAttribute('cx',p1.x); footA.setAttribute('cy',p1.y);
    footB.setAttribute('cx',p2.x); footB.setAttribute('cy',p2.y);

    wheelBack.setAttribute('transform','rotate('+(-wheel*57.2958)+' 300 472)');
    wheelFront.setAttribute('transform','rotate('+(-wheel*57.2958)+' 560 472)');

    lane.setAttribute('transform','translate('+(-(offset%120))+',0)');
    for(var k=0;k<treeEls.length;k++){
      var m = treeEls[k].getAttribute('transform').match(/translate\(([-\d.]+),/);
      var x = parseFloat(m[1]) - SPEED*dt*(k===1?.85:1);
      if(x < -180) x += 1180;
      treeEls[k].setAttribute('transform','translate('+x+',520) scale('+(k===0?1:k===1?.72:1.12)+')');
    }

    bird.setAttribute('transform','translate(0,'+(Math.sin(crank*2)*2.6)+')');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
