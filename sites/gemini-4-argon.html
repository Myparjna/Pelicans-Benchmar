<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鹈鹕骑自行车 - 天气循环动画</title>
  <style>
    :root {
      /* 晴天默认配色 */
      --sky-top: #38bdf8;
      --sky-bottom: #bae6fd;
      --sun-opacity: 1;
      --sun-scale: 1;
      --cloud-color: #ffffff;
      --cloud-shadow: #e2e8f0;
      --cloud-opacity: 0.9;
      --hill-far: #86efac;
      --hill-near: #4ade80;
      --road-color: #64748b;
      --road-line: #f8fafc;
      --ambient-filter: brightness(1) contrast(1);
    }

    body.weather-cloudy {
      --sky-top: #64748b;
      --sky-bottom: #cbd5e1;
      --sun-opacity: 0.15;
      --sun-scale: 0.85;
      --cloud-color: #94a3b8;
      --cloud-shadow: #64748b;
      --cloud-opacity: 0.98;
      --hill-far: #4ade80;
      --hill-near: #22c55e;
      --road-color: #475569;
      --road-line: #cbd5e1;
      --ambient-filter: brightness(0.88) contrast(0.95);
    }

    body.weather-rainy {
      --sky-top: #334155;
      --sky-bottom: #64748b;
      --sun-opacity: 0;
      --sun-scale: 0.6;
      --cloud-color: #475569;
      --cloud-shadow: #334155;
      --cloud-opacity: 1;
      --hill-far: #22c55e;
      --hill-near: #16a34a;
      --road-color: #334155;
      --road-line: #94a3b8;
      --ambient-filter: brightness(0.75) contrast(1.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--sky-top);
    }

    /* 主舞台容器 */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
      transition: background 1.5s ease, filter 1.5s ease;
    }

    /* 顶部天气状态指示器 */
    .hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 18px 12px;
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      min-width: 210px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .hud:active {
      transform: translateX(-50%) scale(0.96);
    }

    .hud-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    body.weather-rainy .hud-header {
      color: #f8fafc;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(15, 23, 42, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #f59e0b;
      border-radius: 2px;
      transition: background-color 0.5s ease;
    }

    body.weather-cloudy .progress-fill {
      background: #38bdf8;
    }

    body.weather-rainy .progress-fill {
      background: #60a5fa;
    }

    /* 太阳 */
    .sun-wrapper {
      position: absolute;
      top: 10%;
      right: 12%;
      width: clamp(70px, 12vmax, 130px);
      height: clamp(70px, 12vmax, 130px);
      opacity: var(--sun-opacity);
      transform: scale(var(--sun-scale));
      transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
    }

    .sun {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #fef08a 20%, #facc15 65%, #f59e0b 100%);
      box-shadow: 0 0 50px #fde047, 0 0 90px rgba(250, 204, 21, 0.6);
      animation: sunPulse 4s ease-in-out infinite alternate;
    }

    @keyframes sunPulse {
      0% { transform: scale(0.96); box-shadow: 0 0 40px #fde047, 0 0 75px rgba(250, 204, 21, 0.5); }
      100% { transform: scale(1.05); box-shadow: 0 0 65px #fde047, 0 0 110px rgba(250, 204, 21, 0.8); }
    }

    /* 云朵层 */
    .clouds-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55%;
      z-index: 5;
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      background: var(--cloud-color);
      border-radius: 100px;
      opacity: var(--cloud-opacity);
      box-shadow: inset 0 -8px 0 var(--cloud-shadow), 0 8px 20px rgba(0, 0, 0, 0.06);
      transition: background 1.5s ease, box-shadow 1.5s ease, opacity 1.5s ease, transform 1.5s ease;
      animation: floatCloud linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: var(--cloud-color);
      border-radius: 50%;
      transition: background 1.5s ease;
    }

    .cloud::before {
      width: 55%;
      height: 130%;
      top: -55%;
      left: 15%;
    }

    .cloud::after {
      width: 42%;
      height: 100%;
      top: -38%;
      right: 15%;
    }

    .c1 { width: 130px; height: 42px; top: 14%; animation-duration: 26s; animation-delay: -5s; }
    .c2 { width: 170px; height: 54px; top: 24%; animation-duration: 34s; animation-delay: -18s; }
    .c3 { width: 110px; height: 36px; top: 10%; animation-duration: 21s; animation-delay: -11s; }
    .c4 { width: 200px; height: 64px; top: 18%; animation-duration: 40s; animation-delay: -29s; }
    /* 阴雨天额外密集的云层 */
    .c-extra {
      opacity: 0;
    }
    body.weather-cloudy .c-extra,
    body.weather-rainy .c-extra {
      opacity: 0.95;
    }
    .c5 { width: 180px; height: 58px; top: 8%; animation-duration: 28s; animation-delay: -7s; }
    .c6 { width: 220px; height: 68px; top: 28%; animation-duration: 32s; animation-delay: -21s; }

    @keyframes floatCloud {
      0% { left: 110%; }
      100% { left: -280px; }
    }

    /* 远景山丘 */
    .hills-far {
      position: absolute;
      bottom: 24%;
      left: 0;
      width: 200%;
      height: 28%;
      z-index: 6;
      background: radial-gradient(circle at 25% 100%, var(--hill-far) 60%, transparent 60.5%),
                  radial-gradient(circle at 75% 100%, var(--hill-far) 60%, transparent 60.5%);
      background-size: 50% 100%;
      animation: moveScenery 22s linear infinite;
      transition: filter 1.5s ease;
      filter: var(--ambient-filter);
    }

    .hills-near {
      position: absolute;
      bottom: 20%;
      left: 0;
      width: 200%;
      height: 20%;
      z-index: 7;
      background: radial-gradient(circle at 20% 100%, var(--hill-near) 55%, transparent 55.5%),
                  radial-gradient(circle at 65% 100%, var(--hill-near) 65%, transparent 65.5%);
      background-size: 50% 100%;
      animation: moveScenery 12s linear infinite;
      transition: filter 1.5s ease;
      filter: var(--ambient-filter);
    }

    @keyframes moveScenery {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* 移动的树木与路标背景 */
    .trees-layer {
      position: absolute;
      bottom: 22%;
      left: 0;
      width: 100%;
      height: 160px;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
      filter: var(--ambient-filter);
      transition: filter 1.5s ease;
    }

    .tree {
      position: absolute;
      bottom: 0;
      width: 60px;
      height: 110px;
      animation: passBy linear infinite;
    }

    .tree1 { animation-duration: 6.5s; animation-delay: 0s; transform: scale(0.95); }
    .tree2 { animation-duration: 6.5s; animation-delay: -2.2s; transform: scale(0.75); }
    .tree3 { animation-duration: 6.5s; animation-delay: -4.5s; transform: scale(1.1); }

    @keyframes passBy {
      0% { left: 110%; }
      100% { left: -120px; }
    }

    /* 公路与草地底部 */
    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 23%;
      background: var(--road-color);
      z-index: 10;
      border-top: 10px solid #15803d;
      transition: background 1.5s ease;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* 路面虚线 */
    .road-lines {
      width: 200%;
      height: 8px;
      background: repeating-linear-gradient(
        to right,
        var(--road-line) 0,
        var(--road-line) 60px,
        transparent 60px,
        transparent 130px
      );
      animation: roadMove 0.75s linear infinite;
      opacity: 0.85;
    }

    @keyframes roadMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-130px); }
    }

    /* 雨天地面水洼反光 */
    .puddles {
      position: absolute;
      bottom: 12%;
      left: 0;
      width: 100%;
      height: 20px;
      z-index: 11;
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
    }

    body.weather-rainy .puddles {
      opacity: 0.55;
    }

    /* 鹈鹕与自行车核心容器 */
    .pelican-stage {
      position: absolute;
      bottom: 11%;
      left: 50%;
      transform: translateX(-50%);
      width: min(88vw, 430px);
      aspect-ratio: 440 / 410;
      z-index: 20;
      filter: drop-shadow(0 14px 12px rgba(0, 0, 0, 0.22));
    }

    .pelican-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* SVG 内部关键帧动画 */
    .wheel-spin {
      transform-box: view-box;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 车身与鹈鹕身体轻快颠簸 */
    .bike-bounce {
      animation: bounce 0.425s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-4.5px) rotate(-0.4deg); }
    }

    /* 鹈鹕大喉囊弹性抖动 */
    .pouch-jiggle {
      transform-origin: 255px 125px;
      animation: jiggle 0.425s ease-in-out infinite alternate;
    }

    @keyframes jiggle {
      0% { transform: rotate(0deg) scaleY(1); }
      100% { transform: rotate(2.5deg) scaleY(1.04); }
    }

    /* 头顶羽毛迎风摆动 */
    .crest-wave {
      transform-origin: 215px 68px;
      animation: wave 0.5s ease-in-out infinite alternate;
    }

    @keyframes wave {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-12deg); }
    }

    /* 围巾飘动 */
    .scarf-flutter {
      transform-origin: 212px 132px;
      animation: scarfWave 0.35s ease-in-out infinite alternate;
    }

    @keyframes scarfWave {
      0% { transform: rotate(-4deg) scaleX(0.96); }
      100% { transform: rotate(8deg) scaleX(1.05); }
    }

    /* 雨天水花飞溅 */
    .wheel-splash {
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    body.weather-rainy .wheel-splash {
      opacity: 0.8;
    }

    /* 雨幕 Canvas */
    #rain-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    body.weather-rainy #rain-canvas {
      opacity: 1;
    }

    /* 响应式：针对手机竖屏与不同宽高比微调 */
    @media (orientation: portrait) {
      .pelican-stage {
        width: min(92vw, 390px);
        bottom: 14%;
      }
      .ground {
        height: 26%;
      }
      .hills-near {
        bottom: 23%;
      }
      .hills-far {
        bottom: 27%;
      }
      .trees-layer {
        bottom: 25%;
      }
      .sun-wrapper {
        top: 12%;
        right: 8%;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .pelican-stage {
        width: min(55vh, 300px);
        bottom: 9%;
      }
      .hud {
        top: 8px;
        padding: 5px 14px 8px;
        transform: translateX(-50%) scale(0.88);
      }
    }
  </style>
</head>
<body class="weather-sunny">

  <div class="scene">
    <!-- 顶部天气控制与5秒倒计时面板 -->
    <div class="hud" id="weatherHud" title="点击可立即切换下一个天气">
      <div class="hud-header">
        <span id="weatherIcon">☀️</span>
        <span id="weatherText">晴天 · 5秒自动切换</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- 太阳 -->
    <div class="sun-wrapper">
      <div class="sun"></div>
    </div>

    <!-- 动态云层 -->
    <div class="clouds-container">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="cloud c4"></div>
      <div class="cloud c5 c-extra"></div>
      <div class="cloud c6 c-extra"></div>
    </div>

    <!-- 远山与近山 -->
    <div class="hills-far"></div>
    <div class="hills-near"></div>

    <!-- 沿途树木 -->
    <div class="trees-layer">
      <svg class="tree tree1" viewBox="0 0 60 110">
        <rect x="25" y="70" width="10" height="40" fill="#78350f" rx="2"/>
        <circle cx="30" cy="50" r="24" fill="#15803d"/>
        <circle cx="18" cy="62" r="16" fill="#166534"/>
        <circle cx="42" cy="60" r="18" fill="#22c55e"/>
      </svg>
      <svg class="tree tree2" viewBox="0 0 60 110">
        <rect x="26" y="75" width="8" height="35" fill="#78350f" rx="2"/>
        <polygon points="30,15 8,78 52,78" fill="#15803d"/>
        <polygon points="30,15 30,78 52,78" fill="#166534"/>
      </svg>
      <svg class="tree tree3" viewBox="0 0 60 110">
        <rect x="25" y="70" width="10" height="40" fill="#78350f" rx="2"/>
        <circle cx="30" cy="46" r="25" fill="#16a34a"/>
        <circle cx="40" cy="58" r="18" fill="#15803d"/>
        <circle cx="18" cy="56" r="18" fill="#22c55e"/>
      </svg>
    </div>

    <!-- 鹈鹕骑自行车 SVG 主体 -->
    <div class="pelican-stage">
      <svg class="pelican-svg" viewBox="0 0 440 410" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 鹈鹕大嘴渐变 -->
          <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="20%">
            <stop offset="0%" stop-color="#fde047"/>
            <stop offset="60%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </linearGradient>
          <!-- 喉囊渐变 -->
          <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#fed7aa"/>
            <stop offset="50%" stop-color="#fdba74"/>
            <stop offset="100%" stop-color="#f97316"/>
          </linearGradient>
          <!-- 车架金属红渐变 -->
          <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#be123c"/>
          </linearGradient>
        </defs>

        <!-- 车底阴影 -->
        <ellipse cx="215" cy="382" rx="165" ry="10" fill="rgba(15, 23, 42, 0.28)" />

        <!-- ================= 后轮与前轮 ================= -->
        <!-- 后轮 (中心: 105, 315) -->
        <g transform="translate(105, 315)">
          <g class="wheel-spin">
            <circle cx="0" cy="0" r="56" fill="none" stroke="#1e293b" stroke-width="11"/>
            <circle cx="0" cy="0" r="49" fill="none" stroke="#cbd5e1" stroke-width="3.5"/>
            <!-- 轮辐 -->
            <g stroke="#94a3b8" stroke-width="2">
              <line x1="-48" y1="0" x2="48" y2="0"/>
              <line x1="0" y1="-48" x2="0" y2="48"/>
              <line x1="-34" y1="-34" x2="34" y2="34"/>
              <line x1="-34" y1="34" x2="34" y2="-34"/>
              <line x1="-44" y1="-19" x2="44" y2="19"/>
              <line x1="-19" y1="-44" x2="19" y2="44"/>
            </g>
            <!-- 气门嘴细节 -->
            <rect x="-3" y="42" width="6" height="8" rx="2" fill="#facc15"/>
          </g>
          <circle cx="0" cy="0" r="9" fill="#475569"/>
        </g>

        <!-- 前轮 (中心: 325, 315) -->
        <g transform="translate(325, 315)">
          <g class="wheel-spin">
            <circle cx="0" cy="0" r="56" fill="none" stroke="#1e293b" stroke-width="11"/>
            <circle cx="0" cy="0" r="49" fill="none" stroke="#cbd5e1" stroke-width="3.5"/>
            <g stroke="#94a3b8" stroke-width="2">
              <line x1="-48" y1="0" x2="48" y2="0"/>
              <line x1="0" y1="-48" x2="0" y2="48"/>
              <line x1="-34" y1="-34" x2="34" y2="34"/>
              <line x1="-34" y1="34" x2="34" y2="-34"/>
              <line x1="-44" y1="-19" x2="44" y2="19"/>
              <line x1="-19" y1="-44" x2="19" y2="44"/>
            </g>
            <rect x="-3" y="-48" width="6" height="8" rx="2" fill="#facc15"/>
          </g>
          <circle cx="0" cy="0" r="9" fill="#475569"/>
        </g>

        <!-- 雨天车轮溅起的水花 -->
        <g class="wheel-splash" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M 45,355 Q 30,340 18,350" />
          <path d="M 52,368 Q 35,360 22,370" />
          <path d="M 270,358 Q 255,342 245,352" />
          <path d="M 278,370 Q 260,362 248,372" />
        </g>

        <!-- ================= 远端右腿 (在车架后方) ================= -->
        <g id="backLegGroup">
          <!-- 大腿与小腿由 JS 实时驱动连接曲柄 -->
          <line id="backThigh" x1="168" y1="215" x2="210" y2="260" stroke="#ea580c" stroke-width="11" stroke-linecap="round"/>
          <line id="backShin" x1="210" y1="260" x2="195" y2="315" stroke="#ea580c" stroke-width="9" stroke-linecap="round"/>
          <!-- 后侧脚蹼与踏板 -->
          <path id="backFoot" d="M 185,315 L 222,315 L 214,305 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2" stroke-linejoin="round"/>
          <rect id="backPedal" x="183" y="313" width="26" height="7" rx="3" fill="#334155"/>
        </g>

        <!-- ================= 自行车架与主体颠簸组 ================= -->
        <g class="bike-bounce">
          <!-- 后轮挡泥板 -->
          <path d="M 44,295 A 63,63 0 0,1 158,278" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
          <!-- 前轮挡泥板 -->
          <path d="M 275,275 A 63,63 0 0,1 372,272" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>

          <!-- 自行车车架 -->
          <g stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- 后下叉 -->
            <line x1="105" y1="315" x2="195" y2="315"/>
            <!-- 后上叉 -->
            <line x1="105" y1="315" x2="162" y2="232"/>
            <!-- 立管 -->
            <line x1="195" y1="315" x2="155" y2="215"/>
            <!-- 下管 -->
            <line x1="195" y1="315" x2="288" y2="232"/>
            <!-- 上管 -->
            <line x1="162" y1="232" x2="284" y2="225"/>
            <!-- 前叉 -->
            <line x1="325" y1="315" x2="280" y2="205"/>
          </g>

          <!-- 车把立管与复古弯把 -->
          <path d="M 280,205 L 268,172 Q 264,160 250,162 L 236,164" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
          <!-- 车把胶套 -->
          <rect x="224" y="159" width="20" height="10" rx="5" fill="#1e293b"/>
          <!-- 复古小车铃 -->
          <path d="M 255,152 A 9,9 0 0,1 273,152 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
          <!-- 车头复古大灯 -->
          <path d="M 286,202 L 302,196 L 302,214 L 286,208 Z" fill="#fef08a"/>
          <circle cx="286" cy="205" r="6" fill="#475569"/>

          <!-- 链条护罩与牙盘 -->
          <path d="M 105,303 L 195,294 A 21,21 0 0,1 195,336 L 105,327 A 12,12 0 0,1 105,303 Z" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4"/>
          <circle cx="195" cy="315" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
          <circle cx="195" cy="315" r="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>

          <!-- 车座 -->
          <path d="M 136,212 Q 158,218 178,210 Q 184,205 172,202 Q 150,204 138,200 Q 128,204 136,212 Z" fill="#1e293b"/>

          <!-- ================= 鹈鹕身体 ================= -->
          <!-- 尾羽 -->
          <path d="M 118,195 L 92,182 L 102,198 L 88,204 L 116,208 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>

          <!-- 肥胖可爱的白色躯干 -->
          <path d="M 116,200 C 110,160 155,128 202,135 C 232,140 242,175 224,206 C 208,232 145,232 116,200 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
          <!-- 肚子高光阴影 -->
          <path d="M 125,202 C 150,224 202,222 218,198" fill="none" stroke="#f1f5f9" stroke-width="6" stroke-linecap="round"/>

          <!-- 飘动的红色小围巾 -->
          <g class="scarf-flutter">
            <path d="M 185,134 Q 150,128 125,142 L 132,155 Q 158,142 190,145 Z" fill="#ef4444"/>
            <path d="M 192,132 C 198,130 220,132 224,140 C 220,148 195,148 190,142 Z" fill="#dc2626"/>
          </g>

          <!-- 鹈鹕修长弯曲的脖子与头部 -->
          <path d="M 192,142 C 185,112 190,82 208,68 C 225,56 246,66 246,88 C 246,105 225,125 218,144 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2.5"/>

          <!-- 头顶呆毛羽毛 -->
          <g class="crest-wave">
            <path d="M 212,68 Q 192,52 184,62 Q 196,66 206,72" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
            <path d="M 206,72 Q 186,64 180,74 Q 194,76 205,78" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
          </g>

          <!-- 鹈鹕标志性超大喉囊 (Pouch) -->
          <g class="pouch-jiggle">
            <path d="M 240,88 C 285,88 345,86 364,88 C 358,136 305,162 258,150 C 234,144 226,118 236,96 Z" fill="url(#pouchGrad)" stroke="#ea580c" stroke-width="2.5"/>
            <!-- 喉囊纹理线条 -->
            <path d="M 252,105 Q 290,138 345,102" fill="none" stroke="#ea580c" stroke-width="1.8" opacity="0.45"/>
            <path d="M 245,120 Q 285,150 330,122" fill="none" stroke="#ea580c" stroke-width="1.8" opacity="0.35"/>
            <!-- 喉囊里藏着一条露出尾巴的小鱼（趣味细节） -->
            <path d="M 332,92 L 348,76 L 345,86 L 355,83 L 338,95 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
          </g>

          <!-- 上喙 (长嘴) -->
          <path d="M 238,76 C 282,72 338,72 368,78 C 374,80 374,90 366,92 C 362,93 360,89 356,88 C 320,86 275,90 238,92 Z" fill="url(#beakGrad)" stroke="#c2410c" stroke-width="2"/>

          <!-- 眼睛与脸颊 -->
          <circle cx="228" cy="78" r="8.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
          <circle cx="230" cy="78" r="4.5" fill="#0f172a"/>
          <circle cx="232" cy="76" r="1.8" fill="#ffffff"/>
          <!-- 腮红 -->
          <ellipse cx="222" cy="90" rx="6" ry="3.5" fill="#fb7185" opacity="0.55"/>

          <!-- 帅气骑行风镜 / 小竹蜻蜓帽（随天气增添趣味） -->
          <path d="M 204,67 Q 225,55 245,67 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
          <path d="M 235,63 L 256,66 L 242,69 Z" fill="#1d4ed8"/>
        </g>

        <!-- ================= 近端左腿与曲柄 (在车架前方) ================= -->
        <g id="frontLegGroup">
          <!-- 曲柄连杆 -->
          <line id="crankArm" x1="195" y1="315" x2="195" y2="315" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
          <circle cx="195" cy="315" r="6" fill="#1e293b"/>

          <!-- 左大腿与左小腿 -->
          <line id="frontThigh" x1="168" y1="215" x2="215" y2="260" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
          <line id="frontShin" x1="215" y1="260" x2="195" y2="315" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>

          <!-- 鹈鹕大腿根部羽毛遮罩 -->
          <circle id="hipFeather" cx="168" cy="212" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

          <!-- 左脚大脚蹼与踏板 -->
          <path id="frontFoot" d="M 185,315 L 225,315 L 216,304 Z" fill="#fb923c" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
          <rect id="frontPedal" x="183" y="313" width="28" height="8" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
        </g>

        <!-- ================= 鹈鹕翅膀扶住车把 (最顶层) ================= -->
        <g class="bike-bounce">
          <path d="M 168,162 C 155,190 192,208 234,166 C 240,160 232,152 222,156 C 198,172 184,166 168,162 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round"/>
          <!-- 翅膀羽毛分界线 -->
          <path d="M 178,182 Q 202,185 224,164" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M 188,190 Q 208,190 230,166" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <!-- 公路层 -->
    <div class="ground">
      <div class="road-lines"></div>
    </div>

    <!-- 雨天水洼层 -->
    <svg class="puddles" viewBox="0 0 1000 30" preserveAspectRatio="none">
      <ellipse cx="220" cy="15" rx="90" ry="6" fill="#93c5fd"/>
      <ellipse cx="580" cy="18" rx="130" ry="7" fill="#93c5fd"/>
      <ellipse cx="860" cy="14" rx="75" ry="5" fill="#93c5fd"/>
    </svg>

    <!-- 雨滴特效画布 -->
    <canvas id="rain-canvas"></canvas>
  </div>

  <script>
    /**
     * 1. 天气每 5 秒自动切换系统：晴天 -> 阴天 -> 雨天 -> 晴天
     */
    const weatherStates = [
      { key: 'sunny',  name: '晴天', icon: '☀️', className: 'weather-sunny' },
      { key: 'cloudy', name: '阴天', icon: '☁️', className: 'weather-cloudy' },
      { key: 'rainy',  name: '雨天', icon: '🌧️', className: 'weather-rainy' }
    ];

    const SWITCH_INTERVAL = 5000; // 5秒切换一次
    let currentWeatherIndex = 0;
    let lastSwitchTime = performance.now();

    const bodyEl = document.body;
    const weatherIconEl = document.getElementById('weatherIcon');
    const weatherTextEl = document.getElementById('weatherText');
    const progressFillEl = document.getElementById('progressFill');
    const weatherHudEl = document.getElementById('weatherHud');

    function applyWeather(index) {
      const state = weatherStates[index];
      bodyEl.className = state.className;
      weatherIconEl.textContent = state.icon;
      const nextState = weatherStates[(index + 1) % weatherStates.length];
      weatherTextEl.textContent = `${state.name} · 下一个是${nextState.name}`;
    }

    function nextWeather() {
      currentWeatherIndex = (currentWeatherIndex + 1) % weatherStates.length;
      applyWeather(currentWeatherIndex);
      lastSwitchTime = performance.now();
    }

    // 支持点击顶部胶囊提前手动体验切换
    weatherHudEl.addEventListener('click', () => {
      nextWeather();
    });

    // 初始化默认晴天
    applyWeather(0);

    /**
     * 2. 鹈鹕双腿逆运动学 (IK) 真实踩踏板动画
     */
    const crankCenter = { x: 195, y: 315 };
    const crankRadius = 22;
    const baseHip = { x: 168, y: 214 };
    const thighLength = 58;
    const shinLength = 60;

    // SVG 元素引用
    const crankArm = document.getElementById('crankArm');
    const frontThigh = document.getElementById('frontThigh');
    const frontShin = document.getElementById('frontShin');
    const frontFoot = document.getElementById('frontFoot');
    const frontPedal = document.getElementById('frontPedal');
    const hipFeather = document.getElementById('hipFeather');

    const backThigh = document.getElementById('backThigh');
    const backShin = document.getElementById('backShin');
    const backFoot = document.getElementById('backFoot');
    const backPedal = document.getElementById('backPedal');

    // 根据髋关节位置与踏板位置求解膝盖坐标（保证膝盖朝前弯曲）
    function solveKnee(hipX, hipY, footX, footY, L1, L2) {
      const dx = footX - hipX;
      const dy = footY - hipY;
      let d = Math.hypot(dx, dy);
      const maxReach = L1 + L2 - 0.5;
      if (d > maxReach) d = maxReach;

      const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));

      const mx = hipX + (a * dx) / d;
      const my = hipY + (a * dy) / d;

      // 朝右侧（车头方向）弯曲膝盖
      const kneeX = mx + (h * dy) / d;
      const kneeY = my - (h * dx) / d;
      return { x: kneeX, y: kneeY };
    }

    function updateLegElement(thighEl, shinEl, footEl, pedalEl, hip, knee, pedal) {
      thighEl.setAttribute('x1', hip.x);
      thighEl.setAttribute('y1', hip.y);
      thighEl.setAttribute('x2', knee.x);
      thighEl.setAttribute('y2', knee.y);

      shinEl.setAttribute('x1', knee.x);
      shinEl.setAttribute('y1', knee.y);
      shinEl.setAttribute('x2', pedal.x);
      shinEl.setAttribute('y2', pedal.y);

      // 踏板水平保持
      pedalEl.setAttribute('x', pedal.x - 13);
      pedalEl.setAttribute('y', pedal.y - 3);

      // 鸭蹼脚掌贴合在踏板上方
      const footPath = `M ${pedal.x - 10},${pedal.y + 1} L ${pedal.x + 28},${pedal.y + 1} L ${pedal.x + 18},${pedal.y - 11} L ${pedal.x - 4},${pedal.y - 7} Z`;
      footEl.setAttribute('d', footPath);
    }

    /**
     * 3. 雨天 Canvas 粒子动画
     */
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');
    let raindrops = [];
    let splashes = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initRain();
    }

    function initRain() {
      const count = Math.floor((canvas.width * canvas.height) / 6500);
      raindrops = [];
      for (let i = 0; i < count; i++) {
        raindrops.push({
          x: Math.random() * canvas.width * 1.2,
          y: Math.random() * canvas.height,
          len: 16 + Math.random() * 16,
          speed: 13 + Math.random() * 8,
          wind: -3.5 - Math.random() * 1.5,
          opacity: 0.35 + Math.random() * 0.45
        });
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isRainy = weatherStates[currentWeatherIndex].key === 'rainy';
      if (!isRainy) return;

      ctx.strokeStyle = 'rgba(224, 242, 254, 0.75)';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';

      const groundY = canvas.height * 0.88;

      for (let i = 0; i < raindrops.length; i++) {
        const r = raindrops[i];
        ctx.globalAlpha = r.opacity;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x + r.wind * 1.6, r.y + r.len);
        ctx.stroke();

        r.x += r.wind;
        r.y += r.speed;

        if (r.y > groundY) {
          // 地面水花
          if (Math.random() < 0.25 && splashes.length < 60) {
            splashes.push({
              x: r.x,
              y: groundY - Math.random() * 35,
              radius: 1,
              maxRadius: 6 + Math.random() * 8,
              opacity: 0.7
            });
          }
          r.y = -20;
          r.x = Math.random() * (canvas.width * 1.25);
        }
      }

      // 绘制地面涟漪圈
      for (let i = splashes.length - 1; i >= 0; i--) {
        const s = splashes[i];
        ctx.globalAlpha = s.opacity;
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.radius * 2, s.radius * 0.5, 0, 0, Math.PI * 2);
        ctx.stroke();

        s.radius += 0.35;
        s.opacity -= 0.03;
        if (s.opacity <= 0) {
          splashes.splice(i, 1);
        }
      }
    }

    /**
     * 4. 主动画循环
     */
    function animate(now) {
      // A. 检查5秒天气自动切换与进度条更新
      const elapsed = now - lastSwitchTime;
      if (elapsed >= SWITCH_INTERVAL) {
        nextWeather();
      } else {
        const pct = Math.min(100, (elapsed / SWITCH_INTERVAL) * 100);
        progressFillEl.style.width = `${pct}%`;
      }

      // B. 计算曲柄角度与双腿运动 (周期与车轮转速匹配)
      const angle = (now * 0.0074) % (Math.PI * 2);

      // 随车身颠簸微调髋部高度
      const bounceOffset = Math.sin(now * 0.0074 * 2) * 2.2;
      const currentHip = { x: baseHip.x, y: baseHip.y + bounceOffset };
      hipFeather.setAttribute('cy', currentHip.y - 2);

      // 前侧左踏板坐标
      const frontPedalPos = {
        x: crankCenter.x + Math.cos(angle) * crankRadius,
        y: crankCenter.y + Math.sin(angle) * crankRadius
      };
      // 后侧右踏板坐标 (相差180度)
      const backPedalPos = {
        x: crankCenter.x + Math.cos(angle + Math.PI) * crankRadius,
        y: crankCenter.y + Math.sin(angle + Math.PI) * crankRadius
      };

      // 更新前侧曲柄杆
      crankArm.setAttribute('x2', frontPedalPos.x);
      crankArm.setAttribute('y2', frontPedalPos.y);

      // 求解并更新前后双腿
      const frontKnee = solveKnee(currentHip.x, currentHip.y, frontPedalPos.x, frontPedalPos.y, thighLength, shinLength);
      updateLegElement(frontThigh, frontShin, frontFoot, frontPedal, currentHip, frontKnee, frontPedalPos);

      const backKnee = solveKnee(currentHip.x, currentHip.y, backPedalPos.x, backPedalPos.y, thighLength, shinLength);
      updateLegElement(backThigh, backShin, backFoot, backPedal, currentHip, backKnee, backPedalPos);

      // C. 渲染雨天粒子
      renderRain();

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
