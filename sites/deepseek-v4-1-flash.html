<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>鹈鹕骑行</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d6e9f4;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    isolation: isolate;
  }

  /* ============ 天空层 ============ */
  .sky {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.4s ease;
    will-change: opacity;
  }
  .sky--sunny {
    background: linear-gradient(180deg, #4f9fd4 0%, #86c4e7 32%, #c3e5f6 64%, #eaf7fc 100%);
  }
  .sky--cloudy {
    background: linear-gradient(180deg, #8fa4b6 0%, #b3c4d2 34%, #d7e0e8 68%, #e9eff3 100%);
  }
  .sky--rainy {
    background: linear-gradient(180deg, #6b7d90 0%, #8b9cae 32%, #aebac6 68%, #ccd5dc 100%);
  }
  .sky--sunny { opacity: 1; }
  .stage[data-weather="cloudy"] .sky--cloudy,
  .stage[data-weather="rainy"]  .sky--cloudy { opacity: 1; }
  .stage[data-weather="rainy"]  .sky--rainy  { opacity: 1; }

  /* ============ 太阳 ============ */
  .sun {
    position: absolute;
    top: 10%;
    right: 13%;
    width: clamp(64px, 8.5vw, 124px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%,
      #fffdf3 0%, #ffeaa0 34%, #ffd05e 64%,
      rgba(255, 208, 94, 0.5) 82%, rgba(255, 208, 94, 0) 100%);
    transition: opacity 1.4s ease, transform 1.4s ease, filter 1.4s ease;
    animation: sunPulse 5s ease-in-out infinite;
    z-index: 2;
  }
  .sun::after {
    content: "";
    position: absolute;
    inset: -46%;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg,
      rgba(255, 226, 142, 0.5) 0deg 2.2deg, transparent 2.2deg 15deg);
    -webkit-mask: radial-gradient(circle, transparent 42%, #000 47%, #000 62%, transparent 70%);
            mask: radial-gradient(circle, transparent 42%, #000 47%, #000 62%, transparent 70%);
    animation: raySpin 72s linear infinite;
  }
  @keyframes raySpin { to { transform: rotate(360deg); } }
  @keyframes sunPulse {
    0%, 100% { box-shadow: 0 0 clamp(28px, 6vw, 78px) rgba(255, 206, 92, 0.5); }
    50%      { box-shadow: 0 0 clamp(42px, 8vw, 104px) rgba(255, 206, 92, 0.8); }
  }
  .stage[data-weather="cloudy"] .sun { opacity: 0.42; transform: scale(0.9); filter: grayscale(0.32); }
  .stage[data-weather="rainy"]  .sun { opacity: 0;    transform: scale(0.82); }

  /* ============ 云层 ============ */
  .clouds {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    color: #ffffff;
    transition: color 1.4s ease, filter 1.4s ease;
  }
  .stage[data-weather="cloudy"] .clouds { color: #d6e0e8; }
  .stage[data-weather="rainy"]  .clouds { color: #b4c1cd; filter: brightness(0.95); }

  .cloud {
    position: absolute;
    width: clamp(130px, 17vw, 280px);
    aspect-ratio: 220 / 120;
    opacity: 1;
    transition: opacity 1.4s ease;
    will-change: transform;
  }
  .cloud svg {
    display: block;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 10px 18px rgba(72, 108, 142, 0.16));
  }
  .cloud--extra { opacity: 0; }
  .stage[data-weather="cloudy"] .cloud--extra,
  .stage[data-weather="rainy"]  .cloud--extra { opacity: 0.94; }

  .c1 { top: 8%;  left: 3%;  animation: drift 34s ease-in-out infinite alternate; }
  .c2 { top: 20%; left: 41%; width: clamp(172px, 23vw, 362px); animation: drift 47s ease-in-out infinite alternate-reverse; }
  .c3 { top: 4%;  left: 74%; width: clamp(110px, 14vw, 220px); animation: drift 40s ease-in-out infinite alternate; }
  .c4 { top: 31%; left: 18%; animation: drift 53s ease-in-out infinite alternate-reverse; }
  .c5 { top: 13%; left: 59%; width: clamp(150px, 20vw, 320px); animation: drift 38s ease-in-out infinite alternate; }
  .c6 { top: 35%; left: 83%; width: clamp(120px, 15vw, 240px); animation: drift 45s ease-in-out infinite alternate-reverse; }

  @keyframes drift {
    from { transform: translate3d(-2.6%, 0, 0); }
    to   { transform: translate3d(2.6%, 0, 0); }
  }

  /* ============ 远景与地面 ============ */
  .scenery {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
  }
  .hills {
    position: absolute;
    left: -4%;
    width: 108%;
    bottom: 27%;
    height: 16%;
    transition: filter 1.4s ease;
  }
  .grass {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18%;
    height: 11%;
    background: linear-gradient(180deg, #b9ddab 0%, #a2cf96 45%, #8dc287 100%);
    transition: filter 1.4s ease;
  }
  .road {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 18.5%;
    background: linear-gradient(180deg, #b0b8c0 0%, #989fa8 22%, #7d858e 100%);
    transition: filter 1.4s ease;
    overflow: hidden;
  }
  .road::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0) 62%);
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .stage[data-weather="rainy"] .road::after { opacity: 1; }

  .road-line {
    position: absolute;
    top: 58%;
    left: -20%;
    width: 140%;
    height: 5px;
    border-radius: 3px;
    background: repeating-linear-gradient(90deg,
      rgba(255, 255, 255, 0.72) 0 56px, transparent 56px 128px);
    animation: roadMove 1.15s linear infinite;
    will-change: transform;
  }
  @keyframes roadMove { to { transform: translateX(-128px); } }

  .stage[data-weather="cloudy"] .hills,
  .stage[data-weather="cloudy"] .grass { filter: brightness(0.86) saturate(0.6); }
  .stage[data-weather="cloudy"] .road  { filter: brightness(0.86) saturate(0.62); }
  .stage[data-weather="rainy"]  .hills,
  .stage[data-weather="rainy"]  .grass { filter: brightness(0.7) saturate(0.45); }
  .stage[data-weather="rainy"]  .road  { filter: brightness(0.7) saturate(0.42); }

  /* ============ 骑手 ============ */
  .rider {
    position: absolute;
    left: 50%;
    bottom: 12%;
    width: min(46vw, 700px, 88vh);
    transform: translateX(-50%);
    z-index: 5;
    transition: filter 1.4s ease;
  }
  .stage[data-weather="cloudy"] .rider { filter: brightness(0.94) saturate(0.9); }
  .stage[data-weather="rainy"]  .rider { filter: brightness(0.85) saturate(0.78); }
  .rider-inner {
    transform-origin: 50% 96%;
    animation: bob 1.15s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-1.6px) rotate(-0.4deg); }
    50%      { transform: translateY(0) rotate(0deg); }
    75%      { transform: translateY(1.3px) rotate(0.4deg); }
  }
  .pelican { display: block; width: 100%; height: auto; overflow: visible; }
  .pelican-body { filter: drop-shadow(0 8px 14px rgba(62, 96, 130, 0.15)); }

  .wheel { transform-box: view-box; animation: spin 1.15s linear infinite; }
  .wheel--back  { transform-origin: 200px 368px; }
  .wheel--front { transform-origin: 452px 368px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .crank { transform-box: view-box; transform-origin: 300px 362px; will-change: transform; }

  /* ============ 降雨 ============ */
  .rain {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    z-index: 6;
  }
  .stage[data-weather="rainy"] .rain { opacity: 1; }

  .drop {
    position: absolute;
    top: -22vh;
    width: 1.7px;
    border-radius: 2px;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0) 0%, rgba(228, 241, 251, 0.92) 62%, rgba(255, 255, 255, 0.98) 100%);
    animation: fall linear infinite;
    will-change: transform;
  }
  @keyframes fall {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-9vw, 158vh, 0); }
  }

  /* ============ 边缘暗角 ============ */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    background: radial-gradient(125% 92% at 50% 44%, rgba(56, 88, 118, 0) 46%, rgba(56, 88, 118, 0.24) 100%);
    opacity: 0.55;
    transition: opacity 1.4s ease;
  }
  .stage[data-weather="cloudy"] .vignette { opacity: 0.82; }
  .stage[data-weather="rainy"]  .vignette { opacity: 1; }

  /* ============ 竖屏适配 ============ */
  @media (orientation: portrait) {
    .rider { width: min(84vw, 560px, 42vh); bottom: 12%; }
    .sun   { top: 7%; right: 10%; width: clamp(76px, 20vw, 150px); }
    .hills { bottom: 32%; height: 18%; }
    .grass { height: 13%; bottom: 19%; }
    .road  { height: 19%; }
    .c1 { top: 5%;  left: 1%; }
    .c2 { top: 15%; left: 24%; width: clamp(150px, 46vw, 330px); }
    .c3 { top: 30%; left: 56%; width: clamp(104px, 30vw, 210px); }
    .c4 { top: 37%; left: 2%;  width: clamp(120px, 38vw, 260px); }
    .c5 { top: 8%;  left: 40%; width: clamp(120px, 34vw, 220px); }
    .c6 { top: 43%; left: 68%; width: clamp(112px, 34vw, 240px); }
  }

  @media (orientation: landscape) and (max-height: 480px) {
    .rider { width: min(34vw, 88vh); bottom: 15%; }
    .grass { bottom: 20%; height: 12%; }
    .road  { height: 20%; }
  }
</style>
</head>

          <path id="nearThigh" d="M282 262 L304 314" stroke="url(#legG)" stroke-width="19" stroke-linecap="round" fill="none"/>
          <path id="nearShin"  d="M304 314 L310 368" stroke="url(#legG)" stroke-width="16" stroke-linecap="round" fill="none"/>
          <path id="nearFoot"  d="M310 368 L336 375" stroke="#dd7c1c" stroke-width="13" stroke-linecap="round" fill="none"/>
        </g>

      </svg>
    </div>
  </div>

  <div class="rain" id="rain"></div>
  <div class="vignette"></div>
</div>

<script>
  (function () {
    /* ---------- 天气自动轮换：晴 → 阴 → 雨，每 5 秒一步 ---------- */
    var stage = document.querySelector('.stage');
    var rainBox = document.getElementById('rain');
    var sequence = ['sunny', 'cloudy', 'rainy'];
    var cursor = 0;

    var dropCount = window.innerWidth < 700 ? 38 : 74;
    for (var i = 0; i < dropCount; i++) {
      var drop = document.createElement('i');
      drop.className = 'drop';
      drop.style.left = (Math.random() * 118 - 9).toFixed(2) + '%';
      drop.style.height = (16 + Math.random() * 26).toFixed(1) + 'px';
      drop.style.opacity = (0.35 + Math.random() * 0.55).toFixed(2);
      drop.style.animationDuration = (0.52 + Math.random() * 0.42).toFixed(2) + 's';
      drop.style.animationDelay = (-Math.random() * 1.4).toFixed(2) + 's';
      rainBox.appendChild(drop);
    }

    window.setInterval(function () {
      cursor = (cursor + 1) % sequence.length;
      stage.setAttribute('data-weather', sequence[cursor]);
    }, 5000);

    /* ---------- 踩踏：曲柄旋转 + 腿部关节解算 ---------- */
    var BOTTOM_BRACKET = { x: 300, y: 362 };
    var CRANK_R = 34;
    var PERIOD = 1150;

    var THIGH = 74;
    var SHIN = 70;
    var KNEE_LIFT = 0.8;

    var HIP_NEAR = { x: 282, y: 262 };
    var HIP_FAR  = { x: 272, y: 268 };

    var crank = document.getElementById('crank');
    var nearThigh = document.getElementById('nearThigh');
    var nearShin  = document.getElementById('nearShin');
    var nearFoot  = document.getElementById('nearFoot');
    var farThigh  = document.getElementById('farThigh');
    var farShin   = document.getElementById('farShin');
    var farFoot   = document.getElementById('farFoot');

    function pedalAt(rad) {
      return {
        x: BOTTOM_BRACKET.x - CRANK_R * Math.sin(rad),
        y: BOTTOM_BRACKET.y + CRANK_R * Math.cos(rad)
      };
    }

    function knee(hx, hy, fx, fy, a, b) {
      var dx = fx - hx;
      var dy = fy - hy;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
      var reach = Math.min(dist, a + b - 0.6);
      var base = (a * a - b * b + reach * reach) / (2 * reach);
      var lift = Math.sqrt(Math.max(0, a * a - base * base)) * KNEE_LIFT;
      var ux = dx / dist;
      var uy = dy / dist;
      return {
        x: hx + base * ux + lift * uy,
        y: hy + base * uy - lift * ux
      };
    }

    function thighPath(hip, k) {
      return 'M' + hip.x + ' ' + hip.y + ' L' + k.x.toFixed(1) + ' ' + k.y.toFixed(1);
    }
    function shinPath(k, f) {
      return 'M' + k.x.toFixed(1) + ' ' + k.y.toFixed(1) + ' L' + f.x.toFixed(1) + ' ' + f.y.toFixed(1);
    }
    function footPath(f) {
      return 'M' + f.x.toFixed(1) + ' ' + f.y.toFixed(1) + ' L' + (f.x + 27).toFixed(1) + ' ' + (f.y + 7).toFixed(1);
    }

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function frame(now) {
      var phase = reduce ? 0.25 : (now % PERIOD) / PERIOD;
      var rad = phase * Math.PI * 2;

      crank.style.transform = 'rotate(' + (phase * 360).toFixed(2) + 'deg)';

      var nearPedal = pedalAt(rad);
      var farPedal = pedalAt(rad + Math.PI);

      var nk = knee(HIP_NEAR.x, HIP_NEAR.y, nearPedal.x, nearPedal.y, THIGH, SHIN);
      nearThigh.setAttribute('d', thighPath(HIP_NEAR, nk));
      nearShin.setAttribute('d', shinPath(nk, nearPedal));
      nearFoot.setAttribute('d', footPath(nearPedal));

      var fk = knee(HIP_FAR.x, HIP_FAR.y, farPedal.x, farPedal.y, THIGH, SHIN);
      farThigh.setAttribute('d', thighPath(HIP_FAR, fk));
      farShin.setAttribute('d', shinPath(fk, farPedal));
      farFoot.setAttribute('d', footPath(farPedal));

      window.requestAnimationFrame(frame);
    }
    window.requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
