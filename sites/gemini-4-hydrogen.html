<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>鹈鹕白天骑行</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8fd3f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .weather-hud {
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(16px, env(safe-area-inset-right, 16px));
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(15, 35, 60, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.65);
      color: #1e293b;
      z-index: 10;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .weather-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-icon svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .weather-label {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1;
      color: #0f172a;
      min-width: 2.4em;
    }

    .weather-progress {
      position: relative;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-progress svg {
      width: 22px;
      height: 22px;
      transform: rotate(-90deg);
    }

    .weather-progress-bg {
      fill: none;
      stroke: rgba(15, 23, 42, 0.12);
      stroke-width: 2.5;
    }

    .weather-progress-ring {
      fill: none;
      stroke: #0284c7;
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: stroke 0.4s ease;
    }

    .weather-countdown {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: #334155;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 600px) {
      .weather-hud {
        top: max(12px, env(safe-area-inset-top, 12px));
        right: max(12px, env(safe-area-inset-right, 12px));
        padding: 7px 12px 7px 10px;
        gap: 8px;
      }

      .weather-label {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="scene" aria-label="鹈鹕白天骑自行车动画"></canvas>

    <div class="weather-hud" role="status" aria-live="polite">
      <span class="weather-icon" id="weatherIcon" aria-hidden="true"></span>
      <span class="weather-label" id="weatherLabel">晴天</span>
      <span class="weather-progress" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle class="weather-progress-bg" cx="12" cy="12" r="9" />
          <circle class="weather-progress-ring" id="progressRing" cx="12" cy="12" r="9" stroke-dasharray="56.55" stroke-dashoffset="0" />
        </svg>
        <span class="weather-countdown" id="weatherCountdown">5</span>
      </span>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      const weatherIconEl = document.getElementById("weatherIcon");
      const weatherLabelEl = document.getElementById("weatherLabel");
      const progressRingEl = document.getElementById("progressRing");
      const weatherCountdownEl = document.getElementById("weatherCountdown");

      const WEATHER_DURATION_MS = 5000;
      const RING_CIRCUMFERENCE = 2 * Math.PI * 9;

      const WEATHER_THEMES = [
        {
          id: "sunny",
          label: "晴天",
          ringColor: "#f59e0b",
          skyTop: [72, 166, 238],
          skyMid: [136, 206, 250],
          skyBottom: [214, 240, 255],
          sunAlpha: 1,
          cloudDensity: 0.45,
          cloudLight: [255, 255, 255],
          cloudShade: [224, 238, 252],
          farHill: [122, 188, 164],
          midHill: [88, 164, 122],
          seaTop: [76, 178, 224],
          seaBottom: [122, 206, 238],
          grassTop: [104, 186, 88],
          grassBottom: [84, 162, 72],
          roadTop: [106, 114, 128],
          roadBottom: [82, 90, 104],
          rainAmount: 0,
          wetness: 0,
          wind: 1.0,
          ambientDim: 0,
          headlamp: 0,
          iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" fill="#fde68a"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`
        },
        {
          id: "cloudy",
          label: "阴天",
          ringColor: "#64748b",
          skyTop: [142, 162, 182],
          skyMid: [176, 193, 208],
          skyBottom: [212, 222, 232],
          sunAlpha: 0.16,
          cloudDensity: 0.92,
          cloudLight: [232, 238, 244],
          cloudShade: [174, 187, 201],
          farHill: [114, 146, 144],
          midHill: [84, 130, 108],
          seaTop: [112, 152, 174],
          seaBottom: [142, 176, 196],
          grassTop: [92, 150, 84],
          grassBottom: [74, 128, 68],
          roadTop: [98, 106, 118],
          roadBottom: [76, 84, 96],
          rainAmount: 0,
          wetness: 0.12,
          wind: 1.35,
          ambientDim: 0.12,
          headlamp: 0.25,
          iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="#e2e8f0"/></svg>`
        },
        {
          id: "rainy",
          label: "雨天",
          ringColor: "#0284c7",
          skyTop: [96, 120, 146],
          skyMid: [132, 154, 176],
          skyBottom: [168, 186, 202],
          sunAlpha: 0,
          cloudDensity: 1.0,
          cloudLight: [182, 196, 210],
          cloudShade: [120, 136, 154],
          farHill: [90, 122, 128],
          midHill: [64, 108, 96],
          seaTop: [88, 124, 150],
          seaBottom: [112, 148, 172],
          grassTop: [72, 130, 74],
          grassBottom: [58, 108, 60],
          roadTop: [74, 84, 98],
          roadBottom: [56, 65, 78],
          rainAmount: 1,
          wetness: 1,
          wind: 1.9,
          ambientDim: 0.22,
          headlamp: 0.9,
          iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" fill="#cbd5e1"/><path d="M8 19v2"/><path d="M12 17v4"/><path d="M16 19v2"/></svg>`
        }
      ];

      // Blended live weather state
      const state = {
        sunAlpha: 1,
        cloudDensity: 0.45,
        rainAmount: 0,
        wetness: 0,
        wind: 1.0,
        ambientDim: 0,
        headlamp: 0,
        skyTop: [...WEATHER_THEMES[0].skyTop],
        skyMid: [...WEATHER_THEMES[0].skyMid],
        skyBottom: [...WEATHER_THEMES[0].skyBottom],
        cloudLight: [...WEATHER_THEMES[0].cloudLight],
        cloudShade: [...WEATHER_THEMES[0].cloudShade],
        farHill: [...WEATHER_THEMES[0].farHill],
        midHill: [...WEATHER_THEMES[0].midHill],
        seaTop: [...WEATHER_THEMES[0].seaTop],
        seaBottom: [...WEATHER_THEMES[0].seaBottom],
        grassTop: [...WEATHER_THEMES[0].grassTop],
        grassBottom: [...WEATHER_THEMES[0].grassBottom],
        roadTop: [...WEATHER_THEMES[0].roadTop],
        roadBottom: [...WEATHER_THEMES[0].roadBottom]
      };

      const stageEl = document.querySelector(".stage");
      let viewW = 0;
      let viewH = 0;
      let dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = stageEl ? stageEl.getBoundingClientRect() : null;
        viewW = Math.max(0, Math.round((rect && rect.width) || window.innerWidth || document.documentElement.clientWidth || 0));
        viewH = Math.max(0, Math.round((rect && rect.height) || window.innerHeight || document.documentElement.clientHeight || 0));
        if (viewW === 0 || viewH === 0) return;
        canvas.width = Math.round(viewW * dpr);
        canvas.height = Math.round(viewH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", resize);
      if (typeof ResizeObserver !== "undefined" && stageEl) {
        new ResizeObserver(resize).observe(stageEl);
      }
      resize();

      function traceRoundRect(x, y, w, h, r) {
        const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
        if (typeof ctx.roundRect === "function") {
          ctx.roundRect(x, y, w, h, radius);
          return;
        }
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      // Helpers
      const lerp = (a, b, t) => a + (b - a) * t;
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const lerpRgb = (out, target, t) => {
        out[0] = lerp(out[0], target[0], t);
        out[1] = lerp(out[1], target[1], t);
        out[2] = lerp(out[2], target[2], t);
      };
      const rgb = (arr, a = 1) => {
        const r = Math.round(arr[0]);
        const g = Math.round(arr[1]);
        const b = Math.round(arr[2]);
        return a >= 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a.toFixed(3)})`;
      };

      // World particles & props
      const clouds = Array.from({ length: 11 }, (_, i) => ({
        xNorm: i / 11 + (i % 3) * 0.03,
        yRatio: 0.1 + (i % 4) * 0.075,
        scale: 0.72 + (i % 5) * 0.22,
        speed: 10 + (i % 4) * 5,
        layer: i < 5 ? 0 : 1,
        seed: i * 1.7
      }));

      const raindrops = Array.from({ length: 150 }, () => ({
        x: Math.random() * 2000,
        y: Math.random() * 1200,
        len: 12 + Math.random() * 14,
        speed: 580 + Math.random() * 240,
        alpha: 0.28 + Math.random() * 0.42
      }));

      const splashes = [];
      const puddles = Array.from({ length: 5 }, (_, i) => ({
        x: i * 420 + Math.random() * 180,
        rx: 28 + Math.random() * 26,
        ry: 4.5 + Math.random() * 2.5,
        phase: Math.random() * Math.PI * 2
      }));

      const trees = Array.from({ length: 16 }, (_, i) => ({
        x: i * 170 + (i % 3) * 35,
        scale: 0.78 + (i % 4) * 0.16,
        kind: i % 3
      }));

      const flowers = Array.from({ length: 28 }, (_, i) => ({
        x: i * 95 + (i % 5) * 18,
        yOffset: 4 + (i % 3) * 5,
        color: i % 3 === 0 ? "#fde047" : i % 3 === 1 ? "#ffffff" : "#fda4af",
        size: 2.6 + (i % 2) * 0.8
      }));

      const birds = Array.from({ length: 4 }, (_, i) => ({
        xNorm: 0.15 + i * 0.22,
        yRatio: 0.16 + (i % 2) * 0.06,
        phase: i * 1.4,
        speed: 18 + i * 3
      }));

      let currentWeatherIdx = -1;
      function updateHud(idx, remainMs) {
        const theme = WEATHER_THEMES[idx];
        if (idx !== currentWeatherIdx) {
          currentWeatherIdx = idx;
          weatherLabelEl.textContent = theme.label;
          weatherIconEl.innerHTML = theme.iconSvg;
          progressRingEl.style.stroke = theme.ringColor;
        }
        const frac = clamp(remainMs / WEATHER_DURATION_MS, 0, 1);
        progressRingEl.style.strokeDashoffset = (RING_CIRCUMFERENCE * (1 - frac)).toFixed(2);
        const sec = Math.max(1, Math.ceil(remainMs / 1000));
        weatherCountdownEl.textContent = String(sec);
      }

      let startTime = null;
      let lastTime = null;
      let worldScroll = 0;
      let wheelAngle = 0;
      let pedalAngle = 0;
      let blinkTimer = 2.6;
      let isBlinking = false;

      // 2-bone IK solver returning knee position
      function solveLegIK(hx, hy, px, py, L1, L2) {
        const dx = px - hx;
        const dy = py - hy;
        const dist = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.5);
        const base = Math.atan2(dy, dx);
        const cosA = clamp((L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist), -1, 1);
        const angle = base - Math.acos(cosA); // Knee bends forward (+x)
        return {
          kx: hx + Math.cos(angle) * L1,
          ky: hy + Math.sin(angle) * L1
        };
      }

      function drawCloud(x, y, s, lightCol, shadeCol, alpha) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.globalAlpha = alpha;

        // Soft bottom shadow
        ctx.fillStyle = shadeCol;
        ctx.beginPath();
        ctx.ellipse(0, 14, 62, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        // Main fluffy puffs
        ctx.fillStyle = lightCol;
        ctx.beginPath();
        ctx.arc(-34, 4, 22, 0, Math.PI * 2);
        ctx.arc(-8, -8, 30, 0, Math.PI * 2);
        ctx.arc(24, -2, 25, 0, Math.PI * 2);
        ctx.arc(46, 8, 18, 0, Math.PI * 2);
        traceRoundRect(-50, 2, 104, 22, 11);
        ctx.fill();

        ctx.restore();
      }

      function drawSun(x, y, r, t, alpha) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;

        // Outer glow
        const glow = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 3.1);
        glow.addColorStop(0, "rgba(255, 243, 176, 0.72)");
        glow.addColorStop(0.45, "rgba(255, 224, 102, 0.26)");
        glow.addColorStop(1, "rgba(255, 224, 102, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, r * 3.1, 0, Math.PI * 2);
        ctx.fill();

        // Subtle rotating rays
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * 0.14);
        ctx.strokeStyle = "rgba(255, 232, 130, 0.55)";
        ctx.lineWidth = Math.max(2, r * 0.09);
        ctx.lineCap = "round";
        for (let i = 0; i < 12; i++) {
          const a = (i * Math.PI * 2) / 12;
          const inner = r * 1.25;
          const outer = r * (i % 2 === 0 ? 1.72 : 1.5);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
          ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
          ctx.stroke();
        }
        ctx.restore();

        // Sun disc
        const disc = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
        disc.addColorStop(0, "#fffbeb");
        disc.addColorStop(0.55, "#fde047");
        disc.addColorStop(1, "#f59e0b");
        ctx.fillStyle = disc;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawHills(groundY, horizonY, scroll, amplitude, freq, col, step = 18) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        for (let x = 0; x <= viewW + step; x += step) {
          const wx = x + scroll;
          const h =
            Math.sin(wx * freq) * amplitude +
            Math.cos(wx * freq * 1.85 + 1.2) * (amplitude * 0.42);
          ctx.lineTo(x, horizonY - Math.max(-amplitude * 0.5, h));
        }
        ctx.lineTo(viewW + step, groundY);
        ctx.closePath();
        ctx.fill();
      }

      function drawTree(x, y, scale, kind, t, wind) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const sway = Math.sin(t * 2.1 + x * 0.02) * 0.045 * wind;

        if (kind === 0) {
          // Coastal pine / cypress
          ctx.fillStyle = "#6b4f3b";
          ctx.fillRect(-4, -28, 8, 28);

          ctx.rotate(sway);
          ctx.fillStyle = rgb(state.midHill);
          ctx.beginPath();
          ctx.ellipse(0, -48, 22, 30, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(255,255,255,0.12)";
          ctx.beginPath();
          ctx.ellipse(-5, -54, 10, 16, -0.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (kind === 1) {
          // Layered leafy tree
          ctx.fillStyle = "#73543e";
          ctx.fillRect(-4.5, -34, 9, 34);

          ctx.rotate(sway);
          ctx.fillStyle = rgb(state.grassBottom);
          ctx.beginPath();
          ctx.arc(-12, -40, 17, 0, Math.PI * 2);
          ctx.arc(12, -40, 16, 0, Math.PI * 2);
          ctx.arc(0, -56, 20, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = rgb(state.grassTop);
          ctx.beginPath();
          ctx.arc(-2, -58, 13, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Flowering coastal shrub
          ctx.rotate(sway * 0.8);
          ctx.fillStyle = rgb(state.grassBottom);
          ctx.beginPath();
          ctx.arc(-10, -10, 12, 0, Math.PI * 2);
          ctx.arc(10, -9, 11, 0, Math.PI * 2);
          ctx.arc(0, -16, 14, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function drawWheel(cx, cy, radius, angle) {
        ctx.save();
        ctx.translate(cx, cy);

        // Tire outer
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 6.2;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();

        // Subtle tire sidewall highlight
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(0, 0, radius - 1.5, 0, Math.PI * 2);
        ctx.stroke();

        // Alloy rim
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(0, 0, radius - 4.2, 0, Math.PI * 2);
        ctx.stroke();

        // Rotating spokes
        ctx.save();
        ctx.rotate(angle);
        ctx.strokeStyle = "rgba(226, 232, 240, 0.88)";
        ctx.lineWidth = 1.25;
        const spokeCount = 12;
        for (let i = 0; i < spokeCount; i++) {
          const a = (i * Math.PI * 2) / spokeCount;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * (radius - 4.5), Math.sin(a) * (radius - 4.5));
          ctx.stroke();
        }
        // Valve stem
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(radius - 5, 0);
        ctx.lineTo(radius - 9, 0);
        ctx.stroke();
        ctx.restore();

        // Hub
        ctx.fillStyle = "#94a3b8";
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#334155";
        ctx.beginPath();
        ctx.arc(0, 0, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawPelicanLeg(hipX, hipY, pedalX, pedalY, isFar) {
        const L1 = 44;
        const L2 = 46;
        const { kx, ky } = solveLegIK(hipX, hipY, pedalX, pedalY, L1, L2);

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Upper feathered thigh
        ctx.strokeStyle = isFar ? "#dfd6c5" : "#f7f1e3";
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(lerp(hipX, kx, 0.55), lerp(hipY, ky, 0.55));
        ctx.stroke();

        // Lower slender orange bird leg
        const legColor = isFar ? "#d4631c" : "#f07d26";
        ctx.strokeStyle = legColor;
        ctx.lineWidth = 5.4;
        ctx.beginPath();
        ctx.moveTo(lerp(hipX, kx, 0.45), lerp(hipY, ky, 0.45));
        ctx.lineTo(kx, ky);
        ctx.lineTo(pedalX, pedalY - 3);
        ctx.stroke();

        // Webbed foot resting flat on pedal
        ctx.fillStyle = isFar ? "#cb5c16" : "#f58a2e";
        ctx.beginPath();
        ctx.moveTo(pedalX - 7, pedalY - 2);
        ctx.quadraticCurveTo(pedalX + 3, pedalY - 7, pedalX + 13, pedalY - 2);
        ctx.quadraticCurveTo(pedalX + 6, pedalY + 2, pedalX - 7, pedalY - 2);
        ctx.fill();

        // Pedal platform
        ctx.fillStyle = isFar ? "#334155" : "#1e293b";
        ctx.beginPath();
        traceRoundRect(pedalX - 8, pedalY - 1.5, 16, 4.5, 2);
        ctx.fill();

        ctx.restore();
      }

      function drawPelicanAndBike(cx, groundY, scale, t) {
        const R = 36;
        const rearX = -62;
        const rearY = -R;
        const frontX = 64;
        const frontY = -R;
        const bbX = -10;
        const bbY = -30;
        const seatTopX = -32;
        const seatTopY = -84;
        const forkX = 50;
        const forkY = -66;
        const headTopX = 43;

      function render(now) {
        if (startTime === null) {
          startTime = now;
          lastTime = now;
        }
        if (viewW === 0 || viewH === 0) {
          resize();
          if (viewW === 0 || viewH === 0) {
            requestAnimationFrame(render);
            return;
          }
        }
        const rawDt = (now - lastTime) / 1000;
        lastTime = now;
        const dt = Math.min(Math.max(rawDt, 0.001), 0.05);

        // Exact 5-second weather cycle: 晴天 -> 阴天 -> 雨天 -> 晴天
        const elapsedMs = Math.max(0, now - startTime);
        const totalCycleMs = WEATHER_DURATION_MS * WEATHER_THEMES.length;
        const cyclePos = ((elapsedMs % totalCycleMs) + totalCycleMs) % totalCycleMs;
        const targetIdx = Math.min(WEATHER_THEMES.length - 1, Math.floor(cyclePos / WEATHER_DURATION_MS));
        const remainMs = WEATHER_DURATION_MS - (cyclePos % WEATHER_DURATION_MS);
        updateHud(targetIdx, remainMs);

        const targetTheme = WEATHER_THEMES[targetIdx];
        const blendRate = 1 - Math.exp(-dt * 2.6);

        state.sunAlpha = lerp(state.sunAlpha, targetTheme.sunAlpha, blendRate);
        state.cloudDensity = lerp(state.cloudDensity, targetTheme.cloudDensity, blendRate);
        state.rainAmount = lerp(state.rainAmount, targetTheme.rainAmount, blendRate);
        state.wetness = lerp(state.wetness, targetTheme.wetness, blendRate);
        state.wind = lerp(state.wind, targetTheme.wind, blendRate);
        state.ambientDim = lerp(state.ambientDim, targetTheme.ambientDim, blendRate);
        state.headlamp = lerp(state.headlamp, targetTheme.headlamp, blendRate);

        lerpRgb(state.skyTop, targetTheme.skyTop, blendRate);
        lerpRgb(state.skyMid, targetTheme.skyMid, blendRate);
        lerpRgb(state.skyBottom, targetTheme.skyBottom, blendRate);
        lerpRgb(state.cloudLight, targetTheme.cloudLight, blendRate);
        lerpRgb(state.cloudShade, targetTheme.cloudShade, blendRate);
        lerpRgb(state.farHill, targetTheme.farHill, blendRate);
        lerpRgb(state.midHill, targetTheme.midHill, blendRate);
        lerpRgb(state.seaTop, targetTheme.seaTop, blendRate);
        lerpRgb(state.seaBottom, targetTheme.seaBottom, blendRate);
        lerpRgb(state.grassTop, targetTheme.grassTop, blendRate);
        lerpRgb(state.grassBottom, targetTheme.grassBottom, blendRate);
        lerpRgb(state.roadTop, targetTheme.roadTop, blendRate);
        lerpRgb(state.roadBottom, targetTheme.roadBottom, blendRate);

        // Responsive layout & scale for both mobile portrait & desktop landscape
        const isPortrait = viewH > viewW * 1.05;
        const bikeScale = isPortrait
          ? clamp(Math.min((viewW * 0.72) / 198, (viewH * 0.36) / 192), 0.85, 2.2)
          : clamp(Math.min((viewW * 0.34) / 198, (viewH * 0.45) / 192), 0.9, 2.35);

        const groundY = isPortrait ? viewH * 0.72 : viewH * 0.77;
        const bikeCenterX = viewW * 0.48;

        // Motion physics: steady cheerful cycling speed
        const bikeSpeedPx = 155 * bikeScale;
        worldScroll += bikeSpeedPx * dt;
        const wheelRadiusPx = 36 * bikeScale;
        wheelAngle += (bikeSpeedPx * dt) / wheelRadiusPx;
        pedalAngle += dt * 5.2;

        // Eye blink timer
        blinkTimer -= dt;
        if (blinkTimer <= 0) {
          if (isBlinking) {
            isBlinking = false;
            blinkTimer = 2.4 + Math.random() * 2.8;
          } else {
            isBlinking = true;
            blinkTimer = 0.13;
          }
        }

        const tSec = elapsedMs / 1000;

        // 1. Daytime Sky Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
        skyGrad.addColorStop(0, rgb(state.skyTop));
        skyGrad.addColorStop(0.56, rgb(state.skyMid));
        skyGrad.addColorStop(1, rgb(state.skyBottom));
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, viewW, viewH);

        // 2. Daytime Sun
        const sunX = isPortrait ? viewW * 0.24 : viewW * 0.2;
        const sunY = isPortrait ? viewH * 0.16 : viewH * 0.2;
        const sunR = clamp(Math.min(viewW, viewH) * 0.055, 22, 42);
        drawSun(sunX, sunY, sunR, tSec, state.sunAlpha);

        // 3. Distant flying birds (appear mostly in sunny/cloudy weather)
        const birdVis = clamp(1 - state.rainAmount * 1.2, 0, 1);
        if (birdVis > 0.05) {
          ctx.save();
          ctx.strokeStyle = `rgba(51, 65, 85, ${(0.45 * birdVis).toFixed(3)})`;
          ctx.lineWidth = 1.7;
          ctx.lineCap = "round";
          for (const b of birds) {
            const bx = ((b.xNorm * viewW - tSec * b.speed) % (viewW + 120) + (viewW + 120)) % (viewW + 120) - 60;
            const by = groundY * b.yRatio + Math.sin(tSec * 1.8 + b.phase) * 8;
            const flap = Math.sin(tSec * 6.5 + b.phase) * 4.5;
            ctx.beginPath();
            ctx.moveTo(bx - 8, by - flap);
            ctx.quadraticCurveTo(bx - 3, by - 4, bx, by);
            ctx.quadraticCurveTo(bx + 3, by - 4, bx + 8, by - flap);
            ctx.stroke();
          }
          ctx.restore();
        }

        // 4. Clouds (layered parallax)
        const cloudBaseScale = clamp(viewW / 900, 0.65, 1.35);
        for (const c of clouds) {
          const span = viewW + 280;
          const cx = ((c.xNorm * span - tSec * c.speed * state.wind - worldScroll * 0.04) % span + span) % span - 140;
          const cy = groundY * c.yRatio + Math.sin(tSec * 0.4 + c.seed) * 4;
          const cAlpha = c.layer === 0
            ? clamp(state.cloudDensity * 0.88, 0.25, 0.92)
            : clamp((state.cloudDensity - 0.35) * 1.35, 0.12, 0.92);
          drawCloud(cx, cy, c.scale * cloudBaseScale, rgb(state.cloudLight), rgb(state.cloudShade), cAlpha);
        }

        // 5. Distant Hills, Bay Water & Rolling Midground Hills
        const seaY = groundY - Math.max(48, viewH * 0.085);
        drawHills(groundY, seaY - 12, worldScroll * 0.12, 26, 0.0032, rgb(state.farHill));

        // Coastal water strip
        const seaGrad = ctx.createLinearGradient(0, seaY - 6, 0, groundY - 22);
        seaGrad.addColorStop(0, rgb(state.seaTop));
        seaGrad.addColorStop(1, rgb(state.seaBottom));
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, seaY - 2, viewW, groundY - seaY);

        // Sunlit sparkles on the water in sunny weather
        if (state.sunAlpha > 0.25) {
          ctx.save();
          ctx.globalAlpha = state.sunAlpha * 0.45;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          for (let i = 0; i < 14; i++) {
            const sx = ((i * 130 - worldScroll * 0.18) % (viewW + 140) + (viewW + 140)) % (viewW + 140) - 40;
            const sy = seaY + 6 + (i % 4) * 5;
            const w = 10 + Math.sin(tSec * 4 + i) * 5;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + w, sy);
            ctx.stroke();
          }
          ctx.restore();
        }

        // Midground green hills
        drawHills(groundY, groundY - Math.max(26, viewH * 0.048), worldScroll * 0.28, 18, 0.0055, rgb(state.midHill));

        // 6. Grass Verge & Trees behind the road
        const grassBand = Math.max(18, 22 * bikeScale * 0.7);
        const grassGrad = ctx.createLinearGradient(0, groundY - grassBand, 0, groundY + 4);
        grassGrad.addColorStop(0, rgb(state.grassTop));
        grassGrad.addColorStop(1, rgb(state.grassBottom));
        ctx.fillStyle = grassGrad;
        ctx.fillRect(0, groundY - grassBand, viewW, grassBand + 6);

        const treeSpan = 16 * 170;
        for (const tr of trees) {
          const tx = ((tr.x - worldScroll * 0.58) % treeSpan + treeSpan) % treeSpan - 120;
          if (tx < -100 || tx > viewW + 100) continue;
          drawTree(tx, groundY - grassBand + 6, tr.scale * clamp(bikeScale * 0.68, 0.65, 1.3), tr.kind, tSec, state.wind);
        }

        // Wooden guardrail posts along roadside
        const postGap = 110;
        const postStart = -((worldScroll * 0.82) % postGap);
        ctx.fillStyle = "rgba(255, 251, 240, 0.82)";
        ctx.fillRect(0, groundY - grassBand + 2, viewW, 3.5);
        for (let px = postStart; px < viewW + postGap; px += postGap) {
          ctx.fillStyle = "#e2d9c8";
          ctx.fillRect(px - 2.5, groundY - grassBand - 1, 5, 12);
        }

        // 7. Cycling Road
        const roadGrad = ctx.createLinearGradient(0, groundY - 4, 0, viewH);
        roadGrad.addColorStop(0, rgb(state.roadTop));
        roadGrad.addColorStop(0.55, rgb(state.roadBottom));
        roadGrad.addColorStop(1, rgb(state.roadBottom.map(c => c * 0.85)));
        ctx.fillStyle = roadGrad;
        ctx.fillRect(0, groundY - 4, viewW, viewH - groundY + 4);

        // Road curb & dashed bike-lane stripe
        ctx.fillStyle = "rgba(241, 245, 249, 0.45)";
        ctx.fillRect(0, groundY - 4, viewW, 3);

        const dashPeriod = 84;
        const dashOffset = -((worldScroll) % dashPeriod);
        const dashY = groundY + Math.min(34, (viewH - groundY) * 0.32);
        ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
        for (let dx = dashOffset; dx < viewW + dashPeriod; dx += dashPeriod) {
          ctx.beginPath();
          traceRoundRect(dx, dashY, 42, 4.5, 2);
          ctx.fill();
        }

        // Foreground grass edge at bottom of road
        const bottomGrassH = Math.max(24, (viewH - groundY) * 0.24);
        const bottomGrassY = viewH - bottomGrassH;
        ctx.fillStyle = rgb(state.grassBottom);
        ctx.fillRect(0, bottomGrassY, viewW, bottomGrassH);
        ctx.fillStyle = rgb(state.grassTop);
        ctx.fillRect(0, bottomGrassY, viewW, 6);

        // Wildflowers on foreground grass
        const flowerSpan = 28 * 95;
        for (const fl of flowers) {
          const fx = ((fl.x - worldScroll * 1.08) % flowerSpan + flowerSpan) % flowerSpan - 50;
          if (fx < -20 || fx > viewW + 20) continue;
          const fy = bottomGrassY + fl.yOffset + 8;
          const swayX = Math.sin(tSec * 3.5 + fl.x * 0.05) * 2.5 * state.wind;
          ctx.strokeStyle = rgb(state.grassTop);
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(fx, fy + 8);
          ctx.lineTo(fx + swayX, fy);
          ctx.stroke();
          ctx.fillStyle = fl.color;
          ctx.beginPath();
          ctx.arc(fx + swayX, fy, fl.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // 8. Wet puddles & rain ripples on the road
        if (state.wetness > 0.05) {
          const puddleSpan = 5 * 420;
          for (const p of puddles) {
            const px = ((p.x - worldScroll) % puddleSpan + puddleSpan) % puddleSpan - 120;
            if (px < -100 || px > viewW + 100) continue;
            const py = groundY + Math.min(22, (viewH - groundY) * 0.2);

            ctx.save();
            ctx.globalAlpha = state.wetness * 0.48;
            ctx.fillStyle = "#94b8d0";
            ctx.beginPath();
            ctx.ellipse(px, py, p.rx, p.ry, 0, 0, Math.PI * 2);
            ctx.fill();

            if (state.rainAmount > 0.15) {
              const rProg = (tSec * 1.9 + p.phase) % 1;
              ctx.strokeStyle = `rgba(226, 240, 252, ${((1 - rProg) * 0.65 * state.rainAmount).toFixed(3)})`;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.ellipse(px + 6, py, p.rx * 0.5 * rProg, p.ry * 0.65 * rProg, 0, 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        // 9. Pelican & Bicycle hero character
        drawPelicanAndBike(bikeCenterX, groundY, bikeScale, tSec);

        // 10. Raindrops & road splash droplets (Rainy weather)
        if (state.rainAmount > 0.02) {
          const activeCount = Math.floor(raindrops.length * state.rainAmount);
          const rainSlopeX = -150 * state.wind;
          ctx.save();
          ctx.lineCap = "round";
          ctx.lineWidth = 1.35;

          for (let i = 0; i < activeCount; i++) {
            const r = raindrops[i];
            r.x += rainSlopeX * dt;
            r.y += r.speed * dt;

            if (r.y > groundY + Math.random() * 40) {
              if (splashes.length < 48 && Math.random() < 0.35) {
                splashes.push({
                  x: r.x,
                  y: groundY + Math.random() * Math.max(12, (viewH - groundY) * 0.45),
                  vx: (Math.random() - 0.5) * 55,
                  vy: -(24 + Math.random() * 34),
                  life: 0,
                  maxLife: 0.24 + Math.random() * 0.14
                });
              }
              r.x = Math.random() * (viewW + 260);
              r.y = -20 - Math.random() * 140;
            }
            if (r.x < -80) {
              r.x += viewW + 240;
            }

            ctx.strokeStyle = `rgba(226, 242, 255, ${(r.alpha * state.rainAmount).toFixed(3)})`;
            ctx.beginPath();
            ctx.moveTo(r.x, r.y);
            ctx.lineTo(r.x + rainSlopeX * 0.022, r.y + r.len);
            ctx.stroke();
          }

          for (let i = splashes.length - 1; i >= 0; i--) {
            const sp = splashes[i];
            sp.life += dt;
            if (sp.life >= sp.maxLife) {
              splashes.splice(i, 1);
              continue;
            }
            sp.x += sp.vx * dt;
            sp.y += sp.vy * dt;
            sp.vy += 220 * dt;
            const alpha = (1 - sp.life / sp.maxLife) * 0.55 * state.rainAmount;
            ctx.fillStyle = `rgba(226, 242, 255, ${alpha.toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, 1.6, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
