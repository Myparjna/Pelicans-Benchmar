<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ec8f2">
<title>鹈鹕骑行记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #dde6ee;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: relative;
    width: min(100vw, 160vh);
    height: min(62.5vw, 100vh);
    border-radius: clamp(8px, 1.6vmin, 20px);
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(23, 43, 66, 0.18);
  }
  @supports (width: 100dvh) {
    .stage { width: min(100vw, 160dvh); height: min(62.5vw, 100dvh); }
  }
  .stage svg { display: block; width: 100%; height: 100%; }

  /* 天气状态切换 */
  .sky { transition: opacity 1.2s ease; }
  #sky-sunny { opacity: 1; }
  #sky-cloudy { opacity: 0; }
  #sky-rainy { opacity: 0; }
  .weather-cloudy #sky-cloudy { opacity: 1; }
  .weather-rainy #sky-rainy { opacity: 1; }

  #sun { transition: opacity 1s ease; }
  .weather-cloudy #sun { opacity: 0.18; }
  .weather-rainy #sun { opacity: 0; }

  .cloud { fill: #ffffff; transition: fill 1.2s ease, opacity 1.2s ease; }
  .weather-cloudy .cloud { fill: #c3ccd6; }
  .weather-rainy .cloud { fill: #8b98a8; }
  .cloud-extra { opacity: 0; }
  .weather-cloudy .cloud-extra { opacity: 0.9; }
  .weather-rainy .cloud-extra { opacity: 1; }

  #rain, #splashes { opacity: 0; transition: opacity 0.9s ease; }
  .weather-rainy #rain, .weather-rainy #splashes { opacity: 1; }

  #wet { opacity: 0; transition: opacity 0.9s ease; }
  .weather-rainy #wet { opacity: 0.38; }

  #tint { opacity: 0; transition: opacity 1.2s ease; }
  .weather-cloudy #tint { opacity: 0.10; }
  .weather-rainy #tint { opacity: 0.22; }

  #flash { opacity: 0; }
  .weather-rainy #flash { animation: flash 7s linear infinite; }

  /* 环境与骑行动画 */
  #rider { animation: bob 0.55s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(0); }
    to { transform: translateY(-3px); }
  }

  .drift-a { animation: drift-a 22s ease-in-out infinite alternate; }
  .drift-b { animation: drift-b 18s ease-in-out infinite alternate; }
  .drift-c { animation: drift-c 26s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translateX(0); } to { transform: translateX(46px); } }
  @keyframes drift-b { from { transform: translateX(0); } to { transform: translateX(-38px); } }
  @keyframes drift-c { from { transform: translateX(0); } to { transform: translateX(30px); } }

  .scroll-hills-far { animation: scroll-x 46s linear infinite; }
  .scroll-hills-near { animation: scroll-x 34s linear infinite; }
  .scroll-trees { animation: scroll-x 20s linear infinite; }
  .scroll-dash { animation: scroll-dash 0.85s linear infinite; }
  @keyframes scroll-x {
    from { transform: translateX(0); }
    to { transform: translateX(-1200px); }
  }
  @keyframes scroll-dash {
    from { transform: translateX(0); }
    to { transform: translateX(-280px); }
  }

  .whoosh { animation: whoosh 0.9s linear infinite; }
  @keyframes whoosh {
    0% { opacity: 0; transform: translateX(24px); }
    30% { opacity: 0.55; }
    100% { opacity: 0; transform: translateX(-44px); }
  }

  #rain line { stroke: #dcebf9; stroke-width: 2; stroke-linecap: round; }
  @keyframes fall {
    from { transform: translateY(0); }
    to { transform: translateY(730px); }
  }

  @keyframes flash {
    0%, 90%, 94.5%, 100% { opacity: 0; }
    91% { opacity: 0.55; }
    92.5% { opacity: 0.10; }
    93% { opacity: 0.40; }
  }

  /* 界面提示 */
  .hud {
    position: absolute;
    top: 0;
    left: 0;
    padding: clamp(10px, 2.4vmin, 24px);
    user-select: none;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    padding: 0.42em 0.95em;
    background: rgba(255, 255, 255, 0.88);
    border-radius: 999px;
    box-shadow: 0 2px 12px rgba(20, 40, 60, 0.16);
    color: #2b3a4a;
    font-size: clamp(13px, 1.9vmin, 18px);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .track {
    margin-top: 0.55em;
    width: clamp(96px, 24vmin, 160px);
    height: 4px;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(20, 40, 60, 0.12);
  }
  .bar {
    width: 0;
    height: 100%;
    background: #3a7bd5;
    border-radius: 2px;
    animation: countdown 5s linear forwards;
  }
  @keyframes countdown {
    from { width: 0; }
    to { width: 100%; }
  }
</style>
</head>
<body>
<div class="stage weather-sunny" id="stage">

      <!-- 近侧腿 -->

<script>
  (function () {
    var stage = document.getElementById('stage');
    var icon = document.getElementById('wIcon');
    var name = document.getElementById('wName');
    var bar = document.getElementById('bar');
    var list = [
      { cls: 'weather-sunny', icon: '☀️', name: '晴天' },
      { cls: 'weather-cloudy', icon: '☁️', name: '阴天' },
      { cls: 'weather-rainy', icon: '🌧️', name: '雨天' }
    ];
    var index = 0;
    function render() {
      var w = list[index];
      stage.className = 'stage ' + w.cls;
      icon.textContent = w.icon;
      name.textContent = w.name;
      bar.style.animation = 'none';
      void bar.offsetWidth;
      bar.style.animation = '';
    }
    render();
    setInterval(function () {
      index = (index + 1) % list.length;
      render();
    }, 5000);

    var rain = document.getElementById('rain');
    var NS = 'http://www.w3.org/2000/svg';
    for (var k = 0; k < 70; k++) {
      var x = Math.random() * 1300 - 60;
      var line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', x.toFixed(1));
      line.setAttribute('y1', '-40');
      line.setAttribute('x2', (x - 8).toFixed(1));
      line.setAttribute('y2', '-22');
      line.style.animation = 'fall ' + (0.5 + Math.random() * 0.55).toFixed(2) + 's linear infinite';
      line.style.animationDelay = (-Math.random() * 2).toFixed(2) + 's';
      line.style.opacity = (0.3 + Math.random() * 0.45).toFixed(2);
      rain.appendChild(line);
    }
  })();
</script>
